<script>
  // 全域錯誤攔截：只要有任何 JS 錯誤（含 CDN 載入失敗），就把錯誤內容直接顯示在畫面上，
  // 避免「整個畫面空白、卻不知道發生什麼事」的情況。
  window.addEventListener("error", function (e) {
    var root = document.getElementById("root");
    if (!root) return;
    var msg = (e && e.message) ? e.message : "未知錯誤";
    var src = (e && e.filename) ? e.filename : "";
    root.innerHTML =
      '<div style="max-width:640px;margin:60px auto;padding:24px;border:1px solid #fecaca;' +
      'background:#fff1f2;border-radius:12px;font-family:sans-serif;color:#7f1d1d;">' +
      '<h2 style="margin:0 0 8px;font-size:18px;">頁面發生錯誤，無法正常顯示</h2>' +
      '<p style="font-size:14px;margin:0 0 8px;">錯誤訊息：' + msg + '</p>' +
      (src ? '<p style="font-size:12px;color:#9f1239;word-break:break-all;">來源：' + src + '</p>' : '') +
      '<p style="font-size:12px;color:#9f1239;">請打開瀏覽器開發者工具（F12 或 右鍵→檢查）的 Console 分頁，把紅字錯誤訊息複製給開發者。</p>' +
      '</div>';
  });
</script>

function fmt(dt) {
  if (!dt) return "—";
  const d = new Date(dt);
  return d.toLocaleString("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function ConfirmModal({ title, message, confirmLabel, cancelLabel, danger, hideCancel, onConfirm, onCancel }) {
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6">
        <h2 className="text-lg font-bold mb-2">{title}</h2>
        <p className="text-sm text-slate-600 mb-5 whitespace-pre-wrap">{message}</p>
        <div className="flex gap-2 justify-end">
          {!hideCancel && <button onClick={onCancel} className="text-sm text-slate-500 px-4 py-2">{cancelLabel || "取消"}</button>}
          <button onClick={onConfirm} className={"text-sm text-white rounded-lg px-4 py-2 " + (danger ? "bg-rose-600" : "bg-slate-900")}>
            {confirmLabel || "確認"}
          </button>
        </div>
      </div>
    </div>
  );
}

// 登入畫面（簡化版，只需要 email/密碼登入，帳號本身在 task-cloud.html 那邊註冊）
// =====================================================================
function AuthScreen() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setBusy(true); setErr(null);
    const { error } = await sb.auth.signInWithPassword({ email, password });
    setBusy(false);
    if (error) setErr(error.message);
  }

  return (
    <div className="min-h-screen flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl shadow p-8 w-full max-w-sm">
        <h1 className="text-lg font-bold mb-1">管理後台登入</h1>
        <p className="text-xs text-slate-400 mb-6">請使用你在任務雲（TaskCloud）的 admin 帳號登入</p>
        <form onSubmit={submit} className="space-y-3">
          <div>
            <label className="text-xs text-slate-500">Email</label>
            <input type="email" required value={email} onChange={e => setEmail(e.target.value)}
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label className="text-xs text-slate-500">密碼</label>
            <input type="password" required value={password} onChange={e => setPassword(e.target.value)}
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          {err && <div className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2">{err}</div>}
          <button disabled={busy} className="w-full bg-slate-900 text-white rounded-lg py-2.5 text-sm font-medium disabled:opacity-50">
            {busy ? "登入中…" : "登入"}
          </button>
        </form>
      </div>
    </div>
  );
}

// =====================================================================
// 錯誤回報管理分頁
// =====================================================================
function BugReportsTab() {
  const [reports, setReports] = useState([]);
  const [statusFilter, setStatusFilter] = useState("all"); // all | open | reviewed | resolved
  const [drafts, setDrafts] = useState({}); // { [reportId]: replyText }
  const [savingId, setSavingId] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [err, setErr] = useState(null);

  const load = useCallback(async () => {
    const { data, error } = await sb.from("bug_reports")
      .select("*, reporter:profiles!bug_reports_reporter_id_fkey(display_name,email)")
      .order("created_at", { ascending: false });
    if (error) setErr(error.message);
    else setReports(data || []);
  }, []);

  useEffect(() => { load(); }, [load]);

  useEffect(() => {
    if (!sb) return;
    const channel = sb.channel("admin-bug-reports")
      .on("postgres_changes", { event: "*", schema: "public", table: "bug_reports" }, () => load())
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [load]);

  async function saveStatus(id, status) {
    setSavingId(id);
    const { error } = await sb.from("bug_reports").update({ status }).eq("id", id);
    setSavingId(null);
    if (error) setErr(error.message); else load();
  }

  async function saveReply(id) {
    const reply = drafts[id];
    if (reply === undefined) return;
    setSavingId(id);
    const { error } = await sb.from("bug_reports").update({ admin_reply: reply, status: "reviewed" }).eq("id", id);
    setSavingId(null);
    if (error) setErr(error.message); else load();
  }

  async function doDelete() {
    const id = confirmDeleteId;
    setConfirmDeleteId(null);
    const { error } = await sb.from("bug_reports").delete().eq("id", id);
    if (error) setErr(error.message); else load();
  }

  const filtered = statusFilter === "all" ? reports : reports.filter(r => r.status === statusFilter);

  return (
    <div>
      <div className="flex gap-2 mb-4">
        {["all", "open", "reviewed", "resolved"].map(s => (
          <button key={s} onClick={() => setStatusFilter(s)}
            className={"text-xs px-3 py-1.5 rounded-lg " + (statusFilter === s ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>
            {s === "all" ? `全部（${reports.length}）` : `${STATUS_LABEL_BR[s]}（${reports.filter(r => r.status === s).length}）`}
          </button>
        ))}
      </div>

      {err && <div className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2 mb-3">{err}</div>}

      <div className="space-y-3">
        {filtered.length === 0 && <p className="text-sm text-slate-400">目前沒有符合條件的回報</p>}
        {filtered.map(r => (
          <div key={r.id} className="bg-white rounded-2xl shadow p-4">
            <div className="flex justify-between items-start mb-2">
              <div>
                <span className={"text-xs px-2 py-0.5 rounded-full font-medium " + STATUS_COLOR_BR[r.status]}>{STATUS_LABEL_BR[r.status]}</span>
                <span className="ml-2 text-xs text-slate-400">{r.reporter?.display_name}（{r.reporter?.email}）</span>
              </div>
              <span className="text-xs text-slate-400">{fmt(r.created_at)}</span>
            </div>
            <p className="text-sm whitespace-pre-wrap mb-3">{r.content}</p>

            <label className="text-xs text-slate-500">回覆給使用者（使用者可以看到這段內容）</label>
            <textarea rows={2} value={drafts[r.id] !== undefined ? drafts[r.id] : (r.admin_reply || "")}
              onChange={e => setDrafts(d => ({ ...d, [r.id]: e.target.value }))}
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />

            <div className="flex justify-between items-center mt-3">
              <div className="flex gap-2">
                <button onClick={() => saveReply(r.id)} disabled={savingId === r.id} className="text-xs bg-slate-900 text-white rounded-lg px-3 py-1.5 disabled:opacity-50">
                  儲存回覆
                </button>
                <select value={r.status} onChange={e => saveStatus(r.id, e.target.value)} disabled={savingId === r.id}
                  className="text-xs border border-slate-300 rounded-lg px-2 py-1.5 bg-white">
                  <option value="open">未處理</option>
                  <option value="reviewed">已查看</option>
                  <option value="resolved">已解決</option>
                </select>
              </div>
              <button onClick={() => setConfirmDeleteId(r.id)} title="刪除回報" className="flex items-center justify-center text-rose-500 hover:text-rose-600">
                <Icon.Trash className="w-4 h-4" />
              </button>
            </div>
          </div>
        ))}
      </div>

      {confirmDeleteId && (
        <ConfirmModal
          title="刪除回報"
          message="此回報將永久刪除，無法復原！確定或取消？"
          confirmLabel="確定刪除"
          danger
          onConfirm={doDelete}
          onCancel={() => setConfirmDeleteId(null)}
        />
      )}
    </div>
  );
}

// =====================================================================
// 使用者總覽分頁
// =====================================================================
function UsersTab({ currentUserId }) {
  const [users, setUsers] = useState([]);
  const [missions, setMissions] = useState([]);
  const [searchTerm, setSearchTerm] = useState("");
  const [savingId, setSavingId] = useState(null);
  const [err, setErr] = useState(null);

  const load = useCallback(async () => {
    const [{ data: profs, error: e1 }, { data: miss, error: e2 }] = await Promise.all([
      sb.from("profiles").select("id,display_name,email,member_role,created_at").order("created_at", { ascending: false }),
      sb.from("missions").select("id,creator_id,status,project_id"),
    ]);
    if (e1) setErr(e1.message);
    else if (e2) setErr(e2.message);
    else { setUsers(profs || []); setMissions(miss || []); }
  }, []);

  useEffect(() => { load(); }, [load]);

  // Realtime：任何人的 profiles（等級）或 missions（任務）有變動，就重新抓一次統計資料
  useEffect(() => {
    if (!sb) return;
    const channel = sb.channel("admin-users-overview")
      .on("postgres_changes", { event: "*", schema: "public", table: "profiles" }, () => load())
      .on("postgres_changes", { event: "*", schema: "public", table: "missions" }, () => load())
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [load]);

  const statsByUser = useMemo(() => {
    const map = {};
    for (const m of missions) {
      if (!map[m.creator_id]) map[m.creator_id] = { total: 0, open: 0, personalOpen: 0 };
      map[m.creator_id].total += 1;
      const isOpen = m.status === "added" || m.status === "in_progress";
      if (isOpen) {
        map[m.creator_id].open += 1;
        if (!m.project_id) map[m.creator_id].personalOpen += 1;
      }
    }
    return map;
  }, [missions]);

  async function changeRole(userId, role) {
    setSavingId(userId);
    const { error } = await sb.from("profiles").update({ member_role: role }).eq("id", userId);
    setSavingId(null);
    if (error) setErr(error.message); else load();
  }

  const filtered = users.filter(u =>
    !searchTerm.trim()
    || (u.display_name || "").toLowerCase().includes(searchTerm.trim().toLowerCase())
    || (u.email || "").toLowerCase().includes(searchTerm.trim().toLowerCase())
  );

  return (
    <div>
      <input value={searchTerm} onChange={e => setSearchTerm(e.target.value)} placeholder="搜尋姓名或 email…"
        className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-4" />

      {err && <div className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2 mb-3">{err}</div>}

      <div className="bg-white rounded-2xl shadow overflow-x-auto">
        <table className="w-full text-sm">
          <thead>
            <tr className="text-left text-xs text-slate-400 border-b border-slate-200">
              <th className="px-4 py-2 font-medium">使用者</th>
              <th className="px-4 py-2 font-medium">會員等級</th>
              <th className="px-4 py-2 font-medium">個人任務進行中</th>
              <th className="px-4 py-2 font-medium">全部進行中</th>
              <th className="px-4 py-2 font-medium">歷史任務總數</th>
              <th className="px-4 py-2 font-medium">註冊時間</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(u => {
              const stats = statsByUser[u.id] || { total: 0, open: 0, personalOpen: 0 };
              return (
                <tr key={u.id} className="border-b border-slate-100">
                  <td className="px-4 py-3 whitespace-nowrap">
                    <div className="font-medium">{u.display_name}</div>
                    <div className="text-xs text-slate-400">{u.email}</div>
                  </td>
                  <td className="px-4 py-3 whitespace-nowrap">
                    <select value={u.member_role} disabled={u.id === currentUserId || savingId === u.id}
                      onChange={e => changeRole(u.id, e.target.value)}
                      className="text-xs border border-slate-300 rounded-lg px-2 py-1.5 bg-white disabled:opacity-50">
                      <option value="free">免費會員</option>
                      <option value="vip">VIP 會員</option>
                      <option value="admin">管理員</option>
                    </select>
                  </td>
                  <td className="px-4 py-3 whitespace-nowrap text-slate-500">{stats.personalOpen}</td>
                  <td className="px-4 py-3 whitespace-nowrap text-slate-500">{stats.open}</td>
                  <td className="px-4 py-3 whitespace-nowrap text-slate-500">{stats.total}</td>
                  <td className="px-4 py-3 whitespace-nowrap text-slate-500">{fmt(u.created_at)}</td>
                </tr>
              );
            })}
            {filtered.length === 0 && (
              <tr><td colSpan={6} className="px-4 py-8 text-center text-slate-400">找不到符合的使用者</td></tr>
            )}
          </tbody>
        </table>
      </div>
      <p className="text-xs text-slate-400 mt-2">＊自己這一列的會員等級選單會被鎖住，避免不小心把自己降級或改掉。要調整自己的等級，請用另一個 admin 帳號操作。</p>
    </div>
  );
}

// =====================================================================
// 使用者 AI 用量分頁

const AI_DAILY_QUOTA = { free: 10, vip: 100, admin: 500 }; // 跟 Edge Function 裡的常數保持一致，純顯示參考用

function AiUsageTab() {
  const [rows, setRows] = useState([]);
  const [searchTerm, setSearchTerm] = useState("");
  const [savingId, setSavingId] = useState(null);
  const [confirmLock, setConfirmLock] = useState(null); // { userId, type: "temp" | "permanent", name }
  const [err, setErr] = useState(null);

  const load = useCallback(async () => {
    const { data, error } = await sb.rpc("admin_ai_usage_stats");
    if (error) setErr(error.message);
    else setRows(data || []);
  }, []);

  useEffect(() => { load(); }, [load]);

  // Realtime：任何人的鎖定狀態或 AI 用量紀錄有變動，就重新抓一次
  useEffect(() => {
    if (!sb) return;
    const channel = sb.channel("admin-ai-usage")
      .on("postgres_changes", { event: "*", schema: "public", table: "profiles" }, () => load())
      .on("postgres_changes", { event: "*", schema: "public", table: "ai_usage_log" }, () => load())
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [load]);

  async function applyLock(userId, type) {
    setSavingId(userId);
    const payload = type === "permanent"
      ? { ai_banned_permanently: true, ai_banned_until: null }
      : { ai_banned_permanently: false, ai_banned_until: new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString() };
    const { error } = await sb.from("profiles").update(payload).eq("id", userId);
    setSavingId(null);
    setConfirmLock(null);
    if (error) setErr(error.message); else load();
  }
  async function unlock(userId) {
    setSavingId(userId);
    const { error } = await sb.from("profiles").update({ ai_banned_permanently: false, ai_banned_until: null }).eq("id", userId);
    setSavingId(null);
    if (error) setErr(error.message); else load();
  }

  const filtered = rows.filter(u =>
    !searchTerm.trim()
    || (u.display_name || "").toLowerCase().includes(searchTerm.trim().toLowerCase())
    || (u.email || "").toLowerCase().includes(searchTerm.trim().toLowerCase())
  );

  return (
    <div>
      <input value={searchTerm} onChange={e => setSearchTerm(e.target.value)} placeholder="搜尋姓名或 email…"
        className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-4" />

      {err && <div className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2 mb-3">{err}</div>}

      <div className="bg-white rounded-2xl shadow overflow-x-auto">
        <table className="w-full text-sm">
          <thead>
            <tr className="text-left text-xs text-slate-400 border-b border-slate-200">
              <th className="px-4 py-2 font-medium">使用者</th>
              <th className="px-4 py-2 font-medium">會員等級</th>
              <th className="px-4 py-2 font-medium">今日已用/上限</th>
              <th className="px-4 py-2 font-medium">近7日成功次數</th>
              <th className="px-4 py-2 font-medium">近7日被拒次數</th>
              <th className="px-4 py-2 font-medium">最近觸發時間</th>
              <th className="px-4 py-2 font-medium">狀態</th>
              <th className="px-4 py-2 font-medium">操作</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(u => {
              const quota = AI_DAILY_QUOTA[u.member_role] ?? AI_DAILY_QUOTA.free;
              const isTempBanned = !!u.ai_banned_until && new Date(u.ai_banned_until) > new Date();
              const isBanned = u.ai_banned_permanently || isTempBanned;
              // 近7日被拒次數高，或今日用量逼近上限，都值得注意，用顏色標一下
              const heavyBlocked = u.last7d_blocked >= 10;
              const nearDailyLimit = u.today_success >= quota;
              return (
                <tr key={u.id} className="border-b border-slate-100">
                  <td className="px-4 py-3 whitespace-nowrap">
                    <div className="font-medium">{u.display_name}</div>
                    <div className="text-xs text-slate-400">{u.email}</div>
                  </td>
                  <td className="px-4 py-3 whitespace-nowrap text-slate-500">{ROLE_LABEL[u.member_role] || u.member_role}</td>
                  <td className={"px-4 py-3 whitespace-nowrap " + (nearDailyLimit ? "text-amber-800 font-medium" : "text-slate-500")}>
                    {u.today_success} / {quota}
                  </td>
                  <td className="px-4 py-3 whitespace-nowrap text-slate-500">{u.last7d_success}</td>
                  <td className={"px-4 py-3 whitespace-nowrap " + (heavyBlocked ? "text-rose-600 font-medium" : "text-slate-500")}>
                    {u.last7d_blocked}
                  </td>
                  <td className="px-4 py-3 whitespace-nowrap text-slate-500">{fmt(u.last_called_at)}</td>
                  <td className="px-4 py-3 whitespace-nowrap">
                    {u.ai_banned_permanently ? (
                      <span className="text-xs px-2 py-0.5 rounded-full font-medium bg-rose-100 text-rose-700">永久禁止中</span>
                    ) : isTempBanned ? (
                      <span className="text-xs px-2 py-0.5 rounded-full font-medium bg-amber-200 text-amber-800">暫時禁止中（至 {fmt(u.ai_banned_until)} 解除）</span>
                    ) : (
                      <span className="text-xs px-2 py-0.5 rounded-full font-medium bg-emerald-100 text-emerald-700">正常</span>
                    )}
                  </td>
                  <td className="px-4 py-3 whitespace-nowrap">
                    <div className="flex gap-1.5">
                      {isBanned ? (
                        <button onClick={() => unlock(u.id)} disabled={savingId === u.id}
                          className="text-xs bg-emerald-600 text-white rounded-lg px-2.5 py-1 disabled:opacity-50">解鎖</button>
                      ) : (
                        <>
                          <button onClick={() => setConfirmLock({ userId: u.id, type: "temp", name: u.display_name })} disabled={savingId === u.id}
                            className="text-xs bg-amber-500 text-white rounded-lg px-2.5 py-1 disabled:opacity-50">鎖24小時</button>
                          <button onClick={() => setConfirmLock({ userId: u.id, type: "permanent", name: u.display_name })} disabled={savingId === u.id}
                            className="text-xs bg-rose-600 text-white rounded-lg px-2.5 py-1 disabled:opacity-50">永久鎖</button>
                        </>
                      )}
                    </div>
                  </td>
                </tr>
              );
            })}
            {filtered.length === 0 && (
              <tr><td colSpan={8} className="px-4 py-8 text-center text-slate-400">找不到符合的使用者</td></tr>
            )}
          </tbody>
        </table>
      </div>
      <p className="text-xs text-slate-400 mt-2">＊這裡不能調整會員等級，請到「使用者總覽」分頁操作。近7日被拒次數包含個人每分鐘/每日上限、全站共用上限、帳號被鎖定期間仍嘗試呼叫，都算在內。</p>

      {confirmLock && (
        <ConfirmModal
          title={confirmLock.type === "permanent" ? "永久鎖定 AI 辨識功能" : "暫時鎖定 AI 辨識功能 24 小時"}
          message={
            confirmLock.type === "permanent"
              ? `確定要永久鎖定「${confirmLock.name}」的 AI 辨識功能嗎？之後要恢復需要手動解鎖。使用者端只會看到「功能暫時無法使用」，不會被告知是永久或暫時。`
              : `確定要暫時鎖定「${confirmLock.name}」的 AI 辨識功能 24 小時嗎？時間到了會自動恢復，也可以隨時手動解鎖。`
          }
          confirmLabel={confirmLock.type === "permanent" ? "確定永久鎖定" : "確定鎖定 24 小時"}
          danger
          onConfirm={() => applyLock(confirmLock.userId, confirmLock.type)}
          onCancel={() => setConfirmLock(null)}
        />
      )}
    </div>
  );
}

// =====================================================================
// 頂層 App：登入狀態 + admin 權限檢查
// =====================================================================
function App() {
  const [session, setSession] = useState(undefined);
  const [profile, setProfile] = useState(null);

  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_event, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setProfile(null); return; }
    let cancelled = false;
    async function fetchProfile(retries) {
      const { data } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
      if (cancelled) return;
      if (data) setProfile(data);
      else if (retries > 0) setTimeout(() => fetchProfile(retries - 1), 500);
    }
    fetchProfile(4);
    return () => { cancelled = true; };
  }, [session]);

  if (!sb) {
    return (
      <div className="min-h-screen flex items-center justify-center p-4">
        <div className="bg-white rounded-2xl shadow p-8 max-w-sm text-sm text-slate-500">
          尚未設定 Supabase 連線資訊，請在檔案最上方填入 SUPABASE_URL / SUPABASE_ANON_KEY（跟 task-cloud.html 用同一組值）。
        </div>
      </div>
    );
  }

  if (session === undefined) return <div className="min-h-screen flex items-center justify-center text-slate-400 text-sm">載入中…</div>;
  if (!session) return <AuthScreen />;
  if (!profile) return <div className="min-h-screen flex items-center justify-center text-slate-400 text-sm">載入使用者資料中…</div>;

  if (profile.member_role !== "admin") {
    return (
      <div className="min-h-screen flex items-center justify-center p-4">
        <div className="bg-white rounded-2xl shadow p-8 max-w-sm text-center">
          <h1 className="font-bold text-lg mb-2">沒有權限存取此頁面</h1>
          <p className="text-sm text-slate-500 mb-4">這個頁面僅供管理員使用，你目前的帳號（{session.user.email}）不是管理員身分。</p>
          <button onClick={() => sb.auth.signOut()} className="text-xs bg-slate-100 rounded-lg px-4 py-2">登出</button>
        </div>
      </div>
    );
  }

  return <AdminDashboard session={session} />;
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("渲染錯誤：", error, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ maxWidth: 640, margin: "60px auto", padding: 24, border: "1px solid #fecaca", background: "#fff1f2", borderRadius: 12, fontFamily: "sans-serif", color: "#7f1d1d" }}>
          <h2 style={{ margin: "0 0 8px", fontSize: 18 }}>畫面渲染時發生錯誤</h2>
          <p style={{ fontSize: 14, margin: "0 0 8px" }}>錯誤訊息：{this.state.error.message}</p>
          <p style={{ fontSize: 12, color: "#9f1239" }}>請打開瀏覽器開發者工具（F12）的 Console 分頁查看詳細內容。</p>
        </div>
      );
    }
    return this.props.children;
  }
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
} catch (e) {
  document.getElementById("root").innerHTML =
    '<div style="max-width:640px;margin:60px auto;padding:24px;border:1px solid #fecaca;background:#fff1f2;border-radius:12px;font-family:sans-serif;color:#7f1d1d;">' +
    '<h2 style="margin:0 0 8px;font-size:18px;">初始化時發生錯誤</h2>' +
    '<p style="font-size:14px;">' + e.message + '</p></div>';
}
</script>
<script>
  // 手動呼叫 Babel.transform 並強制指定 runtime: "classic"（用全域 React/ReactDOM 變數），
  // 避免自動掃描 type="text/babel" 時，較新版 babel-standalone 預設改用 "automatic" runtime
  // 而產生 `import ... from "react/jsx-runtime"`，在一般 <script> 環境中無法執行的問題。
  (function () {
    try {
      var source = document.getElementById("app-source").textContent;
      var output = Babel.transform(source, {
        presets: [["react", { runtime: "classic" }]],
      }).code;
      var s = document.createElement("script");
      s.text = output;
      document.body.appendChild(s);
    } catch (e) {
      document.getElementById("root").innerHTML =
        '<div style="max-width:640px;margin:60px auto;padding:24px;border:1px solid #fecaca;background:#fff1f2;border-radius:12px;font-family:sans-serif;color:#7f1d1d;">' +
        '<h2 style="margin:0 0 8px;font-size:18px;">程式碼轉譯時發生錯誤</h2>' +
        '<p style="font-size:14px;">' + e.message + '</p></div>';
    }
  })();
</script>
