  const [openMissionId, setOpenMissionId] = useState(null);
  const [showNew, setShowNew] = useState(false);
  const [showColumnSettings, setShowColumnSettings] = useState(false);
  const [visibleColumns, setVisibleColumns] = useState({ ...DEFAULT_VISIBLE_COLUMNS, ...(profile.visible_columns || {}) });
  const [visibleSections, setVisibleSections] = useState({ ...DEFAULT_VISIBLE_SECTIONS, ...(profile.visible_sections || {}) });
  const [notifOpen, setNotifOpen] = useState(false);
  const [notifs, setNotifs] = useState([]);
  const [searchInput, setSearchInput] = useState("");
  const [appliedSearch, setAppliedSearch] = useState("");
  const [sortMode, setSortMode] = useState("created_desc"); // created_desc | due_asc | priority_desc
  const [hiddenIds, setHiddenIds] = useState([]);
  const [friendProfiles, setFriendProfiles] = useState([]);
  const [projects, setProjects] = useState([]);
  const [openProjectId, setOpenProjectId] = useState(null);
  const [showNewProject, setShowNewProject] = useState(false);
  const [projectDeleteErr, setProjectDeleteErr] = useState(null);
  const [showDeleteProjectConfirm, setShowDeleteProjectConfirm] = useState(false);
  const [showDeleteBlockedInfo, setShowDeleteBlockedInfo] = useState(false);
  const [showEditProject, setShowEditProject] = useState(false);
  const [currentProjectMembers, setCurrentProjectMembers] = useState([]);
  const openProjectIdRef = useRef(null);
  const notifRef = useRef(null);

  const loadMissions = useCallback(async () => {
    let q = sb.from("missions").select("*, creator:profiles!missions_creator_id_fkey(id,display_name,email), assignee:profiles!missions_assigned_id_fkey(id,display_name,email)").order("created_at", { ascending: false });
    const { data } = await q;
    setMissions(data || []);
  }, []);

  const loadHiddenIds = useCallback(async () => {
    const { data } = await sb.from("mission_hides").select("mission_id").eq("user_id", profile.id);
    setHiddenIds((data || []).map(r => r.mission_id));
  }, [profile.id]);

  const loadNotifs = useCallback(async () => {
    const { data } = await sb.from("notifications")
      .select("*, actor:profiles!notifications_actor_id_fkey(display_name), mission:missions(title), project:projects(name)")
      .eq("user_id", profile.id).eq("is_read", false).order("created_at", { ascending: false });
    setNotifs(data || []);
  }, [profile.id]);

  const loadFriendProfiles = useCallback(async () => {
    const uid = profile.id;
    const [{ data: asReq }, { data: asAdr }] = await Promise.all([
      sb.from("friendships").select("addressee:profiles!friendships_addressee_id_fkey(id,display_name,email)").eq("requester_id", uid).eq("status", "accepted"),
      sb.from("friendships").select("requester:profiles!friendships_requester_id_fkey(id,display_name,email)").eq("addressee_id", uid).eq("status", "accepted"),
    ]);
    const f1 = (asReq || []).map(r => r.addressee).filter(Boolean);
    const f2 = (asAdr || []).map(r => r.requester).filter(Boolean);
    setFriendProfiles([...f1, ...f2]);
  }, [profile.id]);

  const loadProjects = useCallback(async () => {
    const { data } = await sb.from("projects").select("*, creator:profiles!projects_creator_id_fkey(display_name)").order("created_at", { ascending: false });
    setProjects(data || []);
  }, []);

  const loadCurrentProjectMembers = useCallback(async (pid) => {
    if (!pid) { setCurrentProjectMembers([]); return; }
    const { data } = await sb.from("project_members").select("user:profiles!project_members_user_id_fkey(id,display_name)").eq("project_id", pid);
    setCurrentProjectMembers((data || []).map(r => r.user));
  }, []);

  useEffect(() => { openProjectIdRef.current = openProjectId; loadCurrentProjectMembers(openProjectId); }, [openProjectId, loadCurrentProjectMembers]);

  useEffect(() => { loadMissions(); loadNotifs(); loadHiddenIds(); loadFriendProfiles(); loadProjects(); }, [loadMissions, loadNotifs, loadHiddenIds, loadFriendProfiles, loadProjects]);

  async function hideMission(missionId) {
    setHiddenIds(ids => ids.includes(missionId) ? ids : [...ids, missionId]);
    const { error } = await sb.from("mission_hides").insert({ user_id: profile.id, mission_id: missionId });
    if (error) loadHiddenIds();
  }
  async function unhideMission(missionId) {
    setHiddenIds(ids => ids.filter(id => id !== missionId));
    const { error } = await sb.from("mission_hides").delete().eq("user_id", profile.id).eq("mission_id", missionId);
    if (error) loadHiddenIds();
  }

  async function deleteProject() {
    setProjectDeleteErr(null);
    setShowDeleteProjectConfirm(false);
    const { error } = await sb.from("projects").delete().eq("id", openProjectId);
    if (!error) {
      setOpenProjectId(null);
      loadProjects();
    } else {
      setProjectDeleteErr(error.message);
    }
  }

  // Realtime：missions / mission_updates / friendships / mission_hides / projects / project_members
  // 任何一張表有變動，就重新抓一次對應資料。RLS 政策會自動幫每個使用者過濾掉他原本就看不到的變動。
  useEffect(() => {
    if (!sb) return;
    const channel = sb.channel("dashboard-realtime")
      .on("postgres_changes", { event: "*", schema: "public", table: "missions" }, () => loadMissions())
      .on("postgres_changes", { event: "*", schema: "public", table: "mission_updates" }, () => loadMissions())
      .on("postgres_changes", { event: "*", schema: "public", table: "friendships" }, () => { loadMissions(); loadFriendProfiles(); })
      .on("postgres_changes", { event: "*", schema: "public", table: "mission_hides" }, () => loadHiddenIds())
      .on("postgres_changes", { event: "*", schema: "public", table: "projects" }, () => loadProjects())
      .on("postgres_changes", { event: "*", schema: "public", table: "project_members" }, () => { loadProjects(); loadCurrentProjectMembers(openProjectIdRef.current); })
      .on("postgres_changes", { event: "*", schema: "public", table: "notifications", filter: `user_id=eq.${profile.id}` }, () => loadNotifs())
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "profiles", filter: `id=eq.${profile.id}` }, (payload) => {
        // 自己的 profiles 資料列在別的裝置被改動時（例如顯示欄位/區塊設定），同步更新這台裝置的畫面
        const updated = payload.new;
        setProfile(p => ({ ...p, ...updated }));
        if (updated.visible_columns) setVisibleColumns({ ...DEFAULT_VISIBLE_COLUMNS, ...updated.visible_columns });
        if (updated.visible_sections) setVisibleSections({ ...DEFAULT_VISIBLE_SECTIONS, ...updated.visible_sections });
      })
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [loadMissions, loadHiddenIds, loadFriendProfiles, loadProjects, loadCurrentProjectMembers, loadNotifs, profile.id, setProfile]);

  const markNotifsRead = useCallback(async () => {
    await sb.from("notifications").update({ is_read: true }).eq("user_id", profile.id).eq("is_read", false);
    setNotifs([]);
  }, [profile.id]);

  // 點通知面板「外面」才關閉並標記已讀；面板打開期間內容會持續顯示，不會一點開就消失
  useEffect(() => {
    if (!notifOpen) return;
    function handleOutside(e) {
      if (notifRef.current && !notifRef.current.contains(e.target)) {
        setNotifOpen(false);
        markNotifsRead();
      }
    }
    document.addEventListener("mousedown", handleOutside);
    return () => document.removeEventListener("mousedown", handleOutside);
  }, [notifOpen, markNotifsRead]);

  const personalMissions = missions.filter(m => !m.project_id);

  const searchedMissions = appliedSearch
    ? personalMissions.filter(m => {
        const q = appliedSearch.toLowerCase();
        return (m.title || "").toLowerCase().includes(q) || (m.content || "").toLowerCase().includes(q);
      })
    : personalMissions;

  const sortedMissions = sortMissions(searchedMissions, sortMode, profile.priority_weights);
  const hiddenSet = new Set(hiddenIds);
  const visibleSorted = sortedMissions.filter(m => !hiddenSet.has(m.id));

  const openMissions = visibleSorted.filter(m => m.status === "added" || m.status === "in_progress");
  const completedMissions = visibleSorted.filter(m => m.status === "completed");
  const abandonedMissions = visibleSorted.filter(m => m.status === "abandoned");
  const hiddenMissions = sortedMissions.filter(m => hiddenSet.has(m.id));

  const [ganttSortMode, setGanttSortMode] = useState("created_desc");
  const ganttMissions = sortMissions(
    missions.filter(m => (m.status === "added" || m.status === "in_progress") && !hiddenSet.has(m.id)),
    ganttSortMode,
    profile.priority_weights
  );

  const currentProject = projects.find(p => p.id === openProjectId) || null;
  const projectAllMissions = sortMissions(missions.filter(m => m.project_id === openProjectId), "created_desc", profile.priority_weights);
  const projectOpenMissions = projectAllMissions.filter(m => m.status === "added" || m.status === "in_progress");
  const projectCompletedMissions = projectAllMissions.filter(m => m.status === "completed");
  const projectAbandonedMissions = projectAllMissions.filter(m => m.status === "abandoned");

  function runSearch() { setAppliedSearch(searchInput.trim()); }
  function clearSearch() { setSearchInput(""); setAppliedSearch(""); }
  async function toggleColumn(key) {
    const updated = { ...visibleColumns, [key]: !visibleColumns[key] };
    setVisibleColumns(updated);
    setProfile(p => ({ ...p, visible_columns: updated }));
    await sb.from("profiles").update({ visible_columns: updated }).eq("id", profile.id);
  }
  async function toggleSection(key) {
    const updated = { ...visibleSections, [key]: !visibleSections[key] };
    setVisibleSections(updated);
    setProfile(p => ({ ...p, visible_sections: updated }));
    await sb.from("profiles").update({ visible_sections: updated }).eq("id", profile.id);
  }

  return (
    <div className="min-h-screen">
      <header className="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between sticky top-0 z-20">
        <div className="flex items-center gap-6">
          <h1 className="font-bold text-slate-800">任務雲 TaskCloud</h1>
          <nav className="flex gap-1 text-sm">
            {[["list","個人任務"],["project","專案任務"],["gantt","甘特圖"],["settings","系統管理"]].map(([k,l]) => (
              <button key={k} onClick={() => setTab(k)} className={"px-3 py-1.5 rounded-lg " + (tab===k ? "bg-slate-900 text-white" : "text-slate-500 hover:bg-slate-100")}>{l}</button>
            ))}
          </nav>
        </div>
        <div className="flex items-center gap-3">
          <div className="relative" ref={notifRef}>
            <button onClick={() => setNotifOpen(o => !o)} className="relative p-2 rounded-lg hover:bg-slate-100">
              <Icon.Bell className="w-5 h-5 text-slate-600" />
              {notifs.length > 0 && <span className="absolute -top-0.5 -right-0.5 bg-rose-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">{notifs.length}</span>}
            </button>
            {notifOpen && (
              <div className="absolute right-0 mt-2 w-72 bg-white shadow-lg rounded-xl border border-slate-100 p-2 text-sm">
                {notifs.length === 0 && <p className="text-xs text-slate-400 p-2">沒有新通知</p>}
                {notifs.map(n => (
                  <div key={n.id} className="p-2 hover:bg-slate-50 rounded-lg">
                    {notifMessage(n)}
                  </div>
                ))}
              </div>
            )}
          </div>
          <span className="text-sm text-slate-500">{profile.display_name}</span>
          <button onClick={() => sb.auth.signOut()} className="text-xs bg-slate-100 rounded-lg px-3 py-1.5">登出</button>
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-6 py-6">
        {(tab === "list" || tab === "gantt") && (
          <div className="flex justify-end items-center gap-2 mb-4">
            {tab === "list" && (
              <button onClick={() => setShowColumnSettings(true)} title="顯示欄位設定" className="flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded-lg w-9 h-9">
                <Icon.Settings className="w-4 h-4 text-slate-600" />
              </button>
            )}
            <button onClick={() => setShowNew(true)} className="flex items-center gap-1 bg-blue-600 text-white rounded-lg px-4 py-2 text-sm">
              <Icon.Plus className="w-4 h-4" />新增任務
            </button>
          </div>
        )}

        {tab === "project" && (
          <div className="flex justify-between items-center gap-2 mb-4">
            {openProjectId ? (
              <button onClick={() => setOpenProjectId(null)} className="text-sm text-slate-500 underline">← 返回專案列表</button>
            ) : <div />}
            {openProjectId ? (
              <div className="flex items-center gap-2">
                <button onClick={() => setShowColumnSettings(true)} title="顯示欄位設定" className="flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded-lg w-9 h-9">
                  <Icon.Settings className="w-4 h-4 text-slate-600" />
                </button>
                <button onClick={() => setShowNew(true)} className="flex items-center gap-1 bg-blue-600 text-white rounded-lg px-4 py-2 text-sm">
                  <Icon.Plus className="w-4 h-4" />新增子任務
                </button>
              </div>
            ) : (
              <button onClick={() => setShowNewProject(true)} className="flex items-center gap-1 bg-blue-600 text-white rounded-lg px-4 py-2 text-sm">
                <Icon.Plus className="w-4 h-4" />新增專案
              </button>
            )}
          </div>
        )}

        {tab === "list" && (
          <div className="bg-white rounded-2xl shadow p-4 mb-4">
            <div className="flex gap-2">
              <input value={searchInput} onChange={e => setSearchInput(e.target.value)}
                onKeyDown={e => e.key === "Enter" && runSearch()}
                placeholder="搜尋任務標題或內文…"
                className="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm" />
              <button onClick={runSearch} className="bg-slate-900 text-white rounded-lg px-4 flex items-center justify-center">
                <Icon.Search className="w-4 h-4" />
              </button>
            </div>
            <div className="flex justify-between items-center flex-wrap gap-2 mt-3">
              <p className="text-xs text-slate-500">
                {appliedSearch
                  ? `目前顯示是所有標題和內文含有「${appliedSearch}」的搜尋結果，共 ${sortedMissions.length} 筆`
                  : `目前顯示全部任務，共 ${sortedMissions.length} 筆`}
                {appliedSearch && <button onClick={clearSearch} className="ml-2 text-blue-600 underline">清除搜尋</button>}
              </p>
              <div className="flex gap-1 text-xs flex-wrap">
                <button onClick={() => setSortMode("created_desc")}
                  className={"px-3 py-1.5 rounded-lg " + (sortMode === "created_desc" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>建立時間排序</button>
                <button onClick={() => setSortMode("due_asc")}
                  className={"px-3 py-1.5 rounded-lg " + (sortMode === "due_asc" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>截止時間排序</button>
                <button onClick={() => setSortMode("priority_desc")}
                  className={"px-3 py-1.5 rounded-lg " + (sortMode === "priority_desc" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>優先級分數排序</button>
                <button onClick={() => setSortMode("scale_asc")}
                  className={"px-3 py-1.5 rounded-lg " + (sortMode === "scale_asc" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>小任務優先</button>
                <button onClick={() => setSortMode("scale_desc")}
                  className={"px-3 py-1.5 rounded-lg " + (sortMode === "scale_desc" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>大任務優先</button>
                <button onClick={() => setSortMode("procrastination_desc")}
                  className={"px-3 py-1.5 rounded-lg " + (sortMode === "procrastination_desc" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>拖延優先</button>
              </div>
            </div>
          </div>
        )}

        {tab === "list" && (
          <div className="space-y-8">
            {visibleSections.open && (
              <section>
                <h3 className="text-sm font-bold text-slate-600 mb-2">未結案任務（{openMissions.length}）</h3>
                <MissionListView missions={openMissions} onOpen={setOpenMissionId} priorityLabels={profile.priority_labels} scaleLabels={profile.scale_labels} priorityDisplay={profile.priority_display} scaleDisplay={profile.scale_display} urgencyDisplay={profile.urgency_display} priorityColorOverride={profile.priority_color_override} scaleColorOverride={profile.scale_color_override} urgencyLabels={profile.urgency_labels} urgencyColorOverride={profile.urgency_color_override} visibleColumns={visibleColumns} currentUserId={profile.id} hiddenIds={hiddenSet} onHide={hideMission} onUnhide={unhideMission} />
              </section>
            )}
            {visibleSections.completed && (
              <section>
                <h3 className="text-sm font-bold text-slate-600 mb-2">已完成任務（{completedMissions.length}）</h3>
                <MissionListView missions={completedMissions} onOpen={setOpenMissionId} priorityLabels={profile.priority_labels} scaleLabels={profile.scale_labels} priorityDisplay={profile.priority_display} scaleDisplay={profile.scale_display} urgencyDisplay={profile.urgency_display} priorityColorOverride={profile.priority_color_override} scaleColorOverride={profile.scale_color_override} urgencyLabels={profile.urgency_labels} urgencyColorOverride={profile.urgency_color_override} visibleColumns={visibleColumns} currentUserId={profile.id} hiddenIds={hiddenSet} onHide={hideMission} onUnhide={unhideMission} />
              </section>
            )}
            {visibleSections.abandoned && (
              <section>
                <h3 className="text-sm font-bold text-slate-600 mb-2">已棄置任務（{abandonedMissions.length}）</h3>
                <MissionListView missions={abandonedMissions} onOpen={setOpenMissionId} priorityLabels={profile.priority_labels} scaleLabels={profile.scale_labels} priorityDisplay={profile.priority_display} scaleDisplay={profile.scale_display} urgencyDisplay={profile.urgency_display} priorityColorOverride={profile.priority_color_override} scaleColorOverride={profile.scale_color_override} urgencyLabels={profile.urgency_labels} urgencyColorOverride={profile.urgency_color_override} visibleColumns={visibleColumns} currentUserId={profile.id} hiddenIds={hiddenSet} onHide={hideMission} onUnhide={unhideMission} />
              </section>
            )}
            {visibleSections.hidden && (
              <section>
                <h3 className="text-sm font-bold text-slate-600 mb-2">被隱藏任務列表（{hiddenMissions.length}）</h3>
                <p className="text-xs text-slate-400 mb-2">這裡列出你自己隱藏起來的任務（通常是朋友分享給你、但你不想在主要清單看到的任務）。按「取消隱藏」就會回到原本的分類裡。</p>
                <MissionListView missions={hiddenMissions} onOpen={setOpenMissionId} priorityLabels={profile.priority_labels} scaleLabels={profile.scale_labels} priorityDisplay={profile.priority_display} scaleDisplay={profile.scale_display} urgencyDisplay={profile.urgency_display} priorityColorOverride={profile.priority_color_override} scaleColorOverride={profile.scale_color_override} urgencyLabels={profile.urgency_labels} urgencyColorOverride={profile.urgency_color_override} visibleColumns={visibleColumns} currentUserId={profile.id} hiddenIds={hiddenSet} onHide={hideMission} onUnhide={unhideMission} />
              </section>
            )}
          </div>
        )}

        {tab === "gantt" && (
          <div className="bg-white rounded-2xl shadow p-4 mb-4 flex justify-end">
            <div className="flex gap-1 text-xs flex-wrap">
              <button onClick={() => setGanttSortMode("created_desc")}
                className={"px-3 py-1.5 rounded-lg " + (ganttSortMode === "created_desc" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>建立時間排序</button>
              <button onClick={() => setGanttSortMode("due_asc")}
                className={"px-3 py-1.5 rounded-lg " + (ganttSortMode === "due_asc" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>截止時間排序</button>
              <button onClick={() => setGanttSortMode("priority_desc")}
                className={"px-3 py-1.5 rounded-lg " + (ganttSortMode === "priority_desc" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>優先級分數排序</button>
              <button onClick={() => setGanttSortMode("scale_asc")}
                className={"px-3 py-1.5 rounded-lg " + (ganttSortMode === "scale_asc" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>小任務優先</button>
              <button onClick={() => setGanttSortMode("scale_desc")}
                className={"px-3 py-1.5 rounded-lg " + (ganttSortMode === "scale_desc" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>大任務優先</button>
              <button onClick={() => setGanttSortMode("procrastination_desc")}
                className={"px-3 py-1.5 rounded-lg " + (ganttSortMode === "procrastination_desc" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>拖延優先</button>
            </div>
          </div>
        )}
        {tab === "gantt" && <GanttView missions={ganttMissions} onOpen={setOpenMissionId} />}

        {tab === "project" && !openProjectId && (
          <div className="bg-white rounded-2xl shadow overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-left text-xs text-slate-400 border-b border-slate-200">
                  <th className="px-4 py-2 font-medium">專案名稱</th>
                  <th className="px-4 py-2 font-medium">發起人</th>
                  <th className="px-4 py-2 font-medium">建立時間</th>
                </tr>
              </thead>
              <tbody>
                {projects.map(p => (
                  <tr key={p.id} onClick={() => setOpenProjectId(p.id)} className="border-b border-slate-100 hover:bg-slate-50 cursor-pointer">
                    <td className="px-4 py-3 font-medium">{p.name}</td>
                    <td className="px-4 py-3 whitespace-nowrap text-slate-500">{p.creator?.display_name}</td>
                    <td className="px-4 py-3 whitespace-nowrap text-slate-500">{fmt(p.created_at)}</td>
                  </tr>
                ))}
                {projects.length === 0 && (
                  <tr><td colSpan={3} className="px-4 py-8 text-center text-slate-400">目前沒有任何專案</td></tr>
                )}
              </tbody>
            </table>
          </div>
        )}

        {tab === "project" && openProjectId && currentProject && (
          <div className="space-y-6">
            <div className="bg-white rounded-2xl shadow p-5">
              <div className="flex justify-between items-start">
                <div>
                  <h2 className="text-lg font-bold mb-1">{currentProject.name}</h2>
                  {currentProject.description && <p className="text-sm text-slate-600 mb-2 whitespace-pre-wrap">{currentProject.description}</p>}
                  <p className="text-xs text-slate-500 mb-2">發起人：{currentProject.creator?.display_name}</p>
                  <p className="text-xs text-slate-500">專案成員：{currentProjectMembers.map(m => m.display_name).join("、")}</p>
                </div>
                {currentProject.creator_id === profile.id && (
                  <div className="text-right">
                    <div className="flex gap-2 justify-end">
                      <button
                        onClick={() => setShowEditProject(true)}
                        title="編輯專案"
                        className="flex items-center justify-center bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg w-9 h-9"
                      >
                        <Icon.Edit className="w-4 h-4" />
                      </button>
                      <button
                        onClick={() => projectOpenMissions.length > 0 ? setShowDeleteBlockedInfo(true) : setShowDeleteProjectConfirm(true)}
                        title="刪除專案"
                        className="flex items-center justify-center bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg w-9 h-9"
                      >
                        <Icon.Trash className="w-4 h-4" />
                      </button>
                    </div>
                  </div>
                )}
              </div>
              {projectDeleteErr && <div className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2 mt-2">{projectDeleteErr}</div>}
            </div>
            {showDeleteProjectConfirm && (
              <ConfirmModal
                title="刪除專案"
                message={`確定要永久刪除專案「${currentProject.name}」嗎？\n此動作無法復原，底下所有任務與回覆紀錄都會一併刪除。`}
                confirmLabel="確認刪除"
                danger
                onConfirm={deleteProject}
                onCancel={() => setShowDeleteProjectConfirm(false)}
              />
            )}
            {showDeleteBlockedInfo && (
              <ConfirmModal
                title="無法刪除此專案"
                hideCancel
                confirmLabel="我知道了"
                message={`還有 ${projectOpenMissions.length} 筆未結案任務（已新增／進行中），需先轉指派、完成或棄置後才能刪除專案。\n\n` + projectOpenMissions.map(t => `．${t.title}`).join("\n")}
                onConfirm={() => setShowDeleteBlockedInfo(false)}
                onCancel={() => setShowDeleteBlockedInfo(false)}
              />
            )}
            {visibleSections.open && (
              <section>
                <h3 className="text-sm font-bold text-slate-600 mb-2">未結案任務（{projectOpenMissions.length}）</h3>
                <MissionListView missions={projectOpenMissions} onOpen={setOpenMissionId} priorityLabels={profile.priority_labels} scaleLabels={profile.scale_labels} priorityDisplay={profile.priority_display} scaleDisplay={profile.scale_display} urgencyDisplay={profile.urgency_display} priorityColorOverride={profile.priority_color_override} scaleColorOverride={profile.scale_color_override} urgencyLabels={profile.urgency_labels} urgencyColorOverride={profile.urgency_color_override} visibleColumns={visibleColumns} currentUserId={profile.id} hiddenIds={hiddenSet} onHide={hideMission} onUnhide={unhideMission} />
              </section>
            )}
            {visibleSections.completed && (
              <section>
                <h3 className="text-sm font-bold text-slate-600 mb-2">已完成任務（{projectCompletedMissions.length}）</h3>
                <MissionListView missions={projectCompletedMissions} onOpen={setOpenMissionId} priorityLabels={profile.priority_labels} scaleLabels={profile.scale_labels} priorityDisplay={profile.priority_display} scaleDisplay={profile.scale_display} urgencyDisplay={profile.urgency_display} priorityColorOverride={profile.priority_color_override} scaleColorOverride={profile.scale_color_override} urgencyLabels={profile.urgency_labels} urgencyColorOverride={profile.urgency_color_override} visibleColumns={visibleColumns} currentUserId={profile.id} hiddenIds={hiddenSet} onHide={hideMission} onUnhide={unhideMission} />
              </section>
            )}
            {visibleSections.abandoned && (
              <section>
                <h3 className="text-sm font-bold text-slate-600 mb-2">已棄置任務（{projectAbandonedMissions.length}）</h3>
                <MissionListView missions={projectAbandonedMissions} onOpen={setOpenMissionId} priorityLabels={profile.priority_labels} scaleLabels={profile.scale_labels} priorityDisplay={profile.priority_display} scaleDisplay={profile.scale_display} urgencyDisplay={profile.urgency_display} priorityColorOverride={profile.priority_color_override} scaleColorOverride={profile.scale_color_override} urgencyLabels={profile.urgency_labels} urgencyColorOverride={profile.urgency_color_override} visibleColumns={visibleColumns} currentUserId={profile.id} hiddenIds={hiddenSet} onHide={hideMission} onUnhide={unhideMission} />
              </section>
            )}
          </div>
        )}

        {tab === "settings" && <SettingsView profile={profile} onProfileChange={setProfile} />}
      </main>

      {showNew && (
        <NewMissionModal
          onClose={() => setShowNew(false)}
          onCreated={loadMissions}
          priorityLabels={profile.priority_labels} scaleLabels={profile.scale_labels}
          priorityDisplay={profile.priority_display} scaleDisplay={profile.scale_display}
          priorityColorOverride={profile.priority_color_override} scaleColorOverride={profile.scale_color_override}
          currentUserId={profile.id} currentUserName={profile.display_name}
          projectId={tab === "project" ? openProjectId : null}
          assigneeOptions={tab === "project" ? currentProjectMembers.filter(m => m.id !== profile.id) : friendProfiles}
        />
      )}
      {showNewProject && (
        <NewProjectModal
          onClose={() => setShowNewProject(false)}
          onCreated={loadProjects}
          friendProfiles={friendProfiles}
          currentUserName={profile.display_name}
        />
      )}
      {showEditProject && currentProject && (
        <EditProjectModal
          project={currentProject}
          members={currentProjectMembers}
          friendProfiles={friendProfiles}
          openMissions={projectOpenMissions}
          onClose={() => setShowEditProject(false)}
          onChanged={() => { loadCurrentProjectMembers(openProjectId); loadProjects(); loadMissions(); }}
        />
      )}
      {showColumnSettings && (
        <ColumnSettingsModal
          visibleColumns={visibleColumns} onToggleColumn={toggleColumn}
          visibleSections={visibleSections} onToggleSection={toggleSection}
          onClose={() => setShowColumnSettings(false)}
        />
      )}
      {openMissionId && (
        <MissionDetailModal missionId={openMissionId} currentUser={session.user} priorityLabels={profile.priority_labels} scaleLabels={profile.scale_labels} priorityDisplay={profile.priority_display} scaleDisplay={profile.scale_display} priorityColorOverride={profile.priority_color_override} scaleColorOverride={profile.scale_color_override} urgencyDisplay={profile.urgency_display} urgencyLabels={profile.urgency_labels} urgencyColorOverride={profile.urgency_color_override} friendProfiles={friendProfiles}
          onClose={() => setOpenMissionId(null)} onChanged={loadMissions} />
      )}
    </div>
  );
}

// Root
// =====================================================================
function App() {
  const [session, setSession] = useState(undefined); // undefined = loading
  const [profile, setProfile] = useState(null);
  const [recoveryMode, setRecoveryMode] = useState(false);

  useEffect(() => {
    if (!sb) { setSession(null); return; }
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((event, sess) => {
      setSession(sess);
      if (event === "PASSWORD_RECOVERY") setRecoveryMode(true);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setProfile(null); return; }
    let cancelled = false;
    async function fetchProfile(retries) {
      const { data } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
      if (cancelled) return;
      if (data) setProfile(data);
      else if (retries > 0) setTimeout(() => fetchProfile(retries - 1), 500);
    }
    fetchProfile(4);
    return () => { cancelled = true; };
  }, [session]);

  if (recoveryMode) return <ResetPasswordScreen onDone={() => setRecoveryMode(false)} />;
  if (session === undefined) return <div className="min-h-screen flex items-center justify-center text-slate-400 text-sm">載入中…</div>;
  if (!session) return <AuthScreen />;
  if (!profile) return <div className="min-h-screen flex items-center justify-center text-slate-400 text-sm">建立會員資料中…</div>;
  return <Dashboard session={session} profile={profile} setProfile={setProfile} />;
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("渲染錯誤：", error, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ maxWidth: 640, margin: "60px auto", padding: 24, border: "1px solid #fecaca", background: "#fff1f2", borderRadius: 12, fontFamily: "sans-serif", color: "#7f1d1d" }}>
          <h2 style={{ margin: "0 0 8px", fontSize: 18 }}>畫面渲染時發生錯誤</h2>
          <p style={{ fontSize: 14, margin: "0 0 8px" }}>錯誤訊息：{this.state.error.message}</p>
          <p style={{ fontSize: 12, color: "#9f1239" }}>請打開瀏覽器開發者工具（F12）的 Console 分頁查看詳細內容。</p>
        </div>
      );
    }
    return this.props.children;
  }
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
} catch (e) {
  document.getElementById("root").innerHTML =
    '<div style="max-width:640px;margin:60px auto;padding:24px;border:1px solid #fecaca;background:#fff1f2;border-radius:12px;font-family:sans-serif;color:#7f1d1d;">' +
    '<h2 style="margin:0 0 8px;font-size:18px;">初始化時發生錯誤</h2>' +
    '<p style="font-size:14px;">' + e.message + '</p></div>';
}
</script>
<script>
  // 手動呼叫 Babel.transform 並強制指定 runtime: "classic"（用全域 React/ReactDOM 變數），
  // 避免自動掃描 type="text/babel" 時，較新版 babel-standalone 預設改用 "automatic" runtime
  // 而產生 `import ... from "react/jsx-runtime"`，在一般 <script> 環境中無法執行的問題。
  (function () {
    try {
      var source = document.getElementById("app-source").textContent;
      var output = Babel.transform(source, {
        presets: [["react", { runtime: "classic" }]],
      }).code;
      var s = document.createElement("script");
      s.text = output;
      document.body.appendChild(s);
    } catch (e) {
      document.getElementById("root").innerHTML =
        '<div style="max-width:640px;margin:60px auto;padding:24px;border:1px solid #fecaca;background:#fff1f2;border-radius:12px;font-family:sans-serif;color:#7f1d1d;">' +
        '<h2 style="margin:0 0 8px;font-size:18px;">程式碼轉譯時發生錯誤</h2>' +
        '<p style="font-size:14px;">' + e.message + '</p></div>';
    }
  })();
</script>
