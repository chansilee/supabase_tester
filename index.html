  const load = useCallback(async () => {
    const [missionRes, updatesRes, checklistRes] = await Promise.all([
      sb.from("missions")
        .select("*, creator:profiles!missions_creator_id_fkey(id,display_name,email), assignee:profiles!missions_assigned_id_fkey(id,display_name,email), project:projects(id,name), work_dimensions:mission_work_dimensions(*)")
        .eq("id", missionId).single(),
      sb.from("mission_updates")
        .select("*, author:profiles!mission_updates_author_id_fkey(id,display_name)")
        .eq("mission_id", missionId).order("created_at", { ascending: true }),
      sb.from("mission_checklist_items")
        .select("*").eq("mission_id", missionId).order("position", { ascending: true }),
    ]);
    const m = missionRes.data;
    // 重要：只有真的拿到資料才更新 mission，絕對不能讓短暫的 race/查詢失敗把已經載入好的
    // mission 蓋成 null——一旦變 null，整個 Modal 頂端的 `if (!mission) return null` 會讓
    // 畫面整個消失，使用者體感上就是「跳出」。連續匯入多筆 AI 建議子任務時，
    // 一次操作會同時觸發好幾個 realtime 重新載入（checklist insert + missions update 各觸發一次，
    // 加上這裡自己主動呼叫的 load()），偶爾疊在一起造成其中一次查詢結果暫時空的，這裡擋下來即可。
    if (m) {
      setMission(m);
    } else if (missionRes.error) {
      console.error("load mission failed:", missionRes.error);
    }
    // 只有「不在編輯模式」時才重新灌入編輯表單的草稿欄位（標題/內容/截止時間/AI 建議…）。
    // 這幾個欄位是使用者正在動的東西——如果每次 load() 都無腦重灌，會出現兩種壞行為：
    // 1. 使用者在編輯標題打到一半，被 realtime 觸發的 load() 蓋掉打字內容
    // 2. AI 建議清單每匯入/送回一筆（觸發 checklist 變動 → realtime → load()）就被清空成 []，
    //    造成「備選子任務空間動不動就消失」——不是 log 即時刷新的問題，就是這裡的無條件 reset
    if (m && !editingBody) {
      setEditTitle(m.title); setEditContent(m.content || "");
      setEditContentOpen(!!m.content);
      if (m.due_date) {
        const precise = m.due_time_precise !== false;
        if (precise) {
          setEditDue(m.due_date.slice(0, 10));
          setEditDueTime(m.due_date.slice(11, 16));
        } else {
          // due_date 實際存的是隔天 00:00 UTC 邊界，編輯欄位要退回顯示原本那一天
          const back = new Date(m.due_date);
          back.setUTCDate(back.getUTCDate() - 1);
          setEditDue(back.toISOString().slice(0, 10));
          setEditDueTime("");
        }
      } else {
        setEditDue(""); setEditDueTime("");
      }
      setEditPriority(m.priority || "P2");
      setEditScale(m.scale || 1);
      setEditScaleSource(m.scale_source || "manual");
      setEditAssigneeId(m.assigned_id);
      setAiSuggestions([]); setAiCategoryScores(null); setAiErr(null);
    }
    if (m) {
      if (m.project_id) {
        const { data: pm } = await sb.from("project_members")
          .select("user:profiles!project_members_user_id_fkey(id,display_name)")
          .eq("project_id", m.project_id);
        setProjectMembers((pm || []).map(r => r.user));
      } else {
        setProjectMembers([]);
      }
    }
    setUpdates(updatesRes.data || []);
    setChecklist(checklistRes.data || []);
  }, [missionId, editingBody]);

  useEffect(() => { load(); }, [load]);

  // Realtime：這筆任務本身、底下的回覆紀錄、或檢查清單，只要有變動就重新整理詳情內容。
  useEffect(() => {
    if (!sb) return;
    const channel = sb.channel("mission-detail-" + missionId)
      .on("postgres_changes", { event: "*", schema: "public", table: "missions", filter: `id=eq.${missionId}` }, () => load())
      .on("postgres_changes", { event: "*", schema: "public", table: "mission_updates", filter: `mission_id=eq.${missionId}` }, () => load())
      .on("postgres_changes", { event: "*", schema: "public", table: "mission_checklist_items", filter: `mission_id=eq.${missionId}` }, () => load())
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [missionId, load]);

  // 任務規模自動判定：scale_source='auto' 且 checklist 有任一項目填了結構化細節（分鐘數/需移動/需等待，
  // 不論來源是 AI 建議還是使用者手動填）時，即時依 checklist 內容重算 scale 並寫回資料庫
  useEffect(() => {
    if (!mission || mission.scale_source !== "auto") return;
    if (!hasStructuredDetail(checklist)) return;
    const nextScale = autoScaleFromChecklist(checklist);
    if (nextScale !== mission.scale) {
      sb.from("missions").update({ scale: nextScale }).eq("id", missionId).then(({ error }) => {
        if (!error) setMission(m => m ? { ...m, scale: nextScale } : m);
      });
    }
  }, [checklist, mission?.scale_source, mission?.scale, missionId]);

  // 更新紀錄：依排序方向算出目前要顯示的清單，跟真正「時間上最新」的那一筆是誰（給發光框跟自動捲動共用）。
  // 這幾行、還有下面的 useEffect，故意放在「if (!mission) return null」這行之前——
  // 這是我上一版的 bug：Hook 一定要在元件每一次 render 都用同樣的順序、同樣的數量呼叫，
  // 放在 early return 之後會導致「任務還沒載入完成時」跟「載入完成後」呼叫到的 Hook 數量不一樣，
  // React 會直接丟出 #310 這個錯誤（Rendered more hooks than during the previous render）。
  // updates 這個 state 一開始就是空陣列，跟 mission 有沒有載入完成無關，搬到這裡完全不影響邏輯。
  const visibleUpdateLogs = showSystemLogs === false ? updates.filter(u => !u.is_system) : updates;
  const updateLogSortDir = (updateLogSortOrder || "desc") === "desc" ? -1 : 1;
  const sortedUpdateLogs = [...visibleUpdateLogs].sort((a, b) => updateLogSortDir * (new Date(a.created_at) - new Date(b.created_at)));
  const latestUpdateLogId = sortedUpdateLogs.reduce((latest, u) =>
    (!latest || new Date(u.created_at) > new Date(latest.created_at)) ? u : latest, null)?.id;

  const effectiveGlow = glowSettings || DEFAULT_GLOW_SETTINGS;

  const updateLogScrollRef = useRef(null);
  const updateLogScrollTriggerRef = useRef(null);
  const latestRowRef = useRef(null);
  const rowRefsMap = useRef(new Map()); // 每一列的 DOM 節點，用留言 id 當 key——刪除任何一列時（不只是最新那筆）都要找得到對應的元素才能播放縮小動畫
  const prevLatestIdRef = useRef(undefined); // undefined=尚未初始化；用來分辨「真的有新一筆」還是「只是排序方向切換、最新那筆還是同一筆」
  useEffect(() => {
    const el = updateLogScrollRef.current;
    if (!el) return;
    const triggerKey = `${updateLogSortOrder}|${latestUpdateLogId}`;
    const isFirstRun = updateLogScrollTriggerRef.current === null;
    if (updateLogScrollTriggerRef.current === triggerKey) return;
    updateLogScrollTriggerRef.current = triggerKey;

    // 「最新那筆」的 id 真的換人了，才算是新送出的一筆；如果只是排序方向切換、id 沒變，
    // 就只是同一筆換位置而已，不用播放「新插入」的長高動畫，只要捲動+閃爍提醒就好
    const isNewRecord = prevLatestIdRef.current !== undefined && prevLatestIdRef.current !== latestUpdateLogId;
    prevLatestIdRef.current = latestUpdateLogId;

    const target = (updateLogSortOrder || "desc") === "desc" ? 0 : el.scrollHeight;
    if (isFirstRun) { el.scrollTop = target; return; } // 第一次掛載直接定位，不用播過場動畫、也不用閃爍
    smoothScrollTo(el, target, 500);
    runGlowPulse(latestRowRef.current, effectiveGlow); // 觸發時機二：排序方向切換或有新的一筆送出，都算「有新東西要提醒你看」
    // 真的有新一筆送出時，不管是「新到舊」插在最上面、還是「舊到新」插在最下面，都讓那一列從 0
    // 長高進來，旁邊的紀錄會被正常排版自然推開，兩種排序方向現在都有「被推進來」的動態感，不是只有
    // 「舊到新」因為捲動效果剛好順眼、「新到舊」卻因為本來就在頂部、捲動距離是 0 而顯得突兀地直接冒出來
    if (isNewRecord) growRowIn(latestRowRef.current);
  }, [updateLogSortOrder, latestUpdateLogId]);

  // 觸發時機三：捲動讓最新那筆完整進入可視範圍（不管是往下捲進去、還是往上捲回去），才閃一次。
  // root 設成更新紀錄自己的捲動容器，不是瀏覽器視窗——這是內部小捲動區，不是整頁捲動。
  // threshold 用 0.999 而不是 1（浮點數誤差偶爾會讓瀏覽器算出來的比例卡在 0.999xxx，永遠到不了剛好 1.0）
  useEffect(() => {
    const target = latestRowRef.current;
    const root = updateLogScrollRef.current;
    if (!target || !root) return;
    let wasFullyVisible = false;
    const observer = new IntersectionObserver(([entry]) => {
      const isFullyVisible = entry.isIntersecting && entry.intersectionRatio >= 0.999;
      if (isFullyVisible && !wasFullyVisible) runGlowPulse(target, effectiveGlow);
      wasFullyVisible = isFullyVisible;
    }, { root, threshold: 0.999 });
    observer.observe(target);
    return () => observer.disconnect();
  }, [latestUpdateLogId, effectiveGlow]);

  if (!mission) return null;
  const normalizedWorkDim = Array.isArray(mission.work_dimensions) ? mission.work_dimensions[0] : mission.work_dimensions;

  const isCreator = mission.creator_id === currentUser.id;
  const isAssignee = mission.assigned_id === currentUser.id;
  const isClosed = mission.status === "completed" || mission.status === "abandoned";
  // 暫時完成/暫時棄置：被指派者回報後，等待建立者裁決期間的「凍結」狀態——這兩個是「未結案」狀態
  // （statusTier() 預設非 completed/abandoned 都算未結案，這裡自然吃到，不用改 statusTier 本身），
  // 但期間任何人都不能再留言、不能再動檢查清單，只有建立者的同意/不同意、或原回報人的取消回報能解開。
  const isTaskPending = mission.status === "pending_completed" || mission.status === "pending_abandoned";
  // 只有「目前仍是被指派者」而且「當初就是自己送出這筆回報」兩個條件同時成立，才能看到取消回報按鈕——
  // 轉指派給別人之後，原回報人就算還記得自己回報過，也不再符合 isAssignee，這裡自然被擋掉
  // （跟資料庫那邊 restrict_assignee_status_update 的 RLS 判斷邏輯一致，前後端行為對得起來）
  const isReporter = isAssignee && mission.pending_status_reported_by === currentUser.id;
  // 標題外發光：只有「未結案+注目」才要亮，關掉（取消注目、或任務已結案）就是 0% 沒有發光。
  // 這是單純的兩個狀態互相切換（亮/不亮），不是像更新紀錄那種要反覆閃爍的動畫，純 CSS transition
  // 就能處理，不需要像 box-shadow 那個閃爍效果一樣寫 JS 逐幀計算。
  const titleGlowActive = isStarred && !isClosed;
  const titleGlowRgb = hexToRgb(effectiveGlow.color);
  const titleGlowAlpha = titleGlowActive ? effectiveGlow.maxOpacity : 0;
  const titleGlowStyle = {
    transition: "text-shadow 600ms ease",
    textShadow: `0 0 4px rgba(${titleGlowRgb.r}, ${titleGlowRgb.g}, ${titleGlowRgb.b}, ${titleGlowAlpha}), 0 0 48px rgba(${titleGlowRgb.r}, ${titleGlowRgb.g}, ${titleGlowRgb.b}, ${titleGlowAlpha * 0.6})`,
  };
  // 暫時完成/暫時棄置期間，檢查清單整個凍結——不能再打勾、不能再新增/刪除/編輯細節
  const canToggleChecklist = (isCreator || isAssignee) && !isClosed && !isTaskPending;
  const typeLabel = mission.project_id ? "專案任務" : (mission.assigned_id === mission.creator_id ? "私人任務" : "私人指派任務");
  // 編輯時可選的指派對象：專案任務只能選專案成員；個人任務只能選自己或好友
  const assigneeChoices = mission.project_id
    ? projectMembers
    : [{ id: currentUser.id, display_name: "我自己" }, ...(friendProfiles || [])];

  async function submitReply(e) {
    if (e) e.preventDefault();
    if (!replyText.trim()) { setReplyErr("更新內容不能為空"); return; }
    setBusy(true); setReplyErr(null);
    try {
      const { error } = await sb.from("mission_updates").insert({
        mission_id: missionId, author_id: currentUser.id, content: replyText,
      });
      if (error) throw error;
      setReplyText("");
      setShowReplyForm(false);
      await load();
      onChanged();
    } catch (e2) { setReplyErr(e2.message); } finally { setBusy(false); }
  }

  async function deleteUpdate() {
    const updateId = confirmDeleteUpdateId;
    setConfirmDeleteUpdateId(null);
    const rowEl = rowRefsMap.current.get(updateId);
    if (rowEl) await shrinkRowOut(rowEl); // 先把那一列縮小到 0，下面的列自然被排版擠上來填補空隙，播完才真的送出刪除
    const { error } = await sb.from("mission_updates").delete().eq("id", updateId);
    if (error) setErr(error.message);
    else await load();
  }

  async function addChecklistItem(e) {
    e.preventDefault();
    const text = newChecklistText.trim();
    if (!text) return;
    setChecklistErr(null);
    setNewChecklistText("");
    const { error } = await sb.from("mission_checklist_items").insert({ mission_id: missionId, content: text });
    if (error) { setChecklistErr(error.message); setNewChecklistText(text); }
    load();
  }
  async function toggleChecklistItem(item) {
    setChecklistErr(null);
    const nextChecked = !item.is_checked;
    setChecklist(list => list.map(i => i.id === item.id ? { ...i, is_checked: nextChecked } : i));
    const { error } = await sb.from("mission_checklist_items").update({ is_checked: nextChecked }).eq("id", item.id);
    if (error) {
      setChecklistErr(error.message);
      setChecklist(list => list.map(i => i.id === item.id ? { ...i, is_checked: item.is_checked } : i));
    } else {
      load();
    }
  }
  async function deleteChecklistItem(id) {
    setChecklistErr(null);
    const el = checklistRowRefsMap.current.get(id);
    if (el) await shrinkRowOut(el);
    const removed = checklist.find(i => i.id === id);
    setChecklist(list => list.filter(i => i.id !== id));
    const { error } = await sb.from("mission_checklist_items").delete().eq("id", id);
    if (error) {
      setChecklistErr(error.message);
      if (removed) setChecklist(list => [...list, removed].sort((a, b) => new Date(a.created_at) - new Date(b.created_at)));
    } else {
      load();
    }
  }
  // 垃圾桶按鈕先跳自繪彈窗二次確認，避免手滑誤觸直接刪掉子任務
  function confirmDeleteChecklistItemAction() {
    if (!confirmDeleteChecklistItem) return;
    deleteChecklistItem(confirmDeleteChecklistItem.id);
    setConfirmDeleteChecklistItem(null);
  }
  function startEditChecklist(item) {
    setEditingChecklistId(item.id);
    setEditingChecklistText(item.content);
  }
  async function saveChecklistEdit(id) {
    const text = editingChecklistText.trim();
    setEditingChecklistId(null);
    if (!text) return;
    setChecklistErr(null);
    const previous = checklist.find(i => i.id === id);
    setChecklist(list => list.map(i => i.id === id ? { ...i, content: text } : i));
    const { error } = await sb.from("mission_checklist_items").update({ content: text }).eq("id", id);
    if (error) {
      setChecklistErr(error.message);
      if (previous) setChecklist(list => list.map(i => i.id === id ? previous : i));
    } else {
      load();
    }
  }
  async function moveChecklistItem(index, dir) {
    const target = index + dir;
    if (target < 0 || target >= checklist.length) return;
    const a = checklist[index], b = checklist[target];
    const reordered = [...checklist];
    [reordered[index], reordered[target]] = [reordered[target], reordered[index]];
    setChecklist(reordered);
    const { error: e1 } = await sb.from("mission_checklist_items").update({ position: b.position }).eq("id", a.id);
    const { error: e2 } = await sb.from("mission_checklist_items").update({ position: a.position }).eq("id", b.id);
    if (e1 || e2) {
      setChecklistErr((e1 || e2).message);
      load();
    }
  }

  // 更新單一項目的結構化細節（分鐘數/需移動/需等待天數）；不論項目來源，填了細節就可能觸發自動規模
  async function updateChecklistDetail(item, patch) {
    setChecklistErr(null);
    const previous = item;
    setChecklist(list => list.map(i => i.id === item.id ? { ...i, ...patch } : i));
    const { error } = await sb.from("mission_checklist_items").update(patch).eq("id", item.id);
    if (error) {
      setChecklistErr(error.message);
      setChecklist(list => list.map(i => i.id === item.id ? previous : i));
    }
  }

  // 「🔒 手動輸入」／「🔄 改回自動判定」：切換 scale_source
  async function toggleScaleSource() {
    const next = mission.scale_source === "auto" ? "manual" : "auto";
    const { error } = await sb.from("missions").update({ scale_source: next }).eq("id", missionId);
    if (!error) {
      setMission(m => ({ ...m, scale_source: next }));
      setEditScaleSource(next);
      if (next === "auto" && hasStructuredDetail(checklist)) {
        const s = autoScaleFromChecklist(checklist);
        await sb.from("missions").update({ scale: s }).eq("id", missionId);
        setMission(m => ({ ...m, scale: s }));
      }
    } else {
      setErr(error.message);
    }
  }

  // 手動分類：開啟編輯時，把目前 category_scores 裡分數 > 0 的分類全部預先勾選，
  // 使用者可以直接調整（刪減/新增），不需要每次都從零開始選
  function startCategoryEdit() {
    const current = (aiCategoryScores !== null ? aiCategoryScores : mission.category_scores) || {};
    setCategoryDraft(AI_CATEGORIES.filter(k => Number(current[k]) > 0));
    setCategoryErr(null);
    setCategoryEditing(true);
  }
  function toggleCategoryDraft(key) {
    setCategoryDraft(list => list.includes(key) ? list.filter(k => k !== key) : [...list, key]);
  }
  async function saveCategoryEdit() {
    setCategoryBusy(true); setCategoryErr(null);
    try {
      const scores = evenSplitScores(categoryDraft);
      const { error } = await sb.from("missions").update({
        category_scores: scores, primary_category: scores ? primaryCategoryOf(scores) : null,
      }).eq("id", missionId);
      if (error) throw error;
      setMission(m => ({ ...m, category_scores: scores, primary_category: scores ? primaryCategoryOf(scores) : null }));
      setAiCategoryScores(null); // 手動存檔後這筆就是最新的權威值，清掉待確認的 AI 草稿，避免顯示邏輯誤用舊草稿蓋掉剛存好的結果
      setCategoryEditing(false);
      onChanged(); // 讓 Dashboard 的 missions 列表也立即重抓，不然任務列表/類別瀏覽的「類別」欄位要等 realtime 或重新整理才會更新
    } catch (e) {
      setCategoryErr(e.message);
    } finally {
      setCategoryBusy(false);
    }
  }

  // 「工作」六個管理學維度：手動編輯起手式——把目前值（沒有就是空字串）灌進草稿
  function startWorkDimEdit() {
    const wd = normalizedWorkDim || {};
    setWorkDimDraft({
      internal_external: wd.internal_external || "",
      functional_category: wd.functional_category || "",
      task_level: wd.task_level || "",
      priority_quadrant: wd.priority_quadrant || "",
      task_type: wd.task_type || "",
      growth_strategy: wd.growth_strategy || "",
      resource_bottleneck: wd.resource_bottleneck || "",
    });
    setWorkDimErr(null);
    setWorkDimEditing(true);
  }
  function updateWorkDimDraft(key, value) {
    setWorkDimDraft(d => {
      const next = { ...d, [key]: value };
      // internal_external 改成「內部」時，growth_strategy 只對「外部」有意義，跟著鎖成「不適用」
      if (key === "internal_external" && value !== "外部") next.growth_strategy = "不適用";
      return next;
    });
  }
  async function saveWorkDimEdit() {
    setWorkDimBusy(true); setWorkDimErr(null);
    try {
      const payload = { mission_id: missionId };
      WORK_DIMENSION_DEFS.forEach(d => { payload[d.key] = workDimDraft[d.key] || null; });
      payload.internal_external = workDimDraft.internal_external || null;
      const { error } = await sb.from("mission_work_dimensions").upsert(payload, { onConflict: "mission_id" });
      if (error) throw error;
      await load();
      setWorkDimEditing(false);
      onChanged(); // mission_work_dimensions 是獨立的表，不會觸發 missions 本身的 realtime 事件，
                   // 不主動呼叫的話，任務列表／類別瀏覽的「工作-XXX」子標籤要等重新整理才會看到最新結果
    } catch (e) {
      setWorkDimErr(e.message);
    } finally {
      setWorkDimBusy(false);
    }
  }
  async function runWorkDimAi() {
    if (isTitleTooShortForAi(mission.title)) { setAiInsufficientModal(true); return; }
    setWorkAiBusy(true); setWorkAiErr(null);
    try {
      const result = await callAiWorkDimensions(mission.title, mission.content || "");
      const payload = { mission_id: missionId, ...result, from_ai: true };
      const { error } = await sb.from("mission_work_dimensions").upsert(payload, { onConflict: "mission_id" });
      if (error) throw error;
      await load();
      onChanged(); // 同上，AI 標記完也要主動通知 Dashboard 重抓，不然要等重新整理頁面
    } catch (e) {
      if (AI_QUOTA_ERROR_CODES.has(e.code)) {
        setAiQuotaModal({ title: AI_QUOTA_ERROR_TITLES[e.code] || "已達使用上限", message: e.message });
      } else {
        setWorkAiErr(e.message);
      }
    } finally {
      setWorkAiBusy(false);
    }
  }

  // 重新 AI 辨識：只在編輯模式、依目前的 editTitle 重新呼叫。deadline 若原本已有值且判斷出不同結果，
  // 需要使用者在自繪 ConfirmModal 二次確認才覆蓋；scale 交給既有的自動判定 effect 處理，不需額外確認。
  async function rerunAiRecognize() {
    if (!editTitle.trim()) return;
    if (isTitleTooShortForAi(editTitle)) { setAiInsufficientModal(true); return; }
    setAiBusy(true); setAiErr(null); setAiErrCode(null);
    try {
      const result = await callAiRecognize(editTitle.trim(), editContent);
      if (mission.category_scores) {
        // 之前已經有分類設定（不論是 AI 判斷過還是使用者手動設的），重新辨識不能無聲蓋掉，要讓使用者決定
        setConfirmCategoryOverwrite(result.category_scores);
      } else {
        // 從來沒分類過，直接套用新結果，不用多問
        setAiCategoryScores(result.category_scores);
      }
      setAiSuggestions((result.subtasks || []).map((s, i) => ({ ...s, _key: `ai-${Date.now()}-${i}` })));
      if (result.extracted_deadline_date) {
        const hasExisting = !!editDue;
        const changed = editDue !== result.extracted_deadline_date || editDueTime !== (result.extracted_deadline_time || "");
        if (hasExisting && changed) {
          setConfirmDeadlineOverwrite({ date: result.extracted_deadline_date, time: result.extracted_deadline_time || "" });
        } else if (!hasExisting) {
          setEditDue(result.extracted_deadline_date);
          setEditDueTime(result.extracted_deadline_time || "");
        }
      }
    } catch (e) {
      if (AI_QUOTA_ERROR_CODES.has(e.code)) {
        setAiQuotaModal({ title: AI_QUOTA_ERROR_TITLES[e.code] || "已達使用上限", message: e.message });
      } else {
        setAiErr(e.message); setAiErrCode(e.code || null);
      }
    } finally {
      setAiBusy(false);
    }
  }
  function applyDeadlineOverwrite() {
    setEditDue(confirmDeadlineOverwrite.date);
    setEditDueTime(confirmDeadlineOverwrite.time);
    setConfirmDeadlineOverwrite(null);
  }
  function applyCategoryOverwrite() {
    setAiCategoryScores(confirmCategoryOverwrite);
    setConfirmCategoryOverwrite(null);
  }
  // 右欄「←」匯入：把 AI 建議的子任務直接寫入 checklist（from_ai=true），並從建議清單移除
  async function importAiSuggestion(sugg) {
    setAiSuggestions(list => list.filter(s => s._key !== sugg._key));
    const { error } = await sb.from("mission_checklist_items").insert({
      mission_id: missionId, content: sugg.title,
      estimated_minutes: sugg.estimated_minutes || null,
      requires_travel: !!sugg.requires_travel,
      wait_days_after: sugg.wait_days_after || 0,
      from_ai: true,
    });
    if (error) { setChecklistErr(error.message); setAiSuggestions(list => [...list, sugg]); }
    else {
      if (mission.scale_source !== "auto") await sb.from("missions").update({ scale_source: "auto" }).eq("id", missionId).then(() => setMission(m => ({ ...m, scale_source: "auto" })));
      load();
    }
  }
  // 不要的建議「✕」：純粹從右欄移除，不寫入 checklist
  function discardSuggestion(key) {
    setAiSuggestions(list => list.filter(s => s._key !== key));
  }
  // 現有 checklist 項目「→」：送回右欄建議（從 checklist 刪除，變成可重新匯入的建議卡片），
  // 讓「並排、互相推來推去」的操作跟新增任務時的雙欄邏輯一致
  async function sendChecklistItemToSuggestions(item) {
    setChecklistErr(null);
    const el = checklistRowRefsMap.current.get(item.id);
    if (el) await shrinkRowOut(el);
    setChecklist(list => list.filter(i => i.id !== item.id));
    const { error } = await sb.from("mission_checklist_items").delete().eq("id", item.id);
    if (error) {
      setChecklistErr(error.message);
      setChecklist(list => [...list, item].sort((a, b) => (a.position || 0) - (b.position || 0)));
    } else {
      setAiSuggestions(list => [...list, {
        _key: `back-${item.id}-${Date.now()}`, title: item.content,
        estimated_minutes: item.estimated_minutes, requires_travel: item.requires_travel,
        wait_days_after: item.wait_days_after,
      }]);
    }
  }

  function startSwitch() {
    setSwitchError(null);
    if (mission.project_id) setConfirmSwitch({ type: "to_personal" });
    else setShowProjectPicker(true);
  }
  function pickProject(project) {
    setShowProjectPicker(false);
    setConfirmSwitch({ type: "to_project", project });
  }
  async function confirmSwitchAction() {
    setSwitchBusy(true); setSwitchError(null);
    try {
      const { error } = confirmSwitch.type === "to_personal"
        ? await sb.rpc("move_mission_to_personal", { p_mission_id: missionId })
        : await sb.rpc("move_mission_to_project", { p_mission_id: missionId, p_project_id: confirmSwitch.project.id });
      if (error) throw error;
      setConfirmSwitch(null);
      await load();
      onChanged();
    } catch (e2) {
      setSwitchError(e2.message);
    } finally {
      setSwitchBusy(false);
    }
  }

  async function saveBodyEdit() {
    setBusy(true); setErr(null);
    try {
      const duePrecise = !!editDueTime;
      const dueDateValue = !editDue ? null : (duePrecise ? preciseDeadlineISO(editDue, editDueTime) : nextDayUtcMidnightISO(editDue));
      const { error } = await sb.from("missions").update({
        title: editTitle, content: editContent.trim() || null, priority: editPriority,
        scale: editScale, scale_source: editScaleSource,
        due_date: dueDateValue, due_time_precise: dueDateValue ? duePrecise : true,
        assigned_id: editAssigneeId,
        ...(aiCategoryScores ? { category_scores: aiCategoryScores, primary_category: primaryCategoryOf(aiCategoryScores), ai_raw_input: editTitle } : {}),
      }).eq("id", missionId);
      if (error) throw error;
      setEditingBody(false);
      setAiCategoryScores(null);
      await load();
      onChanged();
    } catch (e2) { setErr(e2.message); } finally { setBusy(false); }
  }

  async function confirmStatusChange() {
    const isWaiting = pendingStatus === "waiting";
    const text = isWaiting ? waitingReasonInput : finalComment;
    if (!text.trim()) { setStatusChangeErr(isWaiting ? "切換狀態前必須輸入等待中之事由" : "切換狀態前必須填寫最終評論"); return; }
    setBusy(true); setStatusChangeErr(null);
    try {
      const payload = isWaiting
        ? { status: "waiting", waiting_reason: text }
        : { status: pendingStatus, final_comment: text };
      const { error } = await sb.from("missions").update(payload).eq("id", missionId);
      if (error) throw error;
      setPendingStatus(null); setFinalComment(""); setWaitingReasonInput("");
      await load();
      onChanged();
    } catch (e2) { setStatusChangeErr(e2.message); } finally { setBusy(false); }
  }

  return (
    <>
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className={"bg-white rounded-2xl shadow-xl w-full max-w-4xl max-h-[85vh] overflow-hidden flex flex-col " + effectivePopClassName} style={popStyle}>
        <div className="px-6 pt-6 pb-3 border-b border-slate-100">
          <div className="flex justify-between items-start mb-2">
            <div>
              <span className={"inline-block text-xs px-2 py-0.5 rounded-full font-medium " + STATUS_COLOR[mission.status]}>{STATUS_LABEL[mission.status]}</span>
              <span className="ml-2 text-xs text-slate-400">{typeLabel}{mission.project_id ? `（${mission.project?.name}）` : ""}</span>
              {isCreator && (
                <button onClick={startSwitch} className="ml-2 inline-block text-xs px-2 py-0.5 rounded-full font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">
                  {mission.project_id ? "切至個人專案" : "切至專案內"}
                </button>
              )}
            </div>
            <button onClick={() => requestClose(onClose)}><Icon.Close className="w-5 h-5 text-slate-400"/></button>
          </div>
          <div className="flex items-center justify-between gap-3">
            <h2 className="text-xl font-bold" style={titleGlowStyle}>{mission.title}</h2>
            {(!isClosed || isCreator) && (
              <div className="flex items-center gap-2 shrink-0">
                {!isClosed && (
                  isStarred ? (
                    <button onClick={() => onUnstar(missionId)} title="取消關注"
                      className="flex items-center justify-center bg-slate-100 hover:bg-slate-200 text-pin-inactive rounded-lg w-9 h-9">
                      <Icon.Unboost className="w-4 h-4" />
                    </button>
                  ) : (
                    <button onClick={() => onStar(missionId)} title="注目任務"
                      className="flex items-center justify-center bg-rose-50 hover:bg-rose-100 text-pin-active rounded-lg w-9 h-9">
                      <Icon.Boost className="w-4 h-4" />
                    </button>
                  )
                )}
                {isCreator && !isClosed && (
                  <button onClick={() => { setEditingBody(true); smoothScrollTo(bodyScrollRef.current, 0, 500); }} title="編輯本文"
                    className={"flex items-center justify-center rounded-lg w-9 h-9 " + (editingBody ? "bg-blue-600 text-white" : "bg-slate-100 hover:bg-slate-200 text-slate-600")}>
                    <Icon.Edit className="w-4 h-4" />
                  </button>
                )}
                {isCreator && (
                  <button onClick={() => setConfirmDeleteMission(true)} title="永久刪除任務"
                    className="flex items-center justify-center bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg w-9 h-9">
                    <Icon.Trash className="w-4 h-4" />
                  </button>
                )}
              </div>
            )}
          </div>
        </div>

        <div ref={bodyScrollRef} className="overflow-y-auto flex-1 px-6 pb-6 pt-4">
        <div ref={editBodyAnimRef}>
        {!editingBody ? (
          <div>
            {mission.content && (
              <div className="bg-slate-50 rounded-lg px-3 py-2 text-sm text-slate-700 whitespace-pre-wrap mb-3">{mission.content}</div>

            <div className="grid grid-cols-2 gap-2 text-xs text-slate-500 mb-3">

              <div>指派給：{mission.assignee?.display_name}</div>

              <div>最後更新：{fmt(mission.updated_at)}</div>
              <div>截止時間：{renderDueDate(mission, dueDateDisplayDetail, dueDateColorOverride)}</div>
              <div>重要性：{renderPriorityText(priorityLabels, priorityDisplay, "detail_view", mission.priority, priorityColorOverride)}</div>
              <div>任務規模：{renderScaleText(scaleLabels, scaleDisplay, "detail_view", mission.scale, scaleColorOverride)}
                {(isCreator || isAssignee) && !isClosed && (
                  <button onClick={toggleScaleSource} title={mission.scale_source === "auto" ? "改成手動輸入" : "改回依 checklist 自動判定"}
                    className="ml-1.5 text-xs text-slate-400 hover:text-slate-600">
                    {mission.scale_source === "auto" ? "🤖" : "🔒"}
                  </button>
                )}
              </div>
              <div>緊急度：{(() => { const rd = remainingDays(mission.due_date); const u = rd === null ? null : urgencyScore(rd, mission.scale || 1); return renderUrgencyText(urgencyLabels, urgencyDisplay, "detail_view", u, urgencyColorOverride); })()}</div>
            </div>
            <div className="text-xs text-slate-500 mb-3">
              <div className="flex items-center gap-1.5">
                <span>任務類別：{mission.primary_category ? renderCategoryText(categoryDisplay, "detail_view", mission.primary_category, categoryEmojiOverride, normalizedWorkDim, workSubDimension) : "尚未分類"}</span>
                <button onClick={() => setCategoryOpen(v => !v)} title={categoryOpen ? "收合" : "展開查看完整分類權重"}
                  className={"flex items-center justify-center w-5 h-5 rounded " + (categoryOpen ? "bg-blue-100 text-blue-600" : "text-slate-400 hover:text-slate-600")}>
                  <Icon.Search className="w-3.5 h-3.5" />
                </button>
              </div>
              <div ref={categoryAnimRef}>
                {categoryOpen && (
                <div className="mt-2 bg-slate-50 rounded-lg p-3">
                  {!categoryEditing ? (
                    <>
                      <CategoryBreakdown scores={mission.category_scores} />
                      {isCreator && (
                        <button onClick={startCategoryEdit} className="mt-2 text-xs text-slate-400 hover:text-slate-600">✏️ 手動設定分類</button>
                      )}
                    </>
                  ) : (
                    <>
                      <p className="text-xs text-slate-500 mb-1">選擇分類（可複選，選多個會自動平分權重，都不選就是「未分類」）</p>
                      <CategoryMultiSelect selected={categoryDraft} onToggle={toggleCategoryDraft} />
                      {categoryErr && <p className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2 mt-2">{categoryErr}</p>}
                      <div className="flex gap-2 mt-2">
                        <button onClick={saveCategoryEdit} disabled={categoryBusy} className="bg-slate-900 text-white text-xs rounded-lg px-3 py-1.5">{categoryBusy ? "儲存中…" : "儲存"}</button>
                        <button onClick={() => setCategoryEditing(false)} className="text-xs text-slate-500 px-3 py-1.5">取消</button>
                      </div>
                    </>
                  )}
                </div>
              )}
              </div>
            </div>
            {mission.primary_category === "work" && (
              <div className="text-xs text-slate-500 mb-3">
                <div className="flex items-center gap-1.5">
                  <span>工作維度：{normalizedWorkDim ? "已標記" : "尚未標記"}</span>
                  <button onClick={() => setWorkDimOpen(v => !v)} title={workDimOpen ? "收合" : "展開查看六個維度"}
                    className={"flex items-center justify-center w-5 h-5 rounded " + (workDimOpen ? "bg-blue-100 text-blue-600" : "text-slate-400 hover:text-slate-600")}>
                    <Icon.Search className="w-3.5 h-3.5" />
                  </button>
                </div>
                <div ref={workDimAnimRef}>
                {workDimOpen && (
                  <div className="mt-2 bg-slate-50 rounded-lg p-3">
                    {!workDimEditing ? (
                      <>
                        {normalizedWorkDim ? (
                          <div>
                            <div className="flex flex-wrap gap-1.5">
                              {normalizedWorkDim.internal_external && (
                                <WorkDimBadge label="內部/外部" value={normalizedWorkDim.internal_external} dimKey="internal_external" />
                              )}
                              {WORK_DIMENSION_DEFS.map(d => (
                                normalizedWorkDim[d.key] && normalizedWorkDim[d.key] !== "不適用" && (
                                  <WorkDimBadge key={d.key} label={d.label} value={normalizedWorkDim[d.key]} dimKey={d.key} />
                                )
                              ))}
                            </div>
                            {normalizedWorkDim.keywords?.length > 0 && (
                              <p className="text-slate-400 mt-2">關鍵字：{normalizedWorkDim.keywords.join("、")}</p>
                            )}
                            {normalizedWorkDim.rationale && (
                              <p className="text-slate-400 mt-1">理由：{normalizedWorkDim.rationale}</p>
                            )}
                          </div>
                        ) : (
                          <p className="text-slate-400">尚未標記任何維度</p>
                        )}
                        {isCreator && (
                          <div className="flex items-center gap-3 mt-2">
                            <button onClick={startWorkDimEdit} className="text-xs text-slate-400 hover:text-slate-600">✏️ 手動設定維度</button>
                            <button onClick={runWorkDimAi} disabled={workAiBusy || aiBanned}
                              title={aiBanned ? "AI 辨識功能目前暫時無法使用" : undefined}
                              className="text-xs text-violet-700 hover:text-violet-800 disabled:opacity-50">
                              {workAiBusy ? "標記中…" : "✨ AI 標記維度"}
                            </button>
                          </div>

                        {workAiErr && <p className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2 mt-2">{workAiErr}</p>}

                    ) : (
                      <>
                        <div className="space-y-2">

                            <label className="text-slate-500 shrink-0">內部/外部</label>
                            <select value={workDimDraft.internal_external || ""} onChange={e => updateWorkDimDraft("internal_external", e.target.value)}
                              className="border border-slate-300 rounded-lg px-2 py-1 bg-white text-xs">
                              <option value="">未設定</option>
                              <option value="內部">內部</option>
                              <option value="外部">外部</option>
                            </select>
                          </div>
                          {WORK_DIMENSION_DEFS.map(d => (
                            <div key={d.key} className="flex items-center gap-2">
                              <label className="text-slate-500 shrink-0">{d.label}</label>
                              <select value={workDimDraft[d.key] || ""} onChange={e => updateWorkDimDraft(d.key, e.target.value)}
                                disabled={d.key === "growth_strategy" && workDimDraft.internal_external !== "外部"}
                                className="border border-slate-300 rounded-lg px-2 py-1 bg-white text-xs disabled:opacity-50">
                                <option value="">未設定</option>

                        {workDimErr && <p className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2 mt-2">{workDimErr}</p>}
                        <div className="flex gap-2 mt-2">
                          <button onClick={saveWorkDimEdit} disabled={workDimBusy} className="bg-slate-900 text-white text-xs rounded-lg px-3 py-1.5">{workDimBusy ? "儲存中…" : "儲存"}</button>
                          <button onClick={() => setWorkDimEditing(false)} className="text-xs text-slate-500 px-3 py-1.5">取消</button>
                        </div>
                      </>
                    )}
                  </div>
                )}
                </div>
              </div>
            )}
            <div className="text-xs text-slate-400 mb-3">
              {mission.project_id
                ? `誰可以看：專案「${mission.project?.name}」的所有成員（${projectMembers.map(p => p.display_name).join("、")}）`
                : `誰可以看：${[mission.creator?.display_name, mission.assignee?.display_name].filter((v, i, a) => v && a.indexOf(v) === i).join("、")}`}
            </div>
          </div>
        ) : (
          <div className="space-y-2 mb-3">
            <div className="flex gap-2 items-start">
              <input value={editTitle} onChange={e => setEditTitle(e.target.value)} className="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold" />
              <button type="button" onClick={rerunAiRecognize} disabled={aiBusy || !editTitle.trim() || aiBanned}

                className="shrink-0 bg-violet-50 text-violet-700 text-xs rounded-lg px-3 py-2 font-medium disabled:opacity-50 whitespace-nowrap">

            <div>
              <div className="flex items-center gap-2">
                <label className="text-xs text-slate-500">{fieldLabelPrefix}任務內容</label>
                <button type="button" onClick={() => setEditContentOpen(v => !v)}
                  title={editContentOpen ? "收合" : "展開編輯任務內容"}
                  className={"flex items-center justify-center w-5 h-5 rounded text-xs font-bold " + (editContentOpen ? "bg-blue-600 text-white" : "bg-slate-100 text-slate-500 hover:bg-slate-200")}>

                {!editContentOpen && editContent && <span className="text-xs text-slate-400">（已填寫，點「+」查看）</span>}
              </div>
              <div ref={editContentAnimRef}>
                {editContentOpen && (
                  <textarea rows={5} value={editContent} onChange={e => setEditContent(e.target.value)}

            <div>
              <div className="flex items-center gap-1.5">
                <label className="text-xs text-slate-500">{fieldLabelPrefix}任務類別：{(() => {
                  const p = aiCategoryScores !== null ? primaryCategoryOf(aiCategoryScores) : mission.primary_category;
                  return p ? renderCategoryText(categoryDisplay, "detail_edit", p, categoryEmojiOverride, normalizedWorkDim, workSubDimension) : "尚未分類";
                })()}</label>
                <button type="button" onClick={() => setCategoryOpen(v => !v)} title={categoryOpen ? "收合" : "展開查看完整分類權重"}
                  className={"flex items-center justify-center w-5 h-5 rounded " + (categoryOpen ? "bg-blue-100 text-blue-600" : "text-slate-400 hover:text-slate-600")}>
                  <Icon.Search className="w-3.5 h-3.5" />
                </button>
              </div>
              <div ref={categoryAnimRef}>
              {categoryOpen && (
                <div className="mt-2 bg-slate-50 rounded-lg p-3">
                  {!categoryEditing ? (
                    <>
                      <CategoryBreakdown scores={aiCategoryScores !== null ? aiCategoryScores : mission.category_scores} />
                      <button type="button" onClick={startCategoryEdit} className="mt-2 text-xs text-slate-400 hover:text-slate-600">✏️ 手動設定分類</button>
                    </>
                  ) : (
                    <>
                      <p className="text-xs text-slate-500 mb-1">選擇分類（可複選，選多個會自動平分權重，都不選就是「未分類」）</p>
                      <CategoryMultiSelect selected={categoryDraft} onToggle={toggleCategoryDraft} />
                      {categoryErr && <p className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2 mt-2">{categoryErr}</p>}
                      <div className="flex gap-2 mt-2">
                        <button type="button" onClick={saveCategoryEdit} disabled={categoryBusy} className="bg-slate-900 text-white text-xs rounded-lg px-3 py-1.5">{categoryBusy ? "儲存中…" : "儲存"}</button>
                        <button type="button" onClick={() => setCategoryEditing(false)} className="text-xs text-slate-500 px-3 py-1.5">取消</button>
                      </div>

            {(aiCategoryScores !== null ? primaryCategoryOf(aiCategoryScores) : mission.primary_category) === "work" && (

                    ? u.content.split("\n").map((line, i) => <React.Fragment key={i}>{i > 0 && <br/>}{u.author?.display_name}{line}</React.Fragment>)
                    : u.content}
                </p>
                {u.is_system ? (
                  <div className="flex justify-end mt-1">
                    <span className="text-xs text-slate-400">〈系統自動記錄〉</span>
                  </div>
                ) : u.author_id === currentUser.id && mission.status !== "completed" && mission.status !== "abandoned" && (
                  <div className="flex justify-end mt-1">
                    <button onClick={() => setConfirmDeleteUpdateId(u.id)} title="刪除留言" className="flex items-center justify-center text-rose-500 hover:text-rose-600">
                      <Icon.Trash className="w-4 h-4" />
                    </button>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>

        {confirmDeleteUpdateId && (
          <ConfirmModal
            title="刪除留言"
            message="此留言將永久刪除，無法復原！確定或取消？"
            confirmLabel="確定刪除"
            danger
            onConfirm={deleteUpdate}
            onCancel={() => setConfirmDeleteUpdateId(null)}
          />
        )}

        {confirmDeleteChecklistItem && (
          <ConfirmModal
            title="刪除子任務"
            message={`確定要刪除「${confirmDeleteChecklistItem.content}」這個子任務嗎？此動作無法復原！`}
            confirmLabel="確定刪除"
            danger
            onConfirm={confirmDeleteChecklistItemAction}
            onCancel={() => setConfirmDeleteChecklistItem(null)}
          />
        )}
        {confirmDeleteMission && (
          <ConfirmModal
            title="永久刪除任務"
            message={`確定要永久刪除「${mission.title}」這個任務嗎？此動作無法復原！`}
            confirmLabel="確定刪除"
            danger
            onConfirm={() => { onDelete(missionId); setConfirmDeleteMission(false); requestDeleteClose(onClose); }}
            onCancel={() => setConfirmDeleteMission(false)}
          />
        )}
        {confirmPendingAction && (
          <ConfirmModal
            title={confirmPendingAction === "disagree" ? (mission.status === "pending_completed" ? "不同意已完成" : "不同意已棄置") : (mission.status === "pending_completed" ? "取消已完成回報" : "取消不需要回報")}
            message={`確定${confirmPendingAction === "disagree" ? "不同意這筆回報" : "取消這筆回報"}嗎？任務將退回「進行中」，暫時評論會被清空。`}
            confirmLabel="確定"
            onConfirm={resolvePendingAction}
            onCancel={() => setConfirmPendingAction(null)}
          />
        )}

        {err && <div className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2 mt-3">{err}</div>}
        </div>

        {!isClosed && (!isTaskPending || isCreator || isReporter) && (
          <div className="border-t border-slate-200 px-6 py-3 shrink-0">
            <div ref={statusFooterAnimRef}>
            {footerMode === "buttons" ? (
              isTaskPending ? (
                <div className="flex items-center gap-2">
                  {isCreator && (
                    <>
                      <button onClick={() => { setPendingStatus(mission.status === "pending_completed" ? "completed" : "abandoned"); setFinalComment(mission.final_comment || ""); setStatusChangeErr(null); }}
                        className={"text-xs text-white rounded-lg px-3 py-1.5 " + (mission.status === "pending_completed" ? "bg-emerald-600" : "bg-rose-600")}>
                        {mission.status === "pending_completed" ? "同意已完成" : "同意已棄置"}
                      </button>
                      <button onClick={() => setConfirmPendingAction("disagree")} className="text-xs bg-slate-400 text-white rounded-lg px-3 py-1.5">
                        {mission.status === "pending_completed" ? "不同意已完成" : "不同意已棄置"}
                      </button>
                    </>
                  )}
                  {!isCreator && isReporter && (
                    <button onClick={() => setConfirmPendingAction("cancel_report")} className="text-xs bg-slate-400 text-white rounded-lg px-3 py-1.5">
                      {mission.status === "pending_completed" ? "取消已完成回報" : "取消不需要回報"}
                    </button>
                  )}
                  {pendingActionErr && <span className="text-xs text-rose-600">{pendingActionErr}</span>}
                </div>
              ) : (
                <div className="flex gap-2">
                  <button onClick={() => { setShowReplyForm(true); setReplyErr(null); }} className="text-xs bg-blue-600 text-white rounded-lg px-3 py-1.5">更新任務</button>
                  {isCreator && (
                    <button onClick={() => { setPendingStatus("completed"); setStatusChangeErr(null); }} className="text-xs bg-emerald-600 text-white rounded-lg px-3 py-1.5">標記為已完成</button>
                  )}
                  {isAssignee && !isCreator && (
                    <button onClick={() => { setPendingStatus("pending_completed"); setStatusChangeErr(null); }} className="text-xs bg-emerald-600 text-white rounded-lg px-3 py-1.5">回報為已完成</button>
                  )}
                  {(isCreator || isAssignee) && mission.status !== "waiting" && (
                    <button onClick={() => { setPendingStatus("waiting"); setStatusChangeErr(null); }} className="text-xs bg-amber-500 text-white rounded-lg px-3 py-1.5">標記為等待中</button>
                  )}
                  {isAssignee && !isCreator && (
                    <button onClick={() => { setPendingStatus("pending_abandoned"); setStatusChangeErr(null); }} className="text-xs bg-rose-600 text-white rounded-lg px-3 py-1.5">回報為不需要</button>
                  )}
                  {isCreator && (
                    <button onClick={() => { setPendingStatus("abandoned"); setStatusChangeErr(null); }} className="text-xs bg-rose-600 text-white rounded-lg px-3 py-1.5">標記為已棄置</button>
                  )}
                </div>
              )
            ) : footerMode === "reply" ? (
              <div className="space-y-2">
                <textarea rows={5} value={replyText} onChange={e => setReplyText(e.target.value)}
                  placeholder="請輸入欲更新之內容…"
                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
                <div className="flex items-center gap-2">
                  <button onClick={submitReply} disabled={busy} className="text-xs bg-slate-900 text-white rounded-lg px-3 py-1.5">送出更新</button>
                  <button onClick={() => { setShowReplyForm(false); setReplyText(""); setReplyErr(null); }} className="text-xs text-slate-500 px-3 py-1.5">取消</button>
                  {replyErr && <span className="text-xs text-rose-600">{replyErr}</span>}
                </div>
              </div>
            ) : (
              <div className="space-y-2">
                <label className="text-xs text-slate-800 bg-yellow-300 inline-block px-2 py-1 rounded-lg font-medium">
                  {fieldLabelPrefix}
                  {pendingStatus === "waiting" ? "切換為「等待中」前，請輸入等待中之事由"
                    : pendingStatus === "pending_completed" ? "回報為「已完成」前，請填寫暫時評論"
                    : pendingStatus === "pending_abandoned" ? "回報為「不需要」前，請填寫暫時評論"
                    : isTaskPending && pendingStatus === "completed" ? "同意這筆「已完成」回報前，請確認或修改最終評論"
                    : isTaskPending && pendingStatus === "abandoned" ? "同意這筆「已棄置」回報前，請確認或修改最終評論"
                    : `切換為「${STATUS_LABEL[pendingStatus]}」前，請填寫最終評論`}
                </label>
                <textarea rows={2} value={pendingStatus === "waiting" ? waitingReasonInput : finalComment}
                  onChange={e => pendingStatus === "waiting" ? setWaitingReasonInput(e.target.value) : setFinalComment(e.target.value)}
                  placeholder={pendingStatus === "waiting" ? "請輸入等待中之事由…"
                    : pendingStatus === "completed" ? "請輸入完成的評論…"
                    : pendingStatus === "pending_completed" ? "請輸入暫時評論…"
                    : pendingStatus === "pending_abandoned" ? "請輸入暫時評論…"
                    : "請輸入棄置的理由…"}
                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
                <div className="flex items-center gap-2">
                  <button onClick={confirmStatusChange} disabled={busy} className="text-xs bg-slate-900 text-white rounded-lg px-3 py-1.5">確認切換</button>
                  <button onClick={() => { setPendingStatus(null); setFinalComment(""); setWaitingReasonInput(""); setStatusChangeErr(null); }} className="text-xs text-slate-500 px-3 py-1.5">取消</button>
                  {statusChangeErr && <span className="text-xs text-rose-600">{statusChangeErr}</span>}
                </div>
              </div>
            )}
            </div>
          </div>
        )}
      </div>
    </div>

    {showProjectPicker && (
      <ProjectPickerModal
        projects={(projects || []).filter(p => p.id !== mission.project_id)}
        onPick={pickProject}
        onClose={() => setShowProjectPicker(false)}
      />
    )}

    {confirmSwitch && (
      <ConfirmModal
        title="切換任務歸屬"
        message={
          confirmSwitch.type === "to_personal"
            ? "確定要將此任務移出目前的專案、退回個人任務嗎？\n（若指派對象並非您的個人好友，系統將無法完成這個動作）"
            : `確定將此任務移入專案「${confirmSwitch.project.name}」嗎？\n（若指派對象目前不是該專案成員，且您是該專案的擁有者，系統會一併將對方加入為專案成員；若您不是擁有者，指派對象又不在該專案內，則無法完成）`
        }
        confirmLabel={switchBusy ? "處理中…" : "確定"}
        onConfirm={confirmSwitchAction}
        onCancel={() => setConfirmSwitch(null)}
      />
    )}

    {switchError && (
      <ConfirmModal
        title="無法切換任務歸屬"
        message={switchError}
        confirmLabel="確定"
        hideCancel
        onConfirm={() => setSwitchError(null)}
        onCancel={() => setSwitchError(null)}
      />
    )}
    </>
  );
}

// =====================================================================
// 任務清單（傳統列表模式）
// =====================================================================
const COLUMN_LABELS = {
  created_at: "建立時間", creator: "建立成員", assignee: "指派給", relation: "指派關係",
  updated_at: "最後更新", procrastination_days: "拖延天數", title: "任務標題", priority: "重要性",
  scale: "任務規模", urgency: "緊急度", due_date: "截止時間", status: "狀態", action: "動作",
  no_progress_days: "無進度天數", closed_at: "完成/棄置時間", final_comment: "最終評論",
  checklist_progress: "檢查清單進度", category_score: "類別分數", source: "來源", category: "類別",
};

function MissionListView({ missions, onOpen, priorityLabels, scaleLabels, priorityDisplay, scaleDisplay, priorityColorOverride, scaleColorOverride, urgencyDisplay, urgencyLabels, urgencyColorOverride, visibleColumns, currentUserId, hiddenIds, onHide, onUnhide, onDelete, relationDisplayMode, dueDateDisplayList, dueDateColorOverride, sortMode, sortHighlightColor, forceShowSortColumn, noProgressColorOverride, noProgressSeverityDays, starredIds, onStar, onUnstar, starOverrideColor, columnMode, columnOrder, checklistDisplayMode, showCategoryColumns, categoryKey, projectNameById, categoryDisplay, categoryEmojiOverride, workSubDimension }) {
  const isClosedMode = columnMode === "closed";
  const columnDefs = isClosedMode ? TASK_LIST_COLUMNS_CLOSED : TASK_LIST_COLUMNS;
  const vc = visibleColumns || (isClosedMode ? DEFAULT_VISIBLE_COLUMNS_CLOSED : DEFAULT_VISIBLE_COLUMNS);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const confirmDeleteMission = missions.find(m => m.id === confirmDeleteId) || null;

  const highlightCols = SORT_MODE_HIGHLIGHT_COLUMNS[sortMode] || [];
  const highlightSet = new Set(highlightCols);
  const highlightHex = (SORT_HIGHLIGHT_COLORS[sortHighlightColor] || SORT_HIGHLIGHT_COLORS.blue).hex;
  const highlightRgb = hexToRgbString(highlightHex);
  const headerHighlightStyle = { background: `rgba(${highlightRgb},0.15)` };
  const cellHighlightStyle = { background: `rgba(${highlightRgb},0.08)` };
  const starColorEntry = starOverrideColor && starOverrideColor !== "none" ? SORT_HIGHLIGHT_COLORS[starOverrideColor] : null;
  const starCellStyle = starColorEntry ? { background: `rgba(${hexToRgbString(starColorEntry.hex)},0.12)` } : null;

  // 決定欄位顯示順序：優先套用使用者自訂的排列順序（若有效），否則用預設順序；
  // 開啟「強制顯示排序欄位在最前面」時，再把排序對應的欄位（不論原本是否被隱藏）額外提到最前面
  const defaultBaseKeys = columnDefs.map(c => c.key);
  const baseKeys = (Array.isArray(columnOrder) && columnOrder.length === defaultBaseKeys.length && defaultBaseKeys.every(k => columnOrder.includes(k)))
    ? columnOrder
    : defaultBaseKeys;
  const orderedKeys = forceShowSortColumn && highlightCols.length
    ? [...highlightCols.filter(k => baseKeys.includes(k)), ...baseKeys.filter(k => !highlightSet.has(k))]
    : baseKeys;
  // 「類別分數」「來源」這兩欄只有類別瀏覽頁會傳 showCategoryColumns=true 才會出現；
  // 個人任務／專案任務即使使用者在設定裡勾選、調整過順序，這裡還是強制濾掉，避免跟一般任務列表混在一起。
  // 反過來「類別」欄位在類別瀏覽頁本身要強制隱藏——已經在看某個分類底下的清單了，沒必要再顯示一次是哪個分類
  const visibleKeys = orderedKeys
    .filter(k => showCategoryColumns ? k !== "category" : (k !== "category_score" && k !== "source"))
    .filter(k => vc[k] || (forceShowSortColumn && highlightSet.has(k)));
  const colCount = visibleKeys.length || 1;

  function handleConfirmDelete() {
    onDelete(confirmDeleteId);
    setConfirmDeleteId(null);
  }

  function th(key) {
    return <th key={key} className="px-4 py-2 font-medium" style={highlightSet.has(key) ? headerHighlightStyle : undefined}>{COLUMN_LABELS[key]}</th>;
  }
  function td(key, content, extraClass, onClickCell, rowStarStyle, extraStyle) {
    const baseStyle = rowStarStyle || (highlightSet.has(key) ? cellHighlightStyle : undefined);
    const style = extraStyle ? { ...baseStyle, ...extraStyle } : baseStyle;
    return <td key={key} className={extraClass || "px-4 py-3 whitespace-nowrap"} style={style} onClick={onClickCell}>{content}</td>;
  }

  function renderCell(key, m) {
    const rd = remainingDays(m.due_date);
    const urgency = rd === null ? null : urgencyScore(rd, m.scale || 1);
    const isHidden = hiddenIds && hiddenIds.has(m.id);
    const isOwn = m.creator_id === currentUserId;
    const isOpenStatus = statusTier(m.status) === 0;
    const isStarred = starredIds && starredIds.has(m.id);
    // 已完成/已棄置的任務不該再顯示「注目任務」的遮色提示——就算完成前有標記過，結案後就該回到正常樣式
    const rowStarStyle = (isStarred && isOpenStatus) ? starCellStyle : null;
    switch (key) {
      case "closed_at": return td(key, fmt(m.updated_at), "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "final_comment": return td(key, m.final_comment || "—", "px-4 py-3 text-slate-600", null, rowStarStyle,
        { maxWidth: 260, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" });
      case "created_at": return td(key, fmt(m.created_at), "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "creator": return td(key, m.creator?.display_name, null, null, rowStarStyle);
      case "assignee": return td(key, m.assignee?.display_name, null, null, rowStarStyle);
      case "relation": return td(key,
        relationDisplayMode === "text"
          ? RELATION_LABELS[relationCategory(m, currentUserId)]
          : <AssignRelationIcon {...RELATION_ICON_PROPS[relationCategory(m, currentUserId)]} className="w-10 h-6" />,
        null, null, rowStarStyle
      );
      case "updated_at": return td(key, fmt(m.updated_at), "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "procrastination_days": return td(key, procrastinationDays(m).toFixed(1) + "天", "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "no_progress_days": return td(key,
        noProgressColorOverride
          ? <span style={{ color: noProgressColor(m.updated_at, noProgressSeverityDays) }}>{noProgressText(m.updated_at, m.status)}</span>
          : noProgressText(m.updated_at, m.status),
        "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle
      );
      case "category": return td(key, renderCategoryText(categoryDisplay, "list", m.primary_category, categoryEmojiOverride, Array.isArray(m.work_dimensions) ? m.work_dimensions[0] : m.work_dimensions, workSubDimension), "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "title": return td(key, m.title, "px-4 py-3 font-medium", null, rowStarStyle);
      case "category_score": return td(key,
        m.category_scores ? (Number(m.category_scores[categoryKey]) || 0).toFixed(2) : "—",
        "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "source": return td(key,
        m.project_id ? (projectNameById?.[m.project_id] || "專案任務") : "個人任務",
        "px-4 py-3 whitespace-nowrap text-slate-400", null, rowStarStyle);
      case "priority": return td(key, renderPriorityText(priorityLabels, priorityDisplay, "list", m.priority, priorityColorOverride), "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "scale": return td(key, renderScaleText(scaleLabels, scaleDisplay, "list", m.scale || 1, scaleColorOverride), "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "urgency": return td(key, renderUrgencyText(urgencyLabels, urgencyDisplay, "list", urgency, urgencyColorOverride), "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "due_date": return td(key, renderDueDate(m, dueDateDisplayList, dueDateColorOverride), "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "status": return td(key, <span className={"text-xs px-2 py-0.5 rounded-full font-medium " + STATUS_COLOR[m.status]}>{STATUS_LABEL[m.status]}</span>, null, null, rowStarStyle);
      case "checklist_progress": {
        const pct = checklistProgress(m.mission_checklist_items, m.status);
        const content = pct === null ? "—" : checklistDisplayMode === "percent" ? `${pct}%` : (
          <div className="w-20 bg-slate-100 rounded-full h-2 overflow-hidden" style={{ border: "1px solid #666666" }}>
            <div className="h-2 bg-blue-600" style={{ width: `${pct}%` }} />
          </div>
        );
        return td(key, content, "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      }
      case "action": return td(key, (
        <div className="flex items-center gap-2">
          {isOpenStatus && !isHidden && (
            isStarred ? (
              <button onClick={() => onUnstar(m.id)} title="取消關注" className="flex items-center justify-center text-pin-inactive">
                <Icon.Unboost className="w-4 h-4" />
              </button>
            ) : (
              <button onClick={() => onStar(m.id)} title="注目任務" className="flex items-center justify-center text-pin-active">
                <Icon.Boost className="w-4 h-4" />
              </button>
            )
          )}
          {!m.project_id && (
            isHidden ? (
              <button onClick={() => onUnhide(m.id)} title="取消隱藏" className="flex items-center justify-center text-blue-600 hover:text-blue-700">
                <Icon.Show className="w-4 h-4" />
              </button>
            ) : !isOwn ? (
              <button onClick={() => onHide(m.id)} title="隱藏" className="flex items-center justify-center text-slate-500 hover:text-slate-600">
                <Icon.Hidden className="w-4 h-4" />
              </button>
            ) : null
          )}
          {isOwn && (
            <button onClick={() => setConfirmDeleteId(m.id)} title="永久刪除任務" className="flex items-center justify-center text-rose-500 hover:text-rose-600">
              <Icon.Trash className="w-4 h-4" />
            </button>
          )}
        </div>
      ), null, e => e.stopPropagation(), rowStarStyle);
      default: return null;
    }
  }

  return (
    <div className="bg-white rounded-2xl shadow overflow-x-auto">
      <table className="w-full text-sm">
        <thead>
          <tr className="text-left text-xs text-slate-400 border-b border-slate-200">
            {visibleKeys.map(key => th(key))}
          </tr>
        </thead>
        <tbody>
          {missions.map(m => (
            <tr key={m.id} onClick={() => onOpen(m.id)} className="border-b border-slate-100 hover:bg-slate-50 cursor-pointer">
              {visibleKeys.map(key => renderCell(key, m))}
            </tr>
          ))}
          {missions.length === 0 && (
            <tr><td colSpan={colCount} className="px-4 py-8 text-center text-slate-400">目前沒有符合條件的任務</td></tr>
          )}
        </tbody>
      </table>
      {confirmDeleteMission && (
        <ConfirmModal
          title="刪除任務"
          message={`「${confirmDeleteMission.title}」該任務將永久刪除！確定或取消？`}
          confirmLabel="確定刪除"
          danger
          onConfirm={handleConfirmDelete}
          onCancel={() => setConfirmDeleteId(null)}
        />
      )}
    </div>
  );
}

// =====================================================================
// 甘特圖模式
// =====================================================================
function GanttView({ missions, onOpen }) {
  const [pxPerDay, setPxPerDay] = useState(36);
  const [viewStart, setViewStart] = useState(() => { const d = new Date(); d.setDate(d.getDate() - 3); d.setHours(0,0,0,0); return d; });
  const totalDays = 30;
  const viewEnd = useMemo(() => { const d = new Date(viewStart); d.setDate(d.getDate() + totalDays); return d; }, [viewStart]);
  const today = new Date();
  const nowLeftPct = nowLinePercent();

  function shift(days) {
    setViewStart(d => { const nd = new Date(d); nd.setDate(nd.getDate() + days); return nd; });
  }

  const days = useMemo(() => {
    const arr = [];
    for (let i = 0; i < totalDays; i++) { const d = new Date(viewStart); d.setDate(d.getDate() + i); arr.push(d); }
    return arr;
  }, [viewStart]);

  function dayDiff(a, b) { return (b - a) / 86400000; }

  const rows = missions.map(m => {
    const start = new Date(m.created_at);
    const end = m.due_date ? new Date(m.due_date) : new Date(start.getTime() + 86400000);
    const clampedStart = start < viewStart ? viewStart : start;
    const clampedEnd = end > viewEnd ? viewEnd : end;
    const visible = clampedEnd >= viewStart && clampedStart <= viewEnd;
    const left = Math.max(0, dayDiff(viewStart, clampedStart)) * pxPerDay;
    const width = Math.max(dayDiff(clampedStart, clampedEnd) * pxPerDay, 6);
    // 色塊顏色：依緊急度分數（0~2）對應青綠→橘→紅；沒有截止時間就用狀態色當備案
    const rd = remainingDays(m.due_date);
    const barColor = rd === null ? STATUS_BAR_COLOR[m.status] : urgencyColor(urgencyScore(rd, m.scale || 1));
    return { m, visible, left, width, barColor };
  });

  return (

function UrgencyCurveChart({ scaleLabels, multiplier, onMultiplierChange }) {
  const [s, setS] = useState(1);
  const [hover, setHover] = useState(null); // { x, y, cx, cy }

  const W = 720, H = 400;
  const padL = 44, padR = 20, padT = 20, padB = 40;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const xMin = -1, xMax = 10, yMin = -1, yMax = 5;
  const sx = x => padL + (x - xMin) / (xMax - xMin) * plotW;
  const sy = y => padT + (yMax - y) / (yMax - yMin) * plotH;

  const gridXs = [];
  for (let gx = Math.ceil(xMin); gx <= xMax; gx++) gridXs.push(gx);
  const gridYs = [];
  for (let gy = Math.ceil(yMin); gy <= yMax; gy++) gridYs.push(gy);

  let d = "";
  const steps = Math.round((xMax - xMin) / 0.1);
  for (let i = 0; i <= steps; i++) {
    const x = +(xMin + i * 0.1).toFixed(1);
    let y = urgencyScore(x, s);
    if (y > yMax) y = yMax;
    if (y < yMin) y = yMin;
    d += (i === 0 ? "M " : "L ") + sx(x) + " " + sy(y) + " ";
  }

  const markers = [];
  for (let x = 0; x <= xMax + 1e-9; x += 0.5) {
    const xr = +x.toFixed(1);
    const y = urgencyScore(xr, s);
    const yDisp = Math.min(Math.max(y, yMin), yMax);
    markers.push({ x: xr, y, cx: sx(xr), cy: sy(yDisp) });
  }

  return (
    <div>
      <div className="flex items-center gap-2 mb-3 flex-wrap">
        <span className="text-xs text-slate-500">預覽規模：</span>
        {SCALE_LEVELS.map(n => (
          <button key={n} onClick={() => setS(n)}
            className={"text-xs px-3 py-1.5 rounded-lg " + (s === n ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>
            {scaleLabels["S" + n] || ("S" + n)}
          </button>
        ))}
      </div>
      <div className="flex items-center gap-2 mb-3 flex-wrap">
        <span className="text-xs text-slate-500">提前緊張加成：</span>
        <select value={multiplier} onChange={e => onMultiplierChange(Number(e.target.value))}
          className="text-xs border border-slate-300 rounded-lg px-2 py-1.5 bg-white">
          {[1, 2, 3, 4].map(n => <option key={n} value={n}>{`x${n}`}</option>)}
        </select>
        <span className="text-xs text-slate-400">（倍數越高，任務條會越早進入「紅色區」以便提醒使用者「提早」完成任務）</span>
      </div>
      <div>
        <div className="relative rounded-t-xl overflow-hidden" style={{ background: "#0f1720" }}>
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto block">
            {gridXs.map(gx => (
              <line key={"gx" + gx} x1={sx(gx)} y1={sy(yMin)} x2={sx(gx)} y2={sy(yMax)} stroke="#27394a" strokeWidth="1" />
            ))}
            {gridYs.map(gy => (
              <line key={"gy" + gy} x1={sx(xMin)} y1={sy(gy)} x2={sx(xMax)} y2={sy(gy)} stroke="#27394a" strokeWidth="1" />
            ))}
            <line x1={sx(0)} y1={sy(yMin)} x2={sx(0)} y2={sy(yMax)} stroke="#5c7488" strokeWidth="2.5" />
            <line x1={sx(xMin)} y1={sy(0)} x2={sx(xMax)} y2={sy(0)} stroke="#5c7488" strokeWidth="2.5" />
            {gridXs.map(gx => (
              <text key={"tx" + gx} x={sx(gx)} y={sy(0) + 18} textAnchor="middle" fontSize="11" fill="#93a4b3">{gx}</text>
            ))}
            {gridYs.filter(gy => gy !== 0).map(gy => (
              <text key={"ty" + gy} x={sx(0) - 10} y={sy(gy) + 4} textAnchor="end" fontSize="11" fill="#93a4b3">{gy}</text>
            ))}
            <text x={sx(xMax) - 4} y={sy(0) - 12} textAnchor="end" fontSize="13" fontWeight="700" fill="#e8eef3">剩餘時間(天)</text>
            <text x={sx(0) + 10} y={sy(yMax) + 16} textAnchor="start" fontSize="13" fontWeight="700" fill="#e8eef3">緊急程度分數</text>
            <path d={d} fill="none" stroke="#4fd1c5" strokeWidth="3" strokeLinejoin="round" strokeLinecap="round" />
            {markers.map((m, i) => (
              <circle key={i} cx={m.cx} cy={m.cy} r={hover && hover.x === m.x ? 6 : 4.5}
                fill={hover && hover.x === m.x ? "#f2a541" : "#16212c"} stroke="#f2a541" strokeWidth="2"
                style={{ cursor: "pointer" }}
                onMouseEnter={() => setHover(m)} onMouseLeave={() => setHover(null)} />
            ))}
          </svg>
          {hover && (
            <div className="absolute bg-slate-900 text-white text-xs px-3 py-2 rounded-lg shadow-lg pointer-events-none"
              style={{ left: (hover.cx / W) * 100 + "%", top: (hover.cy / H) * 100 + "%", transform: "translate(-50%, -120%)" }}>
              剩餘天數：{hover.x} 天，緊急分數：{hover.y.toFixed(2)}
            </div>
          )}
        </div>
        <p className="text-center text-[11px] py-2 rounded-b-xl" style={{ color: "#93a4b3", background: "#0f1720", margin: 0 }}>
          已套用 - 提前緊張加成 x{multiplier}
        </p>
      </div>
      <p className="text-[11px] text-slate-400 mt-2">滑鼠移到圖上的橘色圓點可以看到該天數對應的精確分數。</p>
    </div>
  );
}
