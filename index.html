<script>
  // 全域錯誤攔截：只要有任何 JS 錯誤（含 CDN 載入失敗），就把錯誤內容直接顯示在畫面上，
  // 避免「整個畫面空白、卻不知道發生什麼事」的情況。
  window.addEventListener("error", function (e) {
    var root = document.getElementById("root");
    if (!root) return;
    var msg = (e && e.message) ? e.message : "未知錯誤";
    var src = (e && e.filename) ? e.filename : "";
    root.innerHTML =
      '<div style="max-width:640px;margin:60px auto;padding:24px;border:1px solid #fecaca;' +
      'background:#fff1f2;border-radius:12px;font-family:sans-serif;color:#7f1d1d;">' +
      '<h2 style="margin:0 0 8px;font-size:18px;">頁面發生錯誤，無法正常顯示</h2>' +
      '<p style="font-size:14px;margin:0 0 8px;">錯誤訊息：' + msg + '</p>' +
      (src ? '<p style="font-size:12px;color:#9f1239;word-break:break-all;">來源：' + src + '</p>' : '') +
      '<p style="font-size:12px;color:#9f1239;">請打開瀏覽器開發者工具（F12 或 右鍵→檢查）的 Console 分頁，把紅字錯誤訊息複製給開發者。</p>' +
      '</div>';
  });
</script>

function ColumnSettingsModal({ visibleColumns, onToggleColumn, visibleColumnsClosed, onToggleColumnClosed, visibleSections, onToggleSection, columnOrder, columnOrderClosed, onSaveColumnOrder, onClose }) {

  const currentOrder = isClosedCat ? columnOrderClosed : columnOrder;
  const defaultKeys = columnDefs.map(c => c.key);
  const effectiveOrder = (Array.isArray(currentOrder) && currentOrder.length === defaultKeys.length && defaultKeys.every(k => currentOrder.includes(k)))

    setOrderDraft(effectiveOrder);
    setReorderMode(true);
  }
  function moveItem(index, dir) {
    const target = index + dir;

    const next = [...orderDraft];
    [next[index], next[target]] = [next[target], next[index]];
    setOrderDraft(next);

                  return (

// 依「顯示情境」與使用者自訂文字，決定重要性/規模要顯示長字串、短字串、還是原始分數

// 緊急度顏色：0 分＝青綠、1 分＝琥珀橘、2 分＝珊瑚紅，中間線性插值
const URGENCY_COLOR_STOPS = [
  { t: 0, c: [47, 175, 155] },
  { t: 1, c: [232, 163, 61] },
  { t: 2, c: [232, 84, 74] },
];
function urgencyColor(score) {
  const s = Math.max(0, Math.min(2, score));
  const [lo, hi] = s <= 1 ? [URGENCY_COLOR_STOPS[0], URGENCY_COLOR_STOPS[1]] : [URGENCY_COLOR_STOPS[1], URGENCY_COLOR_STOPS[2]];
  const localT = (s - lo.t) / (hi.t - lo.t || 1);
  const r = Math.round(lo.c[0] + (hi.c[0] - lo.c[0]) * localT);
  const g = Math.round(lo.c[1] + (hi.c[1] - lo.c[1]) * localT);
  const b = Math.round(lo.c[2] + (hi.c[2] - lo.c[2]) * localT);
  return `rgb(${r}, ${g}, ${b})`;
}

// 把 0~2 分的緊急度分數對應到 U1~U4 四個級距
function urgencyBucket(score) {
  const s = Math.max(0, Math.min(2, score));
  if (s < 0.5) return "U1";
  if (s < 1.0) return "U2";
  if (s < 1.5) return "U3";
  return "U4";
}
function resolveUrgencyDisplay(labels, displayModes, context, score) {
  if (score === null) return "—";
  const mode = (displayModes && displayModes[context]) || "score";
  if (mode === "score") return score.toFixed(2);
  const bucket = urgencyBucket(score);
  const entry = (labels && labels[bucket]) || DEFAULT_URGENCY_LABELS[bucket];
  return (entry && entry[mode]) || bucket;
}
function renderUrgencyText(labels, displayModes, context, score, colorOverride) {
  const text = resolveUrgencyDisplay(labels, displayModes, context, score);

}

function urgencyScore(x, s) {
  if (x <= 0) return 2;
  if (x >= s) return s / x;
  return (-1 / s) * x + 2;
}

const PRIORITY_SCORE_MAP = { P1: 1, P2: 2, P3: 3, P4: 4 };
const DEFAULT_PRIORITY_WEIGHTS = { w1: 1, w2: 1 };
function priorityImportanceScore(p) { return PRIORITY_SCORE_MAP[p] || 2; }
function overallPriorityScore(m, weights) {
  const w1 = (weights && Number(weights.w1)) || 0;
  const w2 = (weights && Number(weights.w2)) || 0;
  const importance = priorityImportanceScore(m.priority);
  const rd = remainingDays(m.due_date);
  const urgency = rd === null ? 0 : urgencyScore(rd, m.scale || 1);
  return importance * w1 + urgency * w2;
}

function fmt(dt) {
  if (!dt) return "—";
  const d = new Date(dt);
  return d.toLocaleString("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}
function fmtDate(dt) {
  if (!dt) return "—";
  const d = new Date(dt);
  return d.toLocaleDateString("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit" });
}

function notifMessage(n) {
  switch (n.type) {
    case "friend_request": return `${n.actor?.display_name} 想加你為好友`;
    case "friend_accepted": return `${n.actor?.display_name} 已接受你的好友邀請`;
    case "project_added": return `您已被加入專案＜${n.project?.name || ""}＞中，可於＜專案任務＞頁面中查看詳細內容`;
    case "project_task_added": return `專案＜${n.project?.name || ""}＞已新增任務：${n.mission?.title || ""}`;
    case "task_assigned": return n.project_id
      ? `您已被指派處理任務：${n.mission?.title || ""}－於＜${n.project?.name || ""}＞專案中`
      : `您已被指派處理任務：${n.mission?.title || ""}`;
    case "project_renamed": return `專案＜${n.payload?.old_name || ""}＞現已改名為＜${n.payload?.new_name || ""}＞`;
    default: return "";
  }
}

function sortMissions(list, mode, weights) {
  const arr = [...list];
  if (mode === "due_asc") {
    arr.sort((a, b) => {
      if (!a.due_date && !b.due_date) return 0;
      if (!a.due_date) return 1;
      if (!b.due_date) return -1;
      return new Date(a.due_date) - new Date(b.due_date);
    });
  } else if (mode === "priority_desc") {
    arr.sort((a, b) => overallPriorityScore(b, weights) - overallPriorityScore(a, weights));
  } else if (mode === "priority_first") {
    arr.sort((a, b) => (PRIORITY_SCORE_MAP[b.priority] - PRIORITY_SCORE_MAP[a.priority]) || (overallPriorityScore(b, weights) - overallPriorityScore(a, weights)));
  } else if (mode === "scale_asc") {
    arr.sort((a, b) => (a.scale || 1) - (b.scale || 1) || overallPriorityScore(b, weights) - overallPriorityScore(a, weights));
  } else if (mode === "scale_desc") {
    arr.sort((a, b) => (b.scale || 1) - (a.scale || 1) || overallPriorityScore(b, weights) - overallPriorityScore(a, weights));
  } else if (mode === "procrastination_desc") {
    arr.sort((a, b) => procrastinationTier(a.status) - procrastinationTier(b.status) || procrastinationDays(b) - procrastinationDays(a));
  } else if (mode === "updated_desc") {
    arr.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
  } else {
    arr.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  }
  return arr;
}

// =====================================================================
// 登入 / 註冊畫面
// =====================================================================
function AuthScreen() {
  const [mode, setMode] = useState("login"); // login | register | forgot
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setMsg(null);
    setBusy(true);
    try {
      if (mode === "login") {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else if (mode === "register") {
        const { error } = await sb.auth.signUp({
          email, password,
          options: { emailRedirectTo: window.location.href.split("#")[0] },
        });
        if (error) throw error;
        setMsg({ type: "ok", text: "註冊成功！若專案有開啟信箱驗證，請收信確認後再登入。" });
      } else if (mode === "forgot") {
        const { error } = await sb.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.href.split("#")[0],
        });
        if (error) throw error;
        setMsg({ type: "ok", text: "已寄出重設密碼信，請至信箱點擊連結繼續。" });
      }
    } catch (err) {
      setMsg({ type: "err", text: err.message || "發生錯誤" });
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="min-h-screen flex items-center justify-center px-4">
      <div className="w-full max-w-sm bg-white rounded-2xl shadow-lg p-8">
        <h1 className="text-2xl font-bold text-slate-800 mb-1">任務雲 TaskCloud</h1>
        <p className="text-sm text-slate-500 mb-6">多人共享任務管理系統（測試前端）</p>
        {mode !== "forgot" && (
          <div className="flex mb-6 rounded-lg bg-slate-100 p-1 text-sm font-medium">
            <button onClick={() => { setMode("login"); setMsg(null); }} className={"flex-1 py-1.5 rounded-md " + (mode === "login" ? "bg-white shadow text-slate-900" : "text-slate-500")}>登入</button>
            <button onClick={() => { setMode("register"); setMsg(null); }} className={"flex-1 py-1.5 rounded-md " + (mode === "register" ? "bg-white shadow text-slate-900" : "text-slate-500")}>註冊</button>
          </div>
        )}
        {mode === "forgot" && (
          <div className="mb-4">
            <h2 className="text-sm font-semibold text-slate-700">重設密碼</h2>
            <p className="text-xs text-slate-500 mt-1">輸入註冊時使用的 email，我們會寄一封重設密碼信給你。</p>
          </div>
        )}
        <form onSubmit={submit} className="space-y-3">
          <div>
            <label className="text-xs text-slate-500">Email</label>
            <input required type="email" value={email} onChange={e => setEmail(e.target.value)}
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
          </div>
          {mode !== "forgot" && (
            <div>
              <label className="text-xs text-slate-500">密碼</label>
              <input required type="password" minLength={6} value={password} onChange={e => setPassword(e.target.value)}
                className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
            </div>
          )}
          {mode === "login" && (
            <button type="button" onClick={() => { setMode("forgot"); setMsg(null); }} className="text-xs text-blue-600 underline">忘記密碼？</button>
          )}
          {msg && (
            <div className={"text-xs rounded-lg px-3 py-2 " + (msg.type === "err" ? "bg-rose-50 text-rose-600" : "bg-emerald-50 text-emerald-700")}>{msg.text}</div>
          )}
          <button disabled={busy} className="w-full bg-slate-900 text-white rounded-lg py-2.5 text-sm font-medium disabled:opacity-50">
            {busy ? "處理中…" : (mode === "login" ? "登入" : mode === "register" ? "註冊" : "傳送重設密碼信")}
          </button>
          {mode === "forgot" && (
            <button type="button" onClick={() => { setMode("login"); setMsg(null); }} className="w-full text-xs text-slate-500 underline">返回登入</button>
          )}
        </form>
        {!sb && (
          <p className="mt-4 text-xs text-rose-500">尚未設定 SUPABASE_URL / SUPABASE_ANON_KEY，請先在檔案最上方填入你的 Supabase 專案資訊。</p>
        )}
      </div>
    </div>
  );
}

// =====================================================================
// 重設密碼（從 email 連結點回來後顯示）
// =====================================================================
function ResetPasswordScreen({ onDone }) {
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [done, setDone] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setMsg(null);
    if (newPassword.length < 6) { setMsg({ type: "err", text: "新密碼至少需要 6 個字元" }); return; }
    if (newPassword !== confirmPassword) { setMsg({ type: "err", text: "兩次輸入的新密碼不一致" }); return; }
    setBusy(true);
    try {
      const { error } = await sb.auth.updateUser({ password: newPassword });
      if (error) throw error;
      await sb.auth.signOut();
      setDone(true);
    } catch (err) {
      setMsg({ type: "err", text: err.message || "更新密碼時發生錯誤" });
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="min-h-screen flex items-center justify-center px-4">
      <div className="w-full max-w-sm bg-white rounded-2xl shadow-lg p-8">
        <h1 className="text-xl font-bold text-slate-800 mb-1">設定新密碼</h1>
        {done ? (
          <div>
            <p className="text-sm text-emerald-700 bg-emerald-50 rounded-lg px-3 py-2 mt-4">密碼已更新成功，請用新密碼重新登入。</p>
            <button onClick={onDone} className="w-full mt-4 bg-slate-900 text-white rounded-lg py-2.5 text-sm font-medium">前往登入</button>
          </div>
        ) : (
          <form onSubmit={submit} className="space-y-3 mt-4">
            <div>
              <label className="text-xs text-slate-500">新密碼（至少 6 個字元）</label>
              <input required type="password" minLength={6} value={newPassword} onChange={e => setNewPassword(e.target.value)}
                className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
            </div>
            <div>
              <label className="text-xs text-slate-500">確認新密碼</label>
              <input required type="password" minLength={6} value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)}
                className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
            </div>
            {msg && <div className={"text-xs rounded-lg px-3 py-2 " + (msg.type === "err" ? "bg-rose-50 text-rose-600" : "bg-emerald-50 text-emerald-700")}>{msg.text}</div>}
            <button disabled={busy} className="w-full bg-slate-900 text-white rounded-lg py-2.5 text-sm font-medium disabled:opacity-50">{busy ? "更新中…" : "更新密碼"}</button>
          </form>
        )}
      </div>
    </div>
  );
}

function NewMissionModal({ onClose, onCreated, priorityLabels, scaleLabels, priorityDisplay, scaleDisplay, priorityColorOverride, scaleColorOverride, currentUserId, currentUserName, assigneeOptions, projectId }) {
  const [title, setTitle] = useState("");
  const [content, setContent] = useState("");
  const [dueDate, setDueDate] = useState("");
  const [priority, setPriority] = useState("P2");
  const [scale, setScale] = useState(1);
  const [assigneeId, setAssigneeId] = useState(currentUserId);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  async function submit(e) {
    e.preventDefault();
    setBusy(true); setErr(null);
    try {
      const { data: { user } } = await sb.auth.getUser();
      const payload = {
        creator_id: user.id,
        assigned_id: assigneeId,
        project_id: projectId || null,
        title, content,
        priority, scale,
        due_date: dueDate ? new Date(dueDate).toISOString() : null,
      };
      const { error } = await sb.from("missions").insert(payload);
      if (error) throw error;
      onCreated();
      onClose();
    } catch (e2) {
      setErr(e2.message);
    } finally { setBusy(false); }
  }

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6">
        <div className="flex justify-between items-center mb-4">
          <h2 className="text-lg font-bold">{projectId ? "新增子任務" : "新增任務"}</h2>
          <button onClick={onClose}><Icon.Close className="w-5 h-5 text-slate-400"/></button>
        </div>
        <form onSubmit={submit} className="space-y-3">
          <div>
            <label className="text-xs text-slate-500">任務標題</label>
            <input required value={title} onChange={e => setTitle(e.target.value)}
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label className="text-xs text-slate-500">任務內容</label>
            <textarea required rows={4} value={content} onChange={e => setContent(e.target.value)}
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label className="text-xs text-slate-500">重要性</label>
            <div className="flex gap-2 mt-1">
              {PRIORITY_LEVELS.map(p => (
                <button key={p} type="button" onClick={() => setPriority(p)}
                  className={"flex-1 py-2 rounded-lg text-sm font-medium " + (priority === p ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>
                  {renderPriorityText(priorityLabels, priorityDisplay, "detail_edit", p, priorityColorOverride)}
                </button>
              ))}
            </div>
          </div>
          <div>
            <label className="text-xs text-slate-500">任務規模</label>
            <div className="flex gap-2 mt-1">
              {SCALE_LEVELS.map(n => (
                <button key={n} type="button" onClick={() => setScale(n)}
                  className={"flex-1 py-2 rounded-lg text-sm font-medium " + (scale === n ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>
                  {renderScaleText(scaleLabels, scaleDisplay, "detail_edit", n, scaleColorOverride)}
                </button>
              ))}
            </div>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-xs text-slate-500">截止時間（可留空）</label>
              <input type="datetime-local" value={dueDate} onChange={e => setDueDate(e.target.value)}
                className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
            </div>
            <div>
              <label className="text-xs text-slate-500">指派給</label>
              <select value={assigneeId} onChange={e => setAssigneeId(e.target.value)}
                className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                <option value={currentUserId}>我自己（{currentUserName}）</option>
                {(assigneeOptions || []).map(u => (
                  <option key={u.id} value={u.id}>{u.display_name}</option>
                ))}
              </select>
            </div>
          </div>
          {err && <div className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2">{err}</div>}
          <button disabled={busy} className="w-full bg-slate-900 text-white rounded-lg py-2.5 text-sm font-medium disabled:opacity-50">
            {busy ? "建立中…" : "建立任務"}
          </button>
        </form>
      </div>
    </div>
  );
}

    const { data: u } = await sb.from("mission_updates")
      .select("*, author:profiles!mission_updates_author_id_fkey(id,display_name)")
      .eq("mission_id", missionId).order("created_at", { ascending: true });
    setUpdates(u || []);
  }, [missionId]);

  useEffect(() => { load(); }, [load]);

  // Realtime：這筆任務本身，或底下的回覆紀錄，只要有變動就重新整理詳情內容。
  useEffect(() => {
    if (!sb) return;
    const channel = sb.channel("mission-detail-" + missionId)
      .on("postgres_changes", { event: "*", schema: "public", table: "missions", filter: `id=eq.${missionId}` }, () => load())
      .on("postgres_changes", { event: "*", schema: "public", table: "mission_updates", filter: `mission_id=eq.${missionId}` }, () => load())
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [missionId, load]);

  if (!mission) return null;

  const isCreator = mission.creator_id === currentUser.id;
  // 誰能看得到，誰就能回覆更新（跟資料庫 RLS 的可見範圍規則一致）
  const canReply = mission.status !== "completed" && mission.status !== "abandoned";
  const typeLabel = mission.project_id ? "專案任務" : (mission.assigned_id === mission.creator_id ? "私人任務" : "私人指派任務");
  // 編輯時可選的指派對象：專案任務只能選專案成員；個人任務只能選自己或好友
  const assigneeChoices = mission.project_id
    ? projectMembers
    : [{ id: currentUser.id, display_name: "我自己" }, ...(friendProfiles || [])];

  async function submitReply(e) {
    e.preventDefault();
    setBusy(true); setErr(null);
    try {
      const { error } = await sb.from("mission_updates").insert({
        mission_id: missionId, author_id: currentUser.id, content: replyText,
      });
      if (error) throw error;
      setReplyText("");
      await load();
      onChanged();
    } catch (e2) { setErr(e2.message); } finally { setBusy(false); }
  }

  async function deleteUpdate() {
    const updateId = confirmDeleteUpdateId;
    setConfirmDeleteUpdateId(null);
    const { error } = await sb.from("mission_updates").delete().eq("id", updateId);
    if (error) setErr(error.message);
    else await load();
  }

  function startSwitch() {
    setSwitchError(null);
    if (mission.project_id) setConfirmSwitch({ type: "to_personal" });
    else setShowProjectPicker(true);
  }
  function pickProject(project) {
    setShowProjectPicker(false);
    setConfirmSwitch({ type: "to_project", project });
  }
  async function confirmSwitchAction() {
    setSwitchBusy(true); setSwitchError(null);
    try {
      const { error } = confirmSwitch.type === "to_personal"
        ? await sb.rpc("move_mission_to_personal", { p_mission_id: missionId })
        : await sb.rpc("move_mission_to_project", { p_mission_id: missionId, p_project_id: confirmSwitch.project.id });
      if (error) throw error;
      setConfirmSwitch(null);
      await load();
      onChanged();
    } catch (e2) {
      setSwitchError(e2.message);
    } finally {
      setSwitchBusy(false);
    }
  }

  async function saveBodyEdit() {
    setBusy(true); setErr(null);
    try {
      const { error } = await sb.from("missions").update({
        title: editTitle, content: editContent, priority: editPriority, scale: editScale,
        due_date: editDue ? new Date(editDue).toISOString() : null,
        assigned_id: editAssigneeId,
      }).eq("id", missionId);
      if (error) throw error;
      setEditingBody(false);
      await load();
      onChanged();
    } catch (e2) { setErr(e2.message); } finally { setBusy(false); }
  }

  async function confirmStatusChange() {
    if (!finalComment.trim()) { setErr("切換狀態前必須填寫最終評論"); return; }
    setBusy(true); setErr(null);
    try {
      const { error } = await sb.from("missions").update({
        status: pendingStatus, final_comment: finalComment,
      }).eq("id", missionId);
      if (error) throw error;
      setPendingStatus(null); setFinalComment("");
      await load();
      onChanged();
    } catch (e2) { setErr(e2.message); } finally { setBusy(false); }
  }

  return (
    <>
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[85vh] overflow-y-auto p-6">
        <div className="flex justify-between items-start mb-4">
          <div>
            <span className={"inline-block text-xs px-2 py-0.5 rounded-full font-medium " + STATUS_COLOR[mission.status]}>{STATUS_LABEL[mission.status]}</span>
            <span className="ml-2 text-xs text-slate-400">{typeLabel}{mission.project_id ? `（${mission.project?.name}）` : ""}</span>
            {isCreator && (
              <button onClick={startSwitch} className="ml-2 inline-block text-xs px-2 py-0.5 rounded-full font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">
                {mission.project_id ? "切至個人專案" : "切至專案內"}
              </button>
            )}
          </div>
          <button onClick={onClose}><Icon.Close className="w-5 h-5 text-slate-400"/></button>
        </div>

        {!editingBody ? (
          <div>
            <h2 className="text-xl font-bold mb-2">{mission.title}</h2>
            <p className="whitespace-pre-wrap text-sm text-slate-700 mb-3">{mission.content}</p>
            <div className="grid grid-cols-2 gap-2 text-xs text-slate-500 mb-3">
              <div>建立成員：{mission.creator?.display_name}</div>
              <div>指派給：{mission.assignee?.display_name}</div>
              <div>建立時間：{fmt(mission.created_at)}</div>
              <div>最後更新：{fmt(mission.updated_at)}</div>
              <div>截止時間：{renderDueDate(mission, dueDateDisplayDetail, dueDateColorOverride)}</div>
              <div>重要性：{renderPriorityText(priorityLabels, priorityDisplay, "detail_view", mission.priority, priorityColorOverride)}</div>
              <div>任務規模：{renderScaleText(scaleLabels, scaleDisplay, "detail_view", mission.scale, scaleColorOverride)}</div>
              <div>緊急度：{(() => { const rd = remainingDays(mission.due_date); const u = rd === null ? null : urgencyScore(rd, mission.scale || 1); return renderUrgencyText(urgencyLabels, urgencyDisplay, "detail_view", u, urgencyColorOverride); })()}</div>
            </div>
            <div className="text-xs text-slate-400 mb-3">
              {mission.project_id
                ? `誰可以看：專案「${mission.project?.name}」的所有成員（${projectMembers.map(p => p.display_name).join("、")}）`
                : `誰可以看：${[mission.creator?.display_name, mission.assignee?.display_name].filter((v, i, a) => v && a.indexOf(v) === i).join("、")}`}
            </div>
            {isCreator && mission.status !== "completed" && mission.status !== "abandoned" && (
              <div className="flex justify-end mb-2">
                <button onClick={() => setEditingBody(true)} title="編輯本文" className="flex items-center justify-center text-slate-500 hover:text-slate-600">
                  <Icon.Edit className="w-4 h-4" />
                </button>
              </div>
            )}
          </div>
        ) : (
          <div className="space-y-2 mb-3">
            <input value={editTitle} onChange={e => setEditTitle(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold" />
            <textarea rows={4} value={editContent} onChange={e => setEditContent(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
            <div>
              <label className="text-xs text-slate-500">重要性</label>
              <div className="flex gap-2 mt-1">
                {PRIORITY_LEVELS.map(p => (
                  <button key={p} type="button" onClick={() => setEditPriority(p)}
                    className={"flex-1 py-2 rounded-lg text-sm font-medium " + (editPriority === p ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>
                    {renderPriorityText(priorityLabels, priorityDisplay, "detail_edit", p, priorityColorOverride)}
                  </button>
                ))}
              </div>
            </div>
            <div>
              <label className="text-xs text-slate-500">任務規模</label>
              <div className="flex gap-2 mt-1">
                {SCALE_LEVELS.map(n => (
                  <button key={n} type="button" onClick={() => setEditScale(n)}
                    className={"flex-1 py-2 rounded-lg text-sm font-medium " + (editScale === n ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>
                    {renderScaleText(scaleLabels, scaleDisplay, "detail_edit", n, scaleColorOverride)}
                  </button>
                ))}
              </div>
            </div>
            <input type="datetime-local" value={editDue} onChange={e => setEditDue(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
            <div>
              <label className="text-xs text-slate-500">指派給{mission.project_id ? "（僅限此專案成員）" : "（自己或好友）"}</label>
              <select value={editAssigneeId} onChange={e => setEditAssigneeId(e.target.value)}
                className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                {assigneeChoices.map(u => (
                  <option key={u.id} value={u.id}>{u.id === currentUser.id ? "我自己" : u.display_name}</option>
                ))}
              </select>
            </div>
            <div className="flex gap-2">
              <button onClick={saveBodyEdit} disabled={busy} className="bg-slate-900 text-white text-xs rounded-lg px-3 py-1.5">儲存</button>
              <button onClick={() => setEditingBody(false)} className="text-xs text-slate-500 px-3 py-1.5">取消</button>
            </div>
          </div>
        )}

        {mission.final_comment && (
          <div className="bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 text-sm text-amber-800 mb-4">
            <strong>最終評論：</strong>{mission.final_comment}
          </div>
        )}

        <div className="border-t border-slate-200 pt-3 mt-3">
          <h3 className="text-sm font-semibold text-slate-600 mb-2">更新紀錄</h3>
          <div className="space-y-2 max-h-56 overflow-y-auto pr-1">
            {updates.length === 0 && <p className="text-xs text-slate-400">尚無更新紀錄</p>}
            {updates.map(u => (
              <div key={u.id} className="bg-slate-50 rounded-lg px-3 py-2">
                <div className="flex justify-between text-xs text-slate-400 mb-1">
                  <span>{u.author?.display_name}</span>
                  <span>{fmt(u.created_at)}</span>
                </div>
                <p className="text-sm whitespace-pre-wrap">{u.content}</p>
                {u.author_id === currentUser.id && mission.status !== "completed" && mission.status !== "abandoned" && (
                  <div className="flex justify-end mt-1">
                    <button onClick={() => setConfirmDeleteUpdateId(u.id)} title="刪除留言" className="flex items-center justify-center text-rose-500 hover:text-rose-600">
                      <Icon.Trash className="w-4 h-4" />
                    </button>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>

        {confirmDeleteUpdateId && (
          <ConfirmModal
            title="刪除留言"
            message="此留言將永久刪除，無法復原！確定或取消？"
            confirmLabel="確定刪除"
            danger
            onConfirm={deleteUpdate}
            onCancel={() => setConfirmDeleteUpdateId(null)}
          />
        )}

        {err && <div className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2 mt-3">{err}</div>}

        {canReply && (
          <form onSubmit={submitReply} className="mt-4 border-t border-slate-200 pt-3">
            <label className="text-xs text-slate-500">更新任務</label>
            <textarea required rows={2} value={replyText} onChange={e => setReplyText(e.target.value)}
              placeholder="輸入更新內容…" className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
            <button disabled={busy} className="mt-2 bg-blue-600 text-white text-xs rounded-lg px-4 py-2 disabled:opacity-50">送出更新</button>
          </form>
        )}

        {isCreator && (mission.status === "added" || mission.status === "in_progress") && (
          <div className="mt-4 border-t border-slate-200 pt-3">
            {!pendingStatus ? (
              <div className="flex gap-2">
                <button onClick={() => setPendingStatus("completed")} className="text-xs bg-emerald-600 text-white rounded-lg px-3 py-1.5">標記為已完成</button>
                <button onClick={() => setPendingStatus("abandoned")} className="text-xs bg-rose-600 text-white rounded-lg px-3 py-1.5">標記為已棄置</button>
              </div>
            ) : (
              <div className="space-y-2">
                <label className="text-xs text-slate-500">切換為「{STATUS_LABEL[pendingStatus]}」前，請填寫最終評論</label>
                <textarea rows={2} value={finalComment} onChange={e => setFinalComment(e.target.value)}
                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
                <div className="flex gap-2">
                  <button onClick={confirmStatusChange} disabled={busy} className="text-xs bg-slate-900 text-white rounded-lg px-3 py-1.5">確認切換</button>
                  <button onClick={() => { setPendingStatus(null); setFinalComment(""); }} className="text-xs text-slate-500 px-3 py-1.5">取消</button>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>

    {showProjectPicker && (
      <ProjectPickerModal
        projects={(projects || []).filter(p => p.id !== mission.project_id)}
        onPick={pickProject}
        onClose={() => setShowProjectPicker(false)}
      />
    )}

    {confirmSwitch && (
      <ConfirmModal
        title="切換任務歸屬"
        message={
          confirmSwitch.type === "to_personal"
            ? "確定要將此任務移出目前的專案、退回個人任務嗎？\n（若指派對象並非您的個人好友，系統將無法完成這個動作）"
            : `確定將此任務移入專案「${confirmSwitch.project.name}」嗎？\n（若指派對象目前不是該專案成員，且您是該專案的擁有者，系統會一併將對方加入為專案成員；若您不是擁有者，指派對象又不在該專案內，則無法完成）`
        }
        confirmLabel={switchBusy ? "處理中…" : "確定"}
        onConfirm={confirmSwitchAction}
        onCancel={() => setConfirmSwitch(null)}
      />
    )}

    {switchError && (
      <ConfirmModal
        title="無法切換任務歸屬"
        message={switchError}
        confirmLabel="確定"
        hideCancel
        onConfirm={() => setSwitchError(null)}
        onCancel={() => setSwitchError(null)}
      />
    )}
    </>
  );
}

// =====================================================================
// 任務清單（傳統列表模式）
// =====================================================================
const COLUMN_LABELS = {
  created_at: "建立時間", creator: "建立成員", assignee: "指派給", relation: "指派關係",
  updated_at: "最後更新", procrastination_days: "拖延天數", title: "任務標題", priority: "重要性",
  scale: "任務規模", urgency: "緊急度", due_date: "截止時間", status: "狀態", action: "動作",
  no_progress_days: "無進度天數", closed_at: "完成/棄置時間", final_comment: "最終評論",
};

function MissionListView({ missions, onOpen, priorityLabels, scaleLabels, priorityDisplay, scaleDisplay, priorityColorOverride, scaleColorOverride, urgencyDisplay, urgencyLabels, urgencyColorOverride, visibleColumns, currentUserId, hiddenIds, onHide, onUnhide, onDelete, relationDisplayMode, dueDateDisplayList, dueDateColorOverride, sortMode, sortHighlightColor, forceShowSortColumn, noProgressColorOverride, noProgressSeverityDays, starredIds, onStar, onUnstar, starOverrideColor, columnMode, columnOrder }) {
  const isClosedMode = columnMode === "closed";
  const columnDefs = isClosedMode ? TASK_LIST_COLUMNS_CLOSED : TASK_LIST_COLUMNS;
  const vc = visibleColumns || (isClosedMode ? DEFAULT_VISIBLE_COLUMNS_CLOSED : DEFAULT_VISIBLE_COLUMNS);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const confirmDeleteMission = missions.find(m => m.id === confirmDeleteId) || null;

  const highlightCols = SORT_MODE_HIGHLIGHT_COLUMNS[sortMode] || [];
  const highlightSet = new Set(highlightCols);
  const highlightHex = (SORT_HIGHLIGHT_COLORS[sortHighlightColor] || SORT_HIGHLIGHT_COLORS.blue).hex;
  const highlightRgb = hexToRgbString(highlightHex);
  const headerHighlightStyle = { background: `rgba(${highlightRgb},0.15)` };
  const cellHighlightStyle = { background: `rgba(${highlightRgb},0.08)` };
  const starColorEntry = starOverrideColor && starOverrideColor !== "none" ? SORT_HIGHLIGHT_COLORS[starOverrideColor] : null;
  const starCellStyle = starColorEntry ? { background: `rgba(${hexToRgbString(starColorEntry.hex)},0.12)` } : null;

  // 決定欄位顯示順序：優先套用使用者自訂的排列順序（若有效），否則用預設順序；
  // 開啟「強制顯示排序欄位在最前面」時，再把排序對應的欄位（不論原本是否被隱藏）額外提到最前面
  const defaultBaseKeys = columnDefs.map(c => c.key);
  const baseKeys = (Array.isArray(columnOrder) && columnOrder.length === defaultBaseKeys.length && defaultBaseKeys.every(k => columnOrder.includes(k)))
    ? columnOrder
    : defaultBaseKeys;
  const orderedKeys = forceShowSortColumn && highlightCols.length
    ? [...highlightCols.filter(k => baseKeys.includes(k)), ...baseKeys.filter(k => !highlightSet.has(k))]
    : baseKeys;
  const visibleKeys = orderedKeys.filter(k => vc[k] || (forceShowSortColumn && highlightSet.has(k)));
  const colCount = visibleKeys.length || 1;

  function handleConfirmDelete() {
    onDelete(confirmDeleteId);
    setConfirmDeleteId(null);
  }

  function th(key) {
    return <th key={key} className="px-4 py-2 font-medium" style={highlightSet.has(key) ? headerHighlightStyle : undefined}>{COLUMN_LABELS[key]}</th>;
  }
  function td(key, content, extraClass, onClickCell, rowStarStyle, extraStyle) {
    const baseStyle = rowStarStyle || (highlightSet.has(key) ? cellHighlightStyle : undefined);
    const style = extraStyle ? { ...baseStyle, ...extraStyle } : baseStyle;
    return <td key={key} className={extraClass || "px-4 py-3 whitespace-nowrap"} style={style} onClick={onClickCell}>{content}</td>;
  }

  function renderCell(key, m) {
    const rd = remainingDays(m.due_date);
    const urgency = rd === null ? null : urgencyScore(rd, m.scale || 1);
    const isHidden = hiddenIds && hiddenIds.has(m.id);
    const isOwn = m.creator_id === currentUserId;
    const isOpenStatus = m.status === "added" || m.status === "in_progress";
    const isStarred = starredIds && starredIds.has(m.id);
    const rowStarStyle = isStarred ? starCellStyle : null;
    switch (key) {
      case "closed_at": return td(key, fmt(m.updated_at), "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "final_comment": return td(key, m.final_comment || "—", "px-4 py-3 text-slate-600", null, rowStarStyle,
        { maxWidth: 260, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" });
      case "created_at": return td(key, fmt(m.created_at), "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "creator": return td(key, m.creator?.display_name, null, null, rowStarStyle);
      case "assignee": return td(key, m.assignee?.display_name, null, null, rowStarStyle);
      case "relation": return td(key,
        relationDisplayMode === "text"
          ? RELATION_LABELS[relationCategory(m, currentUserId)]
          : <AssignRelationIcon {...RELATION_ICON_PROPS[relationCategory(m, currentUserId)]} className="w-10 h-6" />,
        null, null, rowStarStyle
      );
      case "updated_at": return td(key, fmt(m.updated_at), "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "procrastination_days": return td(key, procrastinationDays(m).toFixed(1) + "天", "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "no_progress_days": return td(key,
        noProgressColorOverride
          ? <span style={{ color: noProgressColor(m.updated_at, noProgressSeverityDays) }}>{noProgressText(m.updated_at, m.status)}</span>
          : noProgressText(m.updated_at, m.status),
        "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle
      );
      case "title": return td(key, m.title, "px-4 py-3 font-medium", null, rowStarStyle);
      case "priority": return td(key, renderPriorityText(priorityLabels, priorityDisplay, "list", m.priority, priorityColorOverride), "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "scale": return td(key, renderScaleText(scaleLabels, scaleDisplay, "list", m.scale || 1, scaleColorOverride), "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "urgency": return td(key, renderUrgencyText(urgencyLabels, urgencyDisplay, "list", urgency, urgencyColorOverride), "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "due_date": return td(key, renderDueDate(m, dueDateDisplayList, dueDateColorOverride), "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "status": return td(key, <span className={"text-xs px-2 py-0.5 rounded-full font-medium " + STATUS_COLOR[m.status]}>{STATUS_LABEL[m.status]}</span>, null, null, rowStarStyle);
      case "action": return td(key, (
        <div className="flex items-center gap-2">
          {isOpenStatus && !isHidden && (
            isStarred ? (
              <button onClick={() => onUnstar(m.id)} title="取消關注" className="flex items-center justify-center text-emerald-600 hover:text-emerald-700">
                <Icon.Unboost className="w-4 h-4" />
              </button>
            ) : (
              <button onClick={() => onStar(m.id)} title="注目任務" className="flex items-center justify-center text-violet-600 hover:text-violet-700">
                <Icon.Boost className="w-4 h-4" />
              </button>
            )
          )}
          {isHidden ? (
            <button onClick={() => onUnhide(m.id)} title="取消隱藏" className="flex items-center justify-center text-blue-600 hover:text-blue-700">
              <Icon.Show className="w-4 h-4" />
            </button>
          ) : !isOwn ? (
            <button onClick={() => onHide(m.id)} title="隱藏" className="flex items-center justify-center text-slate-500 hover:text-slate-600">
              <Icon.Hidden className="w-4 h-4" />
            </button>
          ) : null}
          {isOwn && (
            <button onClick={() => setConfirmDeleteId(m.id)} title="永久刪除任務" className="flex items-center justify-center text-rose-500 hover:text-rose-600">
              <Icon.Trash className="w-4 h-4" />
            </button>
          )}
        </div>
      ), null, e => e.stopPropagation(), rowStarStyle);
      default: return null;
    }
  }

  return (
    <div className="bg-white rounded-2xl shadow overflow-x-auto">
      <table className="w-full text-sm">
        <thead>
          <tr className="text-left text-xs text-slate-400 border-b border-slate-200">
            {visibleKeys.map(key => th(key))}
          </tr>
        </thead>
        <tbody>
          {missions.map(m => (
            <tr key={m.id} onClick={() => onOpen(m.id)} className="border-b border-slate-100 hover:bg-slate-50 cursor-pointer">
              {visibleKeys.map(key => renderCell(key, m))}
            </tr>
          ))}

// =====================================================================
// 甘特圖模式
// =====================================================================
function GanttView({ missions, onOpen }) {
  const [pxPerDay, setPxPerDay] = useState(36);
  const [viewStart, setViewStart] = useState(() => { const d = new Date(); d.setDate(d.getDate() - 3); d.setHours(0,0,0,0); return d; });
  const totalDays = 30;
  const viewEnd = useMemo(() => { const d = new Date(viewStart); d.setDate(d.getDate() + totalDays); return d; }, [viewStart]);
  const today = new Date();
  const nowLeftPct = nowLinePercent();

  function shift(days) {
    setViewStart(d => { const nd = new Date(d); nd.setDate(nd.getDate() + days); return nd; });
  }

  const days = useMemo(() => {
    const arr = [];
    for (let i = 0; i < totalDays; i++) { const d = new Date(viewStart); d.setDate(d.getDate() + i); arr.push(d); }
    return arr;
  }, [viewStart]);

  function dayDiff(a, b) { return (b - a) / 86400000; }

  const rows = missions.map(m => {
    const start = new Date(m.created_at);
    const end = m.due_date ? new Date(m.due_date) : new Date(start.getTime() + 86400000);
    const clampedStart = start < viewStart ? viewStart : start;
    const clampedEnd = end > viewEnd ? viewEnd : end;
    const visible = clampedEnd >= viewStart && clampedStart <= viewEnd;
    const left = Math.max(0, dayDiff(viewStart, clampedStart)) * pxPerDay;
    const width = Math.max(dayDiff(clampedStart, clampedEnd) * pxPerDay, 6);
    // 色塊顏色：依緊急度分數（0~2）對應青綠→橘→紅；沒有截止時間就用狀態色當備案
    const rd = remainingDays(m.due_date);
    const barColor = rd === null ? STATUS_BAR_COLOR[m.status] : urgencyColor(urgencyScore(rd, m.scale || 1));
    return { m, visible, left, width, barColor };
  });

  return (
    <div className="bg-white rounded-2xl shadow p-4">
      <div className="flex items-center justify-between mb-3 gap-2 flex-wrap">
        <div className="flex gap-2">
          <button onClick={() => shift(-7)} className="text-xs px-2 py-1 rounded-lg bg-slate-100">← 上一週</button>
          <button onClick={() => shift(7)} className="text-xs px-2 py-1 rounded-lg bg-slate-100">下一週 →</button>
          <button onClick={() => { const d = new Date(); d.setDate(d.getDate() - 3); setViewStart(d); }} className="text-xs px-2 py-1 rounded-lg bg-slate-100">回到今天</button>
        </div>
        <div className="flex gap-2 items-center">
          <span className="text-xs text-slate-400">縮放</span>
          <button onClick={() => setPxPerDay(p => Math.max(16, p - 8))} className="text-xs w-7 h-7 rounded-lg bg-slate-100">－</button>
          <button onClick={() => setPxPerDay(p => Math.min(80, p + 8))} className="text-xs w-7 h-7 rounded-lg bg-slate-100">＋</button>
        </div>
      </div>
      <div className="overflow-x-auto">
        <div style={{ width: totalDays * pxPerDay + 180 }}>
          <div className="flex sticky top-0 bg-white z-10" style={{ paddingLeft: 180 }}>
            {days.map((d, i) => {
              const todayCol = isSameDay(d, today);
              return (
                <div key={i} style={{ width: pxPerDay, ...(todayCol ? { "--now-line-left": nowLeftPct + "%" } : {}) }}
                  className={"tl-day-col text-[10px] text-center border-l border-slate-100 py-1 " + (todayCol ? "is-today" : "text-slate-400")}>
                  <div>{d.getMonth()+1}/{d.getDate()}</div>
                  <div>{WEEKDAY_LABELS[d.getDay()]}</div>
                </div>
              );
            })}
          </div>
          {rows.map(({ m, visible, left, width, barColor }) => (
            <div key={m.id} className="flex items-center border-t border-slate-100" style={{ height: 40 }}>
              <div style={{ width: 180 }} className="pr-2 text-xs truncate font-medium" title={m.title}>{m.title}</div>
              <div className="relative flex-1" style={{ height: "100%" }}>
                <div className="flex absolute inset-0">
                  {days.map((d, i) => {
                    const todayCol = isSameDay(d, today);
                    return (
                      <div key={i} style={{ width: pxPerDay, ...(todayCol ? { "--now-line-left": nowLeftPct + "%" } : {}) }}
                        className={"tl-day-cell" + (todayCol ? " is-today" : "")} />
                    );
                  })}
                </div>
                {visible && (
                  <div onClick={() => onOpen(m.id)} title={`${m.title}（${STATUS_LABEL[m.status]}）`}
                    className="absolute top-2 h-6 rounded-md cursor-pointer flex items-center px-2 text-[10px] text-white truncate shadow-sm"
                    style={{ left, width, background: barColor, zIndex: 2 }}>
                    {m.title}
                  </div>
                )}
              </div>
            </div>
          ))}
          {rows.length === 0 && <p className="text-center text-slate-400 text-sm py-8">目前沒有符合條件的任務</p>}
        </div>
      </div>
      <p className="text-[11px] text-slate-400 mt-2">＊長條左端＝任務建立時間，右端＝截止時間（若無截止時間則顯示為一天的短區塊）；顏色依緊急度分數由青綠（不急）到珊瑚紅（緊急）漸變。</p>
    </div>
  );
}

// =====================================================================
// 緊急程度分數曲線（互動預覽，邏輯對應 urgency-score-spec.md）
// =====================================================================
function UrgencyCurveChart({ scaleLabels }) {
  const [s, setS] = useState(1);
  const [hover, setHover] = useState(null); // { x, y, cx, cy }

  const W = 720, H = 400;
  const padL = 44, padR = 20, padT = 20, padB = 40;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const xMin = -1, xMax = 10, yMin = -1, yMax = 5;
  const sx = x => padL + (x - xMin) / (xMax - xMin) * plotW;
  const sy = y => padT + (yMax - y) / (yMax - yMin) * plotH;

  const gridXs = [];
  for (let gx = Math.ceil(xMin); gx <= xMax; gx++) gridXs.push(gx);
  const gridYs = [];
  for (let gy = Math.ceil(yMin); gy <= yMax; gy++) gridYs.push(gy);

  let d = "";
  const steps = Math.round((xMax - xMin) / 0.1);
  for (let i = 0; i <= steps; i++) {
    const x = +(xMin + i * 0.1).toFixed(1);
    let y = urgencyScore(x, s);
    if (y > yMax) y = yMax;
    if (y < yMin) y = yMin;
    d += (i === 0 ? "M " : "L ") + sx(x) + " " + sy(y) + " ";
  }

  const markers = [];
  for (let x = 0; x <= xMax + 1e-9; x += 0.5) {
    const xr = +x.toFixed(1);
    const y = urgencyScore(xr, s);
    const yDisp = Math.min(Math.max(y, yMin), yMax);
    markers.push({ x: xr, y, cx: sx(xr), cy: sy(yDisp) });
  }

  return (
    <div>
      <div className="flex items-center gap-2 mb-3 flex-wrap">
        <span className="text-xs text-slate-500">預覽規模：</span>
        {SCALE_LEVELS.map(n => (
          <button key={n} onClick={() => setS(n)}
            className={"text-xs px-3 py-1.5 rounded-lg " + (s === n ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>
            {scaleLabels["S" + n] || ("S" + n)}
          </button>
        ))}
      </div>
      <div className="relative">
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto rounded-xl" style={{ background: "#0f1720" }}>
          {gridXs.map(gx => (
            <line key={"gx" + gx} x1={sx(gx)} y1={sy(yMin)} x2={sx(gx)} y2={sy(yMax)} stroke="#27394a" strokeWidth="1" />
          ))}
          {gridYs.map(gy => (
            <line key={"gy" + gy} x1={sx(xMin)} y1={sy(gy)} x2={sx(xMax)} y2={sy(gy)} stroke="#27394a" strokeWidth="1" />
          ))}
          <line x1={sx(0)} y1={sy(yMin)} x2={sx(0)} y2={sy(yMax)} stroke="#5c7488" strokeWidth="2.5" />
          <line x1={sx(xMin)} y1={sy(0)} x2={sx(xMax)} y2={sy(0)} stroke="#5c7488" strokeWidth="2.5" />
          {gridXs.map(gx => (
            <text key={"tx" + gx} x={sx(gx)} y={sy(0) + 18} textAnchor="middle" fontSize="11" fill="#93a4b3">{gx}</text>
          ))}
          {gridYs.filter(gy => gy !== 0).map(gy => (
            <text key={"ty" + gy} x={sx(0) - 10} y={sy(gy) + 4} textAnchor="end" fontSize="11" fill="#93a4b3">{gy}</text>
          ))}
          <text x={sx(xMax) - 4} y={sy(0) - 12} textAnchor="end" fontSize="13" fontWeight="700" fill="#e8eef3">剩餘時間(天)</text>
          <text x={sx(0) + 10} y={sy(yMax) + 16} textAnchor="start" fontSize="13" fontWeight="700" fill="#e8eef3">緊急程度分數</text>
          <path d={d} fill="none" stroke="#4fd1c5" strokeWidth="3" strokeLinejoin="round" strokeLinecap="round" />
          {markers.map((m, i) => (
            <circle key={i} cx={m.cx} cy={m.cy} r={hover && hover.x === m.x ? 6 : 4.5}
              fill={hover && hover.x === m.x ? "#f2a541" : "#16212c"} stroke="#f2a541" strokeWidth="2"
              style={{ cursor: "pointer" }}
              onMouseEnter={() => setHover(m)} onMouseLeave={() => setHover(null)} />
          ))}
        </svg>
        {hover && (
          <div className="absolute bg-slate-900 text-white text-xs px-3 py-2 rounded-lg shadow-lg pointer-events-none"
            style={{ left: (hover.cx / W) * 100 + "%", top: (hover.cy / H) * 100 + "%", transform: "translate(-50%, -120%)" }}>
            剩餘天數：{hover.x} 天，緊急分數：{hover.y.toFixed(2)}
          </div>
        )}
      </div>
      <p className="text-[11px] text-slate-400 mt-2">滑鼠移到圖上的橘色圓點可以看到該天數對應的精確分數。</p>
    </div>
  );
}

// =====================================================================
// 變更密碼
// =====================================================================
function ChangePasswordCard({ email }) {
  const [currentPassword, setCurrentPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);

  async function submit(e) {
    e.preventDefault();
    setMsg(null);

    if (newPassword.length < 6) {
      setMsg({ type: "err", text: "新密碼至少需要 6 個字元" });
      return;
    }
    if (newPassword !== confirmPassword) {
      setMsg({ type: "err", text: "兩次輸入的新密碼不一致" });
      return;
    }
    if (newPassword === currentPassword) {
      setMsg({ type: "err", text: "新密碼不能與目前密碼相同" });
      return;
    }

    setBusy(true);
    try {
      // 先用目前密碼重新驗證身分，確認操作者真的知道舊密碼
      const { error: signInErr } = await sb.auth.signInWithPassword({ email, password: currentPassword });
      if (signInErr) {
        setMsg({ type: "err", text: "目前密碼不正確" });
        return;
      }
      const { error: updateErr } = await sb.auth.updateUser({ password: newPassword });
      if (updateErr) throw updateErr;
      setMsg({ type: "ok", text: "密碼已更新成功" });
      setCurrentPassword(""); setNewPassword(""); setConfirmPassword("");
    } catch (err) {
      setMsg({ type: "err", text: err.message || "變更密碼時發生錯誤" });
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="bg-white rounded-2xl shadow p-5">
      <h3 className="font-bold mb-3">變更密碼</h3>
      <form onSubmit={submit} className="space-y-3 text-sm">
        <div>
          <label className="text-xs text-slate-500">目前密碼</label>
          <input required type="password" value={currentPassword} onChange={e => setCurrentPassword(e.target.value)}
            className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2" />
        </div>
        <div>
          <label className="text-xs text-slate-500">新密碼（至少 6 個字元）</label>
          <input required type="password" minLength={6} value={newPassword} onChange={e => setNewPassword(e.target.value)}
            className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2" />
        </div>
        <div>
          <label className="text-xs text-slate-500">確認新密碼</label>
          <input required type="password" minLength={6} value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)}
            className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2" />
        </div>
        {msg && <div className={"text-xs rounded-lg px-3 py-2 " + (msg.type === "err" ? "bg-rose-50 text-rose-600" : "bg-emerald-50 text-emerald-700")}>{msg.text}</div>}
        <button disabled={busy} className="bg-slate-900 text-white rounded-lg px-4 py-2 text-sm disabled:opacity-50">{busy ? "更新中…" : "更新密碼"}</button>
      </form>
    </div>
  );
}

    </>
  );
}

// =====================================================================
// 新增專案 Modal
// =====================================================================
function NewProjectModal({ onClose, onCreated, friendProfiles, currentUserName }) {
  const [name, setName] = useState("");
  const [description, setDescription] = useState("");
  const [memberSearch, setMemberSearch] = useState("");
  const [selectedIds, setSelectedIds] = useState([]);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  const filteredFriends = (friendProfiles || []).filter(f =>
    !memberSearch.trim() || (f.display_name || "").toLowerCase().includes(memberSearch.trim().toLowerCase())
  );

  function toggleMember(id) {
    setSelectedIds(ids => ids.includes(id) ? ids.filter(x => x !== id) : [...ids, id]);
  }

  async function submit(e) {
    e.preventDefault();
    setBusy(true); setErr(null);
    try {
      const { data: { user } } = await sb.auth.getUser();
      const { data: project, error } = await sb.from("projects").insert({ name, description: description || null, creator_id: user.id }).select().single();
      if (error) throw error;
      if (selectedIds.length > 0) {
        const rows = selectedIds.map(uid => ({ project_id: project.id, user_id: uid }));
        const { error: memberErr } = await sb.from("project_members").insert(rows);
        if (memberErr) throw memberErr;
      }
      onCreated();
      onClose();
    } catch (e2) {
      setErr(e2.message);
    } finally { setBusy(false); }
  }

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6">
        <div className="flex justify-between items-center mb-4">
          <h2 className="text-lg font-bold">新增專案</h2>
          <button onClick={onClose}><Icon.Close className="w-5 h-5 text-slate-400"/></button>
        </div>
        <form onSubmit={submit} className="space-y-3">
          <div>
            <label className="text-xs text-slate-500">專案名稱</label>
            <input required value={name} onChange={e => setName(e.target.value)}
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label className="text-xs text-slate-500">專案描述（可留空）</label>
            <textarea rows={3} value={description} onChange={e => setDescription(e.target.value)}
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label className="text-xs text-slate-500">專案發起人</label>
            <div className="mt-1 px-3 py-2 bg-slate-50 rounded-lg text-sm text-slate-500">{currentUserName}</div>
          </div>
          <div>
            <label className="text-xs text-slate-500">新增專案成員（只能從好友中選擇）</label>
            <input value={memberSearch} onChange={e => setMemberSearch(e.target.value)} placeholder="搜尋好友名稱…"
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
            <div className="mt-2 max-h-48 overflow-y-auto space-y-1">
              {filteredFriends.length === 0 && <p className="text-xs text-slate-400">找不到符合的好友</p>}
              {filteredFriends.map(f => (
                <label key={f.id} className="flex items-center gap-2 text-sm bg-slate-50 rounded-lg px-3 py-2">
                  <input type="checkbox" checked={selectedIds.includes(f.id)} onChange={() => toggleMember(f.id)} className="w-4 h-4" />
                  {f.display_name}
                </label>
              ))}
            </div>
            {selectedIds.length > 0 && <p className="text-xs text-slate-400 mt-2">已選擇 {selectedIds.length} 位成員</p>}
          </div>
          {err && <div className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2">{err}</div>}
          <button disabled={busy || !name.trim()} className="w-full bg-slate-900 text-white rounded-lg py-2.5 text-sm font-medium disabled:opacity-50">
            {busy ? "建立中…" : "建立專案"}
          </button>
        </form>
      </div>
    </div>
  );
}

// =====================================================================
// 編輯專案 Modal（新增/移除成員）
// =====================================================================
function EditProjectModal({ project, members, friendProfiles, openMissions, onClose, onChanged }) {
  const [nameDraft, setNameDraft] = useState(project.name);
  const [descDraft, setDescDraft] = useState(project.description || "");
  const [savingInfo, setSavingInfo] = useState(false);
  const [infoErr, setInfoErr] = useState(null);
  const [memberSearch, setMemberSearch] = useState("");
  const [blockedInfo, setBlockedInfo] = useState(null); // { member, tasks }
  const [confirmRemove, setConfirmRemove] = useState(null); // member
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  const availableFriends = (friendProfiles || []).filter(f =>
    !members.some(m => m.id === f.id) &&
    (!memberSearch.trim() || (f.display_name || "").toLowerCase().includes(memberSearch.trim().toLowerCase()))
  );

  function blockingTasks(memberId) {
    return (openMissions || []).filter(m => m.creator_id === memberId || m.assigned_id === memberId);
  }

  async function saveProjectInfo() {
    if (!nameDraft.trim()) { setInfoErr("專案名稱不能留空"); return; }
    setSavingInfo(true); setInfoErr(null);
    const { error } = await sb.from("projects").update({ name: nameDraft.trim(), description: descDraft || null }).eq("id", project.id);
    setSavingInfo(false);
    if (error) setInfoErr(error.message); else onChanged();
  }

  async function addMember(uid) {
    setBusy(true); setErr(null);
    const { error } = await sb.from("project_members").insert({ project_id: project.id, user_id: uid });
    setBusy(false);
    if (error) setErr(error.message); else onChanged();
  }

  function requestRemove(member) {
    const blocking = blockingTasks(member.id);
    if (blocking.length > 0) setBlockedInfo({ member, tasks: blocking });
    else setConfirmRemove(member);
  }

  async function doRemove() {
    setBusy(true); setErr(null);
    const { error } = await sb.from("project_members").delete().eq("project_id", project.id).eq("user_id", confirmRemove.id);
    setBusy(false);
    setConfirmRemove(null);
    if (error) setErr(error.message); else onChanged();
  }

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6">
        <div className="flex justify-between items-center mb-4">
          <h2 className="text-lg font-bold">編輯專案</h2>
          <button onClick={onClose}><Icon.Close className="w-5 h-5 text-slate-400"/></button>
        </div>

        <div className="space-y-2 mb-4">
          <div>
            <label className="text-xs text-slate-500">專案名稱</label>
            <input value={nameDraft} onChange={e => setNameDraft(e.target.value)}
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label className="text-xs text-slate-500">專案描述（可留空）</label>
            <textarea rows={3} value={descDraft} onChange={e => setDescDraft(e.target.value)}
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          {infoErr && <div className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2">{infoErr}</div>}
          <button onClick={saveProjectInfo} disabled={savingInfo} className="bg-slate-900 text-white text-xs rounded-lg px-4 py-2 disabled:opacity-50">
            {savingInfo ? "儲存中…" : "儲存基本資料"}
          </button>
          <p className="text-xs text-amber-600">若變更「專案名稱」，儲存後會自動通知專案內所有其他成員。</p>
        </div>

        <h3 className="text-sm font-semibold text-slate-700 mb-2 pt-2 border-t border-slate-100">目前成員</h3>
        <div className="space-y-2 mb-4 max-h-48 overflow-y-auto">
          {members.map(m => (
            <div key={m.id} className="flex justify-between items-center bg-slate-50 rounded-lg px-3 py-2 text-sm">
              <span>{m.display_name}{m.id === project.creator_id ? "（發起人）" : ""}</span>
              {m.id !== project.creator_id && (
                <button onClick={() => requestRemove(m)} className="text-xs text-rose-600 underline">移除</button>
              )}
            </div>
          ))}
        </div>

        <h3 className="text-sm font-semibold text-slate-700 mb-2">新增成員（只能從好友中選擇）</h3>
        <input value={memberSearch} onChange={e => setMemberSearch(e.target.value)} placeholder="搜尋好友名稱…"
          className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-2" />
        <div className="space-y-1 max-h-40 overflow-y-auto">
          {availableFriends.length === 0 && <p className="text-xs text-slate-400">沒有可加入的好友</p>}
          {availableFriends.map(f => (
            <div key={f.id} className="flex justify-between items-center bg-slate-50 rounded-lg px-3 py-2 text-sm">
              <span>{f.display_name}</span>
              <button onClick={() => addMember(f.id)} disabled={busy} className="text-xs bg-blue-600 text-white rounded-lg px-2 py-1 disabled:opacity-50">加入</button>
            </div>
          ))}
        </div>

        {err && <div className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2 mt-3">{err}</div>}
      </div>

      {blockedInfo && (
        <ConfirmModal
          title="無法移除此成員"
          hideCancel
          confirmLabel="我知道了"
          message={`「${blockedInfo.member.display_name}」目前在這個專案還有 ${blockedInfo.tasks.length} 筆未結案任務（自己建立或被指派），必須先轉指派給別人、或將任務標記為已完成/已棄置後才能移除。\n\n受影響的任務：\n` + blockedInfo.tasks.map(t => `．${t.title}`).join("\n")}
          onConfirm={() => setBlockedInfo(null)}
          onCancel={() => setBlockedInfo(null)}
        />
      )}
      {confirmRemove && (
        <ConfirmModal
          title="移除成員"
          message={`確定要把「${confirmRemove.display_name}」移出這個專案嗎？`}
          confirmLabel="確認移除"
          danger
          onConfirm={doRemove}
          onCancel={() => setConfirmRemove(null)}
        />
      )}
    </div>
  );
}

function Dashboard({ session, profile, setProfile }) {
  const [tab, setTab] = useState("list"); // list(個人任務) | project | gantt | settings
  const [missions, setMissions] = useState([]);
  const [openMissionId, setOpenMissionId] = useState(null);
  const [showNew, setShowNew] = useState(false);
  const [showColumnSettings, setShowColumnSettings] = useState(false);
  const [visibleColumns, setVisibleColumns] = useState({ ...DEFAULT_VISIBLE_COLUMNS, ...(profile.visible_columns || {}) });
  const [visibleColumnsClosed, setVisibleColumnsClosed] = useState({ ...DEFAULT_VISIBLE_COLUMNS_CLOSED, ...(profile.visible_columns_closed || {}) });
  const [visibleSections, setVisibleSections] = useState({ ...DEFAULT_VISIBLE_SECTIONS, ...(profile.visible_sections || {}) });
  const [notifOpen, setNotifOpen] = useState(false);
  const [notifs, setNotifs] = useState([]);
  const [searchInput, setSearchInput] = useState("");
  const [appliedSearch, setAppliedSearch] = useState("");
  const [searchMatchedUpdateMissionIds, setSearchMatchedUpdateMissionIds] = useState([]);
  const [sortMode, setSortMode] = useState(() => (
    profile.remember_sort_mode && profile.remember_sort_mode !== "last_used"
      ? profile.remember_sort_mode
      : (profile.last_sort_mode || "created_desc")
  )); // created_desc | due_asc | priority_desc | priority_first | scale_asc | scale_desc | procrastination_desc

  // 依「記住排序原則」設定：選了固定模式就不寫回去（每次都回到那個模式）；
  // 選「上次停留選項」才把這次選的排序模式存回 profile，下次開啟/切分頁時記得
  function chooseSortMode(setter, mode) {
    setter(mode);
    if (!profile.remember_sort_mode || profile.remember_sort_mode === "last_used") {
      setProfile(p => ({ ...p, last_sort_mode: mode }));
      sb.from("profiles").update({ last_sort_mode: mode }).eq("id", profile.id)
        .then(({ error }) => { if (error) console.error("儲存排序模式失敗：", error); });
    }
  }
  const [personalViewMode, setPersonalViewMode] = useState("list"); // list | gantt
  const [projectViewMode, setProjectViewMode] = useState("list"); // list | gantt
  const [relationFilter, setRelationFilter] = useState(DEFAULT_RELATION_FILTER);
  const [hiddenIds, setHiddenIds] = useState([]);
  const [starredIds, setStarredIds] = useState([]);
  const [friendProfiles, setFriendProfiles] = useState([]);
  const [projects, setProjects] = useState([]);
  const [myProjectIds, setMyProjectIds] = useState([]);
  const [openProjectId, setOpenProjectId] = useState(null);
  const [showNewProject, setShowNewProject] = useState(false);
  const [showMemberRoleModal, setShowMemberRoleModal] = useState(false);
  const [projectDeleteErr, setProjectDeleteErr] = useState(null);
  const [showDeleteProjectConfirm, setShowDeleteProjectConfirm] = useState(false);
  const [showDeleteBlockedInfo, setShowDeleteBlockedInfo] = useState(false);
  const [showEditProject, setShowEditProject] = useState(false);
  const [currentProjectMembers, setCurrentProjectMembers] = useState([]);
  const openProjectIdRef = useRef(null);
  const notifRef = useRef(null);

  const loadMissions = useCallback(async () => {
    let q = sb.from("missions").select("*, creator:profiles!missions_creator_id_fkey(id,display_name,email), assignee:profiles!missions_assigned_id_fkey(id,display_name,email)").order("created_at", { ascending: false });
    const { data } = await q;
    setMissions(data || []);
  }, []);

  const loadHiddenIds = useCallback(async () => {
    const { data } = await sb.from("mission_hides").select("mission_id").eq("user_id", profile.id);
    setHiddenIds((data || []).map(r => r.mission_id));
  }, [profile.id]);

  const loadStarredIds = useCallback(async () => {
    const { data } = await sb.from("mission_stars").select("mission_id").eq("user_id", profile.id);
    setStarredIds((data || []).map(r => r.mission_id));
  }, [profile.id]);

  const loadNotifs = useCallback(async () => {
    const { data } = await sb.from("notifications")
      .select("*, actor:profiles!notifications_actor_id_fkey(display_name), mission:missions(title), project:projects(name)")
      .eq("user_id", profile.id).eq("is_read", false).order("created_at", { ascending: false });
    setNotifs(data || []);
  }, [profile.id]);

  const loadFriendProfiles = useCallback(async () => {
    const uid = profile.id;
    const [{ data: asReq }, { data: asAdr }] = await Promise.all([
      sb.from("friendships").select("addressee:profiles!friendships_addressee_id_fkey(id,display_name,email)").eq("requester_id", uid).eq("status", "accepted"),
      sb.from("friendships").select("requester:profiles!friendships_requester_id_fkey(id,display_name,email)").eq("addressee_id", uid).eq("status", "accepted"),
    ]);
    const f1 = (asReq || []).map(r => r.addressee).filter(Boolean);
    const f2 = (asAdr || []).map(r => r.requester).filter(Boolean);
    setFriendProfiles([...f1, ...f2]);
  }, [profile.id]);

  const loadProjects = useCallback(async () => {
    const { data } = await sb.from("projects").select("*, creator:profiles!projects_creator_id_fkey(display_name)").order("created_at", { ascending: false });
    setProjects(data || []);
  }, []);

  // 自己所屬（發起或加入）的專案 ID 清單。project_members 這張表沒有給 admin 額外的讀取權限，
  // 所以不管是不是 admin，這裡查到的都只會是「自己真正有份」的專案，可以用來在前端一致地
  // 過濾掉 admin 因為管理用途的資料庫權限而多讀到、但畫面上不該顯示給自己看的任務/專案。
  const loadMyProjectIds = useCallback(async () => {
    const { data } = await sb.from("project_members").select("project_id").eq("user_id", profile.id);
    setMyProjectIds((data || []).map(r => r.project_id));
  }, [profile.id]);

  const loadCurrentProjectMembers = useCallback(async (pid) => {
    if (!pid) { setCurrentProjectMembers([]); return; }
    const { data } = await sb.from("project_members").select("user:profiles!project_members_user_id_fkey(id,display_name)").eq("project_id", pid);
    setCurrentProjectMembers((data || []).map(r => r.user));
  }, []);

  useEffect(() => { openProjectIdRef.current = openProjectId; loadCurrentProjectMembers(openProjectId); }, [openProjectId, loadCurrentProjectMembers]);

  useEffect(() => { loadMissions(); loadNotifs(); loadHiddenIds(); loadStarredIds(); loadFriendProfiles(); loadProjects(); loadMyProjectIds(); }, [loadMissions, loadNotifs, loadHiddenIds, loadStarredIds, loadFriendProfiles, loadProjects, loadMyProjectIds]);

  async function hideMission(missionId) {
    setHiddenIds(ids => ids.includes(missionId) ? ids : [...ids, missionId]);
    const { error } = await sb.from("mission_hides").insert({ user_id: profile.id, mission_id: missionId });
    if (error) loadHiddenIds();
  }
  async function unhideMission(missionId) {
    setHiddenIds(ids => ids.filter(id => id !== missionId));
    const { error } = await sb.from("mission_hides").delete().eq("user_id", profile.id).eq("mission_id", missionId);
    if (error) loadHiddenIds();
  }

  async function starMission(missionId) {
    setStarredIds(ids => ids.includes(missionId) ? ids : [...ids, missionId]);
    const { error } = await sb.from("mission_stars").insert({ user_id: profile.id, mission_id: missionId });
    if (error) loadStarredIds();
  }
  async function unstarMission(missionId) {
    setStarredIds(ids => ids.filter(id => id !== missionId));
    const { error } = await sb.from("mission_stars").delete().eq("user_id", profile.id).eq("mission_id", missionId);
    if (error) loadStarredIds();
  }

  async function deleteMission(missionId) {
    const { error } = await sb.from("missions").delete().eq("id", missionId);
    if (!error) loadMissions();
  }

  async function deleteProject() {
    setProjectDeleteErr(null);
    setShowDeleteProjectConfirm(false);
    const { error } = await sb.rpc("delete_project_release_missions", { p_project_id: openProjectId });
    if (!error) {
      setOpenProjectId(null);
      loadProjects();
      loadMissions();
    } else {
      setProjectDeleteErr(error.message);
    }
  }

  // Realtime：missions / mission_updates / friendships / mission_hides / projects / project_members
  // 任何一張表有變動，就重新抓一次對應資料。RLS 政策會自動幫每個使用者過濾掉他原本就看不到的變動。
  useEffect(() => {
    if (!sb) return;
    const channel = sb.channel("dashboard-realtime")
      .on("postgres_changes", { event: "*", schema: "public", table: "missions" }, () => loadMissions())
      .on("postgres_changes", { event: "*", schema: "public", table: "mission_updates" }, () => loadMissions())
      .on("postgres_changes", { event: "*", schema: "public", table: "friendships" }, () => { loadMissions(); loadFriendProfiles(); })
      .on("postgres_changes", { event: "*", schema: "public", table: "mission_hides" }, () => loadHiddenIds())
      .on("postgres_changes", { event: "*", schema: "public", table: "mission_stars" }, () => loadStarredIds())
      .on("postgres_changes", { event: "*", schema: "public", table: "projects" }, () => loadProjects())
      .on("postgres_changes", { event: "*", schema: "public", table: "project_members" }, () => { loadProjects(); loadCurrentProjectMembers(openProjectIdRef.current); loadMyProjectIds(); })
      .on("postgres_changes", { event: "*", schema: "public", table: "notifications", filter: `user_id=eq.${profile.id}` }, () => loadNotifs())
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "profiles", filter: `id=eq.${profile.id}` }, (payload) => {
        // 自己的 profiles 資料列在別的裝置被改動時（例如顯示欄位/區塊設定），同步更新這台裝置的畫面
        const updated = payload.new;
        setProfile(p => ({ ...p, ...updated }));
        if (updated.visible_columns) setVisibleColumns({ ...DEFAULT_VISIBLE_COLUMNS, ...updated.visible_columns });
        if (updated.visible_columns_closed) setVisibleColumnsClosed({ ...DEFAULT_VISIBLE_COLUMNS_CLOSED, ...updated.visible_columns_closed });
        if (updated.visible_sections) setVisibleSections({ ...DEFAULT_VISIBLE_SECTIONS, ...updated.visible_sections });
      })
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [loadMissions, loadHiddenIds, loadStarredIds, loadFriendProfiles, loadProjects, loadCurrentProjectMembers, loadMyProjectIds, loadNotifs, profile.id, setProfile]);

  const markNotifsRead = useCallback(async () => {
    await sb.from("notifications").update({ is_read: true }).eq("user_id", profile.id).eq("is_read", false);
    setNotifs([]);
  }, [profile.id]);

  // 點通知面板「外面」才關閉並標記已讀；面板打開期間內容會持續顯示，不會一點開就消失
  useEffect(() => {
    if (!notifOpen) return;
    function handleOutside(e) {
      if (notifRef.current && !notifRef.current.contains(e.target)) {
        setNotifOpen(false);
        markNotifsRead();
      }
    }
    document.addEventListener("mousedown", handleOutside);
    return () => document.removeEventListener("mousedown", handleOutside);
  }, [notifOpen, markNotifsRead]);

function App() {
  const [session, setSession] = useState(undefined); // undefined = loading
  const [profile, setProfile] = useState(null);
  const [recoveryMode, setRecoveryMode] = useState(false);

  useEffect(() => {
    if (!sb) { setSession(null); return; }
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((event, sess) => {
      setSession(sess);
      if (event === "PASSWORD_RECOVERY") setRecoveryMode(true);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setProfile(null); return; }
    let cancelled = false;
    async function fetchProfile(retries) {
      const { data } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
      if (cancelled) return;
      if (data) setProfile(data);
      else if (retries > 0) setTimeout(() => fetchProfile(retries - 1), 500);
    }
    fetchProfile(4);
    return () => { cancelled = true; };
  }, [session]);

  if (recoveryMode) return <ResetPasswordScreen onDone={() => setRecoveryMode(false)} />;
  if (session === undefined) return <div className="min-h-screen flex items-center justify-center text-slate-400 text-sm">載入中…</div>;
  if (!session) return <AuthScreen />;
  if (!profile) return <div className="min-h-screen flex items-center justify-center text-slate-400 text-sm">建立會員資料中…</div>;
  return <Dashboard session={session} profile={profile} setProfile={setProfile} />;
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("渲染錯誤：", error, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ maxWidth: 640, margin: "60px auto", padding: 24, border: "1px solid #fecaca", background: "#fff1f2", borderRadius: 12, fontFamily: "sans-serif", color: "#7f1d1d" }}>
          <h2 style={{ margin: "0 0 8px", fontSize: 18 }}>畫面渲染時發生錯誤</h2>
          <p style={{ fontSize: 14, margin: "0 0 8px" }}>錯誤訊息：{this.state.error.message}</p>
          <p style={{ fontSize: 12, color: "#9f1239" }}>請打開瀏覽器開發者工具（F12）的 Console 分頁查看詳細內容。</p>
        </div>
      );
    }
    return this.props.children;
  }
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
} catch (e) {
  document.getElementById("root").innerHTML =
    '<div style="max-width:640px;margin:60px auto;padding:24px;border:1px solid #fecaca;background:#fff1f2;border-radius:12px;font-family:sans-serif;color:#7f1d1d;">' +
    '<h2 style="margin:0 0 8px;font-size:18px;">初始化時發生錯誤</h2>' +
    '<p style="font-size:14px;">' + e.message + '</p></div>';
}

<script>

  // 避免自動掃描 type="text/babel" 時，較新版 babel-standalone 預設改用 "automatic" runtime
  // 而產生 `import ... from "react/jsx-runtime"`，在一般 <script> 環境中無法執行的問題。
  (function () {
    try {
      var source = document.getElementById("app-source").textContent;
      var output = Babel.transform(source, {
        presets: [["react", { runtime: "classic" }]],
      }).code;
      var s = document.createElement("script");
      s.text = output;
      document.body.appendChild(s);
    } catch (e) {
      document.getElementById("root").innerHTML =
        '<div style="max-width:640px;margin:60px auto;padding:24px;border:1px solid #fecaca;background:#fff1f2;border-radius:12px;font-family:sans-serif;color:#7f1d1d;">' +
        '<h2 style="margin:0 0 8px;font-size:18px;">程式碼轉譯時發生錯誤</h2>' +
        '<p style="font-size:14px;">' + e.message + '</p></div>';
    }
  })();
</script>
