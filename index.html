<script>
  // 全域錯誤攔截：只要有任何 JS 錯誤（含 CDN 載入失敗），就把錯誤內容直接顯示在畫面上，
  // 避免「整個畫面空白、卻不知道發生什麼事」的情況。
  window.addEventListener("error", function (e) {
    var root = document.getElementById("root");
    if (!root) return;
    var msg = (e && e.message) ? e.message : "未知錯誤";
    var src = (e && e.filename) ? e.filename : "";
    root.innerHTML =
      '<div style="max-width:640px;margin:60px auto;padding:24px;border:1px solid #fecaca;' +
      'background:#fff1f2;border-radius:12px;font-family:sans-serif;color:#7f1d1d;">' +
      '<h2 style="margin:0 0 8px;font-size:18px;">頁面發生錯誤，無法正常顯示</h2>' +
      '<p style="font-size:14px;margin:0 0 8px;">錯誤訊息：' + msg + '</p>' +
      (src ? '<p style="font-size:12px;color:#9f1239;word-break:break-all;">來源：' + src + '</p>' : '') +
      '<p style="font-size:12px;color:#9f1239;">請打開瀏覽器開發者工具（F12 或 右鍵→檢查）的 Console 分頁，把紅字錯誤訊息複製給開發者。</p>' +
      '</div>';
  });
</script>

}
const TYPE_LABEL = { private_mission: "私人任務", shared_mission: "分享任務" };
const PERM_LABEL = { read_only: "唯讀", editable: "可編輯" };
const PRIORITY_LEVELS = ["P1", "P2", "P3", "P4"];
const DEFAULT_PRIORITY_LABELS = { P1: "P1", P2: "P2", P3: "P3", P4: "P4" };
function priorityLabel(labels, p) {
  return (labels && labels[p]) || DEFAULT_PRIORITY_LABELS[p] || p;
}

const SCALE_LEVELS = [1, 2, 3, 4, 5]; // 對應 S1~S5
const DEFAULT_SCALE_LABELS = { S1: "S1", S2: "S2", S3: "S3", S4: "S4", S5: "S5" };
function scaleLabel(labels, n) {
  const key = "S" + n;
  return (labels && labels[key]) || DEFAULT_SCALE_LABELS[key] || key;
}

// 緊急程度分數：依剩餘天數 x 與規模 s 計算（規格見 urgency-score-spec.md）
function urgencyScore(x, s) {
  if (x <= 0) return 2;
  if (x >= s) return s / x;
  return (-1 / s) * x + 2;
}
function remainingDays(dueDate) {
  if (!dueDate) return null;
  return (new Date(dueDate).getTime() - Date.now()) / 86400000;
}

const PRIORITY_SCORE_MAP = { P1: 1, P2: 2, P3: 3, P4: 4 };
const DEFAULT_PRIORITY_WEIGHTS = { w1: 1, w2: 1 };
function priorityImportanceScore(p) { return PRIORITY_SCORE_MAP[p] || 2; }
function overallPriorityScore(m, weights) {
  const w1 = (weights && Number(weights.w1)) || 0;
  const w2 = (weights && Number(weights.w2)) || 0;
  const importance = priorityImportanceScore(m.priority);
  const rd = remainingDays(m.due_date);
  const urgency = rd === null ? 0 : urgencyScore(rd, m.scale || 1);
  return importance * w1 + urgency * w2;
}

function fmt(dt) {
  if (!dt) return "—";
  const d = new Date(dt);
  return d.toLocaleString("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}
function fmtDate(dt) {
  if (!dt) return "—";
  const d = new Date(dt);
  return d.toLocaleDateString("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit" });
}

function sortMissions(list, mode, weights) {
  const arr = [...list];
  if (mode === "due_asc") {
    arr.sort((a, b) => {
      if (!a.due_date && !b.due_date) return 0;
      if (!a.due_date) return 1;
      if (!b.due_date) return -1;
      return new Date(a.due_date) - new Date(b.due_date);
    });
  } else if (mode === "priority_desc") {
    arr.sort((a, b) => overallPriorityScore(b, weights) - overallPriorityScore(a, weights));
  } else if (mode === "scale_asc") {
    arr.sort((a, b) => (a.scale || 1) - (b.scale || 1) || overallPriorityScore(b, weights) - overallPriorityScore(a, weights));
  } else if (mode === "scale_desc") {
    arr.sort((a, b) => (b.scale || 1) - (a.scale || 1) || overallPriorityScore(b, weights) - overallPriorityScore(a, weights));
  } else {
    arr.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  }
  return arr;
}

// =====================================================================
// 登入 / 註冊畫面
// =====================================================================
function AuthScreen() {
  const [mode, setMode] = useState("login"); // login | register | forgot
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setMsg(null);
    setBusy(true);
    try {
      if (mode === "login") {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else if (mode === "register") {
        const { error } = await sb.auth.signUp({
          email, password,
          options: { emailRedirectTo: window.location.href.split("#")[0] },
        });
        if (error) throw error;
        setMsg({ type: "ok", text: "註冊成功！若專案有開啟信箱驗證，請收信確認後再登入。" });
      } else if (mode === "forgot") {
        const { error } = await sb.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.href.split("#")[0],
        });
        if (error) throw error;
        setMsg({ type: "ok", text: "已寄出重設密碼信，請至信箱點擊連結繼續。" });
      }
    } catch (err) {
      setMsg({ type: "err", text: err.message || "發生錯誤" });
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="min-h-screen flex items-center justify-center px-4">
      <div className="w-full max-w-sm bg-white rounded-2xl shadow-lg p-8">
        <h1 className="text-2xl font-bold text-slate-800 mb-1">任務雲 TaskCloud</h1>
        <p className="text-sm text-slate-500 mb-6">多人共享任務管理系統（測試前端）</p>
        {mode !== "forgot" && (
          <div className="flex mb-6 rounded-lg bg-slate-100 p-1 text-sm font-medium">
            <button onClick={() => { setMode("login"); setMsg(null); }} className={"flex-1 py-1.5 rounded-md " + (mode === "login" ? "bg-white shadow text-slate-900" : "text-slate-500")}>登入</button>
            <button onClick={() => { setMode("register"); setMsg(null); }} className={"flex-1 py-1.5 rounded-md " + (mode === "register" ? "bg-white shadow text-slate-900" : "text-slate-500")}>註冊</button>
          </div>
        )}
        {mode === "forgot" && (
          <div className="mb-4">
            <h2 className="text-sm font-semibold text-slate-700">重設密碼</h2>
            <p className="text-xs text-slate-500 mt-1">輸入註冊時使用的 email，我們會寄一封重設密碼信給你。</p>
          </div>
        )}
        <form onSubmit={submit} className="space-y-3">
          <div>
            <label className="text-xs text-slate-500">Email</label>
            <input required type="email" value={email} onChange={e => setEmail(e.target.value)}
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
          </div>
          {mode !== "forgot" && (
            <div>
              <label className="text-xs text-slate-500">密碼</label>
              <input required type="password" minLength={6} value={password} onChange={e => setPassword(e.target.value)}
                className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
            </div>
          )}
          {mode === "login" && (
            <button type="button" onClick={() => { setMode("forgot"); setMsg(null); }} className="text-xs text-blue-600 underline">忘記密碼？</button>
          )}
          {msg && (
            <div className={"text-xs rounded-lg px-3 py-2 " + (msg.type === "err" ? "bg-rose-50 text-rose-600" : "bg-emerald-50 text-emerald-700")}>{msg.text}</div>
          )}
          <button disabled={busy} className="w-full bg-slate-900 text-white rounded-lg py-2.5 text-sm font-medium disabled:opacity-50">
            {busy ? "處理中…" : (mode === "login" ? "登入" : mode === "register" ? "註冊" : "傳送重設密碼信")}
          </button>
          {mode === "forgot" && (
            <button type="button" onClick={() => { setMode("login"); setMsg(null); }} className="w-full text-xs text-slate-500 underline">返回登入</button>
          )}
        </form>
        {!sb && (
          <p className="mt-4 text-xs text-rose-500">尚未設定 SUPABASE_URL / SUPABASE_ANON_KEY，請先在檔案最上方填入你的 Supabase 專案資訊。</p>
        )}
      </div>
    </div>
  );
}

// 重設密碼（從 email 連結點回來後顯示）

function ResetPasswordScreen({ onDone }) {
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [done, setDone] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setMsg(null);
    if (newPassword.length < 6) { setMsg({ type: "err", text: "新密碼至少需要 6 個字元" }); return; }
    if (newPassword !== confirmPassword) { setMsg({ type: "err", text: "兩次輸入的新密碼不一致" }); return; }
    setBusy(true);
    try {
      const { error } = await sb.auth.updateUser({ password: newPassword });
      if (error) throw error;
      await sb.auth.signOut();
      setDone(true);
    } catch (err) {
      setMsg({ type: "err", text: err.message || "更新密碼時發生錯誤" });
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="min-h-screen flex items-center justify-center px-4">
      <div className="w-full max-w-sm bg-white rounded-2xl shadow-lg p-8">
        <h1 className="text-xl font-bold text-slate-800 mb-1">設定新密碼</h1>
        {done ? (
          <div>
            <p className="text-sm text-emerald-700 bg-emerald-50 rounded-lg px-3 py-2 mt-4">密碼已更新成功，請用新密碼重新登入。</p>
            <button onClick={onDone} className="w-full mt-4 bg-slate-900 text-white rounded-lg py-2.5 text-sm font-medium">前往登入</button>
          </div>
        ) : (
          <form onSubmit={submit} className="space-y-3 mt-4">
            <div>
              <label className="text-xs text-slate-500">新密碼（至少 6 個字元）</label>
              <input required type="password" minLength={6} value={newPassword} onChange={e => setNewPassword(e.target.value)}
                className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
            </div>
            <div>
              <label className="text-xs text-slate-500">確認新密碼</label>
              <input required type="password" minLength={6} value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)}
                className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
            </div>
            {msg && <div className={"text-xs rounded-lg px-3 py-2 " + (msg.type === "err" ? "bg-rose-50 text-rose-600" : "bg-emerald-50 text-emerald-700")}>{msg.text}</div>}
            <button disabled={busy} className="w-full bg-slate-900 text-white rounded-lg py-2.5 text-sm font-medium disabled:opacity-50">{busy ? "更新中…" : "更新密碼"}</button>
          </form>
        )}
      </div>
    </div>
  );
}

function MissionDetailModal({ missionId, currentUser, priorityLabels, scaleLabels, onClose, onChanged }) {
  const [mission, setMission] = useState(null);
  const [updates, setUpdates] = useState([]);
  const [replyText, setReplyText] = useState("");
  const [finalComment, setFinalComment] = useState("");
  const [pendingStatus, setPendingStatus] = useState(null); // 'completed' | 'abandoned'
  const [editingBody, setEditingBody] = useState(false);
  const [editTitle, setEditTitle] = useState("");
  const [editContent, setEditContent] = useState("");
  const [editDue, setEditDue] = useState("");
  const [editPriority, setEditPriority] = useState("P2");
  const [editScale, setEditScale] = useState(1);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  const load = useCallback(async () => {
    const { data: m } = await sb.from("missions")
      .select("*, creator:profiles!missions_creator_id_fkey(id,display_name,email)")
      .eq("id", missionId).single();
    setMission(m);
    if (m) {
      setEditTitle(m.title); setEditContent(m.content);
      setEditDue(m.due_date ? m.due_date.slice(0, 16) : "");
      setEditPriority(m.priority || "P2");
      setEditScale(m.scale || 1);
    }
    const { data: u } = await sb.from("mission_updates")
      .select("*, author:profiles!mission_updates_author_id_fkey(id,display_name)")
      .eq("mission_id", missionId).order("created_at", { ascending: true });
    setUpdates(u || []);
  }, [missionId]);

  useEffect(() => { load(); }, [load]);

  if (!mission) return null;

  const isCreator = mission.creator_id === currentUser.id;
  const canReply = mission.status !== "completed" && mission.status !== "abandoned" &&
    (isCreator || (mission.mission_type === "shared_mission" && mission.shared_permission === "editable"));

  async function submitReply(e) {
    e.preventDefault();
    setBusy(true); setErr(null);
    try {
      const { error } = await sb.from("mission_updates").insert({
        mission_id: missionId, author_id: currentUser.id, content: replyText,
      });
      if (error) throw error;
      setReplyText("");
      await load();
      onChanged();
    } catch (e2) { setErr(e2.message); } finally { setBusy(false); }
  }

  async function saveBodyEdit() {
    setBusy(true); setErr(null);
    try {
      const { error } = await sb.from("missions").update({
        title: editTitle, content: editContent, priority: editPriority, scale: editScale,
        due_date: editDue ? new Date(editDue).toISOString() : null,
      }).eq("id", missionId);
      if (error) throw error;
      setEditingBody(false);
      await load();
      onChanged();
    } catch (e2) { setErr(e2.message); } finally { setBusy(false); }
  }

  async function confirmStatusChange() {
    if (!finalComment.trim()) { setErr("切換狀態前必須填寫最終評論"); return; }
    setBusy(true); setErr(null);
    try {
      const { error } = await sb.from("missions").update({
        status: pendingStatus, final_comment: finalComment,
      }).eq("id", missionId);
      if (error) throw error;
      setPendingStatus(null); setFinalComment("");
      await load();
      onChanged();
    } catch (e2) { setErr(e2.message); } finally { setBusy(false); }
  }

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[85vh] overflow-y-auto p-6">
        <div className="flex justify-between items-start mb-4">
          <div>
            <span className={"inline-block text-xs px-2 py-0.5 rounded-full font-medium " + STATUS_COLOR[mission.status]}>{STATUS_LABEL[mission.status]}</span>
            <span className="ml-2 text-xs text-slate-400">{TYPE_LABEL[mission.mission_type]}{mission.mission_type === "shared_mission" ? `（好友：${PERM_LABEL[mission.shared_permission]}）` : ""}</span>
          </div>
          <button onClick={onClose}><Icon.Close className="w-5 h-5 text-slate-400"/></button>
        </div>

        {!editingBody ? (
          <div>
            <h2 className="text-xl font-bold mb-2">{mission.title}</h2>
            <p className="whitespace-pre-wrap text-sm text-slate-700 mb-3">{mission.content}</p>
            <div className="grid grid-cols-2 gap-2 text-xs text-slate-500 mb-3">
              <div>建立成員：{mission.creator?.display_name}</div>
              <div>建立時間：{fmt(mission.created_at)}</div>
              <div>最後更新：{fmt(mission.updated_at)}</div>
              <div>截止時間：{fmt(mission.due_date)}</div>
              <div>重要性：{priorityLabel(priorityLabels, mission.priority)}</div>
              <div>任務規模：{scaleLabel(scaleLabels, mission.scale)}</div>
              <div>緊急度：{(() => { const rd = remainingDays(mission.due_date); return rd === null ? "—" : urgencyScore(rd, mission.scale || 1).toFixed(2); })()}</div>
            </div>
            {isCreator && mission.status !== "completed" && mission.status !== "abandoned" && (
              <button onClick={() => setEditingBody(true)} className="text-xs text-blue-600 underline mb-2">編輯本文</button>
            )}
          </div>
        ) : (
          <div className="space-y-2 mb-3">
            <input value={editTitle} onChange={e => setEditTitle(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold" />
            <textarea rows={4} value={editContent} onChange={e => setEditContent(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
            <div>
              <label className="text-xs text-slate-500">重要性</label>
              <div className="flex gap-2 mt-1">
                {PRIORITY_LEVELS.map(p => (
                  <button key={p} type="button" onClick={() => setEditPriority(p)}
                    className={"flex-1 py-2 rounded-lg text-sm font-medium " + (editPriority === p ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>
                    {priorityLabel(priorityLabels, p)}
                  </button>
                ))}
              </div>
            </div>
            <div>
              <label className="text-xs text-slate-500">任務規模</label>
              <div className="flex gap-2 mt-1">
                {SCALE_LEVELS.map(n => (
                  <button key={n} type="button" onClick={() => setEditScale(n)}
                    className={"flex-1 py-2 rounded-lg text-sm font-medium " + (editScale === n ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>
                    {scaleLabel(scaleLabels, n)}
                  </button>
                ))}
              </div>
            </div>
            <input type="datetime-local" value={editDue} onChange={e => setEditDue(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
            <div className="flex gap-2">
              <button onClick={saveBodyEdit} disabled={busy} className="bg-slate-900 text-white text-xs rounded-lg px-3 py-1.5">儲存</button>
              <button onClick={() => setEditingBody(false)} className="text-xs text-slate-500 px-3 py-1.5">取消</button>
            </div>
          </div>
        )}

        {mission.final_comment && (
          <div className="bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 text-sm text-amber-800 mb-4">
            <strong>最終評論：</strong>{mission.final_comment}
          </div>
        )}

        <div className="border-t border-slate-200 pt-3 mt-3">
          <h3 className="text-sm font-semibold text-slate-600 mb-2">更新紀錄</h3>
          <div className="space-y-2 max-h-56 overflow-y-auto pr-1">
            {updates.length === 0 && <p className="text-xs text-slate-400">尚無更新紀錄</p>}
            {updates.map(u => (
              <div key={u.id} className="bg-slate-50 rounded-lg px-3 py-2">
                <div className="flex justify-between text-xs text-slate-400 mb-1">
                  <span>{u.author?.display_name}</span>
                  <span>{fmt(u.created_at)}</span>
                </div>
                <p className="text-sm whitespace-pre-wrap">{u.content}</p>
              </div>
            ))}
          </div>
        </div>

        {err && <div className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2 mt-3">{err}</div>}

        {canReply && (
          <form onSubmit={submitReply} className="mt-4 border-t border-slate-200 pt-3">
            <label className="text-xs text-slate-500">更新任務</label>
            <textarea required rows={2} value={replyText} onChange={e => setReplyText(e.target.value)}
              placeholder="輸入更新內容…" className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
            <button disabled={busy} className="mt-2 bg-blue-600 text-white text-xs rounded-lg px-4 py-2 disabled:opacity-50">送出更新</button>
          </form>

        {!canReply && mission.status !== "completed" && mission.status !== "abandoned" && (
          <p className="mt-4 text-xs text-slate-400">你對此任務為唯讀權限，僅能檢視。</p>
        )}

        {isCreator && (mission.status === "added" || mission.status === "in_progress") && (
          <div className="mt-4 border-t border-slate-200 pt-3">
            {!pendingStatus ? (
              <div className="flex gap-2">
                <button onClick={() => setPendingStatus("completed")} className="text-xs bg-emerald-600 text-white rounded-lg px-3 py-1.5">標記為已完成</button>
                <button onClick={() => setPendingStatus("abandoned")} className="text-xs bg-rose-600 text-white rounded-lg px-3 py-1.5">標記為已棄置</button>
              </div>
            ) : (
              <div className="space-y-2">
                <label className="text-xs text-slate-500">切換為「{STATUS_LABEL[pendingStatus]}」前，請填寫最終評論</label>

                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
                <div className="flex gap-2">
                  <button onClick={confirmStatusChange} disabled={busy} className="text-xs bg-slate-900 text-white rounded-lg px-3 py-1.5">確認切換</button>
                  <button onClick={() => { setPendingStatus(null); setFinalComment(""); }} className="text-xs text-slate-500 px-3 py-1.5">取消</button>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// =====================================================================
// 甘特圖模式
// =====================================================================
function GanttView({ missions, onOpen }) {
  const [pxPerDay, setPxPerDay] = useState(36);
  const [viewStart, setViewStart] = useState(() => { const d = new Date(); d.setDate(d.getDate() - 3); d.setHours(0,0,0,0); return d; });
  const totalDays = 30;
  const viewEnd = useMemo(() => { const d = new Date(viewStart); d.setDate(d.getDate() + totalDays); return d; }, [viewStart]);

  function shift(days) {
    setViewStart(d => { const nd = new Date(d); nd.setDate(nd.getDate() + days); return nd; });
  }

  const days = useMemo(() => {
    const arr = [];
    for (let i = 0; i < totalDays; i++) { const d = new Date(viewStart); d.setDate(d.getDate() + i); arr.push(d); }
    return arr;
  }, [viewStart]);

  function dayDiff(a, b) { return (b - a) / 86400000; }

  const rows = missions.map(m => {
    const start = new Date(m.created_at);
    const end = m.due_date ? new Date(m.due_date) : new Date(start.getTime() + 86400000);
    const clampedStart = start < viewStart ? viewStart : start;
    const clampedEnd = end > viewEnd ? viewEnd : end;
    const visible = clampedEnd >= viewStart && clampedStart <= viewEnd;
    const left = Math.max(0, dayDiff(viewStart, clampedStart)) * pxPerDay;
    const width = Math.max(dayDiff(clampedStart, clampedEnd) * pxPerDay, 6);
    return { m, visible, left, width };
  });

  return (
    <div className="bg-white rounded-2xl shadow p-4">
      <div className="flex items-center justify-between mb-3 gap-2 flex-wrap">
        <div className="flex gap-2">
          <button onClick={() => shift(-7)} className="text-xs px-2 py-1 rounded-lg bg-slate-100">← 上一週</button>
          <button onClick={() => shift(7)} className="text-xs px-2 py-1 rounded-lg bg-slate-100">下一週 →</button>
          <button onClick={() => { const d = new Date(); d.setDate(d.getDate() - 3); setViewStart(d); }} className="text-xs px-2 py-1 rounded-lg bg-slate-100">回到今天</button>
        </div>
        <div className="flex gap-2 items-center">
          <span className="text-xs text-slate-400">縮放</span>
          <button onClick={() => setPxPerDay(p => Math.max(16, p - 8))} className="text-xs w-7 h-7 rounded-lg bg-slate-100">－</button>
          <button onClick={() => setPxPerDay(p => Math.min(80, p + 8))} className="text-xs w-7 h-7 rounded-lg bg-slate-100">＋</button>
        </div>
      </div>
      <div className="overflow-x-auto">
        <div style={{ width: totalDays * pxPerDay + 180 }}>
          <div className="flex sticky top-0 bg-white z-10" style={{ paddingLeft: 180 }}>
            {days.map((d, i) => (
              <div key={i} style={{ width: pxPerDay }} className={"text-[10px] text-center border-l border-slate-100 py-1 " + (d.toDateString() === new Date().toDateString() ? "bg-blue-50 font-bold text-blue-600" : "text-slate-400")}>
                {d.getMonth()+1}/{d.getDate()}
              </div>
            ))}
          </div>
          {rows.map(({ m, visible, left, width }) => (
            <div key={m.id} className="flex items-center border-t border-slate-100" style={{ height: 40 }}>
              <div style={{ width: 180 }} className="pr-2 text-xs truncate font-medium" title={m.title}>{m.title}</div>
              <div className="relative flex-1" style={{ height: "100%" }}>
                {visible && (
                  <div onClick={() => onOpen(m.id)} title={`${m.title}（${STATUS_LABEL[m.status]}）`}
                    className="absolute top-2 h-6 rounded-md cursor-pointer flex items-center px-2 text-[10px] text-white truncate shadow-sm"
                    style={{ left, width, background: STATUS_BAR_COLOR[m.status] }}>
                    {m.title}
                  </div>
                )}
              </div>
            </div>
          ))}
          {rows.length === 0 && <p className="text-center text-slate-400 text-sm py-8">目前沒有符合條件的任務</p>}
        </div>
      </div>
      <p className="text-[11px] text-slate-400 mt-2">＊長條左端＝任務建立時間，右端＝截止時間（若無截止時間則顯示為一天的短區塊）。</p>
    </div>
  );
}

// =====================================================================
// 緊急程度分數曲線（互動預覽，邏輯對應 urgency-score-spec.md）
// =====================================================================
function UrgencyCurveChart({ scaleLabels }) {
  const [s, setS] = useState(1);
  const [hover, setHover] = useState(null); // { x, y, cx, cy }

  const W = 720, H = 400;
  const padL = 44, padR = 20, padT = 20, padB = 40;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const xMin = -1, xMax = 10, yMin = -1, yMax = 5;
  const sx = x => padL + (x - xMin) / (xMax - xMin) * plotW;
  const sy = y => padT + (yMax - y) / (yMax - yMin) * plotH;

  const gridXs = [];
  for (let gx = Math.ceil(xMin); gx <= xMax; gx++) gridXs.push(gx);
  const gridYs = [];
  for (let gy = Math.ceil(yMin); gy <= yMax; gy++) gridYs.push(gy);

  let d = "";
  const steps = Math.round((xMax - xMin) / 0.1);
  for (let i = 0; i <= steps; i++) {
    const x = +(xMin + i * 0.1).toFixed(1);
    let y = urgencyScore(x, s);
    if (y > yMax) y = yMax;
    if (y < yMin) y = yMin;
    d += (i === 0 ? "M " : "L ") + sx(x) + " " + sy(y) + " ";
  }

  const markers = [];
  for (let x = 0; x <= xMax + 1e-9; x += 0.5) {
    const xr = +x.toFixed(1);
    const y = urgencyScore(xr, s);
    const yDisp = Math.min(Math.max(y, yMin), yMax);
    markers.push({ x: xr, y, cx: sx(xr), cy: sy(yDisp) });
  }

  return (
    <div>
      <div className="flex items-center gap-2 mb-3 flex-wrap">
        <span className="text-xs text-slate-500">預覽規模：</span>
        {SCALE_LEVELS.map(n => (
          <button key={n} onClick={() => setS(n)}
            className={"text-xs px-3 py-1.5 rounded-lg " + (s === n ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>
            {scaleLabel(scaleLabels, n)}
          </button>
        ))}
      </div>
      <div className="relative">
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto rounded-xl" style={{ background: "#0f1720" }}>
          {gridXs.map(gx => (
            <line key={"gx" + gx} x1={sx(gx)} y1={sy(yMin)} x2={sx(gx)} y2={sy(yMax)} stroke="#27394a" strokeWidth="1" />
          ))}
          {gridYs.map(gy => (
            <line key={"gy" + gy} x1={sx(xMin)} y1={sy(gy)} x2={sx(xMax)} y2={sy(gy)} stroke="#27394a" strokeWidth="1" />
          ))}
          <line x1={sx(0)} y1={sy(yMin)} x2={sx(0)} y2={sy(yMax)} stroke="#5c7488" strokeWidth="2.5" />
          <line x1={sx(xMin)} y1={sy(0)} x2={sx(xMax)} y2={sy(0)} stroke="#5c7488" strokeWidth="2.5" />
          {gridXs.map(gx => (
            <text key={"tx" + gx} x={sx(gx)} y={sy(0) + 18} textAnchor="middle" fontSize="11" fill="#93a4b3">{gx}</text>
          ))}
          {gridYs.filter(gy => gy !== 0).map(gy => (
            <text key={"ty" + gy} x={sx(0) - 10} y={sy(gy) + 4} textAnchor="end" fontSize="11" fill="#93a4b3">{gy}</text>
          ))}
          <text x={sx(xMax) - 4} y={sy(0) - 12} textAnchor="end" fontSize="13" fontWeight="700" fill="#e8eef3">剩餘時間(天)</text>
          <text x={sx(0) + 10} y={sy(yMax) + 16} textAnchor="start" fontSize="13" fontWeight="700" fill="#e8eef3">緊急程度分數</text>
          <path d={d} fill="none" stroke="#4fd1c5" strokeWidth="3" strokeLinejoin="round" strokeLinecap="round" />
          {markers.map((m, i) => (
            <circle key={i} cx={m.cx} cy={m.cy} r={hover && hover.x === m.x ? 6 : 4.5}
              fill={hover && hover.x === m.x ? "#f2a541" : "#16212c"} stroke="#f2a541" strokeWidth="2"
              style={{ cursor: "pointer" }}
              onMouseEnter={() => setHover(m)} onMouseLeave={() => setHover(null)} />
          ))}
        </svg>
        {hover && (
          <div className="absolute bg-slate-900 text-white text-xs px-3 py-2 rounded-lg shadow-lg pointer-events-none"
            style={{ left: (hover.cx / W) * 100 + "%", top: (hover.cy / H) * 100 + "%", transform: "translate(-50%, -120%)" }}>
            剩餘天數：{hover.x} 天，緊急分數：{hover.y.toFixed(2)}
          </div>
        )}
      </div>
      <p className="text-[11px] text-slate-400 mt-2">滑鼠移到圖上的橘色圓點可以看到該天數對應的精確分數。</p>
    </div>
  );
}

// =====================================================================
// 變更密碼
// =====================================================================
function ChangePasswordCard({ email }) {
  const [currentPassword, setCurrentPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);

  async function submit(e) {
    e.preventDefault();
    setMsg(null);

    if (newPassword.length < 6) {
      setMsg({ type: "err", text: "新密碼至少需要 6 個字元" });
      return;
    }
    if (newPassword !== confirmPassword) {
      setMsg({ type: "err", text: "兩次輸入的新密碼不一致" });
      return;
    }
    if (newPassword === currentPassword) {
      setMsg({ type: "err", text: "新密碼不能與目前密碼相同" });
      return;
    }

    setBusy(true);
    try {
      // 先用目前密碼重新驗證身分，確認操作者真的知道舊密碼
      const { error: signInErr } = await sb.auth.signInWithPassword({ email, password: currentPassword });
      if (signInErr) {
        setMsg({ type: "err", text: "目前密碼不正確" });
        return;
      }
      const { error: updateErr } = await sb.auth.updateUser({ password: newPassword });
      if (updateErr) throw updateErr;
      setMsg({ type: "ok", text: "密碼已更新成功" });
      setCurrentPassword(""); setNewPassword(""); setConfirmPassword("");
    } catch (err) {
      setMsg({ type: "err", text: err.message || "變更密碼時發生錯誤" });
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="bg-white rounded-2xl shadow p-5">
      <h3 className="font-bold mb-3">變更密碼</h3>
      <form onSubmit={submit} className="space-y-3 text-sm">
        <div>
          <label className="text-xs text-slate-500">目前密碼</label>
          <input required type="password" value={currentPassword} onChange={e => setCurrentPassword(e.target.value)}
            className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2" />
        </div>
        <div>
          <label className="text-xs text-slate-500">新密碼（至少 6 個字元）</label>
          <input required type="password" minLength={6} value={newPassword} onChange={e => setNewPassword(e.target.value)}
            className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2" />
        </div>
        <div>
          <label className="text-xs text-slate-500">確認新密碼</label>
          <input required type="password" minLength={6} value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)}
            className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2" />
        </div>
        {msg && <div className={"text-xs rounded-lg px-3 py-2 " + (msg.type === "err" ? "bg-rose-50 text-rose-600" : "bg-emerald-50 text-emerald-700")}>{msg.text}</div>}
        <button disabled={busy} className="bg-slate-900 text-white rounded-lg px-4 py-2 text-sm disabled:opacity-50">{busy ? "更新中…" : "更新密碼"}</button>
      </form>
    </div>
  );
}

function SettingsView({ profile, onProfileChange }) {
  const [displayName, setDisplayName] = useState(profile.display_name);
  const [isSearchable, setIsSearchable] = useState(profile.is_searchable);
  const [saving, setSaving] = useState(false);
  const [friends, setFriends] = useState([]);
  const [incoming, setIncoming] = useState([]);
  const [outgoing, setOutgoing] = useState([]);
  const [searchTerm, setSearchTerm] = useState("");
  const [searchResults, setSearchResults] = useState([]);
  const [msg, setMsg] = useState(null);
  const [priorityLabels, setPriorityLabels] = useState(profile.priority_labels || DEFAULT_PRIORITY_LABELS);
  const [editingLabels, setEditingLabels] = useState(false);
  const [labelDraft, setLabelDraft] = useState(profile.priority_labels || DEFAULT_PRIORITY_LABELS);
  const [savingLabels, setSavingLabels] = useState(false);

  function startEditLabels() { setLabelDraft(priorityLabels); setEditingLabels(true); }

  async function saveLabels() {
    setSavingLabels(true);
    const { error } = await sb.from("profiles").update({ priority_labels: labelDraft }).eq("id", profile.id);
    setSavingLabels(false);
    if (!error) {
      setPriorityLabels(labelDraft);
      onProfileChange({ ...profile, priority_labels: labelDraft });
      setEditingLabels(false);
    } else {
      setMsg({ type: "err", text: error.message });
    }
  }

  const [scaleLabels, setScaleLabels] = useState(profile.scale_labels || DEFAULT_SCALE_LABELS);
  const [editingScaleLabels, setEditingScaleLabels] = useState(false);
  const [scaleLabelDraft, setScaleLabelDraft] = useState(profile.scale_labels || DEFAULT_SCALE_LABELS);
  const [savingScaleLabels, setSavingScaleLabels] = useState(false);

  function startEditScaleLabels() { setScaleLabelDraft(scaleLabels); setEditingScaleLabels(true); }

  async function saveScaleLabels() {
    setSavingScaleLabels(true);
    const { error } = await sb.from("profiles").update({ scale_labels: scaleLabelDraft }).eq("id", profile.id);
    setSavingScaleLabels(false);
    if (!error) {
      setScaleLabels(scaleLabelDraft);
      onProfileChange({ ...profile, scale_labels: scaleLabelDraft });
      setEditingScaleLabels(false);
    } else {
      setMsg({ type: "err", text: error.message });
    }
  }

  const [weights, setWeights] = useState(profile.priority_weights || DEFAULT_PRIORITY_WEIGHTS);
  const [editingWeights, setEditingWeights] = useState(false);
  const [weightDraft, setWeightDraft] = useState({ w1: String((profile.priority_weights || DEFAULT_PRIORITY_WEIGHTS).w1), w2: String((profile.priority_weights || DEFAULT_PRIORITY_WEIGHTS).w2) });
  const [savingWeights, setSavingWeights] = useState(false);
  const [weightErr, setWeightErr] = useState(null);

  function startEditWeights() {
    setWeightDraft({ w1: String(weights.w1), w2: String(weights.w2) });
    setWeightErr(null);
    setEditingWeights(true);
  }

  function parseWeight(v) {
    const n = Number(v);
    if (v === "" || v === null || Number.isNaN(n) || !Number.isFinite(n) || n < 0) return null;
    return n;
  }

  async function saveWeights() {
    const w1 = parseWeight(weightDraft.w1);
    const w2 = parseWeight(weightDraft.w2);
    if (w1 === null || w2 === null) {
      setWeightErr("請輸入有效的數字（需為 0 以上的數字）");
      return;
    }
    setWeightErr(null);
    setSavingWeights(true);
    const newWeights = { w1, w2 };
    const { error } = await sb.from("profiles").update({ priority_weights: newWeights }).eq("id", profile.id);
    setSavingWeights(false);
    if (!error) {
      setWeights(newWeights);
      onProfileChange({ ...profile, priority_weights: newWeights });
      setEditingWeights(false);
    } else {
      setWeightErr(error.message);
    }
  }

  async function resetWeights() {
    setSavingWeights(true);
    const { error } = await sb.from("profiles").update({ priority_weights: DEFAULT_PRIORITY_WEIGHTS }).eq("id", profile.id);
    setSavingWeights(false);
    if (!error) {
      setWeights(DEFAULT_PRIORITY_WEIGHTS);
      onProfileChange({ ...profile, priority_weights: DEFAULT_PRIORITY_WEIGHTS });
      setEditingWeights(false);
      setWeightErr(null);
    } else {
      setWeightErr(error.message);
    }
  }

  const loadFriends = useCallback(async () => {
    const uid = profile.id;
    const [{ data: asReq }, { data: asAdr }, { data: inc }, { data: out }] = await Promise.all([
      sb.from("friendships").select("id, addressee:profiles!friendships_addressee_id_fkey(id,display_name,email)").eq("requester_id", uid).eq("status", "accepted"),
      sb.from("friendships").select("id, requester:profiles!friendships_requester_id_fkey(id,display_name,email)").eq("addressee_id", uid).eq("status", "accepted"),
      sb.from("friendships").select("id, requester:profiles!friendships_requester_id_fkey(id,display_name,email)").eq("addressee_id", uid).eq("status", "pending"),
      sb.from("friendships").select("id, addressee:profiles!friendships_addressee_id_fkey(id,display_name,email)").eq("requester_id", uid).eq("status", "pending"),
    ]);
    const f1 = (asReq || []).map(r => ({ friendshipId: r.id, friend: r.addressee }));
    const f2 = (asAdr || []).map(r => ({ friendshipId: r.id, friend: r.requester }));
    setFriends([...f1, ...f2]);
    setIncoming(inc || []);
    setOutgoing(out || []);
  }, [profile.id]);

  useEffect(() => { loadFriends(); }, [loadFriends]);

  async function saveProfile() {
    setSaving(true);
    const { error } = await sb.from("profiles").update({ display_name: displayName, is_searchable: isSearchable }).eq("id", profile.id);
    setSaving(false);
    if (!error) { onProfileChange({ ...profile, display_name: displayName, is_searchable: isSearchable }); setMsg({ type: "ok", text: "已儲存" }); }
    else setMsg({ type: "err", text: error.message });
  }

  async function doSearch() {
    if (!searchTerm.trim()) { setSearchResults([]); return; }
    const { data, error } = await sb.from("profiles").select("id,display_name,email")
      .eq("is_searchable", true).neq("id", profile.id)
      .or(`display_name.ilike.%${searchTerm}%,email.ilike.%${searchTerm}%`);
    if (!error) setSearchResults(data || []);
  }

  async function sendRequest(target) {
    const { data: existing } = await sb.from("friendships")
      .select("id,status")
      .or(`and(requester_id.eq.${profile.id},addressee_id.eq.${target.id}),and(requester_id.eq.${target.id},addressee_id.eq.${profile.id})`)
      .maybeSingle();

    let error;
    if (existing) {
      if (existing.status === "accepted") { setMsg({ type: "err", text: "你們已經是好友了" }); return; }
      if (existing.status === "pending") { setMsg({ type: "err", text: "已經有邀請在等待對方確認" }); return; }
      // 之前被拒絕過：把同一筆紀錄改回 pending 重新邀請，避免違反唯一組合限制
      const { error: updErr } = await sb.from("friendships").update({
        requester_id: profile.id, addressee_id: target.id, status: "pending", updated_at: new Date().toISOString(),
      }).eq("id", existing.id);
      error = updErr;
    } else {
      const { error: insErr } = await sb.from("friendships").insert({ requester_id: profile.id, addressee_id: target.id });
      error = insErr;
    }
    setMsg(error ? { type: "err", text: error.message } : { type: "ok", text: `已送出好友邀請給 ${target.display_name}` });
    if (!error) loadFriends();
  }

  async function respond(friendshipId, status) {
    const { error } = await sb.from("friendships").update({ status }).eq("id", friendshipId);
    if (!error) loadFriends();
  }

  async function removeFriend(friendshipId, friendName) {
    if (!window.confirm(`確定要刪除好友「${friendName}」嗎？刪除後彼此將看不到對方之後建立的分享任務。`)) return;
    const { error } = await sb.from("friendships").delete().eq("id", friendshipId);
    if (!error) loadFriends();
    else setMsg({ type: "err", text: error.message });
  }

  return (
    <>
      <div className="bg-white rounded-2xl shadow p-5 mb-4">
        <h3 className="font-bold mb-2">重要 vs 緊急 － 優先級分數計算規則</h3>
        <p className="text-xs text-slate-500 mb-1">每一個任務會有其（重要）、（緊急）兩個指標分數，依據本公式算出當前優先級分數，分數越高者排越前面，建議優先處理。</p>
        <p className="text-xs text-slate-500 mb-4">使用者可以自行調配權值，譬如放比較多的權重在（重要性加乘：W1），或者（緊急度加乘：W2），以適配個人工作習慣。</p>

        <div className="bg-slate-50 rounded-lg px-4 py-3 text-sm flex flex-wrap items-center gap-2">
          <span className="text-slate-500 w-full mb-1">目前公式：</span>
          <span>重要性分數 ×</span>
          {editingWeights ? (
            <input value={weightDraft.w1} onChange={e => setWeightDraft({ ...weightDraft, w1: e.target.value })}
              className="w-16 border border-slate-300 rounded-lg px-2 py-1 text-center text-sm" />
          ) : (
            <span className="bg-slate-200 text-slate-600 rounded-lg px-3 py-1 font-medium">{Number(weights.w1).toFixed(1)}</span>
          )}
          <span>+ 緊急度分數 ×</span>
          {editingWeights ? (
            <input value={weightDraft.w2} onChange={e => setWeightDraft({ ...weightDraft, w2: e.target.value })}
              className="w-16 border border-slate-300 rounded-lg px-2 py-1 text-center text-sm" />
          ) : (
            <span className="bg-slate-200 text-slate-600 rounded-lg px-3 py-1 font-medium">{Number(weights.w2).toFixed(1)}</span>
          )}
          <span>= 優先級分數</span>
        </div>

        {weightErr && <div className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2 mt-2">{weightErr}</div>}

        <div className="flex gap-2 mt-3">
          {!editingWeights ? (
            <button onClick={startEditWeights} className="text-xs bg-slate-100 rounded-lg px-3 py-1.5">編輯</button>
          ) : (
            <>
              <button onClick={saveWeights} disabled={savingWeights} className="text-xs bg-slate-900 text-white rounded-lg px-4 py-1.5 disabled:opacity-50">{savingWeights ? "儲存中…" : "儲存"}</button>
              <button onClick={() => { setEditingWeights(false); setWeightErr(null); }} className="text-xs text-slate-500 px-4 py-1.5">取消</button>
            </>
          )}
          <button onClick={resetWeights} disabled={savingWeights} className="text-xs bg-rose-50 text-rose-600 rounded-lg px-3 py-1.5 disabled:opacity-50">回到預設</button>
        </div>
      </div>

      <div className="bg-white rounded-2xl shadow p-5 mb-4">
        <h3 className="font-bold mb-3">顯示設定</h3>

        <div className="grid md:grid-cols-2 gap-4">
          <div className="bg-slate-50 rounded-2xl p-4">
            <div className="flex justify-between items-center mb-2">
              <h4 className="text-sm font-semibold text-slate-700">重要性顯示</h4>
              {!editingLabels && <button onClick={startEditLabels} className="text-xs bg-white rounded-lg px-3 py-1.5 shadow-sm">編輯</button>}
            </div>
            <p className="text-xs text-slate-500 mb-3">可以把 P1～P4 換成你自己習慣的名稱（例如「最緊急」），任務列表都會跟著換成你設定的文字。</p>
            <div className="grid grid-cols-1 gap-2">
              {PRIORITY_LEVELS.map(p => (
                <div key={p} className="flex items-center gap-3">
                  <label className="text-xs text-slate-500 w-8 shrink-0">{p}</label>
                  {editingLabels ? (
                    <input value={labelDraft[p] || ""} onChange={e => setLabelDraft({ ...labelDraft, [p]: e.target.value })}
                      className="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white" />
                  ) : (
                    <div className="flex-1 px-3 py-2 bg-white rounded-lg text-sm">{priorityLabels[p] || p}</div>
                  )}
                </div>
              ))}
            </div>
            {editingLabels && (
              <div className="flex gap-2 mt-3">
                <button onClick={saveLabels} disabled={savingLabels} className="bg-slate-900 text-white text-xs rounded-lg px-4 py-2 disabled:opacity-50">{savingLabels ? "儲存中…" : "儲存"}</button>
                <button onClick={() => setEditingLabels(false)} className="text-xs text-slate-500 px-4 py-2">取消</button>
              </div>
            )}
          </div>

          <div className="bg-slate-50 rounded-2xl p-4">
            <div className="flex justify-between items-center mb-2">
              <h4 className="text-sm font-semibold text-slate-700">任務規模顯示</h4>
              {!editingScaleLabels && <button onClick={startEditScaleLabels} className="text-xs bg-white rounded-lg px-3 py-1.5 shadow-sm">編輯</button>}
            </div>
            <p className="text-xs text-slate-500 mb-3">可以把 S1～S5 換成你自己習慣的名稱（例如「小任務」）。規模會用來計算緊急程度分數。</p>
            <div className="grid grid-cols-1 gap-2">
              {SCALE_LEVELS.map(n => {
                const key = "S" + n;
                return (
                  <div key={key} className="flex items-center gap-3">
                    <label className="text-xs text-slate-500 w-8 shrink-0">{key}</label>
                    {editingScaleLabels ? (
                      <input value={scaleLabelDraft[key] || ""} onChange={e => setScaleLabelDraft({ ...scaleLabelDraft, [key]: e.target.value })}
                        className="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white" />
                    ) : (
                      <div className="flex-1 px-3 py-2 bg-white rounded-lg text-sm">{scaleLabels[key] || key}</div>
                    )}
                  </div>
                );
              })}
            </div>
            {editingScaleLabels && (
              <div className="flex gap-2 mt-3">
                <button onClick={saveScaleLabels} disabled={savingScaleLabels} className="bg-slate-900 text-white text-xs rounded-lg px-4 py-2 disabled:opacity-50">{savingScaleLabels ? "儲存中…" : "儲存"}</button>
                <button onClick={() => setEditingScaleLabels(false)} className="text-xs text-slate-500 px-4 py-2">取消</button>
              </div>
            )}
          </div>
        </div>

        <div className="mt-6 pt-4 border-t border-slate-100">
          <h4 className="text-sm font-semibold text-slate-700 mb-2">緊急程度分數曲線</h4>
          <p className="text-xs text-slate-500 mb-3">緊急程度分數依「剩餘時間」與「任務規模」計算，任務列表的「緊急度」欄位就是用這條曲線即時算出來的。</p>
          <UrgencyCurveChart scaleLabels={scaleLabels} />
        </div>
      </div>

    <div className="grid md:grid-cols-2 gap-4">
      <div className="bg-white rounded-2xl shadow p-5">
        <h3 className="font-bold mb-3">我的會員資料</h3>
        <div className="space-y-3 text-sm">
          <div>
            <label className="text-xs text-slate-500">Email（不可修改）</label>
            <div className="mt-1 px-3 py-2 bg-slate-50 rounded-lg text-slate-500">{profile.email}</div>
          </div>
          <div>
            <label className="text-xs text-slate-500">顯示名稱</label>
            <input value={displayName} onChange={e => setDisplayName(e.target.value)} className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2" />
          </div>
          <label className="flex items-center gap-2 text-sm">
            <input type="checkbox" checked={isSearchable} onChange={e => setIsSearchable(e.target.checked)} className="w-4 h-4" />
            開放搜尋（其他成員可以搜尋到我並加我好友）
          </label>
          {msg && <div className={"text-xs rounded-lg px-3 py-2 " + (msg.type === "err" ? "bg-rose-50 text-rose-600" : "bg-emerald-50 text-emerald-700")}>{msg.text}</div>}
          <button onClick={saveProfile} disabled={saving} className="bg-slate-900 text-white rounded-lg px-4 py-2 text-sm disabled:opacity-50">{saving ? "儲存中…" : "儲存變更"}</button>
        </div>

        <h3 className="font-bold mt-6 mb-3">搜尋成員</h3>
        <div className="flex gap-2">
          <input value={searchTerm} onChange={e => setSearchTerm(e.target.value)} placeholder="輸入名稱或 email"
            className="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm" onKeyDown={e => e.key === "Enter" && doSearch()} />
          <button onClick={doSearch} className="bg-slate-100 rounded-lg px-3"><Icon.Search className="w-4 h-4"/></button>
        </div>
        <div className="mt-2 space-y-2">
          {searchResults.map(r => (
            <div key={r.id} className="flex justify-between items-center bg-slate-50 rounded-lg px-3 py-2 text-sm">
              <span>{r.display_name}（{r.email}）</span>
              <button onClick={() => sendRequest(r)} className="text-xs bg-blue-600 text-white rounded-lg px-2 py-1">加好友</button>
            </div>
          ))}
        </div>
      </div>

      <ChangePasswordCard email={profile.email} />

      <div className="bg-white rounded-2xl shadow p-5">
        <h3 className="font-bold mb-3">待確認的好友邀請（{incoming.length}）</h3>
        <div className="space-y-2 mb-5">
          {incoming.length === 0 && <p className="text-xs text-slate-400">目前沒有待確認的邀請</p>}
          {incoming.map(r => (
            <div key={r.id} className="flex justify-between items-center bg-amber-50 rounded-lg px-3 py-2 text-sm">
              <span>{r.requester?.display_name} 想加你為好友</span>
              <div className="flex gap-1">
                <button onClick={() => respond(r.id, "accepted")} className="text-xs bg-emerald-600 text-white rounded-lg px-2 py-1">接受</button>
                <button onClick={() => respond(r.id, "rejected")} className="text-xs bg-slate-300 rounded-lg px-2 py-1">拒絕</button>
              </div>
            </div>
          ))}
        </div>

        <h3 className="font-bold mb-3">已送出、等待對方確認</h3>
        <div className="space-y-2 mb-5">
          {outgoing.length === 0 && <p className="text-xs text-slate-400">沒有待處理的邀請</p>}
          {outgoing.map(r => (
            <div key={r.id} className="bg-slate-50 rounded-lg px-3 py-2 text-sm text-slate-500">
              等待 {r.addressee?.display_name} 確認…
            </div>
          ))}
        </div>

        <h3 className="font-bold mb-3">我的好友（{friends.length}）</h3>
        <div className="space-y-2">
          {friends.length === 0 && <p className="text-xs text-slate-400">目前還沒有好友</p>}
          {friends.map(f => (
            <div key={f.friendshipId} className="flex justify-between items-center bg-slate-50 rounded-lg px-3 py-2 text-sm">
              <span>{f.friend?.display_name}（{f.friend?.email}）</span>
              <button onClick={() => removeFriend(f.friendshipId, f.friend?.display_name)} className="text-xs bg-rose-100 text-rose-600 rounded-lg px-2 py-1">刪除好友</button>
            </div>
          ))}
        </div>
      </div>
    </div>
    </>
  );
}

function Dashboard({ session, profile, setProfile }) {
  const [tab, setTab] = useState("list"); // list | gantt | done | settings
  const [missions, setMissions] = useState([]);
  const [openMissionId, setOpenMissionId] = useState(null);
  const [showNew, setShowNew] = useState(false);
  const [showColumnSettings, setShowColumnSettings] = useState(false);
  const [visibleColumns, setVisibleColumns] = useState(DEFAULT_VISIBLE_COLUMNS);
  const [notifOpen, setNotifOpen] = useState(false);
  const [notifs, setNotifs] = useState([]);
  const [searchInput, setSearchInput] = useState("");
  const [appliedSearch, setAppliedSearch] = useState("");
  const [sortMode, setSortMode] = useState("created_desc"); // created_desc | due_asc | priority_desc
  const notifRef = useRef(null);

  const loadMissions = useCallback(async () => {
    let q = sb.from("missions").select("*, creator:profiles!missions_creator_id_fkey(id,display_name,email)").order("created_at", { ascending: false });
    const { data } = await q;
    setMissions(data || []);
  }, []);

  const loadNotifs = useCallback(async () => {
    const { data } = await sb.from("notifications").select("*, actor:profiles!notifications_actor_id_fkey(display_name)")
      .eq("user_id", profile.id).eq("is_read", false).order("created_at", { ascending: false });
    setNotifs(data || []);
  }, [profile.id]);

  useEffect(() => { loadMissions(); loadNotifs(); }, [loadMissions, loadNotifs]);

  const markNotifsRead = useCallback(async () => {
    await sb.from("notifications").update({ is_read: true }).eq("user_id", profile.id).eq("is_read", false);
    setNotifs([]);
  }, [profile.id]);

  // 點通知面板「外面」才關閉並標記已讀；面板打開期間內容會持續顯示，不會一點開就消失
  useEffect(() => {
    if (!notifOpen) return;
    function handleOutside(e) {
      if (notifRef.current && !notifRef.current.contains(e.target)) {
        setNotifOpen(false);
        markNotifsRead();
      }
    }
    document.addEventListener("mousedown", handleOutside);
    return () => document.removeEventListener("mousedown", handleOutside);
  }, [notifOpen, markNotifsRead]);

  const searchedMissions = appliedSearch
    ? missions.filter(m => {
        const q = appliedSearch.toLowerCase();
        return (m.title || "").toLowerCase().includes(q) || (m.content || "").toLowerCase().includes(q);
      })
    : missions;

  const sortedMissions = sortMissions(searchedMissions, sortMode, profile.priority_weights);

  const openMissions = sortedMissions.filter(m => m.status === "added" || m.status === "in_progress");
  const completedMissions = sortedMissions.filter(m => m.status === "completed");
  const abandonedMissions = sortedMissions.filter(m => m.status === "abandoned");

  const ganttMissions = missions.filter(m => m.status !== "completed");

  function runSearch() { setAppliedSearch(searchInput.trim()); }
  function clearSearch() { setSearchInput(""); setAppliedSearch(""); }
  function toggleColumn(key) { setVisibleColumns(vc => ({ ...vc, [key]: !vc[key] })); }

  return (
    <div className="min-h-screen">
      <header className="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between sticky top-0 z-20">
        <div className="flex items-center gap-6">
          <h1 className="font-bold text-slate-800">任務雲 TaskCloud</h1>
          <nav className="flex gap-1 text-sm">
            {[["list","任務列表"],["gantt","甘特圖"],["settings","系統管理"]].map(([k,l]) => (
              <button key={k} onClick={() => setTab(k)} className={"px-3 py-1.5 rounded-lg " + (tab===k ? "bg-slate-900 text-white" : "text-slate-500 hover:bg-slate-100")}>{l}</button>
            ))}
          </nav>
        </div>
        <div className="flex items-center gap-3">
          <div className="relative" ref={notifRef}>
            <button onClick={() => setNotifOpen(o => !o)} className="relative p-2 rounded-lg hover:bg-slate-100">
              <Icon.Bell className="w-5 h-5 text-slate-600" />
              {notifs.length > 0 && <span className="absolute -top-0.5 -right-0.5 bg-rose-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">{notifs.length}</span>}
            </button>
            {notifOpen && (
              <div className="absolute right-0 mt-2 w-72 bg-white shadow-lg rounded-xl border border-slate-100 p-2 text-sm">
                {notifs.length === 0 && <p className="text-xs text-slate-400 p-2">沒有新通知</p>}
                {notifs.map(n => (
                  <div key={n.id} className="p-2 hover:bg-slate-50 rounded-lg">
                    {n.type === "friend_request" ? `${n.actor?.display_name} 想加你為好友` : `${n.actor?.display_name} 已接受你的好友邀請`}
                  </div>
                ))}
              </div>
            )}
          </div>
          <span className="text-sm text-slate-500">{profile.display_name}</span>
          <button onClick={() => sb.auth.signOut()} className="text-xs bg-slate-100 rounded-lg px-3 py-1.5">登出</button>
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-6 py-6">
        {tab !== "settings" && (
          <div className="flex justify-end items-center gap-2 mb-4">
            {tab === "list" && (
              <button onClick={() => setShowColumnSettings(true)} title="顯示欄位設定" className="flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded-lg w-9 h-9">
                <Icon.Settings className="w-4 h-4 text-slate-600" />
              </button>
            )}
            <button onClick={() => setShowNew(true)} className="flex items-center gap-1 bg-blue-600 text-white rounded-lg px-4 py-2 text-sm">
              <Icon.Plus className="w-4 h-4" />新增任務
            </button>
          </div>
        )}

        {tab === "list" && (
          <div className="bg-white rounded-2xl shadow p-4 mb-4">
            <div className="flex gap-2">
              <input value={searchInput} onChange={e => setSearchInput(e.target.value)}
                onKeyDown={e => e.key === "Enter" && runSearch()}
                placeholder="搜尋任務標題或內文…"
                className="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm" />
              <button onClick={runSearch} className="bg-slate-900 text-white rounded-lg px-4 flex items-center justify-center">
                <Icon.Search className="w-4 h-4" />
              </button>
            </div>
            <div className="flex justify-between items-center flex-wrap gap-2 mt-3">
              <p className="text-xs text-slate-500">
                {appliedSearch
                  ? `目前顯示是所有標題和內文含有「${appliedSearch}」的搜尋結果，共 ${sortedMissions.length} 筆`
                  : `目前顯示全部任務，共 ${sortedMissions.length} 筆`}
                {appliedSearch && <button onClick={clearSearch} className="ml-2 text-blue-600 underline">清除搜尋</button>}
              </p>
              <div className="flex gap-1 text-xs flex-wrap">
                <button onClick={() => setSortMode("created_desc")}
                  className={"px-3 py-1.5 rounded-lg " + (sortMode === "created_desc" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>建立時間排序</button>
                <button onClick={() => setSortMode("due_asc")}
                  className={"px-3 py-1.5 rounded-lg " + (sortMode === "due_asc" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>截止時間排序</button>
                <button onClick={() => setSortMode("priority_desc")}
                  className={"px-3 py-1.5 rounded-lg " + (sortMode === "priority_desc" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>優先級分數排序</button>
                <button onClick={() => setSortMode("scale_asc")}
                  className={"px-3 py-1.5 rounded-lg " + (sortMode === "scale_asc" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>小任務優先</button>
                <button onClick={() => setSortMode("scale_desc")}
                  className={"px-3 py-1.5 rounded-lg " + (sortMode === "scale_desc" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>大任務優先</button>
              </div>
            </div>
          </div>
        )}

        {tab === "list" && (
          <div className="space-y-8">
            <section>
              <h3 className="text-sm font-bold text-slate-600 mb-2">未結案任務（{openMissions.length}）</h3>
              <MissionListView missions={openMissions} onOpen={setOpenMissionId} priorityLabels={profile.priority_labels} scaleLabels={profile.scale_labels} visibleColumns={visibleColumns} />
            </section>
            <section>
              <h3 className="text-sm font-bold text-slate-600 mb-2">已完成任務（{completedMissions.length}）</h3>
              <MissionListView missions={completedMissions} onOpen={setOpenMissionId} priorityLabels={profile.priority_labels} scaleLabels={profile.scale_labels} visibleColumns={visibleColumns} />
            </section>
            <section>
              <h3 className="text-sm font-bold text-slate-600 mb-2">已棄置任務（{abandonedMissions.length}）</h3>
              <MissionListView missions={abandonedMissions} onOpen={setOpenMissionId} priorityLabels={profile.priority_labels} scaleLabels={profile.scale_labels} visibleColumns={visibleColumns} />
            </section>
          </div>
        )}

        {tab === "gantt" && <GanttView missions={ganttMissions} onOpen={setOpenMissionId} />}
        {tab === "settings" && <SettingsView profile={profile} onProfileChange={setProfile} />}
      </main>

      {showNew && <NewMissionModal onClose={() => setShowNew(false)} onCreated={loadMissions} priorityLabels={profile.priority_labels} scaleLabels={profile.scale_labels} />}
      {showColumnSettings && (
        <ColumnSettingsModal visibleColumns={visibleColumns} onToggle={toggleColumn} onClose={() => setShowColumnSettings(false)} />
      )}
      {openMissionId && (
        <MissionDetailModal missionId={openMissionId} currentUser={session.user} priorityLabels={profile.priority_labels} scaleLabels={profile.scale_labels}
          onClose={() => setOpenMissionId(null)} onChanged={loadMissions} />
      )}
    </div>
  );
}

// =====================================================================
// Root
// =====================================================================
function App() {
  const [session, setSession] = useState(undefined); // undefined = loading
  const [profile, setProfile] = useState(null);
  const [recoveryMode, setRecoveryMode] = useState(false);

  useEffect(() => {
    if (!sb) { setSession(null); return; }
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((event, sess) => {
      setSession(sess);
      if (event === "PASSWORD_RECOVERY") setRecoveryMode(true);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setProfile(null); return; }
    let cancelled = false;
    async function fetchProfile(retries) {
      const { data } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
      if (cancelled) return;
      if (data) setProfile(data);
      else if (retries > 0) setTimeout(() => fetchProfile(retries - 1), 500);
    }
    fetchProfile(4);
    return () => { cancelled = true; };
  }, [session]);

  if (recoveryMode) return <ResetPasswordScreen onDone={() => setRecoveryMode(false)} />;
  if (session === undefined) return <div className="min-h-screen flex items-center justify-center text-slate-400 text-sm">載入中…</div>;
  if (!session) return <AuthScreen />;
  if (!profile) return <div className="min-h-screen flex items-center justify-center text-slate-400 text-sm">建立會員資料中…</div>;
  return <Dashboard session={session} profile={profile} setProfile={setProfile} />;
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("渲染錯誤：", error, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ maxWidth: 640, margin: "60px auto", padding: 24, border: "1px solid #fecaca", background: "#fff1f2", borderRadius: 12, fontFamily: "sans-serif", color: "#7f1d1d" }}>
          <h2 style={{ margin: "0 0 8px", fontSize: 18 }}>畫面渲染時發生錯誤</h2>
          <p style={{ fontSize: 14, margin: "0 0 8px" }}>錯誤訊息：{this.state.error.message}</p>
          <p style={{ fontSize: 12, color: "#9f1239" }}>請打開瀏覽器開發者工具（F12）的 Console 分頁查看詳細內容。</p>
        </div>
      );
    }
    return this.props.children;
  }
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
} catch (e) {
  document.getElementById("root").innerHTML =
    '<div style="max-width:640px;margin:60px auto;padding:24px;border:1px solid #fecaca;background:#fff1f2;border-radius:12px;font-family:sans-serif;color:#7f1d1d;">' +
    '<h2 style="margin:0 0 8px;font-size:18px;">初始化時發生錯誤</h2>' +
    '<p style="font-size:14px;">' + e.message + '</p></div>';
}
</script>
<script>
  // 手動呼叫 Babel.transform 並強制指定 runtime: "classic"（用全域 React/ReactDOM 變數），
  // 避免自動掃描 type="text/babel" 時，較新版 babel-standalone 預設改用 "automatic" runtime
  // 而產生 `import ... from "react/jsx-runtime"`，在一般 <script> 環境中無法執行的問題。
  (function () {
    try {
      var source = document.getElementById("app-source").textContent;
      var output = Babel.transform(source, {
        presets: [["react", { runtime: "classic" }]],
      }).code;
      var s = document.createElement("script");
      s.text = output;
      document.body.appendChild(s);
    } catch (e) {
      document.getElementById("root").innerHTML =
        '<div style="max-width:640px;margin:60px auto;padding:24px;border:1px solid #fecaca;background:#fff1f2;border-radius:12px;font-family:sans-serif;color:#7f1d1d;">' +
        '<h2 style="margin:0 0 8px;font-size:18px;">程式碼轉譯時發生錯誤</h2>' +
        '<p style="font-size:14px;">' + e.message + '</p></div>';
    }
  })();
</script>
