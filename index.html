const BUG_REPORT_STATUS_LABEL = { open: "未處理", reviewed: "已查看", resolved: "已解決" };
const BUG_REPORT_STATUS_COLOR = { open: "bg-rose-100 text-rose-700", reviewed: "bg-amber-100 text-amber-700", resolved: "bg-emerald-100 text-emerald-700" };

function MemberRoleModal({ role, currentUserId, onClose }) {
  const [showUpgradeNotice, setShowUpgradeNotice] = useState(false);
  const [reportOpen, setReportOpen] = useState(false);
  const [reportText, setReportText] = useState("");
  const [reportBusy, setReportBusy] = useState(false);
  const [reportMsg, setReportMsg] = useState(null);
  const [myReports, setMyReports] = useState([]);
  const current = MEMBER_ROLE_LIMITS[role] || MEMBER_ROLE_LIMITS.free;

  const loadMyReports = useCallback(async () => {
    const { data } = await sb.from("bug_reports").select("*").eq("reporter_id", currentUserId).order("created_at", { ascending: false });
    setMyReports(data || []);
  }, [currentUserId]);

  useEffect(() => { loadMyReports(); }, [loadMyReports]);

  // Realtime：如果 admin 在這段期間回覆了，畫面上的回報記錄會即時更新
  useEffect(() => {
    if (!sb) return;
    const channel = sb.channel("my-bug-reports-" + currentUserId)
      .on("postgres_changes", { event: "*", schema: "public", table: "bug_reports", filter: `reporter_id=eq.${currentUserId}` }, () => loadMyReports())
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [currentUserId, loadMyReports]);

  async function submitReport() {
    if (!reportText.trim()) return;
    setReportBusy(true); setReportMsg(null);
    const { error } = await sb.from("bug_reports").insert({ reporter_id: currentUserId, content: reportText.trim() });
    setReportBusy(false);
    if (error) {
      setReportMsg({ type: "err", text: error.message });
    } else {
      setReportMsg({ type: "ok", text: "回報已送出，感謝您的協助！" });
      setReportText("");
      loadMyReports();
    }
  }

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[85vh] flex flex-col">
        <div className="flex justify-between items-center p-6 pb-4">
          <h2 className="text-lg font-bold">會員等級與限制</h2>
          <button onClick={onClose}><Icon.Close className="w-5 h-5 text-slate-400"/></button>
        </div>

        <div className="px-6 pb-6 overflow-y-auto flex-1">
          <p className="text-sm font-semibold mb-2">目前身分：{current.label}</p>
          <ul className="text-sm text-slate-600 space-y-1 mb-2" style={{ paddingLeft: 18, listStyleType: "disc" }}>
            {current.items.map((t, i) => <li key={i}>{t}</li>)}
          </ul>

          {role === "free" && (
            <div className="border-t border-slate-200 pt-4 mt-4">
              <p className="text-sm font-semibold mb-2 text-amber-700">升級 VIP 後可以：</p>
              <ul className="text-sm text-slate-600 space-y-1" style={{ paddingLeft: 18, listStyleType: "disc" }}>
                {MEMBER_ROLE_LIMITS.vip.items.map((t, i) => <li key={i}>{t}</li>)}
              </ul>
            </div>
          )}

          {role === "admin" && (
            <div className="border-t border-slate-200 pt-4 mt-4 flex justify-center">
              <a href="admin.html" target="_blank" rel="noopener noreferrer"
                className="bg-rose-600 text-white rounded-lg py-2.5 px-8 text-sm font-medium">
                前往管理頁面
              </a>
            </div>
          )}

          <div className="border-t border-slate-200 pt-4 mt-4">
            {!reportOpen ? (
              <button onClick={() => setReportOpen(true)} className="text-xs text-slate-500 underline">錯誤回報</button>
            ) : (
              <div>
                <label className="text-xs text-slate-500">回報問題或建議給管理員</label>
                <textarea rows={4} value={reportText} onChange={e => setReportText(e.target.value)}
                  placeholder="請描述你遇到的問題或建議…" maxLength={2000}
                  className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
                {reportMsg && (
                  <p className={"text-xs rounded-lg px-3 py-2 mt-2 " + (reportMsg.type === "err" ? "text-rose-600 bg-rose-50" : "text-emerald-600 bg-emerald-50")}>
                    {reportMsg.text}
                  </p>
                )}
                <div className="flex gap-2 mt-2">
                  <button onClick={submitReport} disabled={reportBusy || !reportText.trim()} className="bg-slate-900 text-white text-xs rounded-lg px-4 py-2 disabled:opacity-50">
                    {reportBusy ? "送出中…" : "送出回報"}
                  </button>
                  <button onClick={() => { setReportOpen(false); setReportMsg(null); }} className="text-xs text-slate-500 px-4 py-2">收合</button>
                </div>
              </div>
            )}
          </div>

          {myReports.length > 0 && (
            <div className="border-t border-slate-200 pt-4 mt-4">
              <p className="text-xs font-semibold text-slate-600 mb-2">我的回報記錄</p>
              <div className="space-y-2">
                {myReports.map(r => (
                  <div key={r.id} className="bg-slate-50 rounded-lg px-3 py-2">
                    <div className="flex justify-between items-center mb-1">
                      <span className={"text-xs px-2 py-0.5 rounded-full font-medium " + BUG_REPORT_STATUS_COLOR[r.status]}>{BUG_REPORT_STATUS_LABEL[r.status]}</span>
                      <span className="text-xs text-slate-400">{fmt(r.created_at)}</span>
                    </div>
                    <p className="text-xs text-slate-600 whitespace-pre-wrap">{r.content}</p>
                    {r.admin_reply && (
                      <div className="mt-2 bg-blue-50 rounded-lg px-2 py-1.5">
                        <p className="text-xs text-blue-700"><strong>管理員回覆：</strong>{r.admin_reply}</p>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>

        {role === "free" && (
          <div className="p-6 pt-4 border-t border-slate-200 flex flex-col items-center">
            {showUpgradeNotice && (
              <p className="text-xs text-blue-600 bg-blue-50 rounded-lg px-3 py-2 mb-3">升級功能即將開放，敬請期待！</p>
            )}
            <button onClick={() => setShowUpgradeNotice(true)} className="bg-amber-500 text-white rounded-lg py-2.5 px-8 text-sm font-medium">
              立即升級 VIP
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function Dashboard({ session, profile, setProfile }) {
  const [tab, setTab] = useState("list"); // list(個人任務) | project | gantt | settings
  const [missions, setMissions] = useState([]);
  const [openMissionId, setOpenMissionId] = useState(null);
  const [showNew, setShowNew] = useState(false);
  const [columnSettingsContext, setColumnSettingsContext] = useState(null); // null | "list" | "category"（決定「類別分數」「來源」要不要出現在設定裡）
  const [visibleColumns, setVisibleColumns] = useState({ ...DEFAULT_VISIBLE_COLUMNS, ...(profile.visible_columns || {}) });
  const [visibleColumnsClosed, setVisibleColumnsClosed] = useState({ ...DEFAULT_VISIBLE_COLUMNS_CLOSED, ...(profile.visible_columns_closed || {}) });
  const [visibleSections, setVisibleSections] = useState({ ...DEFAULT_VISIBLE_SECTIONS, ...(profile.visible_sections || {}) });
  const [notifOpen, setNotifOpen] = useState(false);
  const [notifs, setNotifs] = useState([]);
  const [searchInput, setSearchInput] = useState("");
  const [appliedSearch, setAppliedSearch] = useState("");
  const [searchMatchedUpdateMissionIds, setSearchMatchedUpdateMissionIds] = useState([]);
  // 全域搜尋：獨立一份搜尋狀態，不跟個人任務的搜尋框共用（範圍不同，共用容易搞混）
  const [globalSearchInput, setGlobalSearchInput] = useState("");
  const [globalAppliedSearch, setGlobalAppliedSearch] = useState("");
  const [globalSearchMatchedUpdateMissionIds, setGlobalSearchMatchedUpdateMissionIds] = useState([]);
  const [sortMode, setSortMode] = useState(() => (
    profile.remember_sort_mode && profile.remember_sort_mode !== "last_used"
      ? profile.remember_sort_mode
      : (profile.last_sort_mode || "created_desc")
  )); // created_desc | due_asc | priority_desc | priority_first | scale_asc | scale_desc | procrastination_desc

  // 依「記住排序原則」設定：選了固定模式就不寫回去（每次都回到那個模式）；
  // 選「上次停留選項」才把這次選的排序模式存回 profile，下次開啟/切分頁時記得
  function chooseSortMode(setter, mode) {
    setter(mode);
    if (!profile.remember_sort_mode || profile.remember_sort_mode === "last_used") {
      setProfile(p => ({ ...p, last_sort_mode: mode }));
      sb.from("profiles").update({ last_sort_mode: mode }).eq("id", profile.id)
        .then(({ error }) => { if (error) console.error("儲存排序模式失敗：", error); });
    }
  }
  // 搜尋大框框的遮色：只有在搜尋條件不是空白（appliedSearch 有值）時才套用，清空搜尋就解除
  const searchColorEntry = profile.search_highlight_color && profile.search_highlight_color !== "none" ? SORT_HIGHLIGHT_COLORS[profile.search_highlight_color] : null;
  const searchBoxStyle = (appliedSearch && searchColorEntry) ? { background: `rgba(${hexToRgbString(searchColorEntry.hex)},0.15)` } : undefined;
  const [personalViewMode, setPersonalViewMode] = useState("list"); // list | gantt
  const [openCategoryKey, setOpenCategoryKey] = useState(null); // null=十宮格首頁；有值=該分類的詳情列表
  const [categoryShowAll, setCategoryShowAll] = useState(false); // 類別瀏覽「顯示與我無關之任務」開關，預設關閉、不持久化（跟門檻滑桿一樣是當次瀏覽的臨時決定）
  const [projectViewMode, setProjectViewMode] = useState("list"); // list | gantt
  const [relationFilter, setRelationFilter] = useState(DEFAULT_RELATION_FILTER);
  const [hiddenIds, setHiddenIds] = useState([]);
  const [starredIds, setStarredIds] = useState([]);
  const [friendProfiles, setFriendProfiles] = useState([]);
  const [projects, setProjects] = useState([]);
  const [myProjectIds, setMyProjectIds] = useState([]);
  const [openProjectId, setOpenProjectId] = useState(null);
  const [showNewProject, setShowNewProject] = useState(false);
  const [reorderProjectsMode, setReorderProjectsMode] = useState(false);
  const [showMemberRoleModal, setShowMemberRoleModal] = useState(false);
  const [projectDeleteErr, setProjectDeleteErr] = useState(null);
  const [showDeleteProjectConfirm, setShowDeleteProjectConfirm] = useState(false);
  const [showDeleteBlockedInfo, setShowDeleteBlockedInfo] = useState(false);
  const [showEditProject, setShowEditProject] = useState(false);
  const [currentProjectMembers, setCurrentProjectMembers] = useState([]);
  const openProjectIdRef = useRef(null);
  const notifRef = useRef(null);

  const loadMissions = useCallback(async () => {
    let q = sb.from("missions").select("*, creator:profiles!missions_creator_id_fkey(id,display_name,email), assignee:profiles!missions_assigned_id_fkey(id,display_name,email), mission_checklist_items(id,is_checked)").order("created_at", { ascending: false });
    const { data } = await q;
    setMissions(data || []);
  }, []);

  const loadHiddenIds = useCallback(async () => {
    const { data } = await sb.from("mission_hides").select("mission_id").eq("user_id", profile.id);
    setHiddenIds((data || []).map(r => r.mission_id));
  }, [profile.id]);

  const loadStarredIds = useCallback(async () => {
    const { data } = await sb.from("mission_stars").select("mission_id").eq("user_id", profile.id);
    setStarredIds((data || []).map(r => r.mission_id));
  }, [profile.id]);

  const loadNotifs = useCallback(async () => {
    const { data } = await sb.from("notifications")
      .select("*, actor:profiles!notifications_actor_id_fkey(display_name), mission:missions(title), project:projects(name)")
      .eq("user_id", profile.id).eq("is_read", false).order("created_at", { ascending: false });
    setNotifs(data || []);
  }, [profile.id]);

  const loadFriendProfiles = useCallback(async () => {
    const uid = profile.id;
    const [{ data: asReq }, { data: asAdr }] = await Promise.all([
      sb.from("friendships").select("addressee:profiles!friendships_addressee_id_fkey(id,display_name,email)").eq("requester_id", uid).eq("status", "accepted"),
      sb.from("friendships").select("requester:profiles!friendships_requester_id_fkey(id,display_name,email)").eq("addressee_id", uid).eq("status", "accepted"),
    ]);
    const f1 = (asReq || []).map(r => r.addressee).filter(Boolean);
    const f2 = (asAdr || []).map(r => r.requester).filter(Boolean);
    setFriendProfiles([...f1, ...f2]);
  }, [profile.id]);

  const loadProjects = useCallback(async () => {
    const { data } = await sb.from("projects")
      .select("*, creator:profiles!projects_creator_id_fkey(display_name), project_members(user:profiles!project_members_user_id_fkey(display_name))")
      .order("created_at", { ascending: false });
    setProjects(data || []);
  }, []);

  // 自己所屬（發起或加入）的專案 ID 清單。project_members 這張表沒有給 admin 額外的讀取權限，
  // 所以不管是不是 admin，這裡查到的都只會是「自己真正有份」的專案，可以用來在前端一致地
  // 過濾掉 admin 因為管理用途的資料庫權限而多讀到、但畫面上不該顯示給自己看的任務/專案。
  const loadMyProjectIds = useCallback(async () => {
    const { data } = await sb.from("project_members").select("project_id").eq("user_id", profile.id);
    setMyProjectIds((data || []).map(r => r.project_id));
  }, [profile.id]);

  const loadCurrentProjectMembers = useCallback(async (pid) => {
    if (!pid) { setCurrentProjectMembers([]); return; }
    const { data } = await sb.from("project_members").select("user:profiles!project_members_user_id_fkey(id,display_name)").eq("project_id", pid);
    setCurrentProjectMembers((data || []).map(r => r.user));
  }, []);

  useEffect(() => { openProjectIdRef.current = openProjectId; loadCurrentProjectMembers(openProjectId); }, [openProjectId, loadCurrentProjectMembers]);

  useEffect(() => { loadMissions(); loadNotifs(); loadHiddenIds(); loadStarredIds(); loadFriendProfiles(); loadProjects(); loadMyProjectIds(); }, [loadMissions, loadNotifs, loadHiddenIds, loadStarredIds, loadFriendProfiles, loadProjects, loadMyProjectIds]);

  async function hideMission(missionId) {
    setHiddenIds(ids => ids.includes(missionId) ? ids : [...ids, missionId]);
    const { error } = await sb.from("mission_hides").insert({ user_id: profile.id, mission_id: missionId });
    if (error) loadHiddenIds();
  }
  async function unhideMission(missionId) {
    setHiddenIds(ids => ids.filter(id => id !== missionId));
    const { error } = await sb.from("mission_hides").delete().eq("user_id", profile.id).eq("mission_id", missionId);
    if (error) loadHiddenIds();
  }

  async function starMission(missionId) {
    setStarredIds(ids => ids.includes(missionId) ? ids : [...ids, missionId]);
    const { error } = await sb.from("mission_stars").insert({ user_id: profile.id, mission_id: missionId });
    if (error) loadStarredIds();
  }
  async function unstarMission(missionId) {
    setStarredIds(ids => ids.filter(id => id !== missionId));
    const { error } = await sb.from("mission_stars").delete().eq("user_id", profile.id).eq("mission_id", missionId);
    if (error) loadStarredIds();
  }

  async function deleteMission(missionId) {
    const { error } = await sb.from("missions").delete().eq("id", missionId);
    if (!error) loadMissions();
  }

  async function deleteProject() {
    setProjectDeleteErr(null);
    setShowDeleteProjectConfirm(false);
    const { error } = await sb.rpc("delete_project_release_missions", { p_project_id: openProjectId });
    if (!error) {
      setOpenProjectId(null);
      loadProjects();
      loadMissions();
    } else {
      setProjectDeleteErr(error.message);
    }
  }

  // Realtime：missions / mission_updates / friendships / mission_hides / projects / project_members
  // 任何一張表有變動，就重新抓一次對應資料。RLS 政策會自動幫每個使用者過濾掉他原本就看不到的變動。
  useEffect(() => {
    if (!sb) return;
    const channel = sb.channel("dashboard-realtime")
      .on("postgres_changes", { event: "*", schema: "public", table: "missions" }, () => loadMissions())
      .on("postgres_changes", { event: "*", schema: "public", table: "mission_updates" }, () => loadMissions())
      .on("postgres_changes", { event: "*", schema: "public", table: "friendships" }, () => { loadMissions(); loadFriendProfiles(); })
      .on("postgres_changes", { event: "*", schema: "public", table: "mission_hides" }, () => loadHiddenIds())
      .on("postgres_changes", { event: "*", schema: "public", table: "mission_stars" }, () => loadStarredIds())
      .on("postgres_changes", { event: "*", schema: "public", table: "mission_checklist_items" }, () => loadMissions())
      .on("postgres_changes", { event: "*", schema: "public", table: "projects" }, () => loadProjects())
      .on("postgres_changes", { event: "*", schema: "public", table: "project_members" }, () => { loadProjects(); loadCurrentProjectMembers(openProjectIdRef.current); loadMyProjectIds(); })
      .on("postgres_changes", { event: "*", schema: "public", table: "notifications", filter: `user_id=eq.${profile.id}` }, () => loadNotifs())
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "profiles", filter: `id=eq.${profile.id}` }, (payload) => {
        // 自己的 profiles 資料列在別的裝置被改動時（例如顯示欄位/區塊設定），同步更新這台裝置的畫面
        const updated = payload.new;
        setProfile(p => ({ ...p, ...updated }));
        if (updated.visible_columns) setVisibleColumns({ ...DEFAULT_VISIBLE_COLUMNS, ...updated.visible_columns });
        if (updated.visible_columns_closed) setVisibleColumnsClosed({ ...DEFAULT_VISIBLE_COLUMNS_CLOSED, ...updated.visible_columns_closed });
        if (updated.visible_sections) setVisibleSections({ ...DEFAULT_VISIBLE_SECTIONS, ...updated.visible_sections });
      })
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [loadMissions, loadHiddenIds, loadStarredIds, loadFriendProfiles, loadProjects, loadCurrentProjectMembers, loadMyProjectIds, loadNotifs, profile.id, setProfile]);

  const markNotifsRead = useCallback(async () => {
    await sb.from("notifications").update({ is_read: true }).eq("user_id", profile.id).eq("is_read", false);
    setNotifs([]);
  }, [profile.id]);

  // 點通知面板「外面」才關閉並標記已讀；面板打開期間內容會持續顯示，不會一點開就消失
  useEffect(() => {
    if (!notifOpen) return;
    function handleOutside(e) {
      if (notifRef.current && !notifRef.current.contains(e.target)) {
        setNotifOpen(false);
        markNotifsRead();
      }
    }
    document.addEventListener("mousedown", handleOutside);
    return () => document.removeEventListener("mousedown", handleOutside);
  }, [notifOpen, markNotifsRead]);

  // 一致性過濾：不管 member_role 是不是 admin，這裡都只保留「自己是建立者／被指派者／
  // 屬於自己所在的專案」這幾種情況——確保 admin 因為管理用途而被資料庫多放行的資料，
  // 不會顯示在自己一般操作畫面上，讓 admin 在這裡看到的邏輯跟其他角色完全一致。
  const myProjectIdSet = new Set(myProjectIds);
  const visibleMissions = missions.filter(m =>
    m.creator_id === profile.id || m.assigned_id === profile.id || (m.project_id && myProjectIdSet.has(m.project_id))
  );
  const visibleProjects = projects.filter(p => p.creator_id === profile.id || myProjectIdSet.has(p.id));
  const projectNameById = Object.fromEntries(projects.map(p => [p.id, p.name]));

  // 專案列表自訂排序：有存過順序就照存的來，新增/離開的專案自動補在後面，不會整批失效
  const orderedProjects = (() => {
    const order = profile.project_order;
    if (!Array.isArray(order) || order.length === 0) return visibleProjects;
    const byId = new Map(visibleProjects.map(p => [p.id, p]));
    const ordered = order.map(id => byId.get(id)).filter(Boolean);
    const remaining = visibleProjects.filter(p => !order.includes(p.id));
    return [...ordered, ...remaining];
  })();

  // 每個專案的任務統計：未完成＝已新增＋進行中（含被提升為注目任務的，因為注目不影響狀態本身）
  const projectStatsById = (() => {
    const map = {};
    for (const m of missions) {
      if (!m.project_id) continue;
      if (!map[m.project_id]) map[m.project_id] = { open: 0, completed: 0 };
      if (m.status === "added" || m.status === "in_progress" || m.status === "waiting") map[m.project_id].open += 1;
      else if (m.status === "completed") map[m.project_id].completed += 1;
    }
    return map;
  })();

  async function moveProject(index, dir) {
    const target = index + dir;
    if (target < 0 || target >= orderedProjects.length) return;
    const newOrder = orderedProjects.map(p => p.id);
    [newOrder[index], newOrder[target]] = [newOrder[target], newOrder[index]];
    setProfile(p => ({ ...p, project_order: newOrder }));
    await sb.from("profiles").update({ project_order: newOrder }).eq("id", profile.id);
  }

  const personalMissions = visibleMissions.filter(m => !m.project_id);
  const relationFilteredPersonal = personalMissions.filter(m => relationFilter[relationCategory(m, profile.id)]);

  const searchedMissions = appliedSearch
    ? relationFilteredPersonal.filter(m => {
        const q = appliedSearch.toLowerCase();
        return (m.title || "").toLowerCase().includes(q)
          || (m.content || "").toLowerCase().includes(q)
          || (m.final_comment || "").toLowerCase().includes(q)
          || searchMatchedUpdateMissionIds.includes(m.id);
      })
    : relationFilteredPersonal;

  const sortedMissions = sortMissions(searchedMissions, sortMode, profile.priority_weights);
  const hiddenSet = new Set(hiddenIds);
  const starredSet = new Set(starredIds);
  const visibleSorted = sortedMissions.filter(m => !hiddenSet.has(m.id));

  const openMissionsAll = visibleSorted.filter(m => m.status === "added" || m.status === "in_progress" || m.status === "waiting");
  const starredMissions = openMissionsAll.filter(m => starredSet.has(m.id));
  const openMissions = openMissionsAll.filter(m => !starredSet.has(m.id));
  const completedMissions = visibleSorted.filter(m => m.status === "completed").sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
  const abandonedMissions = visibleSorted.filter(m => m.status === "abandoned").sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
  const hiddenMissions = sortedMissions.filter(m => hiddenSet.has(m.id));

  const ganttMissions = sortMissions(
    relationFilteredPersonal.filter(m => (m.status === "added" || m.status === "in_progress" || m.status === "waiting") && !hiddenSet.has(m.id)),
    sortMode,
    profile.priority_weights
  );

  const currentProject = visibleProjects.find(p => p.id === openProjectId) || null;
  const projectMissionsRaw = visibleMissions.filter(m => m.project_id === openProjectId);
  const projectOpenMissionsAll = projectMissionsRaw.filter(m => m.status === "added" || m.status === "in_progress" || m.status === "waiting");
  const projectMissionsFiltered = projectMissionsRaw.filter(m => relationFilter[relationCategory(m, profile.id)]);
  const projectSearchedMissions = appliedSearch
    ? projectMissionsFiltered.filter(m => {
        const q = appliedSearch.toLowerCase();
        return (m.title || "").toLowerCase().includes(q)
          || (m.content || "").toLowerCase().includes(q)
          || (m.final_comment || "").toLowerCase().includes(q)
          || searchMatchedUpdateMissionIds.includes(m.id);
      })
    : projectMissionsFiltered;
  const projectAllMissions = sortMissions(projectSearchedMissions, sortMode, profile.priority_weights);
  const projectOpenMissionsUnsorted = projectAllMissions.filter(m => m.status === "added" || m.status === "in_progress" || m.status === "waiting");
  const projectStarredMissions = projectOpenMissionsUnsorted.filter(m => starredSet.has(m.id));
  const projectOpenMissions = projectOpenMissionsUnsorted.filter(m => !starredSet.has(m.id));
  const projectCompletedMissions = projectAllMissions.filter(m => m.status === "completed").sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
  const projectAbandonedMissions = projectAllMissions.filter(m => m.status === "abandoned").sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
  const projectGanttMissions = sortMissions(
    projectMissionsFiltered.filter(m => (m.status === "added" || m.status === "in_progress" || m.status === "waiting") && !hiddenSet.has(m.id)),
    sortMode,
    profile.priority_weights
  );

  function runSearch() { setAppliedSearch(searchInput.trim()); }
  function clearSearch() { setSearchInput(""); setAppliedSearch(""); }

  // 搜尋時，順便去「更新紀錄」（mission_updates 的留言內容）裡比對是否有符合的內容，
  // RLS 本來就只會回傳這個使用者看得到的任務底下的留言，不需要額外過濾可見範圍
  useEffect(() => {
    if (!appliedSearch.trim()) { setSearchMatchedUpdateMissionIds([]); return; }
    let cancelled = false;
    (async () => {
      const { data } = await sb.from("mission_updates").select("mission_id").ilike("content", `%${appliedSearch}%`);
      if (!cancelled) setSearchMatchedUpdateMissionIds((data || []).map(r => r.mission_id));
    })();
    return () => { cancelled = true; };
  }, [appliedSearch]);

  // 全域搜尋：範圍是整個 missions（RLS 本來就只回傳看得到的：個人 + 所有有份的專案任務，
  // 不分指派關係），不用像個人任務那樣再篩一次 relationFilter
  function runGlobalSearch() { setGlobalAppliedSearch(globalSearchInput.trim()); }
  function clearGlobalSearch() { setGlobalSearchInput(""); setGlobalAppliedSearch(""); }
  useEffect(() => {
    if (!globalAppliedSearch.trim()) { setGlobalSearchMatchedUpdateMissionIds([]); return; }
    let cancelled = false;
    (async () => {
      const { data } = await sb.from("mission_updates").select("mission_id").ilike("content", `%${globalAppliedSearch}%`);
      if (!cancelled) setGlobalSearchMatchedUpdateMissionIds((data || []).map(r => r.mission_id));
    })();
    return () => { cancelled = true; };
  }, [globalAppliedSearch]);
  const globalSearchedMissions = globalAppliedSearch
    ? visibleMissions.filter(m => {
        const q = globalAppliedSearch.toLowerCase();
        return (m.title || "").toLowerCase().includes(q)
          || (m.content || "").toLowerCase().includes(q)
          || (m.final_comment || "").toLowerCase().includes(q)
          || globalSearchMatchedUpdateMissionIds.includes(m.id);
      })
    : [];
  const globalSortedMissions = sortMissions(globalSearchedMissions, sortMode, profile.priority_weights);

  async function toggleColumn(key) {
    const updated = { ...visibleColumns, [key]: !visibleColumns[key] };
    setVisibleColumns(updated);
    setProfile(p => ({ ...p, visible_columns: updated }));
    await sb.from("profiles").update({ visible_columns: updated }).eq("id", profile.id);
  }
  async function toggleColumnClosed(key) {
    const updated = { ...visibleColumnsClosed, [key]: !visibleColumnsClosed[key] };
    setVisibleColumnsClosed(updated);
    setProfile(p => ({ ...p, visible_columns_closed: updated }));
    await sb.from("profiles").update({ visible_columns_closed: updated }).eq("id", profile.id);
  }
  async function saveColumnOrder(category, order) {
    const field = category === "closed" ? "column_order_closed" : "column_order";
    setProfile(p => ({ ...p, [field]: order }));
    await sb.from("profiles").update({ [field]: order }).eq("id", profile.id);
  }
  async function toggleShowSystemLogs() {
    const next = !(profile.show_system_logs !== false);
    setProfile(p => ({ ...p, show_system_logs: next }));
    await sb.from("profiles").update({ show_system_logs: next }).eq("id", profile.id);
  }
  async function toggleUpdateLogSortOrder() {
    const next = (profile.update_log_sort_order || "desc") === "desc" ? "asc" : "desc";
    setProfile(p => ({ ...p, update_log_sort_order: next }));
    await sb.from("profiles").update({ update_log_sort_order: next }).eq("id", profile.id);
  }
  async function toggleSection(key) {
    const updated = { ...visibleSections, [key]: !visibleSections[key] };
    setVisibleSections(updated);
    setProfile(p => ({ ...p, visible_sections: updated }));
    await sb.from("profiles").update({ visible_sections: updated }).eq("id", profile.id);

function App() {
  const [session, setSession] = useState(undefined); // undefined = loading
  const [profile, setProfile] = useState(null);
  const [recoveryMode, setRecoveryMode] = useState(false);

  useEffect(() => {
    if (!sb) { setSession(null); return; }
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((event, sess) => {
      setSession(sess);
      if (event === "PASSWORD_RECOVERY") setRecoveryMode(true);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setProfile(null); return; }
    let cancelled = false;
    async function fetchProfile(retries) {
      const { data } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
      if (cancelled) return;
      if (data) setProfile(data);
      else if (retries > 0) setTimeout(() => fetchProfile(retries - 1), 500);
    }
    fetchProfile(4);
    return () => { cancelled = true; };
  }, [session]);

  if (recoveryMode) return <ResetPasswordScreen onDone={() => setRecoveryMode(false)} />;
  if (session === undefined) return <div className="min-h-screen flex items-center justify-center text-slate-400 text-sm">載入中…</div>;
  if (!session) return <AuthScreen />;
  if (!profile) return <div className="min-h-screen flex items-center justify-center text-slate-400 text-sm">建立會員資料中…</div>;
  return <Dashboard session={session} profile={profile} setProfile={setProfile} />;
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("渲染錯誤：", error, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ maxWidth: 640, margin: "60px auto", padding: 24, border: "1px solid #fecaca", background: "#fff1f2", borderRadius: 12, fontFamily: "sans-serif", color: "#7f1d1d" }}>
          <h2 style={{ margin: "0 0 8px", fontSize: 18 }}>畫面渲染時發生錯誤</h2>
          <p style={{ fontSize: 14, margin: "0 0 8px" }}>錯誤訊息：{this.state.error.message}</p>
          <p style={{ fontSize: 12, color: "#9f1239" }}>請打開瀏覽器開發者工具（F12）的 Console 分頁查看詳細內容。</p>
        </div>
      );
    }
    return this.props.children;
  }
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);

  document.getElementById("root").innerHTML =

}

<script>
  // 手動呼叫 Babel.transform 並強制指定 runtime: "classic"（用全域 React/ReactDOM 變數），
  // 避免自動掃描 type="text/babel" 時，較新版 babel-standalone 預設改用 "automatic" runtime
  // 而產生 `import ... from "react/jsx-runtime"`，在一般 <script> 環境中無法執行的問題。
  (function () {
    try {
      var source = document.getElementById("app-source").textContent;
      var output = Babel.transform(source, {
        presets: [["react", { runtime: "classic" }]],
      }).code;
      var s = document.createElement("script");
      s.text = output;
      document.body.appendChild(s);
    } catch (e) {
      document.getElementById("root").innerHTML =
        '<div style="max-width:640px;margin:60px auto;padding:24px;border:1px solid #fecaca;background:#fff1f2;border-radius:12px;font-family:sans-serif;color:#7f1d1d;">' +
        '<h2 style="margin:0 0 8px;font-size:18px;">程式碼轉譯時發生錯誤</h2>' +
        '<p style="font-size:14px;">' + e.message + '</p></div>';
    }
  })();
</script>
