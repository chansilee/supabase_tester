<title>任務雲 TaskCloud — 多人共享任務管理</title>
<script>
  // 全域錯誤攔截：只要有任何 JS 錯誤（含 CDN 載入失敗），就把錯誤內容直接顯示在畫面上，
  // 避免「整個畫面空白、卻不知道發生什麼事」的情況。
  window.addEventListener("error", function (e) {
    var root = document.getElementById("root");
    if (!root) return;
    var msg = (e && e.message) ? e.message : "未知錯誤";
    var src = (e && e.filename) ? e.filename : "";
    root.innerHTML =
      '<div style="max-width:640px;margin:60px auto;padding:24px;border:1px solid #fecaca;' +
      'background:#fff1f2;border-radius:12px;font-family:sans-serif;color:#7f1d1d;">' +
      '<h2 style="margin:0 0 8px;font-size:18px;">頁面發生錯誤，無法正常顯示</h2>' +
      '<p style="font-size:14px;margin:0 0 8px;">錯誤訊息：' + msg + '</p>' +
      (src ? '<p style="font-size:12px;color:#9f1239;word-break:break-all;">來源：' + src + '</p>' : '') +
      '<p style="font-size:12px;color:#9f1239;">請打開瀏覽器開發者工具（F12 或 右鍵→檢查）的 Console 分頁，把紅字錯誤訊息複製給開發者。</p>' +
      '</div>';
  });
</script>

}

// 依「顯示情境」與使用者自訂文字，決定重要性/規模要顯示長字串、短字串、還是原始分數
function resolvePriorityDisplay(labels, displayModes, context, p) {
  const mode = (displayModes && displayModes[context]) || "long";
  if (mode === "score") return String(priorityImportanceScore(p));
  const entry = (labels && labels[p]) || DEFAULT_PRIORITY_LABELS[p];
  return (entry && entry[mode]) || p;
}
function resolveScaleDisplay(labels, displayModes, context, n) {
  const mode = (displayModes && displayModes[context]) || "long";
  const key = "S" + n;
  if (mode === "score") return String(n);
  const entry = (labels && labels[key]) || DEFAULT_SCALE_LABELS[key];
  return (entry && entry[mode]) || key;
}

// 緊急度顏色：0 分＝青綠、1 分＝琥珀橘、2 分＝珊瑚紅，中間線性插值
const URGENCY_COLOR_STOPS = [
  { t: 0, c: [47, 175, 155] },
  { t: 1, c: [232, 163, 61] },
  { t: 2, c: [232, 84, 74] },
];
function urgencyColor(score) {
  const s = Math.max(0, Math.min(2, score));
  const [lo, hi] = s <= 1 ? [URGENCY_COLOR_STOPS[0], URGENCY_COLOR_STOPS[1]] : [URGENCY_COLOR_STOPS[1], URGENCY_COLOR_STOPS[2]];
  const localT = (s - lo.t) / (hi.t - lo.t || 1);
  const r = Math.round(lo.c[0] + (hi.c[0] - lo.c[0]) * localT);
  const g = Math.round(lo.c[1] + (hi.c[1] - lo.c[1]) * localT);
  const b = Math.round(lo.c[2] + (hi.c[2] - lo.c[2]) * localT);
  return `rgb(${r}, ${g}, ${b})`;
}

// 把 0~2 分的緊急度分數對應到 U1~U4 四個級距
function urgencyBucket(score) {
  const s = Math.max(0, Math.min(2, score));
  if (s < 0.5) return "U1";
  if (s < 1.0) return "U2";
  if (s < 1.5) return "U3";
  return "U4";
}
function resolveUrgencyDisplay(labels, displayModes, context, score) {
  if (score === null) return "—";
  const mode = (displayModes && displayModes[context]) || "score";
  if (mode === "score") return score.toFixed(2);
  const bucket = urgencyBucket(score);
  const entry = (labels && labels[bucket]) || DEFAULT_URGENCY_LABELS[bucket];
  return (entry && entry[mode]) || bucket;
}
function renderUrgencyText(labels, displayModes, context, score, colorOverride) {
  const text = resolveUrgencyDisplay(labels, displayModes, context, score);
  if (!colorOverride || score === null) return text;
  return <span style={{ color: urgencyColor(score) }}>{text}</span>;
}

// 通用：把任意範圍的分數換算成 0~2 分再套用同一組緊急度色階（最低分＝綠，最高分＝紅）
function scoreToColor(value, min, max) {
  const t = max === min ? 0 : (value - min) / (max - min);
  return urgencyColor(t * 2);
}
function renderPriorityText(labels, displayModes, context, p, colorOverride) {
  const text = resolvePriorityDisplay(labels, displayModes, context, p);
  if (!colorOverride) return text;
  return <span style={{ color: scoreToColor(priorityImportanceScore(p), 1, 4) }}>{text}</span>;
}
function renderScaleText(labels, displayModes, context, n, colorOverride) {
  const text = resolveScaleDisplay(labels, displayModes, context, n);
  if (!colorOverride) return text;
  return <span style={{ color: scoreToColor(n, 1, 5) }}>{text}</span>;

// 緊急程度分數：依剩餘天數 x 與規模 s 計算（規格見 urgency-score-spec.md）
function urgencyScore(x, s) {
  if (x <= 0) return 2;
  if (x >= s) return s / x;
  return (-1 / s) * x + 2;
}
function remainingDays(dueDate) {
  if (!dueDate) return null;
  return (new Date(dueDate).getTime() - Date.now()) / 86400000;
}

// 拖延天數：距離上次更新過了多久（天，帶小數）
function procrastinationDays(m) {

}
// 拖延優先排序的第一層級：已新增 > 進行中 > 等待中 > 其他（已完成/已棄置在此排序模式下不會用到這個層級）
function procrastinationTier(status) {
  if (status === "added") return 0;
  if (status === "in_progress") return 1;
  if (status === "waiting") return 2;
  return 3;
}

// 無進度天數：距離上次更新，若不到 24 小時算「本日有進度」，之後每滿 24 小時算多一天無進度
function noProgressDaysInt(updatedAt) {
  const hours = (Date.now() - new Date(updatedAt).getTime()) / 3600000;
  return hours < 24 ? 0 : Math.floor(hours / 24);
}
function noProgressText(updatedAt, status) {
  const days = noProgressDaysInt(updatedAt);
  if (days === 0) return status === "added" ? "尚未開始" : "本日有進度";
  return `無進度${days}天`;
}
// 無進度天數顏色：0 天（本日有進度）＝不急的綠色端，達到「嚴重度天數」門檻＝緊急的紅色端，中間線性內插，超過門檻固定顯示紅色端
function noProgressColor(updatedAt, severityDays) {
  const days = noProgressDaysInt(updatedAt);
  const t = Math.min(2, (days / (severityDays || 7)) * 2);
  return urgencyColor(t);
}

// 檢查清單完成度：沒有項目時回傳 null（不顯示）；全部勾完但任務本身還沒正式標記「已完成」時，
// 封頂顯示 99%，真正的 100% 只保留給任務正式結案的那一刻
function checklistProgress(items, missionStatus) {
  if (!items || items.length === 0) return null;
  const total = items.length;
  const checked = items.filter(i => i.is_checked).length;
  let pct = Math.floor((checked / total) * 100);
  if (missionStatus !== "completed" && checked === total) pct = 99;
  return pct;
}

function hexToRgbString(hex) {
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `${r},${g},${b}`;
}

function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
// 甘特圖用：現在時間在當天 24 小時裡的位置百分比（精度：最近的半小時）
function nowLinePercent() {
  const now = new Date();
  const minutes = now.getHours() * 60 + now.getMinutes();
  const rounded = Math.round(minutes / 30) * 30;
  return Math.min(100, (rounded / 1440) * 100);
}

// 把數值四捨五入到最近的 0.5，整數就不顯示小數點
function roundHalfStep(n) {
  const r = Math.round(n * 2) / 2;
  return Number.isInteger(r) ? String(r) : r.toFixed(1);
}
// 剩餘天數/小時文字：>=1 天顯示天數（精確到小數點一位），<1 天改顯示小時（精確到 0.5 小時）；已逾期則顯示「已逾期」
function remainingTimeText(dueDate) {
  if (!dueDate) return null;
  const diffMs = new Date(dueDate).getTime() - Date.now();
  const overdue = diffMs < 0;
  const absMs = Math.abs(diffMs);
  const absDays = absMs / 86400000;
  const absHours = absMs / 3600000;
  const value = absDays >= 1 ? `${absDays.toFixed(1)}天` : `${roundHalfStep(absHours)}小時`;
  return overdue ? `已逾期${value}` : `剩${value}`;
}
// 依「截止時間顯示設定」組出要顯示的文字，並視需要套用緊急度顏色
// due_time_precise === false 時（AI 只判斷出日期、沒有精確時刻）一律只顯示日期，
// 不印出實際存的「隔天 00:00」時刻，避免使用者誤以為那是 AI 判斷出的精確時間
function renderDueDate(m, mode, colorOverride) {
  if (!m.due_date) return "—";
  const precise = m.due_time_precise !== false;
  const rawText = precise ? fmt(m.due_date) : fmtDate(m.due_date);
  let text;
  if (mode === "remaining_only") text = remainingTimeText(m.due_date);
  else if (mode === "raw_plus_remaining") text = `${rawText} (${remainingTimeText(m.due_date)})`;
  else text = rawText;
  if (!colorOverride) return text;
  const rd = remainingDays(m.due_date);
  const color = urgencyColor(urgencyScore(rd, m.scale || 1));
  return <span style={{ color }}>{text}</span>;
}

const PRIORITY_SCORE_MAP = { P1: 1, P2: 2, P3: 3, P4: 4 };
const DEFAULT_PRIORITY_WEIGHTS = { w1: 1, w2: 1 };
function priorityImportanceScore(p) { return PRIORITY_SCORE_MAP[p] || 2; }
function overallPriorityScore(m, weights) {
  const w1 = (weights && Number(weights.w1)) || 0;
  const w2 = (weights && Number(weights.w2)) || 0;
  const importance = priorityImportanceScore(m.priority);
  const rd = remainingDays(m.due_date);
  const urgency = rd === null ? 0 : urgencyScore(rd, m.scale || 1);
  return importance * w1 + urgency * w2;
}

function fmt(dt) {
  if (!dt) return "—";
  const d = new Date(dt);
  return d.toLocaleString("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}
function fmtDate(dt) {
  if (!dt) return "—";
  const d = new Date(dt);
  return d.toLocaleDateString("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit" });
}

function sortMissions(list, mode, weights) {
  const arr = [...list];
  if (mode === "due_asc") {
    arr.sort((a, b) => {
      if (!a.due_date && !b.due_date) return 0;
      if (!a.due_date) return 1;
      if (!b.due_date) return -1;
      return new Date(a.due_date) - new Date(b.due_date);
    });
  } else if (mode === "priority_desc") {
    arr.sort((a, b) => overallPriorityScore(b, weights) - overallPriorityScore(a, weights));
  } else if (mode === "priority_first") {
    arr.sort((a, b) => (PRIORITY_SCORE_MAP[b.priority] - PRIORITY_SCORE_MAP[a.priority]) || (overallPriorityScore(b, weights) - overallPriorityScore(a, weights)));
  } else if (mode === "scale_asc") {
    arr.sort((a, b) => (a.scale || 1) - (b.scale || 1) || overallPriorityScore(b, weights) - overallPriorityScore(a, weights));
  } else if (mode === "scale_desc") {
    arr.sort((a, b) => (b.scale || 1) - (a.scale || 1) || overallPriorityScore(b, weights) - overallPriorityScore(a, weights));
  } else if (mode === "procrastination_desc") {
    arr.sort((a, b) => procrastinationTier(a.status) - procrastinationTier(b.status) || procrastinationDays(b) - procrastinationDays(a));
  } else if (mode === "updated_desc") {
    arr.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
  } else {
    arr.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  }
  return arr;
}

// 類別瀏覽頁專用排序：分層優先（未結案→已完成→已棄置），
// 同層內先比這個分類自己的分數（不是 primary_category，是任務在「這個分類」上的實際分數），
// 分數相同才比整體優先級分數（沿用既有的 overallPriorityScore）
function sortMissionsByCategory(list, categoryKey, weights) {
  return [...list].sort((a, b) => {
    const tierDiff = statusTier(a.status) - statusTier(b.status);
    if (tierDiff !== 0) return tierDiff;
    const scoreA = Number(a.category_scores?.[categoryKey]) || 0;
    const scoreB = Number(b.category_scores?.[categoryKey]) || 0;
    if (scoreB !== scoreA) return scoreB - scoreA;
    return overallPriorityScore(b, weights) - overallPriorityScore(a, weights);
  });
}
// 「跟我有關」的任務：不論個人任務或專案任務，只要我是建立者或被指派者就算，
// 「別人指派給別人」的專案任務一律不列入類別瀏覽
function isRelevantToUser(m, userId) {
  return m.creator_id === userId || m.assigned_id === userId;
}
function primaryCategoryOf(scores) {
  if (!scores) return null;
  let best = null, bestScore = -1;
  for (const k of AI_CATEGORIES) {
    const v = Number(scores[k]) || 0;
    if (v > bestScore) { bestScore = v; best = k; }
  }
  return best;
}

// 手動分類：多選＋自動平分（不提供比例調整，選 N 個分類各占 1/N）。
// 選 0 個時回傳 null——「未分類」是有意義的狀態，不強制塞 other:1.0 污染資料，
// 避免跟「AI 判斷過、真的就是 other」混在一起，之後做分類統計時才不會失真。
function evenSplitScores(selectedKeys) {
  if (!selectedKeys || selectedKeys.length === 0) return null;
  const val = Number((1 / selectedKeys.length).toFixed(4));
  const scores = {};
  AI_CATEGORIES.forEach(k => { scores[k] = selectedKeys.includes(k) ? val : 0; });
  return scores;
}

// 十分類權重長條圖：由高到低排序，最高分那條用強調色，其餘灰色
function CategoryBreakdown({ scores }) {
  if (!scores) return <p className="text-xs text-slate-300 px-1">尚未分類</p>;
  const sorted = AI_CATEGORIES.map(k => [k, Number(scores[k]) || 0]).sort((a, b) => b[1] - a[1]);
  const top = sorted.length ? sorted[0][1] : 0;
  return (
    <div className="space-y-1">
      {sorted.map(([key, score]) => (
        <div key={key} className="flex items-center gap-2">
          <span className="w-16 text-xs text-slate-500 shrink-0">{AI_CATEGORY_LABELS[key]}</span>
          <div className="flex-1 bg-slate-100 rounded-full h-2 overflow-hidden">
            <div className="h-2" style={{ width: `${Math.max(score * 100, score > 0 ? 2 : 0)}%`, background: (score === top && top > 0) ? "#2563eb" : "#cbd5e1" }} />
          </div>
          <span className="w-9 text-xs text-slate-400 text-right shrink-0">{score.toFixed(2)}</span>
        </div>
      ))}
    </div>
  );
}

// 手動分類的多選按鈕群組，樣式比照既有的重要性/規模按鈕群組
function CategoryMultiSelect({ selected, onToggle }) {
  return (
    <div className="flex flex-wrap gap-1.5 mt-1">
      {AI_CATEGORIES.map(key => (
        <button key={key} type="button" onClick={() => onToggle(key)}
          className={"px-2.5 py-1 rounded-lg text-xs font-medium " + (selected.includes(key) ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>
          {AI_CATEGORY_LABELS[key]}
        </button>
      ))}
    </div>
  );
}

// 任務規模 S1~S5：純前端計算，不呼叫 AI。使用 checklist 目前的結構化細節即時算出
function classifyTaskSize(count, totalMinutes, travelLegs, totalWaitDays) {
  if (travelLegs >= 2 || totalWaitDays >= 2 || count >= 8 || totalMinutes > 480) return 5;
  if (totalMinutes >= 240) return 4;
  if (totalMinutes >= 120) return 3;
  if (totalMinutes >= 30) return 2;
  return 1;
}
// 把目前 checklist 內容彙總成 classifyTaskSize() 需要的四個數字
function checklistAiStats(items) {
  const list = items || [];
  const count = list.length;
  const totalMinutes = list.reduce((s, it) => s + (Number(it.estimated_minutes) || 0), 0);
  const travelLegs = list.filter(it => it.requires_travel).length;
  const totalWaitDays = list.reduce((s, it) => s + (Number(it.wait_days_after) || 0), 0);
  return { count, totalMinutes, travelLegs, totalWaitDays };
}
// 是否有任何一項填了結構化細節（分鐘數/需移動/需等待）——不論項目是 AI 建議還是手動輸入，
// 只要有結構化資料，就足以觸發「自動規模」判定
function hasStructuredDetail(items) {
  return (items || []).some(it => (Number(it.estimated_minutes) > 0) || it.requires_travel || (Number(it.wait_days_after) > 0));
}
function autoScaleFromChecklist(items) {
  const { count, totalMinutes, travelLegs, totalWaitDays } = checklistAiStats(items);
  return classifyTaskSize(count, totalMinutes, travelLegs, totalWaitDays);
}

// UTC 安全的「隔天 00:00」邊界運算：AI 只判斷出日期、沒有精確時刻時，
// 逾期判斷邊界一律是隔天 00:00（不是當天 23:59:59，避免秒級模糊地帶）。
// 務必用 Date.UTC()＋setUTCDate()，不能用本地時間建構＋toISOString()，
// 否則台灣（UTC+8）會系統性少一天。
function nextDayUtcMidnightISO(dateStr) {
  const [y, mo, d] = dateStr.split("-").map(Number);
  const dt = new Date(Date.UTC(y, mo - 1, d));
  dt.setUTCDate(dt.getUTCDate() + 1);
  return dt.toISOString();
}
// 精確時刻的情況：日期+時間直接組成 ISO（時區以使用者輸入的當地時間為準）
function preciseDeadlineISO(dateStr, timeStr) {
  return new Date(`${dateStr}T${timeStr}:00`).toISOString();
}

// 呼叫 Supabase Edge Function（ai-recognize），Gemini API key 只存在伺服器端，前端絕對拿不到
// AI 呼叫失敗時，哪些錯誤代碼屬於「額度/頻率限制」，需要用明顯的自繪彈窗告知使用者
// （其餘技術性錯誤——例如 AI 服務掛了、格式解析失敗——維持原本的行內紅字提示，並附上代碼方便回報給 admin）
const AI_QUOTA_ERROR_CODES = new Set(["PERSONAL_MINUTE_LIMIT", "PERSONAL_DAILY_LIMIT", "GLOBAL_RATE_LIMIT", "GEMINI_QUOTA_EXCEEDED"]);
const AI_QUOTA_ERROR_TITLES = {
  PERSONAL_MINUTE_LIMIT: "查詢太頻繁了",
  PERSONAL_DAILY_LIMIT: "今日次數已用完",
  GLOBAL_RATE_LIMIT: "系統忙碌中",
  GEMINI_QUOTA_EXCEEDED: "AI 服務額度已用完",
};

async function callAiRecognize(title) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { const e = new Error("請重新登入後再試"); e.code = "UNAUTHENTICATED"; throw e; }
  const resp = await fetch(`${SUPABASE_URL}/functions/v1/ai-recognize`, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}` },
    body: JSON.stringify({ title }),
  });
  const json = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    const e = new Error(json.error || "AI 辨識失敗，請稍後再試");
    e.code = json.code || "UNKNOWN_ERROR";
    throw e;
  }
  return json; // { date_type, extracted_deadline_date, extracted_deadline_time, category_scores, subtasks }
}

// =====================================================================
// 登入 / 註冊畫面
// =====================================================================
function AuthScreen() {
  const [mode, setMode] = useState("login"); // login | register | forgot
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setMsg(null);
    setBusy(true);
    try {
      if (mode === "login") {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else if (mode === "register") {
        const { error } = await sb.auth.signUp({
          email, password,
          options: { emailRedirectTo: window.location.href.split("#")[0] },
        });
        if (error) throw error;
        setMsg({ type: "ok", text: "註冊成功！若專案有開啟信箱驗證，請收信確認後再登入。" });
      } else if (mode === "forgot") {
        const { error } = await sb.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.href.split("#")[0],
        });
        if (error) throw error;
        setMsg({ type: "ok", text: "已寄出重設密碼信，請至信箱點擊連結繼續。" });
      }
    } catch (err) {
      setMsg({ type: "err", text: err.message || "發生錯誤" });
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="min-h-screen flex items-center justify-center px-4">
      <div className="w-full max-w-sm bg-white rounded-2xl shadow-lg p-8">
        <h1 className="text-2xl font-bold text-slate-800 mb-1">任務雲 TaskCloud</h1>
        <p className="text-sm text-slate-500 mb-6">多人共享任務管理系統（測試前端）</p>
        {mode !== "forgot" && (
          <div className="flex mb-6 rounded-lg bg-slate-100 p-1 text-sm font-medium">
            <button onClick={() => { setMode("login"); setMsg(null); }} className={"flex-1 py-1.5 rounded-md " + (mode === "login" ? "bg-white shadow text-slate-900" : "text-slate-500")}>登入</button>
            <button onClick={() => { setMode("register"); setMsg(null); }} className={"flex-1 py-1.5 rounded-md " + (mode === "register" ? "bg-white shadow text-slate-900" : "text-slate-500")}>註冊</button>
          </div>
        )}
        {mode === "forgot" && (
          <div className="mb-4">
            <h2 className="text-sm font-semibold text-slate-700">重設密碼</h2>
            <p className="text-xs text-slate-500 mt-1">輸入註冊時使用的 email，我們會寄一封重設密碼信給你。</p>
          </div>
        )}
        <form onSubmit={submit} className="space-y-3">
          <div>
            <label className="text-xs text-slate-500">Email</label>
            <input required type="email" value={email} onChange={e => setEmail(e.target.value)}
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
          </div>
          {mode !== "forgot" && (
            <div>
              <label className="text-xs text-slate-500">密碼</label>
              <input required type="password" minLength={6} value={password} onChange={e => setPassword(e.target.value)}
                className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
            </div>
          )}
          {mode === "login" && (
            <button type="button" onClick={() => { setMode("forgot"); setMsg(null); }} className="text-xs text-blue-600 underline">忘記密碼？</button>
          )}
          {msg && (
            <div className={"text-xs rounded-lg px-3 py-2 " + (msg.type === "err" ? "bg-rose-50 text-rose-600" : "bg-emerald-50 text-emerald-700")}>{msg.text}</div>
          )}
          <button disabled={busy} className="w-full bg-slate-900 text-white rounded-lg py-2.5 text-sm font-medium disabled:opacity-50">
            {busy ? "處理中…" : (mode === "login" ? "登入" : mode === "register" ? "註冊" : "傳送重設密碼信")}
          </button>
          {mode === "forgot" && (
            <button type="button" onClick={() => { setMode("login"); setMsg(null); }} className="w-full text-xs text-slate-500 underline">返回登入</button>
          )}
        </form>
        {!sb && (
          <p className="mt-4 text-xs text-rose-500">尚未設定 SUPABASE_URL / SUPABASE_ANON_KEY，請先在檔案最上方填入你的 Supabase 專案資訊。</p>
        )}
      </div>
    </div>
  );
}

// =====================================================================
// 重設密碼（從 email 連結點回來後顯示）
// =====================================================================
function ResetPasswordScreen({ onDone }) {
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [done, setDone] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setMsg(null);
    if (newPassword.length < 6) { setMsg({ type: "err", text: "新密碼至少需要 6 個字元" }); return; }
    if (newPassword !== confirmPassword) { setMsg({ type: "err", text: "兩次輸入的新密碼不一致" }); return; }
    setBusy(true);
    try {
      const { error } = await sb.auth.updateUser({ password: newPassword });
      if (error) throw error;
      await sb.auth.signOut();
      setDone(true);
    } catch (err) {
      setMsg({ type: "err", text: err.message || "更新密碼時發生錯誤" });
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="min-h-screen flex items-center justify-center px-4">
      <div className="w-full max-w-sm bg-white rounded-2xl shadow-lg p-8">
        <h1 className="text-xl font-bold text-slate-800 mb-1">設定新密碼</h1>
        {done ? (
          <div>
            <p className="text-sm text-emerald-700 bg-emerald-50 rounded-lg px-3 py-2 mt-4">密碼已更新成功，請用新密碼重新登入。</p>
            <button onClick={onDone} className="w-full mt-4 bg-slate-900 text-white rounded-lg py-2.5 text-sm font-medium">前往登入</button>
          </div>
        ) : (
          <form onSubmit={submit} className="space-y-3 mt-4">
            <div>
              <label className="text-xs text-slate-500">新密碼（至少 6 個字元）</label>
              <input required type="password" minLength={6} value={newPassword} onChange={e => setNewPassword(e.target.value)}
                className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
            </div>
            <div>
              <label className="text-xs text-slate-500">確認新密碼</label>
              <input required type="password" minLength={6} value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)}
                className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
            </div>
            {msg && <div className={"text-xs rounded-lg px-3 py-2 " + (msg.type === "err" ? "bg-rose-50 text-rose-600" : "bg-emerald-50 text-emerald-700")}>{msg.text}</div>}
            <button disabled={busy} className="w-full bg-slate-900 text-white rounded-lg py-2.5 text-sm font-medium disabled:opacity-50">{busy ? "更新中…" : "更新密碼"}</button>
          </form>
        )}
      </div>
    </div>
  );
}

// =====================================================================
// 新增任務 Modal
// =====================================================================
// 檢查清單左欄一個「已確定」項目的預設結構（不管來源是 AI 匯入還是手動新增，形狀一致）
function newDraftItem(content, extra) {
  return { _key: `d-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, content, estimated_minutes: null, requires_travel: false, wait_days_after: 0, from_ai: false, ...extra };
}

function NewMissionModal({ onClose, onCreated, priorityLabels, scaleLabels, priorityDisplay, scaleDisplay, priorityColorOverride, scaleColorOverride, currentUserId, currentUserName, assigneeOptions, projectId, fieldLabelPrefix }) {
  const [title, setTitle] = useState("");
  const [content, setContent] = useState("");
  const [contentOpen, setContentOpen] = useState(false); // 任務內容預設收合，因為有 checklist 可以承載細節，不強迫填文字
  const [dueDate, setDueDate] = useState(""); // YYYY-MM-DD
  const [dueTime, setDueTime] = useState(""); // HH:MM，留空代表沒有精確時刻
  const [priority, setPriority] = useState("P2");
  const [scale, setScale] = useState(1);
  const [scaleSource, setScaleSource] = useState("manual"); // manual | auto
  const [scaleLocked, setScaleLocked] = useState(false); // 使用者是否曾按過「🔒 手動輸入」明確鎖住
  const [assigneeId, setAssigneeId] = useState(currentUserId);
  const [checklistDraft, setChecklistDraft] = useState([]); // 左欄：已確定
  const [checklistInput, setChecklistInput] = useState("");
  const [detailOpenKey, setDetailOpenKey] = useState(null);
  const [aiSuggestions, setAiSuggestions] = useState([]); // 右欄：AI 建議，尚未確認
  const [aiBusy, setAiBusy] = useState(false);
  const [aiErr, setAiErr] = useState(null);
  const [aiErrCode, setAiErrCode] = useState(null); // 非額度類的技術性錯誤代碼，附在行內提示裡方便回報
  const [aiQuotaModal, setAiQuotaModal] = useState(null); // { title, message }：額度/頻率類錯誤改用自繪彈窗
  const [aiCategoryScores, setAiCategoryScores] = useState(null); // 目前的分類權重，不論來自 AI 或手動設定
  const [categoryOpen, setCategoryOpen] = useState(false);
  const [categoryEditing, setCategoryEditing] = useState(false);
  const [categoryDraft, setCategoryDraft] = useState([]);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  // 任務規模自動判定：只要左欄任一項目有結構化細節，且使用者沒有明確鎖住手動，就自動接管
  useEffect(() => {
    if (scaleLocked) return;
    if (!hasStructuredDetail(checklistDraft)) return;
    setScaleSource("auto");
    setScale(autoScaleFromChecklist(checklistDraft));
  }, [checklistDraft, scaleLocked]);

  function toggleScaleLock() {
    if (scaleSource === "auto") { setScaleLocked(true); setScaleSource("manual"); }
    else { setScaleLocked(false); if (hasStructuredDetail(checklistDraft)) { setScaleSource("auto"); setScale(autoScaleFromChecklist(checklistDraft)); } }
  }

  function addChecklistDraftItem() {
    if (!checklistInput.trim()) return;
    setChecklistDraft(list => [...list, newDraftItem(checklistInput.trim())]);
    setChecklistInput("");
  }
  function removeChecklistDraftItem(key) {
    setChecklistDraft(list => list.filter(i => i._key !== key));
  }
  function updateDraftItem(key, patch) {
    setChecklistDraft(list => list.map(i => i._key === key ? { ...i, ...patch } : i));
  }
  function moveDraftItem(index, dir) {
    const target = index + dir;
    if (target < 0 || target >= checklistDraft.length) return;
    setChecklistDraft(list => {
      const arr = [...list];
      [arr[index], arr[target]] = [arr[target], arr[index]];
      return arr;
    });
  }
  // 右欄「←」：匯入左欄
  function importSuggestion(sugg) {
    setAiSuggestions(list => list.filter(s => s._key !== sugg._key));
    setChecklistDraft(list => [...list, newDraftItem(sugg.title, {
      estimated_minutes: sugg.estimated_minutes || null, requires_travel: !!sugg.requires_travel,
      wait_days_after: sugg.wait_days_after || 0, from_ai: true,
    })]);
  }
  // 左欄 AI 來源項目「→」：送回右欄建議（手動新增的項目沒有這個按鈕，只能移除）
  function sendBackToSuggestions(item) {
    setChecklistDraft(list => list.filter(i => i._key !== item._key));
    setAiSuggestions(list => [...list, {
      _key: item._key, title: item.content, estimated_minutes: item.estimated_minutes,
      requires_travel: item.requires_travel, wait_days_after: item.wait_days_after,
    }]);
  }

  async function runAiRecognize() {
    if (!title.trim()) return;
    setAiBusy(true); setAiErr(null); setAiErrCode(null);
    try {
      const result = await callAiRecognize(title.trim());
      setAiCategoryScores(result.category_scores);
      setAiSuggestions((result.subtasks || []).map((s, i) => ({ ...s, _key: `ai-${Date.now()}-${i}` })));
      if (result.extracted_deadline_date) {
        setDueDate(result.extracted_deadline_date);
        setDueTime(result.extracted_deadline_time || "");
      }
    } catch (e) {
      if (AI_QUOTA_ERROR_CODES.has(e.code)) {
        setAiQuotaModal({ title: AI_QUOTA_ERROR_TITLES[e.code] || "已達使用上限", message: e.message });
      } else {
        setAiErr(e.message); setAiErrCode(e.code || null);
      }
    } finally {
      setAiBusy(false);
    }
  }

  function startCategoryEdit() {
    setCategoryDraft(AI_CATEGORIES.filter(k => Number((aiCategoryScores || {})[k]) > 0));
    setCategoryEditing(true);
  }
  function toggleCategoryDraft(key) {
    setCategoryDraft(list => list.includes(key) ? list.filter(k => k !== key) : [...list, key]);
  }
  function saveCategoryEdit() {
    setAiCategoryScores(evenSplitScores(categoryDraft));
    setCategoryEditing(false);
  }

  async function submit(e) {
    e.preventDefault();
    setBusy(true); setErr(null);
    try {
      const { data: { user } } = await sb.auth.getUser();
      const duePrecise = !!dueTime;
      const dueDateValue = !dueDate ? null : (duePrecise ? preciseDeadlineISO(dueDate, dueTime) : nextDayUtcMidnightISO(dueDate));
      const payload = {
        creator_id: user.id,
        assigned_id: assigneeId,
        project_id: projectId || null,
        title, content: content.trim() || null,
        priority, scale, scale_source: scaleSource,
        due_date: dueDateValue, due_time_precise: dueDateValue ? duePrecise : true,
        category_scores: aiCategoryScores, primary_category: aiCategoryScores ? primaryCategoryOf(aiCategoryScores) : null,
        ai_raw_input: aiCategoryScores ? title : null,
      };
      const { data: created, error } = await sb.from("missions").insert(payload).select("id").single();
      if (error) throw error;
      if (checklistDraft.length > 0) {
        const { error: clError } = await sb.from("mission_checklist_items")
          .insert(checklistDraft.map(it => ({
            mission_id: created.id, content: it.content,
            estimated_minutes: it.estimated_minutes, requires_travel: it.requires_travel,
            wait_days_after: it.wait_days_after, from_ai: it.from_ai,
          })));
        if (clError) throw clError;
      }
      onCreated();
      onClose();
    } catch (e2) {
      setErr(e2.message);
    } finally { setBusy(false); }
  }

  return (
    <>
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-2xl shadow-xl w-full max-w-4xl max-h-[85vh] overflow-y-auto p-6">
        <div className="flex justify-between items-center mb-4">
          <h2 className="text-lg font-bold">{projectId ? "新增子任務" : "新增任務"}</h2>
          <button onClick={onClose}><Icon.Close className="w-5 h-5 text-slate-400"/></button>
        </div>
        <form onSubmit={submit} className="space-y-3">
          <div>
            <label className="text-xs text-slate-500">{fieldLabelPrefix}任務標題</label>
            <div className="flex gap-2 mt-1">
              <input required value={title} onChange={e => setTitle(e.target.value)}
                className="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm" />
              <button type="button" onClick={runAiRecognize} disabled={aiBusy || !title.trim()}
                className="shrink-0 bg-violet-50 text-violet-700 text-xs rounded-lg px-3 py-2 font-medium disabled:opacity-50 whitespace-nowrap">
                {aiBusy ? "辨識中…" : "✨ AI 辨識"}
              </button>
            </div>
            {aiErr && <p className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2 mt-1">{aiErr}{aiErrCode ? `（代碼：${aiErrCode}）` : ""}</p>}
          </div>
          <div>
            <div className="flex items-center gap-2">
              <label className="text-xs text-slate-500">{fieldLabelPrefix}任務內容</label>
              <button type="button" onClick={() => setContentOpen(v => !v)}
                title={contentOpen ? "收合" : "展開填寫任務內容"}
                className={"flex items-center justify-center w-5 h-5 rounded text-xs font-bold " + (contentOpen ? "bg-blue-600 text-white" : "bg-slate-100 text-slate-500 hover:bg-slate-200")}>
                +
              </button>
              {!contentOpen && content && <span className="text-xs text-slate-400">（已填寫，點「+」查看）</span>}
            </div>
            {contentOpen && (
              <textarea rows={4} value={content} onChange={e => setContent(e.target.value)}
                placeholder="（任務內容文字描述，可留空）"
                className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
            )}
          </div>

          <div>
            <div className="flex items-center gap-1.5">
              <label className="text-xs text-slate-500">{fieldLabelPrefix}任務類別：{aiCategoryScores ? AI_CATEGORY_LABELS[primaryCategoryOf(aiCategoryScores)] : "尚未分類"}</label>
              <button type="button" onClick={() => setCategoryOpen(v => !v)} title={categoryOpen ? "收合" : "展開查看完整分類權重"}
                className={"flex items-center justify-center w-5 h-5 rounded " + (categoryOpen ? "bg-blue-100 text-blue-600" : "text-slate-400 hover:text-slate-600")}>
                <Icon.Search className="w-3.5 h-3.5" />
              </button>
            </div>
            {categoryOpen && (
              <div className="mt-2 bg-slate-50 rounded-lg p-3">
                {!categoryEditing ? (
                  <>
                    <CategoryBreakdown scores={aiCategoryScores} />
                    <button type="button" onClick={startCategoryEdit} className="mt-2 text-xs text-slate-400 hover:text-slate-600">✏️ 手動設定分類</button>
                  </>
                ) : (
                  <>
                    <p className="text-xs text-slate-500 mb-1">選擇分類（可複選，選多個會自動平分權重，都不選就是「未分類」）</p>
                    <CategoryMultiSelect selected={categoryDraft} onToggle={toggleCategoryDraft} />
                    <div className="flex gap-2 mt-2">
                      <button type="button" onClick={saveCategoryEdit} className="bg-slate-900 text-white text-xs rounded-lg px-3 py-1.5">套用</button>
                      <button type="button" onClick={() => setCategoryEditing(false)} className="text-xs text-slate-500 px-3 py-1.5">取消</button>
                    </div>
                  </>
                )}
              </div>
            )}
          </div>

          <div className="border-t border-slate-200 pt-3">
            <label className="text-xs text-slate-500">{fieldLabelPrefix}檢查清單</label>
            <div className="grid grid-cols-2 gap-3 mt-2">
              {/* 左欄：決定的子任務 */}
              <div>
                <p className="text-xs font-semibold text-slate-500 mb-1.5">決定的子任務</p>
                <div className="space-y-1.5 min-h-[2rem]">
                  {checklistDraft.map((it, i) => {
                    const detailOpen = detailOpenKey === it._key;
                    const hasDetail = !!(it.estimated_minutes || it.requires_travel || it.wait_days_after);
                    return (
                      <React.Fragment key={it._key}>
                        <div className="bg-slate-50 rounded-lg px-2.5 py-1.5">
                          <div className="flex items-center gap-1.5">
                            <span contentEditable suppressContentEditableWarning
                              onBlur={e => updateDraftItem(it._key, { content: e.target.textContent.trim() || it.content })}
                              className="flex-1 text-sm text-slate-700 outline-none border-b border-transparent focus:border-slate-300">
                              {it.content}
                            </span>
                            {it.from_ai && <span className="text-[10px] text-violet-400 shrink-0">✨</span>}
                            <button type="button" onClick={() => setDetailOpenKey(detailOpen ? null : it._key)} title="時間／移動／等待細節"
                              className={"shrink-0 flex items-center justify-center w-5 h-5 rounded " + (detailOpen ? "bg-blue-100 text-blue-600" : hasDetail ? "text-blue-600 hover:text-blue-700" : "text-slate-400 hover:text-slate-600")}>
                              <Icon.Search className="w-3.5 h-3.5" />
                            </button>
                            <div className="flex gap-0.5 shrink-0">
                              <button type="button" onClick={() => moveDraftItem(i, -1)} disabled={i === 0} className="p-0.5 rounded disabled:opacity-20 hover:bg-slate-200">
                                <Icon.ChevronUp className="w-3.5 h-3.5" />
                              </button>
                              <button type="button" onClick={() => moveDraftItem(i, 1)} disabled={i === checklistDraft.length - 1} className="p-0.5 rounded disabled:opacity-20 hover:bg-slate-200">
                                <Icon.ChevronDown className="w-3.5 h-3.5" />
                              </button>
                            </div>
                            {it.from_ai ? (
                              <button type="button" onClick={() => sendBackToSuggestions(it)} title="送回建議欄" className="shrink-0 text-xs text-violet-500 hover:text-violet-700">→</button>
                            ) : (
                              <button type="button" onClick={() => removeChecklistDraftItem(it._key)} title="移除" className="shrink-0 text-rose-500 hover:text-rose-600">
                                <Icon.Trash className="w-3.5 h-3.5" />
                              </button>
                            )}
                          </div>
                        </div>
                        {detailOpen && (
                          <div className="flex flex-wrap items-center gap-2 bg-blue-50 rounded-lg px-2.5 py-1.5 -mt-1 text-xs text-slate-600">
                            <label className="flex items-center gap-1">分鐘
                              <input type="number" min="0" value={it.estimated_minutes || ""}
                                onChange={e => updateDraftItem(it._key, { estimated_minutes: e.target.value ? Number(e.target.value) : null })}
                                className="w-14 border border-slate-300 rounded px-1 py-0.5 text-xs" />
                            </label>
                            <label className="flex items-center gap-1">
                              <input type="checkbox" checked={!!it.requires_travel}
                                onChange={e => updateDraftItem(it._key, { requires_travel: e.target.checked })} className="w-3.5 h-3.5" />
                              🚗需移動
                            </label>
                            <label className="flex items-center gap-1">
                              <input type="checkbox" checked={(it.wait_days_after || 0) > 0}
                                onChange={e => updateDraftItem(it._key, { wait_days_after: e.target.checked ? 1 : 0 })} className="w-3.5 h-3.5" />
                              ⏳需等待
                            </label>
                            {(it.wait_days_after || 0) > 0 && (
                              <label className="flex items-center gap-1">天數
                                <input type="number" min="1" value={it.wait_days_after}
                                  onChange={e => updateDraftItem(it._key, { wait_days_after: Number(e.target.value) || 1 })}
                                  className="w-12 border border-slate-300 rounded px-1 py-0.5 text-xs" />
                              </label>
                            )}
                          </div>
                        )}
                      </React.Fragment>
                    );
                  })}
                </div>
                <div className="flex gap-1.5 mt-2">
                  <input value={checklistInput} onChange={e => setChecklistInput(e.target.value)}
                    onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addChecklistDraftItem(); } }}
                    maxLength={150} placeholder="+ 自訂子任務…"
                    className="flex-1 border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs" />
                  <button type="button" onClick={addChecklistDraftItem} className="bg-slate-100 text-slate-600 text-xs rounded-lg px-2.5 py-1.5">新增</button>
                </div>
              </div>
              {/* 右欄：AI 建議 */}
              <div>
                <p className="text-xs font-semibold text-slate-500 mb-1.5">AI 建議</p>
                <div className="space-y-1.5 min-h-[2rem]">
                  {aiSuggestions.length === 0 && <p className="text-xs text-slate-300 px-1">按上方「✨ AI 辨識」會在這裡列出建議</p>}
                  {aiSuggestions.map(s => (
                    <div key={s._key} className="flex items-center gap-1.5 bg-violet-50 rounded-lg px-2.5 py-1.5">
                      <button type="button" onClick={() => importSuggestion(s)} title="匯入左欄" className="shrink-0 text-violet-600 hover:text-violet-800 font-bold">←</button>
                      <span className="flex-1 text-sm text-slate-700">{s.title}</span>
                      <span className="text-xs text-slate-400 whitespace-nowrap shrink-0">
                        {s.estimated_minutes || 0}分{s.requires_travel ? " 🚗" : ""}{s.wait_days_after ? ` ⏳${s.wait_days_after}天` : ""}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>

          <div>
            <label className="text-xs text-slate-500">{fieldLabelPrefix}重要性</label>
            <div className="flex gap-2 mt-1">
              {PRIORITY_LEVELS.map(p => (
                <button key={p} type="button" onClick={() => setPriority(p)}
                  className={"flex-1 py-2 rounded-lg text-sm font-medium text-center " + (priority === p ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>
                  {renderPriorityText(priorityLabels, priorityDisplay, "detail_edit", p, priorityColorOverride)}
                </button>
              ))}
            </div>
          </div>
          <div>
            <div className="flex items-center justify-between">
              <label className="text-xs text-slate-500">{fieldLabelPrefix}任務規模{scaleSource === "auto" ? "（🤖 依 checklist 自動判定）" : ""}</label>
              <button type="button" onClick={toggleScaleLock}
                disabled={scaleSource === "manual" && !scaleLocked && !hasStructuredDetail(checklistDraft)}
                title={scaleSource === "auto" ? "細節未完全決定，先手動輸入規模" : "改回依 checklist 自動判定"}
                className="text-xs text-slate-400 hover:text-slate-600 disabled:opacity-30">
                {scaleSource === "auto" ? "🔒 手動輸入" : "🔄 改回自動判定"}
              </button>
            </div>
            <div className="flex gap-2 mt-1">
              {SCALE_LEVELS.map(n => (
                <button key={n} type="button" disabled={scaleSource === "auto"} onClick={() => setScale(n)}
                  className={"flex-1 py-2 rounded-lg text-sm font-medium text-center disabled:opacity-60 " + (scale === n ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>
                  {renderScaleText(scaleLabels, scaleDisplay, "detail_edit", n, scaleColorOverride)}
                </button>
              ))}
            </div>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-xs text-slate-500">{fieldLabelPrefix}截止日期（可留空）</label>
              <div className="grid grid-cols-2 gap-2 mt-1">
                <input type="date" value={dueDate} onChange={e => setDueDate(e.target.value)}
                  className="border border-slate-300 rounded-lg px-3 py-2 text-sm" />
                <input type="time" value={dueTime} onChange={e => setDueTime(e.target.value)} disabled={!dueDate}
                  className="border border-slate-300 rounded-lg px-3 py-2 text-sm disabled:opacity-50" />
              </div>
              <p className="text-xs text-slate-400 mt-1">時刻留空＝只有日期，逾期以隔天 00:00 為界</p>
            </div>
            <div>
              <label className="text-xs text-slate-500">{fieldLabelPrefix}指派給</label>
              <select value={assigneeId} onChange={e => setAssigneeId(e.target.value)}
                className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                <option value={currentUserId}>我自己（{currentUserName}）</option>
                {(assigneeOptions || []).map(u => (
                  <option key={u.id} value={u.id}>{u.display_name}</option>
                ))}
              </select>
            </div>
          </div>
          {err && <div className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2">{err}</div>}
          <button disabled={busy} className="w-full bg-slate-900 text-white rounded-lg py-2.5 text-sm font-medium text-center disabled:opacity-50">
            {busy ? "建立中…" : "建立任務"}
          </button>
        </form>
      </div>
    </div>
    {aiBusy && <AiThinkingModal label="AI 思考中" />}
    {aiQuotaModal && (
      <ConfirmModal
        title={aiQuotaModal.title}
        message={aiQuotaModal.message}
        confirmLabel="知道了" hideCancel
        onConfirm={() => setAiQuotaModal(null)}
        onCancel={() => setAiQuotaModal(null)}
      />
    )}
    </>
  );
}

// 任務詳情 Modal

        <div className="flex justify-between items-center mb-4">
          <h2 className="text-lg font-bold">選擇要移入的專案</h2>

function MissionDetailModal({ missionId, currentUser, priorityLabels, scaleLabels, priorityDisplay, scaleDisplay, priorityColorOverride, scaleColorOverride, urgencyDisplay, urgencyLabels, urgencyColorOverride, friendProfiles, dueDateDisplayDetail, dueDateColorOverride, projects, showSystemLogs, onToggleShowSystemLogs, updateLogSortOrder, onToggleUpdateLogSortOrder, fieldLabelPrefix, isStarred, onStar, onUnstar, onDelete, onClose, onChanged }) {
  const [mission, setMission] = useState(null);
  const [updates, setUpdates] = useState([]);
  const [checklist, setChecklist] = useState([]);
  const [newChecklistText, setNewChecklistText] = useState("");
  const [editingChecklistId, setEditingChecklistId] = useState(null);
  const [reorderChecklistMode, setReorderChecklistMode] = useState(false);
  const [editingChecklistText, setEditingChecklistText] = useState("");
  const [checklistErr, setChecklistErr] = useState(null);
  const [projectMembers, setProjectMembers] = useState([]);
  const [replyText, setReplyText] = useState("");
  const [finalComment, setFinalComment] = useState("");
  const [waitingReasonInput, setWaitingReasonInput] = useState("");
  const [pendingStatus, setPendingStatus] = useState(null); // 'completed' | 'abandoned'
  const [editingBody, setEditingBody] = useState(false);
  const [editTitle, setEditTitle] = useState("");
  const [editContent, setEditContent] = useState("");
  const [editContentOpen, setEditContentOpen] = useState(false);
  const [editDue, setEditDue] = useState("");
  const [editDueTime, setEditDueTime] = useState("");
  const [editPriority, setEditPriority] = useState("P2");
  const [editScale, setEditScale] = useState(1);
  const [editScaleSource, setEditScaleSource] = useState("manual");
  const [editAssigneeId, setEditAssigneeId] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [confirmDeleteUpdateId, setConfirmDeleteUpdateId] = useState(null);
  const [confirmDeleteChecklistItem, setConfirmDeleteChecklistItem] = useState(null); // { id, content }：待確認刪除的檢查清單項目
  const [confirmDeleteMission, setConfirmDeleteMission] = useState(false); // 是否顯示「永久刪除任務」二次確認
  const [showProjectPicker, setShowProjectPicker] = useState(false);
  const [confirmSwitch, setConfirmSwitch] = useState(null); // { type: "to_personal" } | { type: "to_project", project }
  const [switchBusy, setSwitchBusy] = useState(false);
  const [switchError, setSwitchError] = useState(null);
  const [detailChecklistId, setDetailChecklistId] = useState(null); // 展開「+」細節面板的項目 id
  const [aiBusy, setAiBusy] = useState(false);
  const [aiErr, setAiErr] = useState(null);
  const [aiErrCode, setAiErrCode] = useState(null);
  const [aiQuotaModal, setAiQuotaModal] = useState(null); // { title, message }
  const [aiSuggestions, setAiSuggestions] = useState([]); // 重新辨識的建議子任務（右欄，待匯入）
  const [aiCategoryScores, setAiCategoryScores] = useState(null);
  const [confirmDeadlineOverwrite, setConfirmDeadlineOverwrite] = useState(null); // { date, time }
  const [confirmCategoryOverwrite, setConfirmCategoryOverwrite] = useState(null); // 新的 category_scores，待確認是否覆蓋舊設定
  const [categoryOpen, setCategoryOpen] = useState(false); // 「任務類別」區塊收合狀態
  const [categoryEditing, setCategoryEditing] = useState(false); // 是否進入手動分類編輯
  const [categoryDraft, setCategoryDraft] = useState([]); // 手動分類編輯中的多選草稿
  const [categoryBusy, setCategoryBusy] = useState(false);
  const [categoryErr, setCategoryErr] = useState(null);

  const load = useCallback(async () => {
    const [missionRes, updatesRes, checklistRes] = await Promise.all([
      sb.from("missions")
        .select("*, creator:profiles!missions_creator_id_fkey(id,display_name,email), assignee:profiles!missions_assigned_id_fkey(id,display_name,email), project:projects(id,name)")
        .eq("id", missionId).single(),
      sb.from("mission_updates")
        .select("*, author:profiles!mission_updates_author_id_fkey(id,display_name)")
        .eq("mission_id", missionId).order("created_at", { ascending: true }),
      sb.from("mission_checklist_items")
        .select("*").eq("mission_id", missionId).order("position", { ascending: true }),
    ]);
    const m = missionRes.data;
    // 重要：只有真的拿到資料才更新 mission，絕對不能讓短暫的 race/查詢失敗把已經載入好的
    // mission 蓋成 null——一旦變 null，整個 Modal 頂端的 `if (!mission) return null` 會讓
    // 畫面整個消失，使用者體感上就是「跳出」。連續匯入多筆 AI 建議子任務時，
    // 一次操作會同時觸發好幾個 realtime 重新載入（checklist insert + missions update 各觸發一次，
    // 加上這裡自己主動呼叫的 load()），偶爾疊在一起造成其中一次查詢結果暫時空的，這裡擋下來即可。
    if (m) {
      setMission(m);
    } else if (missionRes.error) {
      console.error("load mission failed:", missionRes.error);
    }
    // 只有「不在編輯模式」時才重新灌入編輯表單的草稿欄位（標題/內容/截止時間/AI 建議…）。
    // 這幾個欄位是使用者正在動的東西——如果每次 load() 都無腦重灌，會出現兩種壞行為：
    // 1. 使用者在編輯標題打到一半，被 realtime 觸發的 load() 蓋掉打字內容
    // 2. AI 建議清單每匯入/送回一筆（觸發 checklist 變動 → realtime → load()）就被清空成 []，
    //    造成「備選子任務空間動不動就消失」——不是 log 即時刷新的問題，就是這裡的無條件 reset
    if (m && !editingBody) {
      setEditTitle(m.title); setEditContent(m.content || "");
      setEditContentOpen(!!m.content);
      if (m.due_date) {
        const precise = m.due_time_precise !== false;
        if (precise) {
          setEditDue(m.due_date.slice(0, 10));
          setEditDueTime(m.due_date.slice(11, 16));
        } else {
          // due_date 實際存的是隔天 00:00 UTC 邊界，編輯欄位要退回顯示原本那一天
          const back = new Date(m.due_date);
          back.setUTCDate(back.getUTCDate() - 1);
          setEditDue(back.toISOString().slice(0, 10));
          setEditDueTime("");
        }
      } else {
        setEditDue(""); setEditDueTime("");
      }
      setEditPriority(m.priority || "P2");
      setEditScale(m.scale || 1);
      setEditScaleSource(m.scale_source || "manual");
      setEditAssigneeId(m.assigned_id);
      setAiSuggestions([]); setAiCategoryScores(null); setAiErr(null);
    }
    if (m) {
      if (m.project_id) {
        const { data: pm } = await sb.from("project_members")
          .select("user:profiles!project_members_user_id_fkey(id,display_name)")
          .eq("project_id", m.project_id);
        setProjectMembers((pm || []).map(r => r.user));
      } else {
        setProjectMembers([]);
      }
    }
    setUpdates(updatesRes.data || []);
    setChecklist(checklistRes.data || []);
  }, [missionId, editingBody]);

  useEffect(() => { load(); }, [load]);

  // Realtime：這筆任務本身、底下的回覆紀錄、或檢查清單，只要有變動就重新整理詳情內容。
  useEffect(() => {
    if (!sb) return;
    const channel = sb.channel("mission-detail-" + missionId)
      .on("postgres_changes", { event: "*", schema: "public", table: "missions", filter: `id=eq.${missionId}` }, () => load())
      .on("postgres_changes", { event: "*", schema: "public", table: "mission_updates", filter: `mission_id=eq.${missionId}` }, () => load())
      .on("postgres_changes", { event: "*", schema: "public", table: "mission_checklist_items", filter: `mission_id=eq.${missionId}` }, () => load())
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [missionId, load]);

  // 任務規模自動判定：scale_source='auto' 且 checklist 有任一項目填了結構化細節（分鐘數/需移動/需等待，
  // 不論來源是 AI 建議還是使用者手動填）時，即時依 checklist 內容重算 scale 並寫回資料庫
  useEffect(() => {
    if (!mission || mission.scale_source !== "auto") return;
    if (!hasStructuredDetail(checklist)) return;
    const nextScale = autoScaleFromChecklist(checklist);
    if (nextScale !== mission.scale) {
      sb.from("missions").update({ scale: nextScale }).eq("id", missionId).then(({ error }) => {
        if (!error) setMission(m => m ? { ...m, scale: nextScale } : m);
      });
    }
  }, [checklist, mission?.scale_source, mission?.scale, missionId]);

  if (!mission) return null;

  const isCreator = mission.creator_id === currentUser.id;
  const isAssignee = mission.assigned_id === currentUser.id;
  const isClosed = mission.status === "completed" || mission.status === "abandoned";
  const canToggleChecklist = (isCreator || isAssignee) && !isClosed;
  // 誰能看得到，誰就能回覆更新（跟資料庫 RLS 的可見範圍規則一致）
  const canReply = mission.status !== "completed" && mission.status !== "abandoned";
  const typeLabel = mission.project_id ? "專案任務" : (mission.assigned_id === mission.creator_id ? "私人任務" : "私人指派任務");
  // 編輯時可選的指派對象：專案任務只能選專案成員；個人任務只能選自己或好友
  const assigneeChoices = mission.project_id
    ? projectMembers
    : [{ id: currentUser.id, display_name: "我自己" }, ...(friendProfiles || [])];

  async function submitReply(e) {
    e.preventDefault();
    setBusy(true); setErr(null);
    try {
      const { error } = await sb.from("mission_updates").insert({
        mission_id: missionId, author_id: currentUser.id, content: replyText,
      });
      if (error) throw error;
      setReplyText("");
      await load();
      onChanged();
    } catch (e2) { setErr(e2.message); } finally { setBusy(false); }
  }

  async function deleteUpdate() {
    const updateId = confirmDeleteUpdateId;
    setConfirmDeleteUpdateId(null);
    const { error } = await sb.from("mission_updates").delete().eq("id", updateId);
    if (error) setErr(error.message);
    else await load();
  }

  async function addChecklistItem(e) {
    e.preventDefault();
    const text = newChecklistText.trim();
    if (!text) return;
    setChecklistErr(null);
    setNewChecklistText("");
    const { error } = await sb.from("mission_checklist_items").insert({ mission_id: missionId, content: text });
    if (error) { setChecklistErr(error.message); setNewChecklistText(text); }
    load();
  }
  async function toggleChecklistItem(item) {
    setChecklistErr(null);
    const nextChecked = !item.is_checked;
    setChecklist(list => list.map(i => i.id === item.id ? { ...i, is_checked: nextChecked } : i));
    const { error } = await sb.from("mission_checklist_items").update({ is_checked: nextChecked }).eq("id", item.id);
    if (error) {
      setChecklistErr(error.message);
      setChecklist(list => list.map(i => i.id === item.id ? { ...i, is_checked: item.is_checked } : i));
    } else {
      load();
    }
  }
  async function deleteChecklistItem(id) {
    setChecklistErr(null);
    const removed = checklist.find(i => i.id === id);
    setChecklist(list => list.filter(i => i.id !== id));
    const { error } = await sb.from("mission_checklist_items").delete().eq("id", id);
    if (error) {
      setChecklistErr(error.message);
      if (removed) setChecklist(list => [...list, removed].sort((a, b) => new Date(a.created_at) - new Date(b.created_at)));
    } else {
      load();
    }
  }
  // 垃圾桶按鈕先跳自繪彈窗二次確認，避免手滑誤觸直接刪掉子任務
  function confirmDeleteChecklistItemAction() {
    if (!confirmDeleteChecklistItem) return;
    deleteChecklistItem(confirmDeleteChecklistItem.id);
    setConfirmDeleteChecklistItem(null);
  }
  function startEditChecklist(item) {
    setEditingChecklistId(item.id);
    setEditingChecklistText(item.content);
  }
  async function saveChecklistEdit(id) {
    const text = editingChecklistText.trim();
    setEditingChecklistId(null);
    if (!text) return;
    setChecklistErr(null);
    const previous = checklist.find(i => i.id === id);
    setChecklist(list => list.map(i => i.id === id ? { ...i, content: text } : i));
    const { error } = await sb.from("mission_checklist_items").update({ content: text }).eq("id", id);
    if (error) {
      setChecklistErr(error.message);
      if (previous) setChecklist(list => list.map(i => i.id === id ? previous : i));
    } else {
      load();
    }
  }
  async function moveChecklistItem(index, dir) {
    const target = index + dir;
    if (target < 0 || target >= checklist.length) return;
    const a = checklist[index], b = checklist[target];
    const reordered = [...checklist];
    [reordered[index], reordered[target]] = [reordered[target], reordered[index]];
    setChecklist(reordered);
    const { error: e1 } = await sb.from("mission_checklist_items").update({ position: b.position }).eq("id", a.id);
    const { error: e2 } = await sb.from("mission_checklist_items").update({ position: a.position }).eq("id", b.id);
    if (e1 || e2) {
      setChecklistErr((e1 || e2).message);
      load();
    }
  }

  // 更新單一項目的結構化細節（分鐘數/需移動/需等待天數）；不論項目來源，填了細節就可能觸發自動規模
  async function updateChecklistDetail(item, patch) {
    setChecklistErr(null);
    const previous = item;
    setChecklist(list => list.map(i => i.id === item.id ? { ...i, ...patch } : i));
    const { error } = await sb.from("mission_checklist_items").update(patch).eq("id", item.id);
    if (error) {
      setChecklistErr(error.message);
      setChecklist(list => list.map(i => i.id === item.id ? previous : i));
    }
  }

  // 「🔒 手動輸入」／「🔄 改回自動判定」：切換 scale_source
  async function toggleScaleSource() {
    const next = mission.scale_source === "auto" ? "manual" : "auto";
    const { error } = await sb.from("missions").update({ scale_source: next }).eq("id", missionId);
    if (!error) {
      setMission(m => ({ ...m, scale_source: next }));
      setEditScaleSource(next);
      if (next === "auto" && hasStructuredDetail(checklist)) {
        const s = autoScaleFromChecklist(checklist);
        await sb.from("missions").update({ scale: s }).eq("id", missionId);
        setMission(m => ({ ...m, scale: s }));
      }
    } else {
      setErr(error.message);
    }
  }

  // 手動分類：開啟編輯時，把目前 category_scores 裡分數 > 0 的分類全部預先勾選，
  // 使用者可以直接調整（刪減/新增），不需要每次都從零開始選
  function startCategoryEdit() {
    const current = (aiCategoryScores !== null ? aiCategoryScores : mission.category_scores) || {};
    setCategoryDraft(AI_CATEGORIES.filter(k => Number(current[k]) > 0));
    setCategoryErr(null);
    setCategoryEditing(true);
  }
  function toggleCategoryDraft(key) {
    setCategoryDraft(list => list.includes(key) ? list.filter(k => k !== key) : [...list, key]);
  }
  async function saveCategoryEdit() {
    setCategoryBusy(true); setCategoryErr(null);
    try {
      const scores = evenSplitScores(categoryDraft);
      const { error } = await sb.from("missions").update({
        category_scores: scores, primary_category: scores ? primaryCategoryOf(scores) : null,
      }).eq("id", missionId);
      if (error) throw error;
      setMission(m => ({ ...m, category_scores: scores, primary_category: scores ? primaryCategoryOf(scores) : null }));
      setAiCategoryScores(null); // 手動存檔後這筆就是最新的權威值，清掉待確認的 AI 草稿，避免顯示邏輯誤用舊草稿蓋掉剛存好的結果
      setCategoryEditing(false);
    } catch (e) {
      setCategoryErr(e.message);
    } finally {
      setCategoryBusy(false);
    }
  }

  // 重新 AI 辨識：只在編輯模式、依目前的 editTitle 重新呼叫。deadline 若原本已有值且判斷出不同結果，
  // 需要使用者在自繪 ConfirmModal 二次確認才覆蓋；scale 交給既有的自動判定 effect 處理，不需額外確認。
  async function rerunAiRecognize() {
    if (!editTitle.trim()) return;
    setAiBusy(true); setAiErr(null); setAiErrCode(null);
    try {
      const result = await callAiRecognize(editTitle.trim());
      if (mission.category_scores) {
        // 之前已經有分類設定（不論是 AI 判斷過還是使用者手動設的），重新辨識不能無聲蓋掉，要讓使用者決定
        setConfirmCategoryOverwrite(result.category_scores);
      } else {
        // 從來沒分類過，直接套用新結果，不用多問
        setAiCategoryScores(result.category_scores);
      }
      setAiSuggestions((result.subtasks || []).map((s, i) => ({ ...s, _key: `ai-${Date.now()}-${i}` })));
      if (result.extracted_deadline_date) {
        const hasExisting = !!editDue;
        const changed = editDue !== result.extracted_deadline_date || editDueTime !== (result.extracted_deadline_time || "");
        if (hasExisting && changed) {
          setConfirmDeadlineOverwrite({ date: result.extracted_deadline_date, time: result.extracted_deadline_time || "" });
        } else if (!hasExisting) {
          setEditDue(result.extracted_deadline_date);
          setEditDueTime(result.extracted_deadline_time || "");
        }
      }
    } catch (e) {
      if (AI_QUOTA_ERROR_CODES.has(e.code)) {
        setAiQuotaModal({ title: AI_QUOTA_ERROR_TITLES[e.code] || "已達使用上限", message: e.message });
      } else {
        setAiErr(e.message); setAiErrCode(e.code || null);
      }
    } finally {
      setAiBusy(false);
    }
  }
  function applyDeadlineOverwrite() {
    setEditDue(confirmDeadlineOverwrite.date);
    setEditDueTime(confirmDeadlineOverwrite.time);
    setConfirmDeadlineOverwrite(null);
  }
  function applyCategoryOverwrite() {
    setAiCategoryScores(confirmCategoryOverwrite);
    setConfirmCategoryOverwrite(null);
  }
  // 右欄「←」匯入：把 AI 建議的子任務直接寫入 checklist（from_ai=true），並從建議清單移除
  async function importAiSuggestion(sugg) {
    setAiSuggestions(list => list.filter(s => s._key !== sugg._key));
    const { error } = await sb.from("mission_checklist_items").insert({
      mission_id: missionId, content: sugg.title,
      estimated_minutes: sugg.estimated_minutes || null,
      requires_travel: !!sugg.requires_travel,
      wait_days_after: sugg.wait_days_after || 0,
      from_ai: true,
    });
    if (error) { setChecklistErr(error.message); setAiSuggestions(list => [...list, sugg]); }
    else {
      if (mission.scale_source !== "auto") await sb.from("missions").update({ scale_source: "auto" }).eq("id", missionId).then(() => setMission(m => ({ ...m, scale_source: "auto" })));
      load();
    }
  }
  // 不要的建議「✕」：純粹從右欄移除，不寫入 checklist
  function discardSuggestion(key) {
    setAiSuggestions(list => list.filter(s => s._key !== key));
  }
  // 現有 checklist 項目「→」：送回右欄建議（從 checklist 刪除，變成可重新匯入的建議卡片），
  // 讓「並排、互相推來推去」的操作跟新增任務時的雙欄邏輯一致
  async function sendChecklistItemToSuggestions(item) {
    setChecklistErr(null);
    setChecklist(list => list.filter(i => i.id !== item.id));
    const { error } = await sb.from("mission_checklist_items").delete().eq("id", item.id);
    if (error) {
      setChecklistErr(error.message);
      setChecklist(list => [...list, item].sort((a, b) => (a.position || 0) - (b.position || 0)));
    } else {
      setAiSuggestions(list => [...list, {
        _key: `back-${item.id}-${Date.now()}`, title: item.content,
        estimated_minutes: item.estimated_minutes, requires_travel: item.requires_travel,
        wait_days_after: item.wait_days_after,
      }]);
    }
  }

  function startSwitch() {
    setSwitchError(null);
    if (mission.project_id) setConfirmSwitch({ type: "to_personal" });
    else setShowProjectPicker(true);
  }
  function pickProject(project) {
    setShowProjectPicker(false);
    setConfirmSwitch({ type: "to_project", project });
  }
  async function confirmSwitchAction() {
    setSwitchBusy(true); setSwitchError(null);
    try {
      const { error } = confirmSwitch.type === "to_personal"
        ? await sb.rpc("move_mission_to_personal", { p_mission_id: missionId })
        : await sb.rpc("move_mission_to_project", { p_mission_id: missionId, p_project_id: confirmSwitch.project.id });
      if (error) throw error;
      setConfirmSwitch(null);
      await load();
      onChanged();
    } catch (e2) {
      setSwitchError(e2.message);
    } finally {
      setSwitchBusy(false);
    }
  }

  async function saveBodyEdit() {
    setBusy(true); setErr(null);
    try {
      const duePrecise = !!editDueTime;
      const dueDateValue = !editDue ? null : (duePrecise ? preciseDeadlineISO(editDue, editDueTime) : nextDayUtcMidnightISO(editDue));
      const { error } = await sb.from("missions").update({
        title: editTitle, content: editContent.trim() || null, priority: editPriority,
        scale: editScale, scale_source: editScaleSource,
        due_date: dueDateValue, due_time_precise: dueDateValue ? duePrecise : true,
        assigned_id: editAssigneeId,
        ...(aiCategoryScores ? { category_scores: aiCategoryScores, primary_category: primaryCategoryOf(aiCategoryScores), ai_raw_input: editTitle } : {}),
      }).eq("id", missionId);
      if (error) throw error;
      setEditingBody(false);
      setAiCategoryScores(null);
      await load();
      onChanged();
    } catch (e2) { setErr(e2.message); } finally { setBusy(false); }
  }

  async function confirmStatusChange() {
    const isWaiting = pendingStatus === "waiting";
    const text = isWaiting ? waitingReasonInput : finalComment;
    if (!text.trim()) { setErr(isWaiting ? "切換狀態前必須輸入等待中之事由" : "切換狀態前必須填寫最終評論"); return; }
    setBusy(true); setErr(null);
    try {
      const payload = isWaiting
        ? { status: "waiting", waiting_reason: text }
        : { status: pendingStatus, final_comment: text };
      const { error } = await sb.from("missions").update(payload).eq("id", missionId);
      if (error) throw error;
      setPendingStatus(null); setFinalComment(""); setWaitingReasonInput("");
      await load();
      onChanged();
    } catch (e2) { setErr(e2.message); } finally { setBusy(false); }
  }

  return (
    <>
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-2xl shadow-xl w-full max-w-4xl max-h-[85vh] overflow-y-auto p-6">
        <div className="flex justify-between items-start mb-4">
          <div>
            <span className={"inline-block text-xs px-2 py-0.5 rounded-full font-medium " + STATUS_COLOR[mission.status]}>{STATUS_LABEL[mission.status]}</span>
            <span className="ml-2 text-xs text-slate-400">{typeLabel}{mission.project_id ? `（${mission.project?.name}）` : ""}</span>
            {isCreator && (
              <button onClick={startSwitch} className="ml-2 inline-block text-xs px-2 py-0.5 rounded-full font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">
                {mission.project_id ? "切至個人專案" : "切至專案內"}
              </button>
            )}
          </div>
          <button onClick={onClose}><Icon.Close className="w-5 h-5 text-slate-400"/></button>
        </div>

        {!editingBody ? (
          <div>
            <h2 className="text-xl font-bold mb-2">{mission.title}</h2>
            {mission.content && <p className="whitespace-pre-wrap text-sm text-slate-700 mb-3">{mission.content}</p>}
            <div className="grid grid-cols-2 gap-2 text-xs text-slate-500 mb-3">
              <div>建立成員：{mission.creator?.display_name}</div>
              <div>指派給：{mission.assignee?.display_name}</div>
              <div>建立時間：{fmt(mission.created_at)}</div>
              <div>最後更新：{fmt(mission.updated_at)}</div>
              <div>截止時間：{renderDueDate(mission, dueDateDisplayDetail, dueDateColorOverride)}</div>
              <div>重要性：{renderPriorityText(priorityLabels, priorityDisplay, "detail_view", mission.priority, priorityColorOverride)}</div>
              <div>任務規模：{renderScaleText(scaleLabels, scaleDisplay, "detail_view", mission.scale, scaleColorOverride)}
                {(isCreator || isAssignee) && !isClosed && (
                  <button onClick={toggleScaleSource} title={mission.scale_source === "auto" ? "改成手動輸入" : "改回依 checklist 自動判定"}
                    className="ml-1.5 text-xs text-slate-400 hover:text-slate-600">
                    {mission.scale_source === "auto" ? "🤖" : "🔒"}
                  </button>
                )}
              </div>
              <div>緊急度：{(() => { const rd = remainingDays(mission.due_date); const u = rd === null ? null : urgencyScore(rd, mission.scale || 1); return renderUrgencyText(urgencyLabels, urgencyDisplay, "detail_view", u, urgencyColorOverride); })()}</div>
            </div>
            <div className="text-xs text-slate-500 mb-3">
              <div className="flex items-center gap-1.5">
                <span>任務類別：{mission.primary_category ? AI_CATEGORY_LABELS[mission.primary_category] : "尚未分類"}</span>
                <button onClick={() => setCategoryOpen(v => !v)} title={categoryOpen ? "收合" : "展開查看完整分類權重"}
                  className={"flex items-center justify-center w-5 h-5 rounded " + (categoryOpen ? "bg-blue-100 text-blue-600" : "text-slate-400 hover:text-slate-600")}>
                  <Icon.Search className="w-3.5 h-3.5" />
                </button>
              </div>
              {categoryOpen && (
                <div className="mt-2 bg-slate-50 rounded-lg p-3">
                  {!categoryEditing ? (
                    <>
                      <CategoryBreakdown scores={mission.category_scores} />
                      {isCreator && (
                        <button onClick={startCategoryEdit} className="mt-2 text-xs text-slate-400 hover:text-slate-600">✏️ 手動設定分類</button>

                    </>
                  ) : (
                    <>
                      <p className="text-xs text-slate-500 mb-1">選擇分類（可複選，選多個會自動平分權重，都不選就是「未分類」）</p>
                      <CategoryMultiSelect selected={categoryDraft} onToggle={toggleCategoryDraft} />
                      {categoryErr && <p className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2 mt-2">{categoryErr}</p>}
                      <div className="flex gap-2 mt-2">
                        <button onClick={saveCategoryEdit} disabled={categoryBusy} className="bg-slate-900 text-white text-xs rounded-lg px-3 py-1.5">{categoryBusy ? "儲存中…" : "儲存"}</button>
                        <button onClick={() => setCategoryEditing(false)} className="text-xs text-slate-500 px-3 py-1.5">取消</button>
                      </div>
                    </>
                  )}
                </div>
              )}
            </div>
            <div className="text-xs text-slate-400 mb-3">
              {mission.project_id
                ? `誰可以看：專案「${mission.project?.name}」的所有成員（${projectMembers.map(p => p.display_name).join("、")}）`
                : `誰可以看：${[mission.creator?.display_name, mission.assignee?.display_name].filter((v, i, a) => v && a.indexOf(v) === i).join("、")}`}
            </div>
            {(!isClosed || isCreator) && (
              <div className="flex items-center justify-end gap-3 mb-2">

                    <button onClick={() => onStar(missionId)} title="注目任務" className="flex items-center justify-center text-pin-active">

                {isCreator && !isClosed && (

                {isCreator && (

              </button>
            </div>
            {aiErr && <p className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2">{aiErr}{aiErrCode ? `（代碼：${aiErrCode}）` : ""}</p>}
            <div>
              <div className="flex items-center gap-2">
                <label className="text-xs text-slate-500">{fieldLabelPrefix}任務內容</label>
                <button type="button" onClick={() => setEditContentOpen(v => !v)}
