                  className={"flex items-center justify-center w-5 h-5 rounded text-xs font-bold " + (editContentOpen ? "bg-blue-600 text-white" : "bg-slate-100 text-slate-500 hover:bg-slate-200")}>
                  +
                </button>
                {!editContentOpen && editContent && <span className="text-xs text-slate-400">（已填寫，點「+」查看）</span>}
              </div>
              {editContentOpen && (
                <textarea rows={4} value={editContent} onChange={e => setEditContent(e.target.value)}
                  placeholder="（任務內容文字描述，可留空）"
                  className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
              )}
            </div>
            <div>
              <div className="flex items-center gap-1.5">
                <label className="text-xs text-slate-500">{fieldLabelPrefix}任務類別：{(() => {
                  const p = aiCategoryScores !== null ? primaryCategoryOf(aiCategoryScores) : mission.primary_category;
                  return p ? AI_CATEGORY_LABELS[p] : "尚未分類";
                })()}</label>
                <button type="button" onClick={() => setCategoryOpen(v => !v)} title={categoryOpen ? "收合" : "展開查看完整分類權重"}
                  className={"flex items-center justify-center w-5 h-5 rounded " + (categoryOpen ? "bg-blue-100 text-blue-600" : "text-slate-400 hover:text-slate-600")}>
                  <Icon.Search className="w-3.5 h-3.5" />
                </button>
              </div>
              {categoryOpen && (
                <div className="mt-2 bg-slate-50 rounded-lg p-3">
                  {!categoryEditing ? (
                    <>
                      <CategoryBreakdown scores={aiCategoryScores !== null ? aiCategoryScores : mission.category_scores} />
                      <button type="button" onClick={startCategoryEdit} className="mt-2 text-xs text-slate-400 hover:text-slate-600">✏️ 手動設定分類</button>
                    </>
                  ) : (
                    <>
                      <p className="text-xs text-slate-500 mb-1">選擇分類（可複選，選多個會自動平分權重，都不選就是「未分類」）</p>
                      <CategoryMultiSelect selected={categoryDraft} onToggle={toggleCategoryDraft} />
                      {categoryErr && <p className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2 mt-2">{categoryErr}</p>}
                      <div className="flex gap-2 mt-2">
                        <button type="button" onClick={saveCategoryEdit} disabled={categoryBusy} className="bg-slate-900 text-white text-xs rounded-lg px-3 py-1.5">{categoryBusy ? "儲存中…" : "儲存"}</button>
                        <button type="button" onClick={() => setCategoryEditing(false)} className="text-xs text-slate-500 px-3 py-1.5">取消</button>
                      </div>
                    </>
                  )}
                </div>
              )}
            </div>
            <div>
              <label className="text-xs text-slate-500">{fieldLabelPrefix}重要性</label>
              <div className="flex gap-2 mt-1">
                {PRIORITY_LEVELS.map(p => (
                  <button key={p} type="button" onClick={() => setEditPriority(p)}
                    className={"flex-1 py-2 rounded-lg text-sm font-medium text-center " + (editPriority === p ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>
                    {renderPriorityText(priorityLabels, priorityDisplay, "detail_edit", p, priorityColorOverride)}
                  </button>
                ))}
              </div>
            </div>
            <div>
              <div className="flex items-center justify-between">
                <label className="text-xs text-slate-500">{fieldLabelPrefix}任務規模{editScaleSource === "auto" ? "（🤖 依 checklist 自動判定）" : ""}</label>
                <button type="button" onClick={() => {
                    const next = editScaleSource === "auto" ? "manual" : "auto";
                    setEditScaleSource(next);
                    if (next === "auto" && hasStructuredDetail(checklist)) setEditScale(autoScaleFromChecklist(checklist));
                  }}
                  disabled={editScaleSource === "manual" && !hasStructuredDetail(checklist)}
                  title={editScaleSource === "auto" ? "改成手動輸入（細節未完全決定時可先手動輸入規模）" : "改回依 checklist 自動判定"}
                  className="text-xs text-slate-400 hover:text-slate-600 disabled:opacity-30">
                  {editScaleSource === "auto" ? "🔒 手動輸入" : "🔄 改回自動判定"}
                </button>
              </div>
              <div className="flex gap-2 mt-1">
                {SCALE_LEVELS.map(n => (
                  <button key={n} type="button" disabled={editScaleSource === "auto"}
                    onClick={() => setEditScale(n)}
                    className={"flex-1 py-2 rounded-lg text-sm font-medium text-center disabled:opacity-60 " + (editScale === n ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>
                    {renderScaleText(scaleLabels, scaleDisplay, "detail_edit", n, scaleColorOverride)}
                  </button>
                ))}
              </div>
            </div>
            <div>
              <label className="text-xs text-slate-500">{fieldLabelPrefix}截止日期（可留空）</label>
              <div className="grid grid-cols-2 gap-2 mt-1">
                <input type="date" value={editDue} onChange={e => setEditDue(e.target.value)} className="border border-slate-300 rounded-lg px-3 py-2 text-sm" />
                <input type="time" value={editDueTime} onChange={e => setEditDueTime(e.target.value)} disabled={!editDue}
                  placeholder="時刻（可留空）" className="border border-slate-300 rounded-lg px-3 py-2 text-sm disabled:opacity-50" />
              </div>
              <p className="text-xs text-slate-400 mt-1">時刻留空代表只有日期沒有精確時間，逾期判斷會以隔天 00:00 為界</p>
            </div>
            {aiSuggestions.length > 0 && (
              <p className="text-xs text-violet-600 bg-violet-50 rounded-lg px-3 py-2">✨ AI 有 {aiSuggestions.length} 項子任務建議，在下方「檢查清單」區塊可以匯入或調整</p>
            )}
            <div>
              <label className="text-xs text-slate-500">{fieldLabelPrefix}指派給{mission.project_id ? "（僅限此專案成員）" : "（自己或好友）"}</label>
              <select value={editAssigneeId} onChange={e => setEditAssigneeId(e.target.value)}
                className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                {assigneeChoices.map(u => (
                  <option key={u.id} value={u.id}>{u.id === currentUser.id ? "我自己" : u.display_name}</option>
                ))}
              </select>
            </div>
            <div className="flex gap-2">
              <button onClick={saveBodyEdit} disabled={busy} className="bg-slate-900 text-white text-xs rounded-lg px-3 py-1.5">儲存</button>
              <button onClick={() => { setEditingBody(false); setAiSuggestions([]); setAiCategoryScores(null); setConfirmCategoryOverwrite(null); }} className="text-xs text-slate-500 px-3 py-1.5">取消</button>
            </div>
          </div>
        )}
        {confirmDeadlineOverwrite && (
          <ConfirmModal
            title="覆蓋截止時間？"
            message={`AI 重新判斷出的截止時間是 ${confirmDeadlineOverwrite.date}${confirmDeadlineOverwrite.time ? " " + confirmDeadlineOverwrite.time : ""}，要覆蓋目前的 ${editDue}${editDueTime ? " " + editDueTime : ""} 嗎？`}
            confirmLabel="覆蓋" cancelLabel="保留原值"
            onConfirm={applyDeadlineOverwrite}
            onCancel={() => setConfirmDeadlineOverwrite(null)}
          />
        )}
        {confirmCategoryOverwrite && (
          <ConfirmModal
            title="覆蓋任務分類？"
            message="任務分類將被 AI 更新，確認或保留舊設定？"
            confirmLabel="確認" cancelLabel="保留原設定"
            onConfirm={applyCategoryOverwrite}
            onCancel={() => setConfirmCategoryOverwrite(null)}
          />
        )}
        {aiBusy && <AiThinkingModal label="AI 思考中" />}
        {aiQuotaModal && (
          <ConfirmModal
            title={aiQuotaModal.title}
            message={aiQuotaModal.message}
            confirmLabel="知道了" hideCancel
            onConfirm={() => setAiQuotaModal(null)}
            onCancel={() => setAiQuotaModal(null)}
          />
        )}

        {mission.final_comment && (
          <div className="bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 text-sm text-amber-800 mb-4">
            <strong>最終評論：</strong>{mission.final_comment}
          </div>
        )}

        {mission.status === "waiting" && mission.waiting_reason && (
          <div className="bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 text-sm text-amber-800 mb-4">
            <strong>等待中事由：</strong>{mission.waiting_reason}
          </div>
        )}

        {(checklist.length > 0 || isCreator || isAssignee) && (
          <div className="border-t border-slate-200 pt-3 mt-3">
            <div className="flex justify-between items-center mb-2">
              <div className="flex items-center gap-2">
                <h3 className="text-sm font-semibold text-slate-600">檢查清單</h3>
                {canToggleChecklist && checklist.length > 1 && (
                  <button onClick={() => setReorderChecklistMode(v => !v)} title="調整順序"
                    className={"flex items-center justify-center rounded-lg w-6 h-6 " + (reorderChecklistMode ? "bg-blue-600 text-white" : "bg-slate-100 hover:bg-slate-200 text-slate-600")}>
                    <Icon.Sort className="w-4 h-4" />
                  </button>
                )}
              </div>
              {checklist.length > 0 && (
                <span className="text-xs text-slate-400">
                  {checklist.filter(i => i.is_checked).length} / {checklist.length}（{checklistProgress(checklist, mission.status)}%）
                </span>
              )}
            </div>
            {checklist.length > 0 && (
              <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden mb-3" style={{ border: "1px solid #666666" }}>
                <div className="h-2 bg-blue-600" style={{ width: `${checklistProgress(checklist, mission.status)}%` }} />

            <div className={aiSuggestions.length > 0 ? "grid grid-cols-2 gap-3" : ""}>
              <div>
                {aiSuggestions.length > 0 && <p className="text-xs font-semibold text-slate-500 mb-1.5">目前的檢查清單</p>}
                <div className="space-y-1.5">

                    const isAuthor = item.created_by === currentUser.id;

                        {isEditing ? (

                            {hasDetail && <span className="ml-1.5 text-xs text-slate-400">
                              {item.estimated_minutes ? `${item.estimated_minutes}分` : ""}{item.requires_travel ? " 🚗" : ""}{item.wait_days_after ? ` ⏳${item.wait_days_after}天` : ""}

                          </button>
                        )}
                        {!reorderChecklistMode && canToggleChecklist && aiSuggestions.length > 0 && !isClosed && (
                          <button onClick={() => sendChecklistItemToSuggestions(item)} title="送回右欄建議（會從清單移除）"
                            className="flex items-center justify-center text-xs text-violet-500 hover:text-violet-700">→</button>
                        )}
                        {reorderChecklistMode ? (
                          <div className="flex gap-1">
                            <button onClick={() => moveChecklistItem(index, -1)} disabled={index === 0} className="p-1 rounded disabled:opacity-30 hover:bg-slate-100">
                              <Icon.ChevronUp className="w-4 h-4" />
                            </button>
                            <button onClick={() => moveChecklistItem(index, 1)} disabled={index === checklist.length - 1} className="p-1 rounded disabled:opacity-30 hover:bg-slate-100">
                              <Icon.ChevronDown className="w-4 h-4" />
                            </button>
                          </div>
                        ) : (
                          <>
                            {canEditDelete && (
                              <button onClick={() => isEditing ? saveChecklistEdit(item.id) : startEditChecklist(item)} title="編輯內容"
                                className={"flex items-center justify-center w-6 h-6 rounded-lg " + (isEditing ? "bg-blue-600 text-white" : "text-slate-500 hover:text-slate-600")}>
                                <Icon.Edit className="w-4 h-4" />
                              </button>
                            )}
                            {canEditDelete && (
                              <button onClick={() => setConfirmDeleteChecklistItem({ id: item.id, content: item.content })} title="刪除項目"
                                className={"flex items-center justify-center " + (isEditing ? "text-slate-400 hover:text-slate-600" : "text-rose-500 hover:text-rose-600")}>
                                <Icon.Trash className="w-4 h-4" />
                              </button>
                            )}
                          </>
                        )}
                      </div>
                      {detailOpen && (
                        <div className="flex flex-wrap items-center gap-3 bg-blue-50 rounded-lg px-3 py-2 -mt-1 text-xs text-slate-600">
                          <label className="flex items-center gap-1.5">
                            分鐘數
                            <input type="number" min="0" value={item.estimated_minutes || ""} disabled={!canToggleChecklist}
                              onChange={e => updateChecklistDetail(item, { estimated_minutes: e.target.value ? Number(e.target.value) : null })}
                              className="w-16 border border-slate-300 rounded px-1.5 py-0.5 text-xs" />
                          </label>
                          <label className="flex items-center gap-1.5">
                            <input type="checkbox" checked={!!item.requires_travel} disabled={!canToggleChecklist}
                              onChange={e => updateChecklistDetail(item, { requires_travel: e.target.checked })} className="w-3.5 h-3.5" />
                            🚗 需移動
                          </label>
                          <label className="flex items-center gap-1.5">
                            <input type="checkbox" checked={(item.wait_days_after || 0) > 0} disabled={!canToggleChecklist}
                              onChange={e => updateChecklistDetail(item, { wait_days_after: e.target.checked ? 1 : 0 })} className="w-3.5 h-3.5" />
                            ⏳ 需等待
                          </label>
                          {(item.wait_days_after || 0) > 0 && (
                            <label className="flex items-center gap-1.5">
                              天數
                              <input type="number" min="1" value={item.wait_days_after} disabled={!canToggleChecklist}
                                onChange={e => updateChecklistDetail(item, { wait_days_after: Number(e.target.value) || 1 })}
                                className="w-14 border border-slate-300 rounded px-1.5 py-0.5 text-xs" />
                            </label>
                          )}
                        </div>
                      )}
                      </React.Fragment>
                    );
                  })}
                </div>
                {(isCreator || isAssignee) && !isClosed && (
                  <form onSubmit={addChecklistItem} className="flex gap-2 mt-2">
                    <input value={newChecklistText} onChange={e => setNewChecklistText(e.target.value)}
                      maxLength={150} placeholder="新增檢查清單項目…"
                      className="flex-1 border border-slate-300 rounded-lg px-3 py-1.5 text-sm" />
                    <button type="submit" className="bg-slate-900 text-white text-xs rounded-lg px-3 py-1.5">新增</button>
                  </form>
                )}
              </div>
              {aiSuggestions.length > 0 && (
                <div>
                  <div className="flex items-center justify-between mb-1.5">
                    <p className="text-xs font-semibold text-slate-500">✨ AI 建議</p>
                    <button type="button" onClick={() => setAiSuggestions([])} className="text-xs text-slate-400 hover:text-slate-600">清空建議</button>
                  </div>
                  <div className="space-y-1.5">
                    {aiSuggestions.map(s => (
                      <div key={s._key} className="flex items-center gap-1.5 bg-violet-50 rounded-lg px-2.5 py-1.5">
                        <button type="button" onClick={() => importAiSuggestion(s)} title="匯入左欄" className="shrink-0 text-violet-600 hover:text-violet-800 font-bold">←</button>
                        <span className="flex-1 text-sm text-slate-700">{s.title}</span>
                        <span className="text-xs text-slate-400 whitespace-nowrap shrink-0">
                          {s.estimated_minutes || 0}分{s.requires_travel ? " 🚗" : ""}{s.wait_days_after ? ` ⏳${s.wait_days_after}天` : ""}
                        </span>
                        <button type="button" onClick={() => discardSuggestion(s._key)} title="移除建議（不匯入）" className="shrink-0 text-slate-400 hover:text-rose-500">
                          <Icon.Trash className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
            {checklistErr && <p className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2 mt-2">{checklistErr}</p>}
          </div>
        )}

        <div className="border-t border-slate-200 pt-3 mt-3">
          <div className="flex justify-between items-center mb-2">
            <h3 className="text-sm font-semibold text-slate-600">更新紀錄</h3>
            <div className="flex items-center gap-2">
              <button onClick={onToggleUpdateLogSortOrder} title="切換更新紀錄排序方向"
                className="flex items-center gap-1 text-xs text-slate-500 hover:text-slate-600">
                {(updateLogSortOrder || "desc") === "desc" ? <Icon.ChevronDown className="w-3.5 h-3.5" /> : <Icon.ChevronUp className="w-3.5 h-3.5" />}
                {(updateLogSortOrder || "desc") === "desc" ? "新到舊" : "舊到新"}
              </button>
              <label className="flex items-center gap-1.5 text-xs text-slate-500">
                <input type="checkbox" checked={showSystemLogs !== false} onChange={onToggleShowSystemLogs} className="w-4 h-4" />
                顯示〈系統自動記錄〉
              </label>
            </div>
          </div>
          <div className="space-y-2 max-h-56 overflow-y-auto pr-1">
            {(() => {
              const filteredUpdates = showSystemLogs === false ? updates.filter(u => !u.is_system) : updates;
              const sortDir = (updateLogSortOrder || "desc") === "desc" ? -1 : 1;
              const visibleUpdates = [...filteredUpdates].sort((a, b) => sortDir * (new Date(a.created_at) - new Date(b.created_at)));
              return (
                <>
                  {visibleUpdates.length === 0 && <p className="text-xs text-slate-400">尚無更新紀錄</p>}
                  {visibleUpdates.map(u => (
                    <div key={u.id} className="bg-slate-50 rounded-lg px-3 py-2">
                      <div className="flex justify-between text-xs text-slate-400 mb-1">
                        <span>{u.is_system ? "System" : u.author?.display_name}</span>
                        <span>{fmt(u.created_at)}</span>
                      </div>
                      <p className="text-sm whitespace-pre-wrap">
                        {u.is_system
                          ? u.content.split("\n").map((line, i) => <React.Fragment key={i}>{i > 0 && <br/>}{u.author?.display_name}{line}</React.Fragment>)
                          : u.content}
                      </p>
                      {u.is_system ? (
                        <div className="flex justify-end mt-1">
                          <span className="text-xs text-slate-400">〈系統自動記錄〉</span>
                        </div>
                      ) : u.author_id === currentUser.id && mission.status !== "completed" && mission.status !== "abandoned" && (
                        <div className="flex justify-end mt-1">
                          <button onClick={() => setConfirmDeleteUpdateId(u.id)} title="刪除留言" className="flex items-center justify-center text-rose-500 hover:text-rose-600">
                            <Icon.Trash className="w-4 h-4" />
                          </button>
                        </div>
                      )}
                    </div>
                  ))}
                </>
              );
            })()}
          </div>
        </div>

        {confirmDeleteUpdateId && (
          <ConfirmModal
            title="刪除留言"
            message="此留言將永久刪除，無法復原！確定或取消？"
            confirmLabel="確定刪除"
            danger
            onConfirm={deleteUpdate}
            onCancel={() => setConfirmDeleteUpdateId(null)}
          />
        )}

        {confirmDeleteChecklistItem && (
          <ConfirmModal
            title="刪除子任務"
            message={`確定要刪除「${confirmDeleteChecklistItem.content}」這個子任務嗎？此動作無法復原！`}
            confirmLabel="確定刪除"
            danger
            onConfirm={confirmDeleteChecklistItemAction}
            onCancel={() => setConfirmDeleteChecklistItem(null)}
          />
        )}
        {confirmDeleteMission && (
          <ConfirmModal
            title="永久刪除任務"
            message={`確定要永久刪除「${mission.title}」這個任務嗎？此動作無法復原！`}
            confirmLabel="確定刪除"
            danger
            onConfirm={() => { onDelete(missionId); setConfirmDeleteMission(false); onClose(); }}
            onCancel={() => setConfirmDeleteMission(false)}
          />
        )}

        {err && <div className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2 mt-3">{err}</div>}

        {canReply && (
          <form onSubmit={submitReply} className="mt-4 border-t border-slate-200 pt-3">
            <label className="text-xs text-slate-500">更新任務</label>
            <textarea required rows={2} value={replyText} onChange={e => setReplyText(e.target.value)}
              placeholder="輸入更新內容…" className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
            <button disabled={busy} className="mt-2 bg-blue-600 text-white text-xs rounded-lg px-4 py-2 disabled:opacity-50">送出更新</button>
          </form>
        )}

        {(isCreator || isAssignee) && (mission.status === "added" || mission.status === "in_progress" || mission.status === "waiting") && (
          <div className="mt-4 border-t border-slate-200 pt-3">
            {!pendingStatus ? (
              <div className="flex gap-2">
                {isCreator && (
                  <button onClick={() => setPendingStatus("completed")} className="text-xs bg-emerald-600 text-white rounded-lg px-3 py-1.5">標記為已完成</button>
                )}
                {mission.status !== "waiting" && (
                  <button onClick={() => setPendingStatus("waiting")} className="text-xs bg-amber-500 text-white rounded-lg px-3 py-1.5">標記為等待中</button>
                )}
                {isCreator && (
                  <button onClick={() => setPendingStatus("abandoned")} className="text-xs bg-rose-600 text-white rounded-lg px-3 py-1.5">標記為已棄置</button>
                )}
              </div>
            ) : (
              <div className="space-y-2">
                <label className="text-xs text-slate-500">
                  {pendingStatus === "waiting" ? "切換為「等待中」前，請輸入等待中之事由" : `切換為「${STATUS_LABEL[pendingStatus]}」前，請填寫最終評論`}
                </label>
                <textarea rows={2} value={pendingStatus === "waiting" ? waitingReasonInput : finalComment}
                  onChange={e => pendingStatus === "waiting" ? setWaitingReasonInput(e.target.value) : setFinalComment(e.target.value)}
                  placeholder={pendingStatus === "waiting" ? "請輸入等待中之事由" : ""}
                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
                <div className="flex gap-2">
                  <button onClick={confirmStatusChange} disabled={busy} className="text-xs bg-slate-900 text-white rounded-lg px-3 py-1.5">確認切換</button>
                  <button onClick={() => { setPendingStatus(null); setFinalComment(""); setWaitingReasonInput(""); }} className="text-xs text-slate-500 px-3 py-1.5">取消</button>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>

    {showProjectPicker && (
      <ProjectPickerModal
        projects={(projects || []).filter(p => p.id !== mission.project_id)}
        onPick={pickProject}
        onClose={() => setShowProjectPicker(false)}
      />
    )}

    {confirmSwitch && (
      <ConfirmModal
        title="切換任務歸屬"
        message={
          confirmSwitch.type === "to_personal"
            ? "確定要將此任務移出目前的專案、退回個人任務嗎？\n（若指派對象並非您的個人好友，系統將無法完成這個動作）"
            : `確定將此任務移入專案「${confirmSwitch.project.name}」嗎？\n（若指派對象目前不是該專案成員，且您是該專案的擁有者，系統會一併將對方加入為專案成員；若您不是擁有者，指派對象又不在該專案內，則無法完成）`
        }
        confirmLabel={switchBusy ? "處理中…" : "確定"}
        onConfirm={confirmSwitchAction}
        onCancel={() => setConfirmSwitch(null)}
      />
    )}

    {switchError && (
      <ConfirmModal
        title="無法切換任務歸屬"
        message={switchError}
        confirmLabel="確定"
        hideCancel
        onConfirm={() => setSwitchError(null)}
        onCancel={() => setSwitchError(null)}
      />
    )}
    </>
  );
}

// =====================================================================
// 任務清單（傳統列表模式）
// =====================================================================
const COLUMN_LABELS = {
  created_at: "建立時間", creator: "建立成員", assignee: "指派給", relation: "指派關係",
  updated_at: "最後更新", procrastination_days: "拖延天數", title: "任務標題", priority: "重要性",
  scale: "任務規模", urgency: "緊急度", due_date: "截止時間", status: "狀態", action: "動作",
  no_progress_days: "無進度天數", closed_at: "完成/棄置時間", final_comment: "最終評論",
  checklist_progress: "檢查清單進度", category_score: "類別分數", source: "來源",
};

function MissionListView({ missions, onOpen, priorityLabels, scaleLabels, priorityDisplay, scaleDisplay, priorityColorOverride, scaleColorOverride, urgencyDisplay, urgencyLabels, urgencyColorOverride, visibleColumns, currentUserId, hiddenIds, onHide, onUnhide, onDelete, relationDisplayMode, dueDateDisplayList, dueDateColorOverride, sortMode, sortHighlightColor, forceShowSortColumn, noProgressColorOverride, noProgressSeverityDays, starredIds, onStar, onUnstar, starOverrideColor, columnMode, columnOrder, checklistDisplayMode, showCategoryColumns, categoryKey, projectNameById }) {
  const isClosedMode = columnMode === "closed";
  const columnDefs = isClosedMode ? TASK_LIST_COLUMNS_CLOSED : TASK_LIST_COLUMNS;
  const vc = visibleColumns || (isClosedMode ? DEFAULT_VISIBLE_COLUMNS_CLOSED : DEFAULT_VISIBLE_COLUMNS);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const confirmDeleteMission = missions.find(m => m.id === confirmDeleteId) || null;

  const highlightCols = SORT_MODE_HIGHLIGHT_COLUMNS[sortMode] || [];
  const highlightSet = new Set(highlightCols);
  const highlightHex = (SORT_HIGHLIGHT_COLORS[sortHighlightColor] || SORT_HIGHLIGHT_COLORS.blue).hex;
  const highlightRgb = hexToRgbString(highlightHex);
  const headerHighlightStyle = { background: `rgba(${highlightRgb},0.15)` };
  const cellHighlightStyle = { background: `rgba(${highlightRgb},0.08)` };
  const starColorEntry = starOverrideColor && starOverrideColor !== "none" ? SORT_HIGHLIGHT_COLORS[starOverrideColor] : null;
  const starCellStyle = starColorEntry ? { background: `rgba(${hexToRgbString(starColorEntry.hex)},0.12)` } : null;

  // 決定欄位顯示順序：優先套用使用者自訂的排列順序（若有效），否則用預設順序；
  // 開啟「強制顯示排序欄位在最前面」時，再把排序對應的欄位（不論原本是否被隱藏）額外提到最前面
  const defaultBaseKeys = columnDefs.map(c => c.key);
  const baseKeys = (Array.isArray(columnOrder) && columnOrder.length === defaultBaseKeys.length && defaultBaseKeys.every(k => columnOrder.includes(k)))
    ? columnOrder
    : defaultBaseKeys;
  const orderedKeys = forceShowSortColumn && highlightCols.length
    ? [...highlightCols.filter(k => baseKeys.includes(k)), ...baseKeys.filter(k => !highlightSet.has(k))]
    : baseKeys;
  // 「類別分數」「來源」這兩欄只有類別瀏覽頁會傳 showCategoryColumns=true 才會出現；
  // 個人任務／專案任務即使使用者在設定裡勾選、調整過順序，這裡還是強制濾掉，避免跟一般任務列表混在一起
  const visibleKeys = orderedKeys
    .filter(k => showCategoryColumns || (k !== "category_score" && k !== "source"))
    .filter(k => vc[k] || (forceShowSortColumn && highlightSet.has(k)));
  const colCount = visibleKeys.length || 1;

  function handleConfirmDelete() {
    onDelete(confirmDeleteId);
    setConfirmDeleteId(null);
  }

  function th(key) {
    return <th key={key} className="px-4 py-2 font-medium" style={highlightSet.has(key) ? headerHighlightStyle : undefined}>{COLUMN_LABELS[key]}</th>;
  }
  function td(key, content, extraClass, onClickCell, rowStarStyle, extraStyle) {
    const baseStyle = rowStarStyle || (highlightSet.has(key) ? cellHighlightStyle : undefined);
    const style = extraStyle ? { ...baseStyle, ...extraStyle } : baseStyle;
    return <td key={key} className={extraClass || "px-4 py-3 whitespace-nowrap"} style={style} onClick={onClickCell}>{content}</td>;
  }

  function renderCell(key, m) {
    const rd = remainingDays(m.due_date);
    const urgency = rd === null ? null : urgencyScore(rd, m.scale || 1);
    const isHidden = hiddenIds && hiddenIds.has(m.id);
    const isOwn = m.creator_id === currentUserId;
    const isOpenStatus = m.status === "added" || m.status === "in_progress" || m.status === "waiting";
    const isStarred = starredIds && starredIds.has(m.id);
    const rowStarStyle = isStarred ? starCellStyle : null;
    switch (key) {
      case "closed_at": return td(key, fmt(m.updated_at), "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "final_comment": return td(key, m.final_comment || "—", "px-4 py-3 text-slate-600", null, rowStarStyle,
        { maxWidth: 260, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" });
      case "created_at": return td(key, fmt(m.created_at), "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "creator": return td(key, m.creator?.display_name, null, null, rowStarStyle);
      case "assignee": return td(key, m.assignee?.display_name, null, null, rowStarStyle);
      case "relation": return td(key,
        relationDisplayMode === "text"
          ? RELATION_LABELS[relationCategory(m, currentUserId)]
          : <AssignRelationIcon {...RELATION_ICON_PROPS[relationCategory(m, currentUserId)]} className="w-10 h-6" />,
        null, null, rowStarStyle
      );
      case "updated_at": return td(key, fmt(m.updated_at), "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "procrastination_days": return td(key, procrastinationDays(m).toFixed(1) + "天", "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "no_progress_days": return td(key,
        noProgressColorOverride
          ? <span style={{ color: noProgressColor(m.updated_at, noProgressSeverityDays) }}>{noProgressText(m.updated_at, m.status)}</span>
          : noProgressText(m.updated_at, m.status),
        "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle
      );
      case "title": return td(key, m.title, "px-4 py-3 font-medium", null, rowStarStyle);
      case "category_score": return td(key,
        m.category_scores ? (Number(m.category_scores[categoryKey]) || 0).toFixed(2) : "—",
        "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "source": return td(key,
        m.project_id ? (projectNameById?.[m.project_id] || "專案任務") : "個人任務",
        "px-4 py-3 whitespace-nowrap text-slate-400", null, rowStarStyle);
      case "priority": return td(key, renderPriorityText(priorityLabels, priorityDisplay, "list", m.priority, priorityColorOverride), "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "scale": return td(key, renderScaleText(scaleLabels, scaleDisplay, "list", m.scale || 1, scaleColorOverride), "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "urgency": return td(key, renderUrgencyText(urgencyLabels, urgencyDisplay, "list", urgency, urgencyColorOverride), "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "due_date": return td(key, renderDueDate(m, dueDateDisplayList, dueDateColorOverride), "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      case "status": return td(key, <span className={"text-xs px-2 py-0.5 rounded-full font-medium " + STATUS_COLOR[m.status]}>{STATUS_LABEL[m.status]}</span>, null, null, rowStarStyle);
      case "checklist_progress": {
        const pct = checklistProgress(m.mission_checklist_items, m.status);
        const content = pct === null ? "—" : checklistDisplayMode === "percent" ? `${pct}%` : (
          <div className="w-20 bg-slate-100 rounded-full h-2 overflow-hidden" style={{ border: "1px solid #666666" }}>
            <div className="h-2 bg-blue-600" style={{ width: `${pct}%` }} />
          </div>
        );
        return td(key, content, "px-4 py-3 whitespace-nowrap text-slate-500", null, rowStarStyle);
      }
      case "action": return td(key, (
        <div className="flex items-center gap-2">
          {isOpenStatus && !isHidden && (
            isStarred ? (
              <button onClick={() => onUnstar(m.id)} title="取消關注" className="flex items-center justify-center text-pin-inactive">
                <Icon.Unboost className="w-4 h-4" />
              </button>
            ) : (
              <button onClick={() => onStar(m.id)} title="注目任務" className="flex items-center justify-center text-pin-active">
                <Icon.Boost className="w-4 h-4" />
              </button>
            )
          )}
          {!m.project_id && (
            isHidden ? (
              <button onClick={() => onUnhide(m.id)} title="取消隱藏" className="flex items-center justify-center text-blue-600 hover:text-blue-700">
                <Icon.Show className="w-4 h-4" />
              </button>
            ) : !isOwn ? (
              <button onClick={() => onHide(m.id)} title="隱藏" className="flex items-center justify-center text-slate-500 hover:text-slate-600">
                <Icon.Hidden className="w-4 h-4" />
              </button>
            ) : null
          )}
          {isOwn && (
            <button onClick={() => setConfirmDeleteId(m.id)} title="永久刪除任務" className="flex items-center justify-center text-rose-500 hover:text-rose-600">
              <Icon.Trash className="w-4 h-4" />
            </button>
          )}
        </div>
      ), null, e => e.stopPropagation(), rowStarStyle);
      default: return null;
    }
  }

  return (
    <div className="bg-white rounded-2xl shadow overflow-x-auto">
      <table className="w-full text-sm">
        <thead>

// =====================================================================
// 甘特圖模式
// =====================================================================
function GanttView({ missions, onOpen }) {
  const [pxPerDay, setPxPerDay] = useState(36);
  const [viewStart, setViewStart] = useState(() => { const d = new Date(); d.setDate(d.getDate() - 3); d.setHours(0,0,0,0); return d; });
  const totalDays = 30;
  const viewEnd = useMemo(() => { const d = new Date(viewStart); d.setDate(d.getDate() + totalDays); return d; }, [viewStart]);
  const today = new Date();
  const nowLeftPct = nowLinePercent();

  function shift(days) {
    setViewStart(d => { const nd = new Date(d); nd.setDate(nd.getDate() + days); return nd; });
  }

  const days = useMemo(() => {
    const arr = [];
    for (let i = 0; i < totalDays; i++) { const d = new Date(viewStart); d.setDate(d.getDate() + i); arr.push(d); }
    return arr;
  }, [viewStart]);

  function dayDiff(a, b) { return (b - a) / 86400000; }

  const rows = missions.map(m => {
    const start = new Date(m.created_at);
    const end = m.due_date ? new Date(m.due_date) : new Date(start.getTime() + 86400000);
    const clampedStart = start < viewStart ? viewStart : start;
    const clampedEnd = end > viewEnd ? viewEnd : end;
    const visible = clampedEnd >= viewStart && clampedStart <= viewEnd;
    const left = Math.max(0, dayDiff(viewStart, clampedStart)) * pxPerDay;
    const width = Math.max(dayDiff(clampedStart, clampedEnd) * pxPerDay, 6);
    // 色塊顏色：依緊急度分數（0~2）對應青綠→橘→紅；沒有截止時間就用狀態色當備案
    const rd = remainingDays(m.due_date);
    const barColor = rd === null ? STATUS_BAR_COLOR[m.status] : urgencyColor(urgencyScore(rd, m.scale || 1));
    return { m, visible, left, width, barColor };
  });

  return (
    <div className="bg-white rounded-2xl shadow p-4">
      <div className="flex items-center justify-between mb-3 gap-2 flex-wrap">
        <div className="flex gap-2">
          <button onClick={() => shift(-7)} className="text-xs px-2 py-1 rounded-lg bg-slate-100">← 上一週</button>
          <button onClick={() => shift(7)} className="text-xs px-2 py-1 rounded-lg bg-slate-100">下一週 →</button>
          <button onClick={() => { const d = new Date(); d.setDate(d.getDate() - 3); setViewStart(d); }} className="text-xs px-2 py-1 rounded-lg bg-slate-100">回到今天</button>
        </div>
        <div className="flex gap-2 items-center">
          <span className="text-xs text-slate-400">縮放</span>
          <button onClick={() => setPxPerDay(p => Math.max(16, p - 8))} className="text-xs w-7 h-7 rounded-lg bg-slate-100">－</button>
          <button onClick={() => setPxPerDay(p => Math.min(80, p + 8))} className="text-xs w-7 h-7 rounded-lg bg-slate-100">＋</button>
        </div>
      </div>
      <div className="overflow-x-auto">
        <div style={{ width: totalDays * pxPerDay + 180 }}>
          <div className="flex sticky top-0 bg-white z-10" style={{ paddingLeft: 180 }}>
            {days.map((d, i) => {
              const todayCol = isSameDay(d, today);
              return (
                <div key={i} style={{ width: pxPerDay, ...(todayCol ? { "--now-line-left": nowLeftPct + "%" } : {}) }}
                  className={"tl-day-col text-[10px] text-center border-l border-slate-100 py-1 " + (todayCol ? "is-today" : "text-slate-400")}>
                  <div>{d.getMonth()+1}/{d.getDate()}</div>
                  <div>{WEEKDAY_LABELS[d.getDay()]}</div>
                </div>
              );
            })}
          </div>
          {rows.map(({ m, visible, left, width, barColor }) => (
            <div key={m.id} className="flex items-center border-t border-slate-100" style={{ height: 40 }}>
              <div style={{ width: 180 }} className="pr-2 text-xs truncate font-medium" title={m.title}>{m.title}</div>
              <div className="relative flex-1" style={{ height: "100%" }}>
                <div className="flex absolute inset-0">
                  {days.map((d, i) => {
                    const todayCol = isSameDay(d, today);
                    return (
                      <div key={i} style={{ width: pxPerDay, ...(todayCol ? { "--now-line-left": nowLeftPct + "%" } : {}) }}
                        className={"tl-day-cell" + (todayCol ? " is-today" : "")} />
                    );
                  })}
                </div>
                {visible && (
                  <div onClick={() => onOpen(m.id)} title={`${m.title}（${STATUS_LABEL[m.status]}）`}
                    className="absolute top-2 h-6 rounded-md cursor-pointer flex items-center px-2 text-[10px] text-white truncate shadow-sm"
                    style={{ left, width, background: barColor, zIndex: 2 }}>
                    {m.title}
                  </div>
                )}
              </div>
            </div>
          ))}
          {rows.length === 0 && <p className="text-center text-slate-400 text-sm py-8">目前沒有符合條件的任務</p>}
        </div>
      </div>
      <p className="text-[11px] text-slate-400 mt-2">＊長條左端＝任務建立時間，右端＝截止時間（若無截止時間則顯示為一天的短區塊）；顏色依緊急度分數由青綠（不急）到珊瑚紅（緊急）漸變。</p>
    </div>
  );
}

// =====================================================================
// 緊急程度分數曲線（互動預覽，邏輯對應 urgency-score-spec.md）
// =====================================================================
function UrgencyCurveChart({ scaleLabels }) {
  const [s, setS] = useState(1);
  const [hover, setHover] = useState(null); // { x, y, cx, cy }

  const W = 720, H = 400;
  const padL = 44, padR = 20, padT = 20, padB = 40;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const xMin = -1, xMax = 10, yMin = -1, yMax = 5;
  const sx = x => padL + (x - xMin) / (xMax - xMin) * plotW;
  const sy = y => padT + (yMax - y) / (yMax - yMin) * plotH;

  const gridXs = [];
  for (let gx = Math.ceil(xMin); gx <= xMax; gx++) gridXs.push(gx);
  const gridYs = [];
  for (let gy = Math.ceil(yMin); gy <= yMax; gy++) gridYs.push(gy);

  let d = "";
  const steps = Math.round((xMax - xMin) / 0.1);
  for (let i = 0; i <= steps; i++) {
    const x = +(xMin + i * 0.1).toFixed(1);
    let y = urgencyScore(x, s);
    if (y > yMax) y = yMax;
    if (y < yMin) y = yMin;
    d += (i === 0 ? "M " : "L ") + sx(x) + " " + sy(y) + " ";
  }

  const markers = [];
  for (let x = 0; x <= xMax + 1e-9; x += 0.5) {
    const xr = +x.toFixed(1);
    const y = urgencyScore(xr, s);
    const yDisp = Math.min(Math.max(y, yMin), yMax);
    markers.push({ x: xr, y, cx: sx(xr), cy: sy(yDisp) });
  }

  return (
    <div>
      <div className="flex items-center gap-2 mb-3 flex-wrap">
        <span className="text-xs text-slate-500">預覽規模：</span>
        {SCALE_LEVELS.map(n => (
          <button key={n} onClick={() => setS(n)}
            className={"text-xs px-3 py-1.5 rounded-lg " + (s === n ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>
            {scaleLabels["S" + n] || ("S" + n)}
          </button>
        ))}
      </div>
      <div className="relative">
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto rounded-xl" style={{ background: "#0f1720" }}>
          {gridXs.map(gx => (
            <line key={"gx" + gx} x1={sx(gx)} y1={sy(yMin)} x2={sx(gx)} y2={sy(yMax)} stroke="#27394a" strokeWidth="1" />
          ))}
          {gridYs.map(gy => (
            <line key={"gy" + gy} x1={sx(xMin)} y1={sy(gy)} x2={sx(xMax)} y2={sy(gy)} stroke="#27394a" strokeWidth="1" />
          ))}
          <line x1={sx(0)} y1={sy(yMin)} x2={sx(0)} y2={sy(yMax)} stroke="#5c7488" strokeWidth="2.5" />
          <line x1={sx(xMin)} y1={sy(0)} x2={sx(xMax)} y2={sy(0)} stroke="#5c7488" strokeWidth="2.5" />
          {gridXs.map(gx => (
            <text key={"tx" + gx} x={sx(gx)} y={sy(0) + 18} textAnchor="middle" fontSize="11" fill="#93a4b3">{gx}</text>
          ))}
          {gridYs.filter(gy => gy !== 0).map(gy => (
            <text key={"ty" + gy} x={sx(0) - 10} y={sy(gy) + 4} textAnchor="end" fontSize="11" fill="#93a4b3">{gy}</text>
          ))}
          <text x={sx(xMax) - 4} y={sy(0) - 12} textAnchor="end" fontSize="13" fontWeight="700" fill="#e8eef3">剩餘時間(天)</text>
          <text x={sx(0) + 10} y={sy(yMax) + 16} textAnchor="start" fontSize="13" fontWeight="700" fill="#e8eef3">緊急程度分數</text>
          <path d={d} fill="none" stroke="#4fd1c5" strokeWidth="3" strokeLinejoin="round" strokeLinecap="round" />
          {markers.map((m, i) => (
            <circle key={i} cx={m.cx} cy={m.cy} r={hover && hover.x === m.x ? 6 : 4.5}
              fill={hover && hover.x === m.x ? "#f2a541" : "#16212c"} stroke="#f2a541" strokeWidth="2"
              style={{ cursor: "pointer" }}
              onMouseEnter={() => setHover(m)} onMouseLeave={() => setHover(null)} />
          ))}
        </svg>
        {hover && (
          <div className="absolute bg-slate-900 text-white text-xs px-3 py-2 rounded-lg shadow-lg pointer-events-none"
            style={{ left: (hover.cx / W) * 100 + "%", top: (hover.cy / H) * 100 + "%", transform: "translate(-50%, -120%)" }}>
            剩餘天數：{hover.x} 天，緊急分數：{hover.y.toFixed(2)}
          </div>
        )}
      </div>
      <p className="text-[11px] text-slate-400 mt-2">滑鼠移到圖上的橘色圓點可以看到該天數對應的精確分數。</p>
    </div>
  );
}

// =====================================================================
// 變更密碼
// =====================================================================
function ChangePasswordCard({ email }) {
  const [currentPassword, setCurrentPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);

  async function submit(e) {
    e.preventDefault();
    setMsg(null);

    if (newPassword.length < 6) {
      setMsg({ type: "err", text: "新密碼至少需要 6 個字元" });
      return;
    }
    if (newPassword !== confirmPassword) {
      setMsg({ type: "err", text: "兩次輸入的新密碼不一致" });
      return;
    }
    if (newPassword === currentPassword) {
      setMsg({ type: "err", text: "新密碼不能與目前密碼相同" });
      return;
    }

    setBusy(true);
    try {
      // 先用目前密碼重新驗證身分，確認操作者真的知道舊密碼
      const { error: signInErr } = await sb.auth.signInWithPassword({ email, password: currentPassword });
      if (signInErr) {
        setMsg({ type: "err", text: "目前密碼不正確" });
        return;
      }
      const { error: updateErr } = await sb.auth.updateUser({ password: newPassword });
      if (updateErr) throw updateErr;
      setMsg({ type: "ok", text: "密碼已更新成功" });
      setCurrentPassword(""); setNewPassword(""); setConfirmPassword("");
    } catch (err) {
      setMsg({ type: "err", text: err.message || "變更密碼時發生錯誤" });
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="bg-white rounded-2xl shadow p-5">
      <h3 className="font-bold mb-3">變更密碼</h3>
      <form onSubmit={submit} className="space-y-3 text-sm">
        <div>
          <label className="text-xs text-slate-500">目前密碼</label>
          <input required type="password" value={currentPassword} onChange={e => setCurrentPassword(e.target.value)}
            className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2" />
        </div>
        <div>
          <label className="text-xs text-slate-500">新密碼（至少 6 個字元）</label>
          <input required type="password" minLength={6} value={newPassword} onChange={e => setNewPassword(e.target.value)}
            className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2" />
        </div>
        <div>
          <label className="text-xs text-slate-500">確認新密碼</label>
          <input required type="password" minLength={6} value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)}
            className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2" />
        </div>
        {msg && <div className={"text-xs rounded-lg px-3 py-2 " + (msg.type === "err" ? "bg-rose-50 text-rose-600" : "bg-emerald-50 text-emerald-700")}>{msg.text}</div>}
        <button disabled={busy} className="bg-slate-900 text-white rounded-lg px-4 py-2 text-sm disabled:opacity-50">{busy ? "更新中…" : "更新密碼"}</button>
      </form>
    </div>
  );
}

      .maybeSingle();

    if (existing) {

      if (existing.status === "pending") { setMsg({ type: "err", text: "已經有邀請在等待對方確認" }); return; }

      const { error: updErr } = await sb.from("friendships").update({

// 新增專案 Modal
// =====================================================================
function NewProjectModal({ onClose, onCreated, friendProfiles, currentUserName }) {
  const [name, setName] = useState("");
  const [description, setDescription] = useState("");
  const [memberSearch, setMemberSearch] = useState("");
  const [selectedIds, setSelectedIds] = useState([]);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  const filteredFriends = (friendProfiles || []).filter(f =>
    !memberSearch.trim() || (f.display_name || "").toLowerCase().includes(memberSearch.trim().toLowerCase())
  );

  function toggleMember(id) {
    setSelectedIds(ids => ids.includes(id) ? ids.filter(x => x !== id) : [...ids, id]);
  }

  async function submit(e) {
    e.preventDefault();
    setBusy(true); setErr(null);
    try {
      const { data: { user } } = await sb.auth.getUser();
      const { data: project, error } = await sb.from("projects").insert({ name, description: description || null, creator_id: user.id }).select().single();
      if (error) throw error;
      if (selectedIds.length > 0) {
        const rows = selectedIds.map(uid => ({ project_id: project.id, user_id: uid }));
        const { error: memberErr } = await sb.from("project_members").insert(rows);
        if (memberErr) throw memberErr;
      }
      onCreated();
      onClose();
    } catch (e2) {
      setErr(e2.message);
    } finally { setBusy(false); }
  }

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6">
        <div className="flex justify-between items-center mb-4">
          <h2 className="text-lg font-bold">新增專案</h2>
          <button onClick={onClose}><Icon.Close className="w-5 h-5 text-slate-400"/></button>
        </div>
        <form onSubmit={submit} className="space-y-3">
          <div>
            <label className="text-xs text-slate-500">專案名稱</label>
            <input required value={name} onChange={e => setName(e.target.value)}
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label className="text-xs text-slate-500">專案描述（可留空）</label>
            <textarea rows={3} value={description} onChange={e => setDescription(e.target.value)}
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label className="text-xs text-slate-500">專案發起人</label>
            <div className="mt-1 px-3 py-2 bg-slate-50 rounded-lg text-sm text-slate-500">{currentUserName}</div>
          </div>
          <div>
            <label className="text-xs text-slate-500">新增專案成員（只能從好友中選擇）</label>
            <input value={memberSearch} onChange={e => setMemberSearch(e.target.value)} placeholder="搜尋好友名稱…"
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
            <div className="mt-2 max-h-48 overflow-y-auto space-y-1">
              {filteredFriends.length === 0 && <p className="text-xs text-slate-400">找不到符合的好友</p>}
              {filteredFriends.map(f => (
                <label key={f.id} className="flex items-center gap-2 text-sm bg-slate-50 rounded-lg px-3 py-2">
                  <input type="checkbox" checked={selectedIds.includes(f.id)} onChange={() => toggleMember(f.id)} className="w-4 h-4" />
                  {f.display_name}
                </label>
              ))}
            </div>
            {selectedIds.length > 0 && <p className="text-xs text-slate-400 mt-2">已選擇 {selectedIds.length} 位成員</p>}
          </div>
          {err && <div className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2">{err}</div>}
          <button disabled={busy || !name.trim()} className="w-full bg-slate-900 text-white rounded-lg py-2.5 text-sm font-medium disabled:opacity-50">
            {busy ? "建立中…" : "建立專案"}
          </button>
        </form>
      </div>
    </div>
  );
}

function EditProjectModal({ project, members, friendProfiles, openMissions, onClose, onChanged }) {
  const [nameDraft, setNameDraft] = useState(project.name);
  const [descDraft, setDescDraft] = useState(project.description || "");
  const [savingInfo, setSavingInfo] = useState(false);
  const [infoErr, setInfoErr] = useState(null);
  const [memberSearch, setMemberSearch] = useState("");
  const [blockedInfo, setBlockedInfo] = useState(null); // { member, tasks }
  const [confirmRemove, setConfirmRemove] = useState(null); // member
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  const availableFriends = (friendProfiles || []).filter(f =>
    !members.some(m => m.id === f.id) &&
    (!memberSearch.trim() || (f.display_name || "").toLowerCase().includes(memberSearch.trim().toLowerCase()))
  );

  function blockingTasks(memberId) {
    return (openMissions || []).filter(m => m.creator_id === memberId || m.assigned_id === memberId);
  }

  async function saveProjectInfo() {
    if (!nameDraft.trim()) { setInfoErr("專案名稱不能留空"); return; }
    setSavingInfo(true); setInfoErr(null);
    const { error } = await sb.from("projects").update({ name: nameDraft.trim(), description: descDraft || null }).eq("id", project.id);
    setSavingInfo(false);
    if (error) setInfoErr(error.message); else onChanged();
  }

  async function addMember(uid) {
    setBusy(true); setErr(null);
    const { error } = await sb.from("project_members").insert({ project_id: project.id, user_id: uid });
    setBusy(false);
    if (error) setErr(error.message); else onChanged();
  }

  function requestRemove(member) {
    const blocking = blockingTasks(member.id);
    if (blocking.length > 0) setBlockedInfo({ member, tasks: blocking });
    else setConfirmRemove(member);
  }

  async function doRemove() {
    setBusy(true); setErr(null);
    const { error } = await sb.from("project_members").delete().eq("project_id", project.id).eq("user_id", confirmRemove.id);
    setBusy(false);
    setConfirmRemove(null);
    if (error) setErr(error.message); else onChanged();
  }

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6">
        <div className="flex justify-between items-center mb-4">
          <h2 className="text-lg font-bold">編輯專案</h2>
          <button onClick={onClose}><Icon.Close className="w-5 h-5 text-slate-400"/></button>
        </div>

        <div className="space-y-2 mb-4">
          <div>
            <label className="text-xs text-slate-500">專案名稱</label>
            <input value={nameDraft} onChange={e => setNameDraft(e.target.value)}
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label className="text-xs text-slate-500">專案描述（可留空）</label>
            <textarea rows={3} value={descDraft} onChange={e => setDescDraft(e.target.value)}
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          {infoErr && <div className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2">{infoErr}</div>}
          <button onClick={saveProjectInfo} disabled={savingInfo} className="bg-slate-900 text-white text-xs rounded-lg px-4 py-2 disabled:opacity-50">
            {savingInfo ? "儲存中…" : "儲存基本資料"}
          </button>
          <p className="text-xs text-amber-600">若變更「專案名稱」，儲存後會自動通知專案內所有其他成員。</p>
        </div>

        <h3 className="text-sm font-semibold text-slate-700 mb-2 pt-2 border-t border-slate-100">目前成員</h3>
        <div className="space-y-2 mb-4 max-h-48 overflow-y-auto">
          {members.map(m => (
            <div key={m.id} className="flex justify-between items-center bg-slate-50 rounded-lg px-3 py-2 text-sm">
              <span>{m.display_name}{m.id === project.creator_id ? "（發起人）" : ""}</span>
              {m.id !== project.creator_id && (
                <button onClick={() => requestRemove(m)} className="text-xs text-rose-600 underline">移除</button>
              )}
            </div>
          ))}
        </div>

        <h3 className="text-sm font-semibold text-slate-700 mb-2">新增成員（只能從好友中選擇）</h3>
        <input value={memberSearch} onChange={e => setMemberSearch(e.target.value)} placeholder="搜尋好友名稱…"
          className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-2" />
        <div className="space-y-1 max-h-40 overflow-y-auto">
          {availableFriends.length === 0 && <p className="text-xs text-slate-400">沒有可加入的好友</p>}
          {availableFriends.map(f => (
            <div key={f.id} className="flex justify-between items-center bg-slate-50 rounded-lg px-3 py-2 text-sm">
              <span>{f.display_name}</span>
              <button onClick={() => addMember(f.id)} disabled={busy} className="text-xs bg-blue-600 text-white rounded-lg px-2 py-1 disabled:opacity-50">加入</button>
            </div>
          ))}
        </div>

        {err && <div className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2 mt-3">{err}</div>}
      </div>

      {blockedInfo && (
        <ConfirmModal
          title="無法移除此成員"
          hideCancel
          confirmLabel="我知道了"
          message={`「${blockedInfo.member.display_name}」目前在這個專案還有 ${blockedInfo.tasks.length} 筆未結案任務（自己建立或被指派），必須先轉指派給別人、或將任務標記為已完成/已棄置後才能移除。\n\n受影響的任務：\n` + blockedInfo.tasks.map(t => `．${t.title}`).join("\n")}
          onConfirm={() => setBlockedInfo(null)}
          onCancel={() => setBlockedInfo(null)}
        />
      )}
      {confirmRemove && (
        <ConfirmModal
          title="移除成員"
          message={`確定要把「${confirmRemove.display_name}」移出這個專案嗎？`}
          confirmLabel="確認移除"
          danger
          onConfirm={doRemove}
          onCancel={() => setConfirmRemove(null)}
        />
      )}
    </div>
  );
}

// 類別瀏覽：十個分類的方格卡片首頁 + 點進去的分類詳情列表

function CategoryGridPage({ missions, currentUserId, onOpenCategory, showAll, onToggleShowAll }) {
  // 每個分類先算個粗略數量給卡片參考（用預設 0.5 門檻，跟詳情頁預設值一致，純粹給使用者一個大概印象）
  const relevant = missions.filter(m => m.category_scores && (showAll || isRelevantToUser(m, currentUserId)));
  const counts = {};
  AI_CATEGORIES.forEach(k => {
    counts[k] = relevant.filter(m => (Number(m.category_scores[k]) || 0) >= 0.5).length;
  });
  return (
    <div>
      <div className="grid grid-cols-5 gap-4">
        {AI_CATEGORIES.map(key => (
          <button key={key} onClick={() => onOpenCategory(key)}
            className="flex flex-col items-center justify-center gap-2 rounded-2xl py-8 hover:opacity-90 transition"
            style={{ background: `${CATEGORY_CARD_COLOR[key]}1a`, border: `1px solid ${CATEGORY_CARD_COLOR[key]}40` }}>
            <span style={{ fontSize: "5rem", lineHeight: 1 }}>{CATEGORY_EMOJI[key]}</span>
            <span className="text-sm font-semibold" style={{ color: CATEGORY_CARD_COLOR[key] }}>{AI_CATEGORY_LABELS[key]}</span>
            <span className="text-xs text-slate-400">{counts[key]} 項</span>
          </button>
        ))}
      </div>
      <label className="flex items-center justify-center gap-2 text-xs text-slate-500 mt-4">
        <input type="checkbox" checked={showAll} onChange={e => onToggleShowAll(e.target.checked)} className="w-4 h-4" />
        顯示與我無關之任務
      </label>
    </div>
  );
}

const CATEGORY_SORT_MODES = { category_first: "類別分數優先", ...SORT_MODE_LABELS };

function CategoryDetailPage({ categoryKey, missions, currentUserId, profile, visibleColumns, visibleColumnsClosed, visibleSections, onOpen, onBack,
  projectNameById, hiddenSet, onHide, onUnhide, onDelete, starredSet, onStar, onUnstar, onOpenColumnSettings, showAll }) {
  const [threshold, setThreshold] = useState(0.5);
  const [sortMode, setSortMode] = useState("category_first");
  const weights = profile.priority_weights;

  const relevant = missions.filter(m => m.category_scores && (showAll || isRelevantToUser(m, currentUserId))
    && (Number(m.category_scores[categoryKey]) || 0) >= threshold);
  // 不管選哪一種排序模式，都要照「顯示區塊設定」分成未結案/已完成/已棄置三段——這點要跟個人任務/專案任務
  // 頁面的行為一致：排序模式只決定「段落內」的順序，不是決定要不要分段。之前只有「類別分數優先」有分段，
  // 其餘 8 種既有模式會把三種狀態混在一起顯示，是漏掉了這個一致性。
  const sortWithinTier = list => sortMode === "category_first"
    ? sortMissionsByCategory(list, categoryKey, weights)
    : sortMissions(list, sortMode, weights);

  const groups = [
    { key: "open", label: "未結案", columnMode: "list", items: sortWithinTier(relevant.filter(m => statusTier(m.status) === 0)) },
    { key: "completed", label: "已完成", columnMode: "closed", items: sortWithinTier(relevant.filter(m => statusTier(m.status) === 1)) },
    { key: "abandoned", label: "已棄置", columnMode: "closed", items: sortWithinTier(relevant.filter(m => statusTier(m.status) === 2)) },
  ].filter(g => g.items.length > 0 && visibleSections?.[g.key] !== false);

  const commonListProps = {
    onOpen, currentUserId,
    priorityLabels: profile.priority_labels, scaleLabels: profile.scale_labels,
    priorityDisplay: profile.priority_display, scaleDisplay: profile.scale_display,
    priorityColorOverride: profile.priority_color_override, scaleColorOverride: profile.scale_color_override,
    urgencyDisplay: profile.urgency_display, urgencyLabels: profile.urgency_labels, urgencyColorOverride: profile.urgency_color_override,
    relationDisplayMode: profile.relation_filter_display_list,
    dueDateDisplayList: profile.due_date_display_list, dueDateColorOverride: profile.due_date_color_override,
    hiddenIds: hiddenSet, onHide, onUnhide, onDelete,
    starredIds: starredSet, onStar, onUnstar, starOverrideColor: profile.star_override_color,
    noProgressColorOverride: profile.no_progress_color_override, noProgressSeverityDays: profile.no_progress_severity_days,
    checklistDisplayMode: profile.checklist_display_mode,
    sortMode, sortHighlightColor: profile.sort_highlight_color, forceShowSortColumn: profile.force_show_sort_column,
    showCategoryColumns: true, categoryKey, projectNameById,
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <button onClick={onBack} className="text-sm text-slate-500 underline">← 返回類別瀏覽</button>
        <button onClick={onOpenColumnSettings} title="顯示欄位設定" className="flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded-lg w-9 h-9">
          <Icon.Settings className="w-4 h-4 text-slate-600" />
        </button>
      </div>
      <div className="flex items-center gap-3 mb-4">
        <span style={{ fontSize: "2rem" }}>{CATEGORY_EMOJI[categoryKey]}</span>
        <h2 className="text-xl font-bold" style={{ color: CATEGORY_CARD_COLOR[categoryKey] }}>{AI_CATEGORY_LABELS[categoryKey]}</h2>
        <span className="text-xs text-slate-400">共 {relevant.length} 項</span>
      </div>

      <div className="flex flex-wrap items-center justify-between gap-4 mb-4 bg-slate-50 rounded-lg px-4 py-3">
        <label className="flex items-center gap-2 text-xs text-slate-500">
          排序設定：
          <select value={sortMode} onChange={e => setSortMode(e.target.value)}
            className="text-xs border border-slate-300 rounded-lg px-2 py-1.5 bg-white">
            {Object.entries(CATEGORY_SORT_MODES).map(([key, label]) => <option key={key} value={key}>{label}</option>)}
          </select>
        </label>
        <label className="flex items-center gap-2 text-xs text-slate-500">
          分數門檻：{threshold.toFixed(2)}
          <input type="range" min="0" max="1" step="0.05" value={threshold}
            onChange={e => setThreshold(Number(e.target.value))} className="w-40" />
        </label>
      </div>

      {relevant.length === 0 && <p className="text-sm text-slate-400 px-1">目前沒有分數達到門檻的任務，可以試著把門檻拉低一點</p>}

      {groups.map(g => (
        <div key={g.key} className="mb-4">
          {g.label && <h3 className="text-xs font-semibold text-slate-400 mb-1.5 px-1">{g.label}（{g.items.length}）</h3>}
          <MissionListView
            {...commonListProps}
            missions={g.items}
            columnMode={g.columnMode}
            visibleColumns={g.columnMode === "closed" ? visibleColumnsClosed : visibleColumns}
            columnOrder={g.columnMode === "closed" ? profile.column_order_closed : profile.column_order}
          />
        </div>
      ))}
    </div>
  );
}

// =====================================================================
// 全域搜尋：極簡列表（任務名稱／任務狀態／來源），不分區塊、不接顯示欄位設定，

  return (

          <tr>

          {missions.map(m => (
            <tr key={m.id} onClick={() => onOpen(m.id)} className="border-t border-slate-100 hover:bg-slate-50 cursor-pointer">

              <td className="px-4 py-2.5 text-slate-500">{STATUS_LABEL[m.status] || m.status}</td>

        </tbody>
      </table>
    </div>
  );
}
