<title>任務雲 TaskCloud — 多人共享任務管理</title>
<script>
  // 全域錯誤攔截：只要有任何 JS 錯誤（含 CDN 載入失敗），就把錯誤內容直接顯示在畫面上，
  // 避免「整個畫面空白、卻不知道發生什麼事」的情況。
  window.addEventListener("error", function (e) {
    var root = document.getElementById("root");
    if (!root) return;
    var msg = (e && e.message) ? e.message : "未知錯誤";
    var src = (e && e.filename) ? e.filename : "";
    root.innerHTML =
      '<div style="max-width:640px;margin:60px auto;padding:24px;border:1px solid #fecaca;' +
      'background:#fff1f2;border-radius:12px;font-family:sans-serif;color:#7f1d1d;">' +
      '<h2 style="margin:0 0 8px;font-size:18px;">頁面發生錯誤，無法正常顯示</h2>' +
      '<p style="font-size:14px;margin:0 0 8px;">錯誤訊息：' + msg + '</p>' +
      (src ? '<p style="font-size:12px;color:#9f1239;word-break:break-all;">來源：' + src + '</p>' : '') +
      '<p style="font-size:12px;color:#9f1239;">請打開瀏覽器開發者工具（F12 或 右鍵→檢查）的 Console 分頁，把紅字錯誤訊息複製給開發者。</p>' +
      '</div>';
  });
</script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" onerror="document.getElementById('root').innerHTML='<p style=\'padding:40px;font-family:sans-serif;color:#7f1d1d\'>無法載入 React（unpkg.com CDN），請檢查網路連線或防火牆/廣告攔截設定。</p>'"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" onerror="document.getElementById('root').innerHTML='<p style=\'padding:40px;font-family:sans-serif;color:#7f1d1d\'>無法載入 React DOM（unpkg.com CDN），請檢查網路連線或防火牆/廣告攔截設定。</p>'"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" onerror="document.getElementById('root').innerHTML='<p style=\'padding:40px;font-family:sans-serif;color:#7f1d1d\'>無法載入 Babel（unpkg.com CDN），請檢查網路連線或防火牆/廣告攔截設定。</p>'"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="document.getElementById('root').innerHTML='<p style=\'padding:40px;font-family:sans-serif;color:#7f1d1d\'>無法載入 Supabase 客戶端（cdn.jsdelivr.net CDN），請檢查網路連線或防火牆/廣告攔截設定。</p>'"></script>

    content: ''; position: absolute; left: var(--now-line-left, 50%); bottom: 0; height: 6px; width: 0;
    border-left: 1.5px dashed rgba(30,30,30,0.35); transform: translateX(-50%); pointer-events: none;
  }
  .tl-day-cell.is-today::after {
    content: ''; position: absolute; left: var(--now-line-left, 50%); top: 0; bottom: 0; width: 0;
    border-left: 1.5px dashed rgba(30,30,30,0.35); transform: translateX(-50%); z-index: 1; pointer-events: none;
  }
  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

  /* AI 思考中彈窗的轉圈圖示 */
  @keyframes ai-thinking-rotate { to { transform: rotate(360deg); } }
  .ai-thinking-spinner {
    width: 2rem; height: 2rem; border-radius: 9999px;
    border: 3px solid #ede9fe; border-top-color: #7c3aed;
    animation: ai-thinking-rotate 0.8s linear infinite;
  }

  /* =====================================================================
     彈窗動畫：模式一「彈出/彈回」給主要內容彈窗（新增任務/新增專案/新增子任務/任務內頁）用，
     從觸發按鈕當下座標長出來；模式二「快速淡入+輕晃定位」給二次確認類彈窗用，固定在畫面中央。
     兩者都只用 transform + opacity，不動 width/height/top/left。
     ===================================================================== */
  @keyframes modalPopIn {
    0%   { transform: translate(var(--ox, 0px), var(--oy, 0px)) scale(0.05); opacity: 0; }
    72%  { transform: translate(0, 0) scale(1.06); opacity: 1; }
    88%  { transform: translate(0, 0) scale(0.997); opacity: 1; }
    100% { transform: translate(0, 0) scale(1); opacity: 1; }
  }
  @keyframes modalPopOut {
    0%   { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--ox, 0px), var(--oy, 0px)) scale(0.05); opacity: 0; }
  }
  /* 這裡刻意不用會超過 1 的 cubic-bezier 當整體節奏曲線——因為 0%→72%→88%→100% 這幾個關卡本身
     就已經手動做出「放大過頭→回彈→定位」的彈性效果了，如果整體節奏曲線自己也會超過 100% 進度再折返，
     兩種「超過又折返」的效果疊在一起，會在數值變化很小的 88%→100% 這段放大成很突兀的一次抖動/跳動。
     改用不會超過的 ease-out 曲線，讓關卡的數值本身負責彈性，節奏曲線只負責「先快後慢」的速度分配。 */
  .modal-pop-in { animation: modalPopIn 560ms cubic-bezier(0.16, 1, 0.3, 1) both; }
  .modal-pop-out { animation: modalPopOut 380ms cubic-bezier(0.5, 0, 0.75, 0) both; }

  @keyframes modalConfirmIn {
    0%   { transform: scale(0.9) translateY(-8px); opacity: 0; }
    40%  { transform: scale(1.035) translateY(2px); opacity: 1; }
    70%  { transform: scale(0.99) translateY(-1px); opacity: 1; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  @keyframes modalConfirmOut {
    0%   { transform: scale(1) translateY(0); opacity: 1; }
    100% { transform: scale(0.95) translateY(-4px); opacity: 0; }
  }
  .modal-confirm-in { animation: modalConfirmIn 320ms ease-out both; }
  .modal-confirm-out { animation: modalConfirmOut 200ms ease-in both; }

  /* 檢查清單雙欄：AI 建議欄從右側滑入/滑出，決定的子任務欄同步伸縮，兩欄都用固定的
     flex-basis + transition 做，不用 JS 量測（目標寬度是固定的 0%/50%/100%，不是內容決定的） */
  .checklist-col-anim { flex-grow: 0; flex-shrink: 0; min-width: 0; transition: flex-basis 300ms cubic-bezier(0.4, 0, 0.2, 1), opacity 300ms ease; }

  /* 純黑底白字的主要送出按鈕，按下時稍微閃一下（背景色瞬間變亮再回復），給予按下的回饋感 */
  .btn-solid-flash { transition: background-color 100ms ease; }
  .btn-solid-flash:active { background-color: #334155; }

  /* 「閃光掃過」：搜尋按鈕 hover/focus 時，一道柔和的斜向光帶從左側掃到右側。
     isolation:isolate 讓 ::after 的疊層只影響按鈕內部，不會跟外面的 z-index 打架；
     圖示要蓋在光帶上面（z-index:2），不然光掃過去的時候會被蓋住 */
  .shine-btn { position: relative; overflow: hidden; isolation: isolate; }
  .shine-btn::after {
    content: "";
    position: absolute;
    top: 0;
    left: -75%;
    width: 45%;
    height: 100%;
    background: linear-gradient(
      115deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0) 30%,
      rgba(255, 255, 255, 0.55) 50%,
      rgba(255, 255, 255, 0) 70%,
      rgba(255, 255, 255, 0) 100%
    );
    transform: skewX(-20deg);
    transition: left 650ms cubic-bezier(0.19, 1, 0.22, 1);
    z-index: 1;
    pointer-events: none;
  }
  .shine-btn:hover::after, .shine-btn:focus-visible::after { left: 125%; }
  .shine-btn:active { transform: scale(0.98); }
  .shine-btn-icon { position: relative; z-index: 2; }

  /* 分類 emoji：維持原本色彩，不做任何濾鏡調整 */
  .category-emoji-mono {}

  /* 靈感池卡片內容預覽：保留完整幾行、超過才截斷，比單行「...」保留更多語意 */
  .line-clamp-5 {
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
</style>

<body class="bg-slate-100 text-slate-800">
<div id="root"></div>

<script type="text/plain" id="app-source">
const { useState, useEffect, useLayoutEffect, useMemo, useCallback, useRef } = React;

// =====================================================================
// 彈窗開啟/關閉動畫的共用機制
// =====================================================================
// 全域記錄「最後一次點擊的座標」（capture 階段，比任何 React onClick 都早執行）。
// 這樣模式一彈窗要從觸發按鈕的位置長出來時，不用在每一個觸發按鈕（新增任務、任務列表每一列、
// 甘特圖、通知、全域搜尋結果...到處都是）分別把座標傳進去，開啟當下直接讀這個全域值就好，
// 涵蓋範圍最大、也最不容易漏掉某個入口忘記接動畫。
let __lastClickX = null, __lastClickY = null;
if (typeof document !== "undefined") {
  document.addEventListener("click", e => { __lastClickX = e.clientX; __lastClickY = e.clientY; }, true);
}

// 模式一：從觸發按鈕位置「彈出/彈回」。用在新增任務／新增專案／新增子任務／任務內頁這類主要內容彈窗。
// 回傳 closing（是否正在播放關閉動畫）、style（要 spread 到彈窗最外層 div 的位移量 CSS 變數）、
// className（目前該套用開啟或關閉動畫的 class）、requestClose（取代直接呼叫關閉/送出成功後的邏輯：
// 先播完 380ms 的關閉動畫才真的執行，動畫播放期間會鎖住、呼叫第二次不會有作用，避免重複觸發關閉）
function usePopModalAnimation() {
  const [closing, setClosing] = useState(false);
  const originRef = useRef(null);
  if (originRef.current === null) {
    const cx = __lastClickX ?? window.innerWidth / 2;
    const cy = __lastClickY ?? window.innerHeight / 2;
    originRef.current = { "--ox": `${cx - window.innerWidth / 2}px`, "--oy": `${cy - window.innerHeight / 2}px` };
  }
  function requestClose(afterClose) {
    if (closing) return;
    setClosing(true);
    setTimeout(afterClose, 380);
  }
  return { closing, style: originRef.current, className: closing ? "modal-pop-out" : "modal-pop-in", requestClose };
}

// 模式二：固定在畫面中央，快速淡入＋輕晃定位。用在需要二次確認的 ConfirmModal。
function useConfirmModalAnimation() {
  const [closing, setClosing] = useState(false);
  function requestClose(afterClose) {
    if (closing) return;
    setClosing(true);
    setTimeout(afterClose, 200);
  }
  return { closing, className: closing ? "modal-confirm-out" : "modal-confirm-in", requestClose };
}

// 展開/收合動畫：用 JS 量測內容實際高度（scrollHeight），對 height 屬性做 transition
// （cubic-bezier(0.4,0,0.2,1)，Material Design 標準曲線，先加速後減速），
// 展開完成後把 height 切回 auto，這樣裡面的輸入欄位/文字/按鈕都能正常互動，內容之後變高也不會被卡住。
// 不只處理單純的「顯示/隱藏」，也處理「兩種不同內容互換」（例如按鈕列 <-> 表單）：
// switchKey 改變時才會跑動畫，同一個 key 底下內容自己變化（例如打字）不會誤觸發。
// 回傳一個 ref，掛在包住內容的那個 wrapper div 上即可，不用額外處理 style。
// cubic-bezier 數值求解器（標準 Newton-Raphson 逼近法）：給時間進度 x（0~1），算出這條貝茲曲線
// 對應的輸出進度。用來讓「捲動」這種沒有 CSS transition 可以直接套用的動作，也能套用
// 跟其他展開/收合動畫一致的 cubic-bezier(0.4, 0, 0.2, 1) 曲線，不是瀏覽器原生 smooth 捲動的固定節奏
function makeBezierEasing(mX1, mY1, mX2, mY2) {
  const A = (a1, a2) => 1 - 3 * a2 + 3 * a1;
  const B = (a1, a2) => 3 * a2 - 6 * a1;
  const C = a1 => 3 * a1;
  const calcBezier = (t, a1, a2) => ((A(a1, a2) * t + B(a1, a2)) * t + C(a1)) * t;
  const getSlope = (t, a1, a2) => 3 * A(a1, a2) * t * t + 2 * B(a1, a2) * t + C(a1);
  function getTForX(x) {
    let t = x;
    for (let i = 0; i < 8; i++) {
      const slope = getSlope(t, mX1, mX2);
      if (slope === 0) return t;
      t -= (calcBezier(t, mX1, mX2) - x) / slope;
    }
    return t;
  }
  return x => (mX1 === mY1 && mX2 === mY2) ? x : calcBezier(getTForX(x), mY1, mY2);
}
const materialEasing = makeBezierEasing(0.4, 0, 0.2, 1);
// 把捲動容器平滑捲到指定位置，用上面那條曲線控制速度（先加速後減速），不是瀏覽器原生 smooth 捲動
function smoothScrollTo(el, targetTop, duration = 500) {
  if (!el) return;
  const startTop = el.scrollTop;
  const distance = targetTop - startTop;
  if (Math.abs(distance) < 1) return;
  const startTime = performance.now();
  function step(now) {
    const progress = Math.min((now - startTime) / duration, 1);
    el.scrollTop = startTop + distance * materialEasing(progress);
    if (progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function hexToRgb(hex) {
  const n = parseInt((hex || "#ffff00").replace("#", ""), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
// 內發光閃爍動畫：每個週期都是 minOpacity → maxOpacity → minOpacity（三角波，不是瞬間切換），
// 重複 count 次之後停在 minOpacity（常態）。直接用 requestAnimationFrame 算每一幀該用的透明度、
// imperatively 寫回 el.style.boxShadow，不透過 React state（動畫過程不需要、也不應該觸發重新渲染），
// 不用 CSS keyframes 是因為顏色/次數/週期/強度全部是使用者可調整的動態值，CSS 沒辦法乾淨地參數化這些。
function runGlowPulse(el, { color, period, count, minOpacity, maxOpacity }) {
  if (!el) return;
  // 排序切換的時候，捲動動畫過程中最新那一列的可見比例也會經過「完整可見」這個瞬間，
  // 讓 IntersectionObserver 也跟著觸發一次——這樣同一個事件會從兩條路徑（排序變化 + 捲動進入視窗）
  // 各自呼叫一次 runGlowPulse，兩個 requestAnimationFrame 迴圈同時搶著寫同一個元素的 boxShadow，
  // 疊出「多閃一次、第一次特別短促」的畫面。用元素本身的一個旗標擋住：已經有一個閃爍在跑的話，
  // 後來這次直接略過，不疊加新的動畫迴圈，讓正在跑的那個好好跑完它自己的完整次數。
  if (el._glowActive) return;
  el._glowActive = true;
  const { r, g, b } = hexToRgb(color);
  const periodMs = (period || 1) * 1000;
  const totalMs = periodMs * (count || 3);
  const startTime = performance.now();
  function setAlpha(a) {
    el.style.boxShadow = `inset 0 0 25px 0px rgba(${r}, ${g}, ${b}, ${a})`;
  }
  function step(now) {
    const elapsed = now - startTime;
    if (elapsed >= totalMs) { setAlpha(minOpacity); el._glowActive = false; return; }
    const cycleProgress = (elapsed % periodMs) / periodMs; // 0~1，這個週期內的進度
    const triangle = cycleProgress <= 0.5 ? cycleProgress * 2 : (1 - cycleProgress) * 2; // 三角波：0→1→0
    setAlpha(minOpacity + (maxOpacity - minOpacity) * triangle);
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// 給「更新紀錄」新插入一筆時用：讓那一列從 0 長高到自然高度，旁邊的其他列會被正常的文件排版
// 自然往下（或往上，看新那筆插在哪個位置）推開，製造出「被推進來」的動態感——不管排序是新到舊
// （新的一筆插在最上面）還是舊到新（插在最下面）都適用，都是同一個技巧。
// 量高度的時機要在「還沒動過 explicit height」之前，避免踩到我們already學到的
// scrollHeight = max(explicit, 自然高度) 那個坑。
function growRowIn(el) {
  if (!el) return;
  const naturalH = el.scrollHeight;
  // space-y-2 的 margin-top 在元素一掛載就已經套用（CSS 規則不受這裡的 JS 影響），跟 shrinkRowOut
  // 同樣的道理：不一起動畫的話，那段間距會在高度都還是 0 的時候就先憑空出現，內容才慢慢長出來填滿，
  // 順序感是反的。這裡一併把 margin-top 從 0 動畫到它原本該有的值，跟 height 同步。
  const naturalMarginTop = parseFloat(getComputedStyle(el).marginTop) || 0;
  el.style.overflow = "hidden";
  el.style.transition = "none";
  el.style.height = "0px";
  el.style.marginTop = "0px";
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      el.style.transition = "height 300ms cubic-bezier(0.4, 0, 0.2, 1), margin-top 300ms cubic-bezier(0.4, 0, 0.2, 1)";
      el.style.height = naturalH + "px";
      el.style.marginTop = naturalMarginTop + "px";
      setTimeout(() => { el.style.height = "auto"; el.style.marginTop = ""; el.style.overflow = ""; }, 300);
    });
  });
}
// growRowIn 的反向：刪除一列前，先把它的高度縮小到 0，讓下面的列自然被文件排版擠上來填補空隙，
// 播完才真的送出刪除請求——回傳 Promise，呼叫端可以用 await 確保動畫播完才繼續，
// 不會動畫還沒跑完，資料就先從畫面上憑空消失。
function shrinkRowOut(el, duration = 300) {
  return new Promise(resolve => {
    if (!el) { resolve(); return; }
    const naturalH = el.scrollHeight;
    // 這個列表用 space-y-2 排間距（.space-y-2 > * + * { margin-top: 0.5rem }），這個 margin
    // 是加在 border-box 外面的，就算用 border-box 讓 height 包含 padding，也不會包含到外面這段
    // margin——只動 height 的話，縮到 0 之後這段 margin 缺口還是會留在畫面上，變成「縮到剩一點點
    // 卡住」的殘影，一直到 React 真的把這個節點從 DOM 移除、margin 規則不再套用才會消失，
    // 造成「卡一下才突然不見」的不順感。這裡把 margin-top 也一起量出來、跟 height 同步動畫收到 0，
    // 這樣動畫播完的當下，整條列的實際垂直佔用空間就已經真的是 0，不會有殘留缺口。
    const computedMarginTop = parseFloat(getComputedStyle(el).marginTop) || 0;
    el.style.overflow = "hidden";
    el.style.transition = "none";
    el.style.height = naturalH + "px";
    el.style.marginTop = computedMarginTop + "px";
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        el.style.transition = `height ${duration}ms cubic-bezier(0.4, 0, 0.2, 1), margin-top ${duration}ms cubic-bezier(0.4, 0, 0.2, 1)`;
        el.style.height = "0px";
        el.style.marginTop = "0px";
        setTimeout(resolve, duration);
      });
    });
  });
}

function useAnimatedHeight(switchKey) {
  const wrapRef = useRef(null);
  const prevKeyRef = useRef(switchKey);
  const prevHeightRef = useRef(null);
  const timerRef = useRef(null);
  const rafRef1 = useRef(null);
  const rafRef2 = useRef(null);

  function clearPending() {
    if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; }
    if (rafRef1.current) { cancelAnimationFrame(rafRef1.current); rafRef1.current = null; }
    if (rafRef2.current) { cancelAnimationFrame(rafRef2.current); rafRef2.current = null; }
  }

  useLayoutEffect(() => {
    const el = wrapRef.current;
    if (el) {
      el.style.overflow = "hidden";
      if (prevKeyRef.current !== switchKey) {
        const startH = prevHeightRef.current;
        const endH = el.scrollHeight;
        clearPending();
        if (startH != null) {
          // 動畫時長跟著實際要跑的高度差距縮放，不是固定 300ms——不然像「更新任務」這種展開後
          // 差距特別大的（5 行文字框，落差常常是「標記為已完成」那種 2 行表單的兩倍以上），
          // 固定時間內要跑的距離變大，速度感自然就跟其他按鈕不一樣，看起來像彈力不同、其實只是
          // 同樣時間內跑得比較快。用距離的平方根去縮放時長（Material Design 建議的做法），
          // 讓「感覺上的移動速度」在不同距離的展開/收合之間維持一致，同時夾住上下限避免極端值。
          const distance = Math.abs(endH - startH);
          const duration = Math.max(200, Math.min(500, Math.round(300 * Math.sqrt(distance / 70 || 0.01))));
          el.style.transition = "none";
          el.style.height = startH + "px";
          // 用兩層 requestAnimationFrame 取代單純強制 reflow（getBoundingClientRect）——
          // 連續快速切換好幾次時，單一次同步強制 reflow 不一定可靠地讓瀏覽器先畫完「起始高度、
          // 無 transition」這一幀，可能被瀏覽器合併掉，導致 transition 沒被觸發、直接跳到終值。
          // 雙層 rAF 確保「無 transition 設定起始值」真的先完成繪製，下一幀才切換成「有 transition
          // 設定目標值」，這是業界處理這類重複觸發轉場問題的標準做法。
          rafRef1.current = requestAnimationFrame(() => {
            rafRef2.current = requestAnimationFrame(() => {
              el.style.transition = `height ${duration}ms cubic-bezier(0.4, 0, 0.2, 1)`;
              el.style.height = endH + "px";
              timerRef.current = setTimeout(() => { el.style.height = "auto"; }, duration);
            });
          });
        }
        prevKeyRef.current = switchKey;
        // 關鍵修正：直接沿用剛剛量到的、還沒被污染的 endH 當作下一次的基準值，不要在設定完
        // explicit height 之後「順手」重新量一次 scrollHeight——scrollHeight 的定義是
        // max(explicit 高度, 內容自然高度)，上面幾行剛把 explicit 高度設成「收合前」比較大的舊值，
        // 這時候如果重新量 scrollHeight，量到的會是那個比較大的 explicit 值，不是新內容真正的
        // 自然高度，導致下一次展開時的起點高度是錯的（收合類轉場之後，下一次展開瞬間跳過去、
        // 沒有動畫感的根本原因）。
        prevHeightRef.current = endH;
      } else if (prevHeightRef.current == null) {
        // 只有第一次掛載、從來沒有初始化過才需要量一次；平常沒有觸發新轉場的話完全不重新量，
        // 沿用上一次已知正確的值，避免在動畫進行中被同樣的 max(explicit, 自然高度) 問題污染
        prevHeightRef.current = el.scrollHeight;
      }
    }
  });

  useEffect(() => () => clearPending(), []);

  return wrapRef;
}

// 專門給「下方 footer 展開/收合時，要連動把上面內文區域的捲動位置也一起推」用的版本。
// 跟 useAnimatedHeight 分開寫，不是共用同一個 hook 改參數——這是因為瀏覽器有個叫「捲動錨定
// scroll anchoring」的機制，會在版面上方內容位移時，自己嘗試（用啟發式規則，不保證每次都觸發）
// 幫你把捲動位置補償回來，讓畫面看起來沒跳動。這正好符合「有時候會同步推上去，有時候不會」的症狀——
// 因為那個補償行為不是我們自己控制的，是瀏覽器自己判斷要不要做。這裡改成自己動手明確控制捲動位置，
// 不依賴瀏覽器的捲動錨定啟發式，跟高度動畫用同一個時長、同一條曲線，確保每一次都會同步、不會忽有忽無。
function useFooterPushAnimation(switchKey, bodyScrollRef) {
  const wrapRef = useRef(null);
  const prevKeyRef = useRef(switchKey);
  const prevHeightRef = useRef(null);
  const timerRef = useRef(null);
  const rafRef1 = useRef(null);
  const rafRef2 = useRef(null);
  const scrollRafRef = useRef(null);

  function clearPending() {
    if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; }
    if (rafRef1.current) { cancelAnimationFrame(rafRef1.current); rafRef1.current = null; }
    if (rafRef2.current) { cancelAnimationFrame(rafRef2.current); rafRef2.current = null; }
    if (scrollRafRef.current) { cancelAnimationFrame(scrollRafRef.current); scrollRafRef.current = null; }
  }

  useLayoutEffect(() => {
    const el = wrapRef.current;
    if (el) {
      el.style.overflow = "hidden";
      if (prevKeyRef.current !== switchKey) {
        const startH = prevHeightRef.current;
        const endH = el.scrollHeight; // 這時候還沒動過 el.style.height，量到的是新內容真正的自然高度，可靠
        clearPending();
        if (startH != null) {
          const distance = Math.abs(endH - startH);
          const duration = Math.max(200, Math.min(500, Math.round(300 * Math.sqrt(distance / 70 || 0.01))));
          el.style.transition = "none";
          el.style.height = startH + "px";
          const bodyEl = bodyScrollRef?.current;
          const scrollStart = bodyEl ? bodyEl.scrollTop : null;
          rafRef1.current = requestAnimationFrame(() => {
            rafRef2.current = requestAnimationFrame(() => {
              el.style.transition = `height ${duration}ms cubic-bezier(0.4, 0, 0.2, 1)`;
              el.style.height = endH + "px";
              timerRef.current = setTimeout(() => { el.style.height = "auto"; }, duration);
              if (bodyEl && scrollStart != null) {
                // footer 長高多少，上面的內文就跟著多捲進去多少（等於整段內容往上被推走）；
                // footer 收合變矮，反過來往回捲同樣的量——正負號跟高度差距本身一致，不用另外判斷方向
                const scrollDelta = endH - startH;
                const scrollStartTime = performance.now();
                function scrollStep(now) {
                  const progress = Math.min((now - scrollStartTime) / duration, 1);
                  bodyEl.scrollTop = scrollStart + scrollDelta * materialEasing(progress);
                  if (progress < 1) scrollRafRef.current = requestAnimationFrame(scrollStep);
                }
                scrollRafRef.current = requestAnimationFrame(scrollStep);
              }
            });
          });
        }
        prevKeyRef.current = switchKey;
        // 關鍵修正：直接沿用剛剛量到的、還沒被污染的 endH 當作下一次的基準值，不要在設定完
        // explicit height 之後「順手」重新量一次 scrollHeight——scrollHeight 的定義是
        // max(explicit 高度, 內容自然高度)，這一行剛把 explicit 高度設成「收合前」比較大的舊值
        // （el.style.height = startH + "px"），如果這時候重新量 scrollHeight，量到的會是那個
        // 比較大的 explicit 值，不是新內容真正的自然高度，導致下一次展開時的起點高度是錯的
        // （這正是「開→關→再開」在收合類型的轉場之後，第二次展開量到錯誤基準值、變成瞬間跳過去
        // 沒有動畫感的真正原因）。
        prevHeightRef.current = endH;
      } else if (prevHeightRef.current == null) {
        // 只有第一次掛載、從來沒有初始化過才需要量一次；平常沒有觸發新轉場的話完全不重新量，
        // 沿用上一次已知正確的值，避免在動畫進行中被同樣的 max(explicit, 自然高度) 問題污染
        prevHeightRef.current = el.scrollHeight;
      }
    }
  });

  useEffect(() => () => clearPending(), []);

  return wrapRef;
}

function ColumnSettingsModal({ visibleColumns, onToggleColumn, visibleColumnsClosed, onToggleColumnClosed, visibleSections, onToggleSection, columnOrder, columnOrderClosed, onSaveColumnOrder, onClose, showCategoryColumns }) {
  const { className: settingsModalClassName, requestClose: requestCloseSettingsModal } = useConfirmModalAnimation();
  const [category, setCategory] = useState("open"); // open | closed
  const [reorderMode, setReorderMode] = useState(false);
  const [syncBothSides, setSyncBothSides] = useState(false); // 「雙邊顯示同動」：開啟時，同名欄位在未結案/已結案兩邊會連動勾選狀態
  const [orderDraft, setOrderDraft] = useState([]);
  const [savingOrder, setSavingOrder] = useState(false);
  const isClosedCat = category === "closed";
  // fullColumnDefs 保留完整欄位集合（含「類別分數」「來源」），用來驗證/計算實際存的排序陣列長度是否有效——
  // 這兩欄不論從哪個頁面打開這個彈窗都真實存在於同一份持久化資料裡，所以長度判斷不能用篩選過的子集，
  // 不然從個人/專案頁打開時，因為長度對不上，會誤判使用者自訂的順序無效、每次都被打回預設順序
  const fullColumnDefs = isClosedCat ? TASK_LIST_COLUMNS_CLOSED : TASK_LIST_COLUMNS;
  // 只有畫面上「要不要列出這個欄位讓使用者勾/排」用這個篩選過的清單，「類別分數」「來源」只有類別瀏覽頁看得到
  // showCategoryColumns=true（從類別瀏覽頁打開）：「類別分數」「來源」才要出現，但「類別」欄位反而要藏起來
  // ——都已經在看某一個分類底下的清單了，欄位裡再顯示一次「這是哪個分類」是多餘的
  // showCategoryColumns=false（從個人/專案打開）：反過來，「類別」要出現，「類別分數」「來源」藏起來
  const visibleColumnDefs = fullColumnDefs.filter(c => showCategoryColumns
    ? c.key !== "category"
    : (c.key !== "category_score" && c.key !== "source"));
  const vc = isClosedCat ? visibleColumnsClosed : visibleColumns;
  const onToggle = isClosedCat ? onToggleColumnClosed : onToggleColumn;
  const currentOrder = isClosedCat ? columnOrderClosed : columnOrder;
  const fullDefaultKeys = fullColumnDefs.map(c => c.key);
  const effectiveOrder = (Array.isArray(currentOrder) && currentOrder.length === fullDefaultKeys.length && fullDefaultKeys.every(k => currentOrder.includes(k)))
    ? currentOrder
    : fullDefaultKeys;
  // 畫面渲染用：從完整順序裡濾掉這個情境不該看到的欄位（類別分數/來源），只顯示允許的那些
  const visibleKeySet = new Set(visibleColumnDefs.map(c => c.key));
  const renderableOrder = effectiveOrder.filter(k => visibleKeySet.has(k));

  function startReorder() {
    setOrderDraft(effectiveOrder);
    setReorderMode(true);
  }
  // 勾選/取消一個欄位。開啟「雙邊顯示同動」時，若另一邊（未結案/已結案）也有同一個 key 的欄位，
  // 這裡不是無腦兩邊都 toggle（那樣如果兩邊原本狀態不同，反而會越切越不同步），
  // 而是先算出這一側切完後的新狀態，只有在另一側目前不是同一個值時才去 toggle 另一側，確保兩邊真的變成一致
  function handleToggleColumn(key, isClosedCat) {
    onToggle(key);
    if (!syncBothSides) return;
    const otherDefs = isClosedCat ? TASK_LIST_COLUMNS : TASK_LIST_COLUMNS_CLOSED;
    if (!otherDefs.some(c => c.key === key)) return; // 另一邊沒有同名欄位，沒東西可同步
    const newValueThisSide = !vc[key];
    const otherVc = isClosedCat ? visibleColumns : visibleColumnsClosed;
    const otherCurrentValue = !!otherVc[key];
    if (otherCurrentValue !== newValueThisSide) {
      const otherToggle = isClosedCat ? onToggleColumn : onToggleColumnClosed;
      otherToggle(key);
    }
  }
  // index/dir 是「畫面上看得到的那幾列」的位置；實際搬動時要換算回完整陣列裡的位置，
  // 這樣「類別分數」「來源」（這個情境看不到、不能排）會維持原本位置不動，只有看得到的欄位互相交換順序
  function moveItem(index, dir) {
    const renderKeys = orderDraft.filter(k => visibleKeySet.has(k));
    const targetIndex = index + dir;
    if (targetIndex < 0 || targetIndex >= renderKeys.length) return;
    const keyA = renderKeys[index], keyB = renderKeys[targetIndex];
    const idxA = orderDraft.indexOf(keyA), idxB = orderDraft.indexOf(keyB);
    const next = [...orderDraft];
    [next[idxA], next[idxB]] = [next[idxB], next[idxA]];
    setOrderDraft(next);
  }
  async function saveOrder() {
    setSavingOrder(true);
    await onSaveColumnOrder(category, orderDraft);
    setSavingOrder(false);
    setReorderMode(false);
  }

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className={"bg-white rounded-2xl shadow-xl w-full max-w-3xl max-h-[85vh] overflow-y-auto p-6 " + settingsModalClassName}>
        <div className="flex justify-between items-center mb-4">
          <h2 className="text-lg font-bold">任務列表顯示設定</h2>
          <button onClick={() => requestCloseSettingsModal(onClose)}><Icon.Close className="w-5 h-5 text-slate-400"/></button>
        </div>
        <div className="grid md:grid-cols-2 gap-4">
          <div className="bg-slate-50 rounded-2xl p-4">
            <div className="flex justify-between items-center mb-3 gap-2">
              <h3 className="font-bold text-sm">顯示欄位設定</h3>
              <div className="flex items-center gap-2">
                <select value={category} disabled={reorderMode} onChange={e => setCategory(e.target.value)}
                  className="text-xs border border-slate-300 rounded-lg px-2 py-1 bg-white disabled:opacity-50">
                  <option value="open">未結案任務-類別</option>
                  <option value="closed">已結案任務-類別</option>
                </select>
                {!reorderMode && (
                  <button onClick={startReorder} title="調整順序" className="w-7 h-7 flex items-center justify-center bg-white border border-slate-300 rounded-lg">
                    <Icon.Sort className="w-4 h-4 text-slate-600" />
                  </button>
                )}
                {!reorderMode && (
                  <button onClick={() => setSyncBothSides(v => !v)} title="雙邊顯示同動：開啟時，同名欄位在未結案/已結案兩邊會連動勾選狀態"
                    className={"w-7 h-7 flex items-center justify-center rounded-lg " + (syncBothSides ? "bg-blue-600 text-white" : "bg-white border border-slate-300 text-slate-600")}>
                    <Icon.Sync className="w-4 h-4" />
                  </button>
                )}
              </div>
            </div>

            {!reorderMode ? (
              <div className="space-y-2 max-h-80 overflow-y-auto pr-1">
                {renderableOrder.map(key => {
                  const c = visibleColumnDefs.find(cc => cc.key === key);
                  return (
                    <label key={key} className="flex items-center gap-2 text-sm bg-white rounded-lg px-3 py-2">
                      <input type="checkbox" checked={!!vc[key]} onChange={() => handleToggleColumn(key, isClosedCat)} className="w-4 h-4" />
                      {c.label}
                    </label>
                  );
                })}
              </div>
            ) : (
              <div className="space-y-2 max-h-80 overflow-y-auto pr-1">
                {orderDraft.filter(k => visibleKeySet.has(k)).map((key, i) => {
                  const c = visibleColumnDefs.find(cc => cc.key === key);
                  const renderCount = orderDraft.filter(k => visibleKeySet.has(k)).length;
                  return (
                    <div key={key} className={"flex items-center justify-between gap-2 text-sm rounded-lg px-3 py-2 " + (vc[key] ? "bg-white" : "bg-slate-100 text-slate-400")}>
                      <span>{c.label}{!vc[key] && <span className="text-xs ml-1">（已隱藏）</span>}</span>
                      <div className="flex gap-1">
                        <button onClick={() => moveItem(i, -1)} disabled={i === 0} className="p-1 rounded disabled:opacity-30 hover:bg-slate-100">
                          <Icon.ChevronUp className="w-4 h-4" />
                        </button>
                        <button onClick={() => moveItem(i, 1)} disabled={i === renderCount - 1} className="p-1 rounded disabled:opacity-30 hover:bg-slate-100">
                          <Icon.ChevronDown className="w-4 h-4" />
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {reorderMode ? (
              <div className="flex gap-2 mt-3">
                <button onClick={saveOrder} disabled={savingOrder} className="bg-slate-900 text-white text-xs rounded-lg px-4 py-2 disabled:opacity-50">{savingOrder ? "儲存中…" : "儲存"}</button>
                <button onClick={() => setReorderMode(false)} className="text-xs text-slate-500 px-4 py-2">取消</button>
              </div>
            ) : (
              <p className="text-xs text-slate-400 mt-3">
                {isClosedCat
                  ? "已完成／已棄置任務不再需要跟時間急不急有關的欄位，這裡是獨立的欄位設定，不會跟未結案任務共用。"
                  : "勾選的欄位會顯示在任務列表；取消勾選則隱藏該欄位。按「調整順序」可以調整欄位排列，按儲存後才會真正套用。"}
              </p>
            )}
          </div>

          <div className="bg-slate-50 rounded-2xl p-4">
            <h3 className="font-bold mb-3 text-sm">顯示區塊設定</h3>
            <div className="space-y-2">
              {TASK_SECTIONS.map(s => (

  const g = Math.round(lo.c[1] + (hi.c[1] - lo.c[1]) * localT);
  const b = Math.round(lo.c[2] + (hi.c[2] - lo.c[2]) * localT);
  return `rgb(${r}, ${g}, ${b})`;
}

const PRIORITY_SCORE_MAP = { P1: 1, P2: 2, P3: 3, P4: 4 };
const DEFAULT_PRIORITY_WEIGHTS = { w1: 1, w2: 1 };
function priorityImportanceScore(p) { return PRIORITY_SCORE_MAP[p] || 2; }
function overallPriorityScore(m, weights) {
  const w1 = (weights && Number(weights.w1)) || 0;
  const w2 = (weights && Number(weights.w2)) || 0;
  const importance = priorityImportanceScore(m.priority);
  const rd = remainingDays(m.due_date);
  const urgency = rd === null ? 0 : urgencyScore(rd, m.scale || 1);
  return importance * w1 + urgency * w2;
}

}

    case "friend_accepted": return `${n.actor?.display_name} 已接受你的好友邀請`;
    case "project_added": return `您已被加入專案＜${n.project?.name || ""}＞中，可於＜專案任務＞頁面中查看詳細內容`;
    case "project_task_added": return `專案＜${n.project?.name || ""}＞已新增任務：${n.mission?.title || ""}`;
    case "task_assigned": return n.project_id
      ? `您已被指派處理任務：${n.mission?.title || ""}－於＜${n.project?.name || ""}＞專案中`
      : `您已被指派處理任務：${n.mission?.title || ""}`;
    case "project_renamed": return `專案＜${n.payload?.old_name || ""}＞現已改名為＜${n.payload?.new_name || ""}＞`;
    default: return "";
  }
}

function sortMissions(list, mode, weights) {
  const arr = [...list];
  if (mode === "due_asc") {
    arr.sort((a, b) => {
      if (!a.due_date && !b.due_date) return 0;
      if (!a.due_date) return 1;
      if (!b.due_date) return -1;
      return new Date(a.due_date) - new Date(b.due_date);
    });
  } else if (mode === "priority_desc") {
    arr.sort((a, b) => overallPriorityScore(b, weights) - overallPriorityScore(a, weights));
  } else if (mode === "priority_first") {
    arr.sort((a, b) => (PRIORITY_SCORE_MAP[b.priority] - PRIORITY_SCORE_MAP[a.priority]) || (overallPriorityScore(b, weights) - overallPriorityScore(a, weights)));
  } else if (mode === "scale_asc") {
    arr.sort((a, b) => (a.scale || 1) - (b.scale || 1) || overallPriorityScore(b, weights) - overallPriorityScore(a, weights));
  } else if (mode === "scale_desc") {
    arr.sort((a, b) => (b.scale || 1) - (a.scale || 1) || overallPriorityScore(b, weights) - overallPriorityScore(a, weights));
  } else if (mode === "procrastination_desc") {
    arr.sort((a, b) => procrastinationTier(a.status) - procrastinationTier(b.status) || procrastinationDays(b) - procrastinationDays(a));
  } else if (mode === "updated_desc") {
    arr.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
  } else {
    arr.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  }
  return arr;
}

function darkenHex(hex, amount = 0.35) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(((n >> 16) & 255) * (1 - amount));
  const g = Math.round(((n >> 8) & 255) * (1 - amount));
  const b = Math.round((n & 255) * (1 - amount));
  return `rgb(${r},${g},${b})`;
}

  return 0;
}
// 類別瀏覽頁專用排序：分層優先（未結案→已完成→已棄置），
// 同層內先比這個分類自己的分數（不是 primary_category，是任務在「這個分類」上的實際分數），
// 分數相同才比整體優先級分數（沿用既有的 overallPriorityScore）
function sortMissionsByCategory(list, categoryKey, weights) {
  return [...list].sort((a, b) => {
    const tierDiff = statusTier(a.status) - statusTier(b.status);
    if (tierDiff !== 0) return tierDiff;
    const scoreA = Number(a.category_scores?.[categoryKey]) || 0;
    const scoreB = Number(b.category_scores?.[categoryKey]) || 0;
    if (scoreB !== scoreA) return scoreB - scoreA;
    return overallPriorityScore(b, weights) - overallPriorityScore(a, weights);
  });
}
// 「跟我有關」的任務：不論個人任務或專案任務，只要我是建立者或被指派者就算，
// 「別人指派給別人」的專案任務一律不列入類別瀏覽
function isRelevantToUser(m, userId) {
  return m.creator_id === userId || m.assigned_id === userId;
}
// AI 呼叫前的資訊量門檻：標題空白或去頭尾空白後 <=5 個字元（中英文數字符號都算一個字元），
// 先在前端擋下來，不要讓 AI 有機會被觸發浪費 token 跟額度
function isTitleTooShortForAi(title) {
  return !title || title.trim().length <= 5;
}
// 搜尋比對共用邏輯：標題/內文/最終評論 + 主分類中文名稱（例如搜「工作」）+ 工作維度的所有值/關鍵字/理由
// （search_blob 是資料庫 trigger 自動維護好的一段字串，不用在這裡自己組）。
// 個人任務／專案任務／全域搜尋三個地方都共用這個函式，改一次三邊都同步更新
function missionMatchesSearch(m, q) {
  if ((m.title || "").toLowerCase().includes(q)) return true;
  if ((m.content || "").toLowerCase().includes(q)) return true;
  if ((m.final_comment || "").toLowerCase().includes(q)) return true;
  const categoryLabel = m.primary_category && AI_CATEGORY_LABELS[m.primary_category];
  if (categoryLabel && categoryLabel.toLowerCase().includes(q)) return true;
  const workDim = Array.isArray(m.work_dimensions) ? m.work_dimensions[0] : m.work_dimensions;
  if (workDim && workDim.search_blob && workDim.search_blob.toLowerCase().includes(q)) return true;
  return false;
}
function primaryCategoryOf(scores) {
  if (!scores) return null;
  let best = null, bestScore = -1;
  for (const k of AI_CATEGORIES) {
    const v = Number(scores[k]) || 0;
    if (v > bestScore) { bestScore = v; best = k; }
  }
  return best;
}

// 手動分類：多選＋自動平分（不提供比例調整，選 N 個分類各占 1/N）。
// 選 0 個時回傳 null——「未分類」是有意義的狀態，不強制塞 other:1.0 污染資料，
// 避免跟「AI 判斷過、真的就是 other」混在一起，之後做分類統計時才不會失真。
function evenSplitScores(selectedKeys) {
  if (!selectedKeys || selectedKeys.length === 0) return null;
  const val = Number((1 / selectedKeys.length).toFixed(4));
  const scores = {};
  AI_CATEGORIES.forEach(k => { scores[k] = selectedKeys.includes(k) ? val : 0; });
  return scores;
}

// 十分類權重長條圖：由高到低排序，最高分那條用強調色，其餘灰色
function CategoryBreakdown({ scores }) {
  if (!scores) return <p className="text-xs text-slate-300 px-1">尚未分類</p>;
  const sorted = AI_CATEGORIES.map(k => [k, Number(scores[k]) || 0]).sort((a, b) => b[1] - a[1]);
  const top = sorted.length ? sorted[0][1] : 0;
  return (
    <div className="space-y-1">
      {sorted.map(([key, score]) => (
        <div key={key} className="flex items-center gap-2">
          <span className="w-16 text-xs text-slate-500 shrink-0">{AI_CATEGORY_LABELS[key]}</span>
          <div className="flex-1 bg-slate-100 rounded-full h-2 overflow-hidden">
            <div className="h-2" style={{ width: `${Math.max(score * 100, score > 0 ? 2 : 0)}%`, background: (score === top && top > 0) ? "#2563eb" : "#cbd5e1" }} />
          </div>
          <span className="w-9 text-xs text-slate-400 text-right shrink-0">{score.toFixed(2)}</span>
        </div>
      ))}
    </div>
  );
}

// 手動分類的多選按鈕群組，樣式比照既有的重要性/規模按鈕群組
function CategoryMultiSelect({ selected, onToggle }) {
  return (
    <div className="flex flex-wrap gap-1.5 mt-1">
      {AI_CATEGORIES.map(key => (
        <button key={key} type="button" onClick={() => onToggle(key)}
          className={"px-2.5 py-1 rounded-lg text-xs font-medium " + (selected.includes(key) ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500")}>
          {AI_CATEGORY_LABELS[key]}
        </button>
      ))}
    </div>
  );
}

// 任務規模 S1~S5：純前端計算，不呼叫 AI。使用 checklist 目前的結構化細節即時算出
function classifyTaskSize(count, totalMinutes, travelLegs, totalWaitDays) {
  if (travelLegs >= 2 || totalWaitDays >= 2 || count >= 8 || totalMinutes > 480) return 5;
  if (totalMinutes >= 240) return 4;
  if (totalMinutes >= 120) return 3;
  if (totalMinutes >= 30) return 2;
  return 1;
}
// 把目前 checklist 內容彙總成 classifyTaskSize() 需要的四個數字
function checklistAiStats(items) {
  const list = items || [];
  const count = list.length;
  const totalMinutes = list.reduce((s, it) => s + (Number(it.estimated_minutes) || 0), 0);
  const travelLegs = list.filter(it => it.requires_travel).length;
  const totalWaitDays = list.reduce((s, it) => s + (Number(it.wait_days_after) || 0), 0);
  return { count, totalMinutes, travelLegs, totalWaitDays };
}
// 是否有任何一項填了結構化細節（分鐘數/需移動/需等待）——不論項目是 AI 建議還是手動輸入，
// 只要有結構化資料，就足以觸發「自動規模」判定
function hasStructuredDetail(items) {
  return (items || []).some(it => (Number(it.estimated_minutes) > 0) || it.requires_travel || (Number(it.wait_days_after) > 0));
}
function autoScaleFromChecklist(items) {
  const { count, totalMinutes, travelLegs, totalWaitDays } = checklistAiStats(items);
  return classifyTaskSize(count, totalMinutes, travelLegs, totalWaitDays);
}

// UTC 安全的「隔天 00:00」邊界運算：AI 只判斷出日期、沒有精確時刻時，
// 逾期判斷邊界一律是隔天 00:00（不是當天 23:59:59，避免秒級模糊地帶）。
// 務必用 Date.UTC()＋setUTCDate()，不能用本地時間建構＋toISOString()，
// 否則台灣（UTC+8）會系統性少一天。
function nextDayUtcMidnightISO(dateStr) {
  const [y, mo, d] = dateStr.split("-").map(Number);
  const dt = new Date(Date.UTC(y, mo - 1, d));
  dt.setUTCDate(dt.getUTCDate() + 1);
  return dt.toISOString();
}
// 精確時刻的情況：日期+時間直接組成 ISO（時區以使用者輸入的當地時間為準）
function preciseDeadlineISO(dateStr, timeStr) {
  return new Date(`${dateStr}T${timeStr}:00`).toISOString();
}

// 呼叫 Supabase Edge Function（ai-recognize），Gemini API key 只存在伺服器端，前端絕對拿不到
// AI 呼叫失敗時，哪些錯誤代碼屬於「額度/頻率限制」，需要用明顯的自繪彈窗告知使用者
// （其餘技術性錯誤——例如 AI 服務掛了、格式解析失敗——維持原本的行內紅字提示，並附上代碼方便回報給 admin）
const AI_QUOTA_ERROR_CODES = new Set(["PERSONAL_MINUTE_LIMIT", "PERSONAL_DAILY_LIMIT", "GLOBAL_RATE_LIMIT", "GEMINI_QUOTA_EXCEEDED", "AI_UNAVAILABLE"]);
const AI_QUOTA_ERROR_TITLES = {
  PERSONAL_MINUTE_LIMIT: "查詢太頻繁了",
  PERSONAL_DAILY_LIMIT: "今日次數已用完",
  GLOBAL_RATE_LIMIT: "系統忙碌中",
  GEMINI_QUOTA_EXCEEDED: "AI 服務額度已用完",
  AI_UNAVAILABLE: "功能暫時無法使用",
};

async function callAiRecognize(title, content) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { const e = new Error("請重新登入後再試"); e.code = "UNAUTHENTICATED"; throw e; }
  const resp = await fetch(`${SUPABASE_URL}/functions/v1/ai-recognize`, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}` },
    body: JSON.stringify({ title, content }),
  });
  const json = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    const e = new Error(json.error || "AI 辨識失敗，請稍後再試");
    e.code = json.code || "UNKNOWN_ERROR";
    throw e;
  }
  return json; // { date_type, extracted_deadline_date, extracted_deadline_time, category_scores, subtasks }
}

// 「工作」分類專用的六個管理學維度標記，跟 callAiRecognize 共用同一套額度/帳號鎖定機制（同一個 Edge Function 家族）
async function callAiWorkDimensions(title, content) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { const e = new Error("請重新登入後再試"); e.code = "UNAUTHENTICATED"; throw e; }
  const resp = await fetch(`${SUPABASE_URL}/functions/v1/ai-work-dimensions`, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}` },
    body: JSON.stringify({ title, content }),
  });
  const json = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    const e = new Error(json.error || "AI 標記失敗，請稍後再試");
    e.code = json.code || "UNKNOWN_ERROR";
    throw e;
  }
  return json; // { internal_external, functional_category, task_level, priority_quadrant, task_type, growth_strategy, resource_bottleneck, keywords, rationale }
}

function AuthScreen() {
  const [mode, setMode] = useState("login"); // login | register | forgot
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setMsg(null);
    setBusy(true);
    try {
      if (mode === "login") {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else if (mode === "register") {
        const { error } = await sb.auth.signUp({
          email, password,
          options: { emailRedirectTo: window.location.href.split("#")[0] },
        });
        if (error) throw error;
        setMsg({ type: "ok", text: "註冊成功！若專案有開啟信箱驗證，請收信確認後再登入。" });
      } else if (mode === "forgot") {
        const { error } = await sb.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.href.split("#")[0],
        });
        if (error) throw error;
        setMsg({ type: "ok", text: "已寄出重設密碼信，請至信箱點擊連結繼續。" });
      }
    } catch (err) {
      setMsg({ type: "err", text: err.message || "發生錯誤" });
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="min-h-screen flex items-center justify-center px-4">
      <div className="w-full max-w-sm bg-white rounded-2xl shadow-lg p-8">
        <h1 className="text-2xl font-bold text-slate-800 mb-1">任務雲 TaskCloud</h1>
        <p className="text-sm text-slate-500 mb-6">多人共享任務管理系統</p>
        {mode !== "forgot" && (
          <div className="flex mb-6 rounded-lg bg-slate-100 p-1 text-sm font-medium">
            <button onClick={() => { setMode("login"); setMsg(null); }} className={"flex-1 py-1.5 rounded-md text-center " + (mode === "login" ? "bg-white shadow text-slate-900" : "text-slate-500")}>登入</button>
            <button onClick={() => { setMode("register"); setMsg(null); }} className={"flex-1 py-1.5 rounded-md text-center " + (mode === "register" ? "bg-white shadow text-slate-900" : "text-slate-500")}>註冊</button>
          </div>
        )}
        {mode === "forgot" && (
          <div className="mb-4">
            <h2 className="text-sm font-semibold text-slate-700">重設密碼</h2>
            <p className="text-xs text-slate-500 mt-1">輸入註冊時使用的 email，我們會寄一封重設密碼信給你。</p>
          </div>
        )}
        <form onSubmit={submit} className="space-y-3">
          <div>
            <label className="text-xs text-slate-500">Email</label>
            <input required type="email" value={email} onChange={e => setEmail(e.target.value)}
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
          </div>
          {mode !== "forgot" && (
            <div>
              <label className="text-xs text-slate-500">密碼</label>
              <input required type="password" minLength={6} value={password} onChange={e => setPassword(e.target.value)}
                className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
            </div>
          )}
          {mode === "login" && (
            <button type="button" onClick={() => { setMode("forgot"); setMsg(null); }} className="text-xs text-blue-600 underline">忘記密碼？</button>
          )}
          {msg && (
            <div className={"text-xs rounded-lg px-3 py-2 " + (msg.type === "err" ? "bg-rose-50 text-rose-600" : "bg-emerald-50 text-emerald-700")}>{msg.text}</div>
          )}
          <button disabled={busy} className="w-full bg-slate-900 text-white rounded-lg py-2.5 text-sm font-medium text-center disabled:opacity-50">
            {busy ? "處理中…" : (mode === "login" ? "登入" : mode === "register" ? "註冊" : "傳送重設密碼信")}
          </button>
          {mode === "forgot" && (
            <button type="button" onClick={() => { setMode("login"); setMsg(null); }} className="w-full text-xs text-slate-500 underline text-center">返回登入</button>
          )}
        </form>
        {!sb && (
          <p className="mt-4 text-xs text-rose-500">尚未設定 SUPABASE_URL / SUPABASE_ANON_KEY，請先在檔案最上方填入你的 Supabase 專案資訊。</p>
        )}
      </div>
    </div>
  );
}

// =====================================================================
// 重設密碼（從 email 連結點回來後顯示）
// =====================================================================
function ResetPasswordScreen({ onDone }) {
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [done, setDone] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setMsg(null);
    if (newPassword.length < 6) { setMsg({ type: "err", text: "新密碼至少需要 6 個字元" }); return; }
    if (newPassword !== confirmPassword) { setMsg({ type: "err", text: "兩次輸入的新密碼不一致" }); return; }
    setBusy(true);
    try {
      const { error } = await sb.auth.updateUser({ password: newPassword });
      if (error) throw error;
      await sb.auth.signOut();
      setDone(true);
    } catch (err) {
      setMsg({ type: "err", text: err.message || "更新密碼時發生錯誤" });
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="min-h-screen flex items-center justify-center px-4">
      <div className="w-full max-w-sm bg-white rounded-2xl shadow-lg p-8">
        <h1 className="text-xl font-bold text-slate-800 mb-1">設定新密碼</h1>
        {done ? (
          <div>
            <p className="text-sm text-emerald-700 bg-emerald-50 rounded-lg px-3 py-2 mt-4">密碼已更新成功，請用新密碼重新登入。</p>
            <button onClick={onDone} className="w-full mt-4 bg-slate-900 text-white rounded-lg py-2.5 text-sm font-medium text-center">前往登入</button>
          </div>
        ) : (
          <form onSubmit={submit} className="space-y-3 mt-4">
            <div>
              <label className="text-xs text-slate-500">新密碼（至少 6 個字元）</label>
              <input required type="password" minLength={6} value={newPassword} onChange={e => setNewPassword(e.target.value)}
                className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
            </div>
            <div>
              <label className="text-xs text-slate-500">確認新密碼</label>
              <input required type="password" minLength={6} value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)}
                className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
            </div>
            {msg && <div className={"text-xs rounded-lg px-3 py-2 " + (msg.type === "err" ? "bg-rose-50 text-rose-600" : "bg-emerald-50 text-emerald-700")}>{msg.text}</div>}
            <button disabled={busy} className="w-full bg-slate-900 text-white rounded-lg py-2.5 text-sm font-medium text-center disabled:opacity-50">{busy ? "更新中…" : "更新密碼"}</button>
          </form>
        )}
      </div>
    </div>
  );
}

// =====================================================================
// 新增任務 Modal
// =====================================================================
// 檢查清單左欄一個「已確定」項目的預設結構（不管來源是 AI 匯入還是手動新增，形狀一致）
function newDraftItem(content, extra) {
  return { _key: `d-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, content, estimated_minutes: null, requires_travel: false, wait_days_after: 0, from_ai: false, ...extra };
}

function NewMissionModal({ onClose, onCreated, priorityLabels, scaleLabels, priorityDisplay, scaleDisplay, priorityColorOverride, scaleColorOverride, currentUserId, currentUserName, assigneeOptions, projectId, fieldLabelPrefix, categoryDisplay, categoryEmojiOverride, aiBanned, initialTitle, initialContent }) {
  const { style: popStyle, className: popClassName, requestClose } = usePopModalAnimation();
  // 建立任務成功走模式二（不用縮回按鈕原位置）；按 X 放棄離開維持模式一，兩者分開追蹤、動畫互斥
  const { closing: createClosing, className: createCloseClassName, requestClose: requestCreateClose } = useConfirmModalAnimation();
  const effectivePopClassName = createClosing ? createCloseClassName : popClassName;
  const [title, setTitle] = useState(initialTitle || "");
  const [content, setContent] = useState(initialContent || "");
  const [contentOpen, setContentOpen] = useState(!!initialContent); // 有帶入初始內容（例如從靈感升級而來）時，預設直接展開讓使用者看得到
  const contentAnimRef = useAnimatedHeight(contentOpen);
  const [dueDate, setDueDate] = useState(""); // YYYY-MM-DD
  const [dueTime, setDueTime] = useState(""); // HH:MM，留空代表沒有精確時刻
  const [priority, setPriority] = useState("P2");
  const [scale, setScale] = useState(1);
  const [scaleSource, setScaleSource] = useState("manual"); // manual | auto
  const [scaleLocked, setScaleLocked] = useState(false); // 使用者是否曾按過「🔒 手動輸入」明確鎖住
  const [assigneeId, setAssigneeId] = useState(currentUserId);
  const [checklistDraft, setChecklistDraft] = useState([]); // 左欄：已確定
  const [checklistInput, setChecklistInput] = useState("");
  const [detailOpenKey, setDetailOpenKey] = useState(null);
  const [aiSuggestions, setAiSuggestions] = useState([]); // 右欄：AI 建議，尚未確認
  const [aiBusy, setAiBusy] = useState(false);
  const [aiErr, setAiErr] = useState(null);
  const [aiErrCode, setAiErrCode] = useState(null); // 非額度類的技術性錯誤代碼，附在行內提示裡方便回報
  const [aiQuotaModal, setAiQuotaModal] = useState(null); // { title, message }：額度/頻率類錯誤改用自繪彈窗
  const [aiCategoryScores, setAiCategoryScores] = useState(null); // 目前的分類權重，不論來自 AI 或手動設定
  const [categoryOpen, setCategoryOpen] = useState(false);
  const [categoryEditing, setCategoryEditing] = useState(false);
  const [categoryDraft, setCategoryDraft] = useState([]);
  // 「工作」六個管理學維度：新增任務時還沒有 mission_id，先存本地草稿，等任務建立成功後才真的寫進資料庫
  const [workDimOpen, setWorkDimOpen] = useState(false);
  const categoryAnimRef = useAnimatedHeight(categoryOpen);
  const workDimAnimRef = useAnimatedHeight(workDimOpen);
  const [workDimDraft, setWorkDimDraft] = useState({});
  const [workDimFromAi, setWorkDimFromAi] = useState(false);
  const [workAiBusy, setWorkAiBusy] = useState(false);
  const [workAiErr, setWorkAiErr] = useState(null);
  const [aiInsufficientModal, setAiInsufficientModal] = useState(false); // 標題資訊量不足時擋下 AI 呼叫，兩個 AI 按鈕共用同一個提示彈窗
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  // 任務規模自動判定：只要左欄任一項目有結構化細節，且使用者沒有明確鎖住手動，就自動接管
  useEffect(() => {
    if (scaleLocked) return;
    if (!hasStructuredDetail(checklistDraft)) return;
    setScaleSource("auto");
    setScale(autoScaleFromChecklist(checklistDraft));
  }, [checklistDraft, scaleLocked]);

  function toggleScaleLock() {
    if (scaleSource === "auto") { setScaleLocked(true); setScaleSource("manual"); }
    else { setScaleLocked(false); if (hasStructuredDetail(checklistDraft)) { setScaleSource("auto"); setScale(autoScaleFromChecklist(checklistDraft)); } }
  }

  function addChecklistDraftItem() {
    if (!checklistInput.trim()) return;
    setChecklistDraft(list => [...list, newDraftItem(checklistInput.trim())]);
    setChecklistInput("");
  }
  function removeChecklistDraftItem(key) {
    setChecklistDraft(list => list.filter(i => i._key !== key));
  }
  function updateDraftItem(key, patch) {
    setChecklistDraft(list => list.map(i => i._key === key ? { ...i, ...patch } : i));
  }
  function moveDraftItem(index, dir) {
    const target = index + dir;
    if (target < 0 || target >= checklistDraft.length) return;
    setChecklistDraft(list => {
      const arr = [...list];
      [arr[index], arr[target]] = [arr[target], arr[index]];
      return arr;
    });
  }
  // 右欄「←」：匯入左欄
  function importSuggestion(sugg) {
    setAiSuggestions(list => list.filter(s => s._key !== sugg._key));
    setChecklistDraft(list => [...list, newDraftItem(sugg.title, {
      estimated_minutes: sugg.estimated_minutes || null, requires_travel: !!sugg.requires_travel,
      wait_days_after: sugg.wait_days_after || 0, from_ai: true,
    })]);
  }
  // 左欄 AI 來源項目「→」：送回右欄建議（手動新增的項目沒有這個按鈕，只能移除）
  function sendBackToSuggestions(item) {
    setChecklistDraft(list => list.filter(i => i._key !== item._key));
    setAiSuggestions(list => [...list, {
      _key: item._key, title: item.content, estimated_minutes: item.estimated_minutes,
      requires_travel: item.requires_travel, wait_days_after: item.wait_days_after,
    }]);
  }

  async function runAiRecognize() {
    if (!title.trim()) return;
    if (isTitleTooShortForAi(title)) { setAiInsufficientModal(true); return; }
    setAiBusy(true); setAiErr(null); setAiErrCode(null);
    try {
      const result = await callAiRecognize(title.trim(), content);
      setAiCategoryScores(result.category_scores);
      setAiSuggestions((result.subtasks || []).map((s, i) => ({ ...s, _key: `ai-${Date.now()}-${i}` })));
      if (result.extracted_deadline_date) {
        setDueDate(result.extracted_deadline_date);
        setDueTime(result.extracted_deadline_time || "");
      }
    } catch (e) {
      if (AI_QUOTA_ERROR_CODES.has(e.code)) {
        setAiQuotaModal({ title: AI_QUOTA_ERROR_TITLES[e.code] || "已達使用上限", message: e.message });
      } else {
        setAiErr(e.message); setAiErrCode(e.code || null);
      }
    } finally {
      setAiBusy(false);
    }
  }

  function startCategoryEdit() {
    setCategoryDraft(AI_CATEGORIES.filter(k => Number((aiCategoryScores || {})[k]) > 0));
    setCategoryEditing(true);
  }
  function toggleCategoryDraft(key) {
    setCategoryDraft(list => list.includes(key) ? list.filter(k => k !== key) : [...list, key]);
  }
  function saveCategoryEdit() {
    setAiCategoryScores(evenSplitScores(categoryDraft));
    setCategoryEditing(false);
  }

  function updateWorkDimDraft(key, value) {
    setWorkDimDraft(d => {
      const next = { ...d, [key]: value };
      if (key === "internal_external" && value !== "外部") next.growth_strategy = "不適用";
      return next;
    });
    setWorkDimFromAi(false); // 手動改過就不算是純 AI 結果了
  }
  async function runWorkDimAi() {
    if (isTitleTooShortForAi(title)) { setAiInsufficientModal(true); return; }
    setWorkAiBusy(true); setWorkAiErr(null);
    try {
      const result = await callAiWorkDimensions(title, content);
      setWorkDimDraft(result);
      setWorkDimFromAi(true);
      setWorkDimOpen(true);
    } catch (e) {
      if (AI_QUOTA_ERROR_CODES.has(e.code)) {
        setAiQuotaModal({ title: AI_QUOTA_ERROR_TITLES[e.code] || "已達使用上限", message: e.message });
      } else {
        setWorkAiErr(e.message);
      }
    } finally {
      setWorkAiBusy(false);
    }
  }

  async function submit(e) {
    e.preventDefault();
    setBusy(true); setErr(null);
    try {
      const { data: { user } } = await sb.auth.getUser();
      const duePrecise = !!dueTime;
      const dueDateValue = !dueDate ? null : (duePrecise ? preciseDeadlineISO(dueDate, dueTime) : nextDayUtcMidnightISO(dueDate));
      const payload = {
        creator_id: user.id,
        assigned_id: assigneeId,
        project_id: projectId || null,
        title, content: content.trim() || null,
        priority, scale, scale_source: scaleSource,
        due_date: dueDateValue, due_time_precise: dueDateValue ? duePrecise : true,
        category_scores: aiCategoryScores, primary_category: aiCategoryScores ? primaryCategoryOf(aiCategoryScores) : null,
        ai_raw_input: aiCategoryScores ? title : null,
      };
      const { data: created, error } = await sb.from("missions").insert(payload).select("id").single();
      if (error) throw error;
      if (checklistDraft.length > 0) {
        const { error: clError } = await sb.from("mission_checklist_items")
          .insert(checklistDraft.map(it => ({
            mission_id: created.id, content: it.content,
            estimated_minutes: it.estimated_minutes, requires_travel: it.requires_travel,
            wait_days_after: it.wait_days_after, from_ai: it.from_ai,
          })));
        if (clError) throw clError;
      }
      const currentPrimaryCategory = aiCategoryScores ? primaryCategoryOf(aiCategoryScores) : null;
      if (currentPrimaryCategory === "work" && Object.values(workDimDraft).some(v => v)) {
        const { error: wdError } = await sb.from("mission_work_dimensions").insert({
          mission_id: created.id, ...workDimDraft, from_ai: workDimFromAi,
        });
        if (wdError) throw wdError;
      }
      requestCreateClose(() => { onCreated(created.id); onClose(); });
    } catch (e2) {
      setErr(e2.message);
    } finally { setBusy(false); }
  }

  return (
    <>
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className={"bg-white rounded-2xl shadow-xl w-full max-w-4xl max-h-[85vh] overflow-y-auto p-6 " + effectivePopClassName} style={popStyle}>
        <div className="flex justify-between items-center mb-4">
          <h2 className="text-lg font-bold">{projectId ? "新增子任務" : "新增任務"}</h2>
          <button onClick={() => requestClose(onClose)}><Icon.Close className="w-5 h-5 text-slate-400"/></button>
        </div>
        <form onSubmit={submit} className="space-y-3">
          <div>
            <label className="text-xs text-slate-500">{fieldLabelPrefix}任務標題</label>
            <div className="flex gap-2 mt-1">
              <input required value={title} onChange={e => setTitle(e.target.value)}
                className="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm" />
              <button type="button" onClick={runAiRecognize} disabled={aiBusy || !title.trim() || aiBanned}
                title={aiBanned ? "AI 辨識功能目前暫時無法使用" : undefined}
                className="shrink-0 bg-violet-50 text-violet-700 text-xs rounded-lg px-3 py-2 font-medium disabled:opacity-50 whitespace-nowrap">
                {aiBusy ? "辨識中…" : "✨ AI 辨識"}
              </button>
            </div>
            {aiErr && <p className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2 mt-1">{aiErr}{aiErrCode ? `（代碼：${aiErrCode}）` : ""}</p>}
          </div>
          <div>
            <div className="flex items-center gap-2">
              <label className="text-xs text-slate-500">{fieldLabelPrefix}任務內容</label>
              <button type="button" onClick={() => setContentOpen(v => !v)}
                title={contentOpen ? "收合" : "展開填寫任務內容"}
                className={"flex items-center justify-center w-5 h-5 rounded text-xs font-bold " + (contentOpen ? "bg-blue-600 text-white" : "bg-slate-100 text-slate-500 hover:bg-slate-200")}>
                +
              </button>
              {!contentOpen && content && <span className="text-xs text-slate-400">（已填寫，點「+」查看）</span>}
            </div>
            <div ref={contentAnimRef}>
              {contentOpen && (
                <textarea rows={5} value={content} onChange={e => setContent(e.target.value)}
                  placeholder="（任務內容文字描述，可留空）"
                  className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
              )}
            </div>
          </div>

          <div>
            <div className="flex items-center gap-1.5">
              <label className="text-xs text-slate-500">{fieldLabelPrefix}任務類別：{aiCategoryScores ? renderCategoryText(categoryDisplay, "detail_edit", primaryCategoryOf(aiCategoryScores), categoryEmojiOverride) : "尚未分類"}</label>
              <button type="button" onClick={() => setCategoryOpen(v => !v)} title={categoryOpen ? "收合" : "展開查看完整分類權重"}
                className={"flex items-center justify-center w-5 h-5 rounded " + (categoryOpen ? "bg-blue-100 text-blue-600" : "text-slate-400 hover:text-slate-600")}>
                <Icon.Search className="w-3.5 h-3.5" />
              </button>
            </div>
            <div ref={categoryAnimRef}>
              {categoryOpen && (
                <div className="mt-2 bg-slate-50 rounded-lg p-3">
                  {!categoryEditing ? (
                    <>
                      <CategoryBreakdown scores={aiCategoryScores} />
                      <button type="button" onClick={startCategoryEdit} className="mt-2 text-xs text-slate-400 hover:text-slate-600">✏️ 手動設定分類</button>
                    </>
                  ) : (
                    <>
                      <p className="text-xs text-slate-500 mb-1">選擇分類（可複選，選多個會自動平分權重，都不選就是「未分類」）</p>
                      <CategoryMultiSelect selected={categoryDraft} onToggle={toggleCategoryDraft} />
                      <div className="flex gap-2 mt-2">
                        <button type="button" onClick={saveCategoryEdit} className="bg-slate-900 text-white text-xs rounded-lg px-3 py-1.5">套用</button>
                        <button type="button" onClick={() => setCategoryEditing(false)} className="text-xs text-slate-500 px-3 py-1.5">取消</button>
                      </div>
                    </>
                  )}
                </div>
              )}
            </div>
          </div>

          {(aiCategoryScores ? primaryCategoryOf(aiCategoryScores) : null) === "work" && (
            <div>
              <div className="flex items-center gap-1.5">
                <label className="text-xs text-slate-500">{fieldLabelPrefix}工作維度：{Object.values(workDimDraft).some(v => v) ? "已標記" : "尚未標記"}</label>
                <button type="button" onClick={() => setWorkDimOpen(v => !v)} title={workDimOpen ? "收合" : "展開設定六個維度"}
                  className={"flex items-center justify-center w-5 h-5 rounded " + (workDimOpen ? "bg-blue-100 text-blue-600" : "text-slate-400 hover:text-slate-600")}>
                  <Icon.Search className="w-3.5 h-3.5" />
                </button>
              </div>
              <div ref={workDimAnimRef}>
                {workDimOpen && (

  useEffect(() => {
    const currentIds = new Set(checklist.map(i => i.id));
    if (seenChecklistIdsRef.current === null) {
      // 第一次掛載，只記錄現有項目，不要播放動畫——不然任務內頁一打開，所有清單項目會一起跑一次長高動畫
      seenChecklistIdsRef.current = currentIds;
      return;
    }
    const newIds = [...currentIds].filter(id => !seenChecklistIdsRef.current.has(id));

  // 按確定才會真的送出（避免手滑點錯），跟一般狀態切換那種要先填理由的表單是分開的兩條路

    // 兩者結果都一樣：退回進行中，final_comment 清空交給 DB trigger 自動處理，這裡不用重複處理
