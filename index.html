function ChangePasswordCard({ email }) {
  const [currentPassword, setCurrentPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);

  async function submit(e) {
    e.preventDefault();
    setMsg(null);

    if (newPassword.length < 6) {
      setMsg({ type: "err", text: "新密碼至少需要 6 個字元" });
      return;
    }
    if (newPassword !== confirmPassword) {
      setMsg({ type: "err", text: "兩次輸入的新密碼不一致" });
      return;
    }
    if (newPassword === currentPassword) {
      setMsg({ type: "err", text: "新密碼不能與目前密碼相同" });
      return;
    }

    setBusy(true);
    try {
      // 先用目前密碼重新驗證身分，確認操作者真的知道舊密碼
      const { error: signInErr } = await sb.auth.signInWithPassword({ email, password: currentPassword });
      if (signInErr) {
        setMsg({ type: "err", text: "目前密碼不正確" });
        return;
      }
      const { error: updateErr } = await sb.auth.updateUser({ password: newPassword });
      if (updateErr) throw updateErr;
      setMsg({ type: "ok", text: "密碼已更新成功" });
      setCurrentPassword(""); setNewPassword(""); setConfirmPassword("");
    } catch (err) {
      setMsg({ type: "err", text: err.message || "變更密碼時發生錯誤" });
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="bg-white rounded-2xl shadow p-5">
      <h3 className="font-bold mb-3">變更密碼</h3>
      <form onSubmit={submit} className="space-y-3 text-sm">
        <div>
          <label className="text-xs text-slate-500">目前密碼</label>
          <input required type="password" value={currentPassword} onChange={e => setCurrentPassword(e.target.value)}
            className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2" />
        </div>
        <div>
          <label className="text-xs text-slate-500">新密碼（至少 6 個字元）</label>
          <input required type="password" minLength={6} value={newPassword} onChange={e => setNewPassword(e.target.value)}
            className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2" />
        </div>
        <div>
          <label className="text-xs text-slate-500">確認新密碼</label>
          <input required type="password" minLength={6} value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)}
            className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2" />
        </div>
        {msg && <div className={"text-xs rounded-lg px-3 py-2 " + (msg.type === "err" ? "bg-rose-50 text-rose-600" : "bg-emerald-50 text-emerald-700")}>{msg.text}</div>}
        <button disabled={busy} className="bg-slate-900 text-white rounded-lg px-4 py-2 text-sm disabled:opacity-50">{busy ? "更新中…" : "更新密碼"}</button>
      </form>
    </div>
  );
}

function SettingsView({ profile, onProfileChange }) {
  const [displayName, setDisplayName] = useState(profile.display_name);
  const [isSearchable, setIsSearchable] = useState(profile.is_searchable);
  useEffect(() => {
    setDisplayName(profile.display_name);
    setIsSearchable(profile.is_searchable);
  }, [profile.display_name, profile.is_searchable]);

  const [saving, setSaving] = useState(false);
  const [friends, setFriends] = useState([]);
  const [incoming, setIncoming] = useState([]);
  const [outgoing, setOutgoing] = useState([]);
  const [searchTerm, setSearchTerm] = useState("");
  const [searchResults, setSearchResults] = useState([]);
  const [msg, setMsg] = useState(null);
  const [confirmRemoveFriend, setConfirmRemoveFriend] = useState(null);

  // 以下這些「已儲存的值」都直接從 profile 讀取（而不是自己另外存一份 state），
  // 這樣只要 profile 因為 Realtime 從別的裝置同步更新，畫面就會自動跟著換，不用重新整理
  const priorityLabels = profile.priority_labels || DEFAULT_PRIORITY_LABELS;
  const priorityDisplay = profile.priority_display || DEFAULT_DISPLAY_MODES;
  const priorityColorOverride = profile.priority_color_override || false;
  const [editingPriority, setEditingPriority] = useState(false);
  const [priorityLabelDraft, setPriorityLabelDraft] = useState(priorityLabels);
  const [priorityDisplayDraft, setPriorityDisplayDraft] = useState(priorityDisplay);
  const [priorityColorOverrideDraft, setPriorityColorOverrideDraft] = useState(priorityColorOverride);
  const [savingPriority, setSavingPriority] = useState(false);

  const categoryDisplay = profile.category_display || DEFAULT_CATEGORY_DISPLAY_MODES;
  const categoryEmojiOverride = profile.category_emoji_override || {};
  const workSubDimension = profile.work_sub_dimension || "functional_category";
  const [editingCategoryDisplay, setEditingCategoryDisplay] = useState(false);
  const [categoryDisplayDraft, setCategoryDisplayDraft] = useState(categoryDisplay);
  const [workSubDimensionDraft, setWorkSubDimensionDraft] = useState(workSubDimension);
  const [categoryEmojiDraft, setCategoryEmojiDraft] = useState(
    Object.fromEntries(AI_CATEGORIES.map(k => [k, categoryEmojiOverride[k] || CATEGORY_EMOJI[k]]))
  );
  const [savingCategoryDisplay, setSavingCategoryDisplay] = useState(false);
  const [invalidEmojiNotice, setInvalidEmojiNotice] = useState(null); // 存檔時被棄置成預設值的分類清單，存完跳彈窗提醒

  const glowSettings = profile.glow_settings || DEFAULT_GLOW_SETTINGS;
  const [editingGlow, setEditingGlow] = useState(false);
  const [glowDraft, setGlowDraft] = useState(glowSettings);
  const [savingGlow, setSavingGlow] = useState(false);

  function startEditGlow() {
    setGlowDraft(glowSettings);
    setEditingGlow(true);
  }
  function updateGlowDraft(patch) {
    setGlowDraft(d => {
      const next = { ...d, ...patch };
      // 最低強度不能超過最亮強度——最亮強度往下調的時候，最低強度要跟著夾住，不然滑桿會出現「最低比最亮還亮」的怪狀態
      if (next.minOpacity > next.maxOpacity) next.minOpacity = next.maxOpacity;
      return next;
    });
  }
  async function saveGlowSettings() {
    setSavingGlow(true);
    const { error } = await sb.from("profiles").update({ glow_settings: glowDraft }).eq("id", profile.id);
    setSavingGlow(false);
    if (!error) {
      onProfileChange({ ...profile, glow_settings: glowDraft });
      setEditingGlow(false);
    } else {
      setMsg({ type: "err", text: error.message });
    }
  }

  function startEditCategoryDisplay() {
    setCategoryDisplayDraft(categoryDisplay);
    setCategoryEmojiDraft(Object.fromEntries(AI_CATEGORIES.map(k => [k, categoryEmojiOverride[k] || CATEGORY_EMOJI[k]])));
    setWorkSubDimensionDraft(workSubDimension);
    setEditingCategoryDisplay(true);
  }
  // 判斷輸入是不是「剛好一個視覺字元」（grapheme cluster）：emoji 常常是好幾個 code unit 組成
  // （帶膚色/多人組合的 emoji 甚至到 10 個以上），不能用字串長度去算，要照使用者眼睛看到的「一個字」判斷，
  // 不然合法的複雜 emoji 會被誤判成太長而擋下來
  function isSingleGrapheme(str) {
    if (!str) return false;
    try {
      const segmenter = new Intl.Segmenter(undefined, { granularity: "grapheme" });
      return Array.from(segmenter.segment(str)).length === 1;
    } catch {
      // 舊瀏覽器沒有 Intl.Segmenter 時的退路，多數 emoji 仍可正確判斷
      return Array.from(str).length === 1;
    }
  }
  async function saveCategoryDisplay() {
    setSavingCategoryDisplay(true);
    const invalidKeys = [];
    const nextOverride = {};
    AI_CATEGORIES.forEach(k => {
      const val = (categoryEmojiDraft[k] || "").trim();
      if (val === CATEGORY_EMOJI[k]) return; // 跟預設一樣，不用存
      if (isSingleGrapheme(val)) {
        nextOverride[k] = val;
      } else {
        invalidKeys.push(k); // 不合格（空白／貼了純文字／貼了不只一個 emoji）：直接棄置回預設值
      }
    });
    const { error } = await sb.from("profiles").update({
      category_display: categoryDisplayDraft, category_emoji_override: nextOverride, work_sub_dimension: workSubDimensionDraft,
    }).eq("id", profile.id);
    setSavingCategoryDisplay(false);
    if (!error) {
      onProfileChange({ ...profile, category_display: categoryDisplayDraft, category_emoji_override: nextOverride, work_sub_dimension: workSubDimensionDraft });
      setEditingCategoryDisplay(false);
      if (invalidKeys.length > 0) setInvalidEmojiNotice(invalidKeys.map(k => AI_CATEGORY_LABELS[k]).join("、"));
    } else {
      setMsg({ type: "err", text: error.message });
    }
  }
  async function resetCategoryEmoji() {
    setSavingCategoryDisplay(true);
    const { error } = await sb.from("profiles").update({ category_emoji_override: {} }).eq("id", profile.id);
    setSavingCategoryDisplay(false);
    if (!error) {
      onProfileChange({ ...profile, category_emoji_override: {} });
      setCategoryEmojiDraft(Object.fromEntries(AI_CATEGORIES.map(k => [k, CATEGORY_EMOJI[k]])));
    } else {
      setMsg({ type: "err", text: error.message });
    }
  }

  // 提前緊張加成：切下拉選單當下立即持久化，不用編輯/儲存流程，
  // 存回 profile 後全站用 urgencyScore() 算出來的分數（排序、列表、甘特圖…）都會立刻反映新倍數
  async function setUrgencyAnticipationMultiplier(val) {
    const { error } = await sb.from("profiles").update({ urgency_anticipation_multiplier: val }).eq("id", profile.id);
    if (!error) onProfileChange({ ...profile, urgency_anticipation_multiplier: val });
    else setMsg({ type: "err", text: error.message });
  }

  function startEditPriority() {
    setPriorityLabelDraft(priorityLabels);
    setPriorityDisplayDraft(priorityDisplay);
    setPriorityColorOverrideDraft(priorityColorOverride);
    setEditingPriority(true);
  }
  function updatePriorityDraft(p, field, value) {
    setPriorityLabelDraft(d => ({ ...d, [p]: { ...(d[p] || {}), [field]: value } }));
  }
  async function savePriority() {
    setSavingPriority(true);
    const { error } = await sb.from("profiles").update({
      priority_labels: priorityLabelDraft, priority_display: priorityDisplayDraft,
      priority_color_override: priorityColorOverrideDraft,
    }).eq("id", profile.id);
    setSavingPriority(false);
    if (!error) {
      onProfileChange({ ...profile, priority_labels: priorityLabelDraft, priority_display: priorityDisplayDraft, priority_color_override: priorityColorOverrideDraft });
      setEditingPriority(false);
    } else {
      setMsg({ type: "err", text: error.message });
    }
  }

  const scaleLabels = profile.scale_labels || DEFAULT_SCALE_LABELS;
  const scaleDisplay = profile.scale_display || DEFAULT_DISPLAY_MODES;
  const scaleColorOverride = profile.scale_color_override || false;
  const [editingScale, setEditingScale] = useState(false);
  const [scaleLabelDraft, setScaleLabelDraft] = useState(scaleLabels);
  const [scaleDisplayDraft, setScaleDisplayDraft] = useState(scaleDisplay);
  const [scaleColorOverrideDraft, setScaleColorOverrideDraft] = useState(scaleColorOverride);
  const [savingScale, setSavingScale] = useState(false);

  function startEditScale() {
    setScaleLabelDraft(scaleLabels);
    setScaleDisplayDraft(scaleDisplay);
    setScaleColorOverrideDraft(scaleColorOverride);
    setEditingScale(true);
  }
  function updateScaleDraft(key, field, value) {
    setScaleLabelDraft(d => ({ ...d, [key]: { ...(d[key] || {}), [field]: value } }));
  }
  async function saveScale() {
    setSavingScale(true);
    const { error } = await sb.from("profiles").update({
      scale_labels: scaleLabelDraft, scale_display: scaleDisplayDraft,
      scale_color_override: scaleColorOverrideDraft,
    }).eq("id", profile.id);
    setSavingScale(false);
    if (!error) {
      onProfileChange({ ...profile, scale_labels: scaleLabelDraft, scale_display: scaleDisplayDraft, scale_color_override: scaleColorOverrideDraft });
      setEditingScale(false);
    } else {
      setMsg({ type: "err", text: error.message });
    }
  }

  const urgencyLabels = profile.urgency_labels || DEFAULT_URGENCY_LABELS;
  const urgencyDisplay = profile.urgency_display || DEFAULT_URGENCY_DISPLAY;
  const urgencyColorOverride = profile.urgency_color_override || false;
  const [editingUrgency, setEditingUrgency] = useState(false);
  const [urgencyLabelDraft, setUrgencyLabelDraft] = useState(urgencyLabels);
  const [urgencyDisplayDraft, setUrgencyDisplayDraft] = useState(urgencyDisplay);
  const [urgencyColorOverrideDraft, setUrgencyColorOverrideDraft] = useState(urgencyColorOverride);
  const [savingUrgency, setSavingUrgency] = useState(false);

  function startEditUrgency() {
    setUrgencyLabelDraft(urgencyLabels);
    setUrgencyDisplayDraft(urgencyDisplay);
    setUrgencyColorOverrideDraft(urgencyColorOverride);
    setEditingUrgency(true);
  }
  function updateUrgencyDraft(u, field, value) {
    setUrgencyLabelDraft(d => ({ ...d, [u]: { ...(d[u] || {}), [field]: value } }));
  }
  async function saveUrgency() {
    setSavingUrgency(true);
    const { error } = await sb.from("profiles").update({
      urgency_labels: urgencyLabelDraft, urgency_display: urgencyDisplayDraft,
      urgency_color_override: urgencyColorOverrideDraft,
    }).eq("id", profile.id);
    setSavingUrgency(false);
    if (!error) {
      onProfileChange({ ...profile, urgency_labels: urgencyLabelDraft, urgency_display: urgencyDisplayDraft, urgency_color_override: urgencyColorOverrideDraft });
      setEditingUrgency(false);
    } else {
      setMsg({ type: "err", text: error.message });
    }
  }

  const weights = profile.priority_weights || DEFAULT_PRIORITY_WEIGHTS;
  const [editingWeights, setEditingWeights] = useState(false);
  const [weightDraft, setWeightDraft] = useState({ w1: String(weights.w1), w2: String(weights.w2) });
  const [savingWeights, setSavingWeights] = useState(false);
  const [weightErr, setWeightErr] = useState(null);

  function startEditWeights() {
    setWeightDraft({ w1: String(weights.w1), w2: String(weights.w2) });
    setWeightErr(null);
    setEditingWeights(true);
  }

  function parseWeight(v) {
    const n = Number(v);
    if (v === "" || v === null || Number.isNaN(n) || !Number.isFinite(n) || n < 0) return null;
    return n;
  }

  async function saveWeights() {
    const w1 = parseWeight(weightDraft.w1);
    const w2 = parseWeight(weightDraft.w2);
    if (w1 === null || w2 === null) {
      setWeightErr("請輸入有效的數字（需為 0 以上的數字）");
      return;
    }
    setWeightErr(null);
    setSavingWeights(true);
    const newWeights = { w1, w2 };
    const { error } = await sb.from("profiles").update({ priority_weights: newWeights }).eq("id", profile.id);
    setSavingWeights(false);
    if (!error) {
      onProfileChange({ ...profile, priority_weights: newWeights });
      setEditingWeights(false);
    } else {
      setWeightErr(error.message);
    }
  }

  async function resetWeights() {
    setSavingWeights(true);
    const { error } = await sb.from("profiles").update({ priority_weights: DEFAULT_PRIORITY_WEIGHTS }).eq("id", profile.id);
    setSavingWeights(false);
    if (!error) {
      onProfileChange({ ...profile, priority_weights: DEFAULT_PRIORITY_WEIGHTS });
      setEditingWeights(false);
      setWeightErr(null);
    } else {
      setWeightErr(error.message);
    }
  }

  const relationFilterDisplayTop = profile.relation_filter_display_top || "text";
  const relationFilterDisplayList = profile.relation_filter_display_list || "logo";
  const dueDateDisplayDetail = profile.due_date_display_detail || "raw";
  const dueDateDisplayList = profile.due_date_display_list || "raw";
  const dueDateColorOverride = profile.due_date_color_override || false;
  const forceShowSortColumn = profile.force_show_sort_column !== false;
  const noProgressColorOverride = profile.no_progress_color_override || false;
  const noProgressSeverityDays = profile.no_progress_severity_days || 7;
  const rememberSortMode = profile.remember_sort_mode || "last_used";
  const checklistDisplayMode = profile.checklist_display_mode || "bar";
  const fieldLabelPrefix = profile.field_label_prefix ?? "※";
  const [editingOtherDisplay, setEditingOtherDisplay] = useState(false);
  const [relationFilterDisplayTopDraft, setRelationFilterDisplayTopDraft] = useState(relationFilterDisplayTop);
  const [relationFilterDisplayListDraft, setRelationFilterDisplayListDraft] = useState(relationFilterDisplayList);
  const [dueDateDisplayDetailDraft, setDueDateDisplayDetailDraft] = useState(dueDateDisplayDetail);
  const [dueDateDisplayListDraft, setDueDateDisplayListDraft] = useState(dueDateDisplayList);
  const [dueDateColorOverrideDraft, setDueDateColorOverrideDraft] = useState(dueDateColorOverride);
  const [forceShowSortColumnDraft, setForceShowSortColumnDraft] = useState(forceShowSortColumn);
  const [noProgressColorOverrideDraft, setNoProgressColorOverrideDraft] = useState(noProgressColorOverride);
  const [noProgressSeverityDaysDraft, setNoProgressSeverityDaysDraft] = useState(String(noProgressSeverityDays));
  const [rememberSortModeDraft, setRememberSortModeDraft] = useState(rememberSortMode);
  const [checklistDisplayModeDraft, setChecklistDisplayModeDraft] = useState(checklistDisplayMode);
  const [fieldLabelPrefixDraft, setFieldLabelPrefixDraft] = useState(fieldLabelPrefix);
  const [savingOtherDisplay, setSavingOtherDisplay] = useState(false);

  function startEditOtherDisplay() {
    setRelationFilterDisplayTopDraft(relationFilterDisplayTop);
    setRelationFilterDisplayListDraft(relationFilterDisplayList);
    setDueDateDisplayDetailDraft(dueDateDisplayDetail);
    setDueDateDisplayListDraft(dueDateDisplayList);
    setDueDateColorOverrideDraft(dueDateColorOverride);
    setForceShowSortColumnDraft(forceShowSortColumn);
    setNoProgressColorOverrideDraft(noProgressColorOverride);
    setNoProgressSeverityDaysDraft(String(noProgressSeverityDays));
    setRememberSortModeDraft(rememberSortMode);
    setChecklistDisplayModeDraft(checklistDisplayMode);
    setFieldLabelPrefixDraft(fieldLabelPrefix);
    setEditingOtherDisplay(true);
  }
  async function saveOtherDisplay() {
    const parsedDays = Math.max(1, parseInt(noProgressSeverityDaysDraft, 10) || 7);
    setSavingOtherDisplay(true);
    const { error } = await sb.from("profiles").update({
      relation_filter_display_top: relationFilterDisplayTopDraft,
      relation_filter_display_list: relationFilterDisplayListDraft,
      due_date_display_detail: dueDateDisplayDetailDraft,
      due_date_display_list: dueDateDisplayListDraft,
      due_date_color_override: dueDateColorOverrideDraft,
      force_show_sort_column: forceShowSortColumnDraft,
      no_progress_color_override: noProgressColorOverrideDraft,
      no_progress_severity_days: parsedDays,
      remember_sort_mode: rememberSortModeDraft,
      checklist_display_mode: checklistDisplayModeDraft,
      field_label_prefix: fieldLabelPrefixDraft,
    }).eq("id", profile.id);
    setSavingOtherDisplay(false);
    if (!error) {
      onProfileChange({
        ...profile,
        relation_filter_display_top: relationFilterDisplayTopDraft,
        relation_filter_display_list: relationFilterDisplayListDraft,
        due_date_display_detail: dueDateDisplayDetailDraft,
        due_date_display_list: dueDateDisplayListDraft,
        due_date_color_override: dueDateColorOverrideDraft,
        force_show_sort_column: forceShowSortColumnDraft,
        no_progress_color_override: noProgressColorOverrideDraft,
        no_progress_severity_days: parsedDays,
        remember_sort_mode: rememberSortModeDraft,
        checklist_display_mode: checklistDisplayModeDraft,
        field_label_prefix: fieldLabelPrefixDraft,
      });
      setEditingOtherDisplay(false);
    } else {
      setMsg({ type: "err", text: error.message });
    }
  }

  const sortHighlightColor = profile.sort_highlight_color || "blue";
  const starOverrideColor = profile.star_override_color || "none";
  const searchHighlightColor = profile.search_highlight_color || "none";
  const [editingSortColor, setEditingSortColor] = useState(false);
  const [sortHighlightColorDraft, setSortHighlightColorDraft] = useState(sortHighlightColor);
  const [starOverrideColorDraft, setStarOverrideColorDraft] = useState(starOverrideColor);
  const [searchHighlightColorDraft, setSearchHighlightColorDraft] = useState(searchHighlightColor);
  const [savingSortColor, setSavingSortColor] = useState(false);

  function startEditSortColor() {
    setSortHighlightColorDraft(sortHighlightColor);
    setStarOverrideColorDraft(starOverrideColor);
    setSearchHighlightColorDraft(searchHighlightColor);
    setEditingSortColor(true);
  }
  async function saveSortColor() {
    setSavingSortColor(true);
    const { error } = await sb.from("profiles").update({
      sort_highlight_color: sortHighlightColorDraft,
      star_override_color: starOverrideColorDraft,
      search_highlight_color: searchHighlightColorDraft,
    }).eq("id", profile.id);
    setSavingSortColor(false);
    if (!error) {
      onProfileChange({ ...profile, sort_highlight_color: sortHighlightColorDraft, star_override_color: starOverrideColorDraft, search_highlight_color: searchHighlightColorDraft });
      setEditingSortColor(false);
    } else {
      setMsg({ type: "err", text: error.message });
    }
  }

  const loadFriends = useCallback(async () => {
    const uid = profile.id;
    const [{ data: asReq }, { data: asAdr }, { data: inc }, { data: out }] = await Promise.all([
      sb.from("friendships").select("id, addressee:profiles!friendships_addressee_id_fkey(id,display_name,email)").eq("requester_id", uid).eq("status", "accepted"),
      sb.from("friendships").select("id, requester:profiles!friendships_requester_id_fkey(id,display_name,email)").eq("addressee_id", uid).eq("status", "accepted"),
      sb.from("friendships").select("id, requester:profiles!friendships_requester_id_fkey(id,display_name,email)").eq("addressee_id", uid).eq("status", "pending"),
      sb.from("friendships").select("id, addressee:profiles!friendships_addressee_id_fkey(id,display_name,email)").eq("requester_id", uid).eq("status", "pending"),
    ]);
    const f1 = (asReq || []).map(r => ({ friendshipId: r.id, friend: r.addressee }));
    const f2 = (asAdr || []).map(r => ({ friendshipId: r.id, friend: r.requester }));
    setFriends([...f1, ...f2]);
    setIncoming(inc || []);
    setOutgoing(out || []);
  }, [profile.id]);

  useEffect(() => { loadFriends(); }, [loadFriends]);

    setSaving(true);

    setSaving(false);
    if (!error) { onProfileChange({ ...profile, display_name: displayName, is_searchable: isSearchable }); setMsg({ type: "ok", text: "已儲存" }); }
    else setMsg({ type: "err", text: error.message });
  }

  async function doSearch() {
    if (!searchTerm.trim()) { setSearchResults([]); return; }
    const { data, error } = await sb.from("profiles").select("id,display_name,email")
      .eq("is_searchable", true).neq("id", profile.id)
      .or(`display_name.ilike.%${searchTerm}%,email.ilike.%${searchTerm}%`);
    if (!error) setSearchResults(data || []);
  }

  async function sendRequest(target) {
    const { data: existing } = await sb.from("friendships")
      .select("id,status")
      .or(`and(requester_id.eq.${profile.id},addressee_id.eq.${target.id}),and(requester_id.eq.${target.id},addressee_id.eq.${profile.id})`)
      .maybeSingle();

    let error;
    if (existing) {
      if (existing.status === "accepted") { setMsg({ type: "err", text: "你們已經是好友了" }); return; }
      if (existing.status === "pending") { setMsg({ type: "err", text: "已經有邀請在等待對方確認" }); return; }
      // 之前被拒絕過：把同一筆紀錄改回 pending 重新邀請，避免違反唯一組合限制
      const { error: updErr } = await sb.from("friendships").update({
        requester_id: profile.id, addressee_id: target.id, status: "pending", updated_at: new Date().toISOString(),
      }).eq("id", existing.id);
      error = updErr;
    } else {
      const { error: insErr } = await sb.from("friendships").insert({ requester_id: profile.id, addressee_id: target.id });
      error = insErr;
    }
    setMsg(error ? { type: "err", text: error.message } : { type: "ok", text: `已送出好友邀請給 ${target.display_name}` });
    if (!error) loadFriends();
  }

  async function respond(friendshipId, status) {
    const { error } = await sb.from("friendships").update({ status }).eq("id", friendshipId);
    if (!error) loadFriends();
    else setMsg({ type: "err", text: error.message });
  }

  function removeFriend(friendshipId, friendName) {
    setConfirmRemoveFriend({ friendshipId, friendName });
  }

  async function doRemoveFriend() {
    const { friendshipId } = confirmRemoveFriend;
    setConfirmRemoveFriend(null);
    const { error } = await sb.from("friendships").delete().eq("id", friendshipId);
    if (!error) loadFriends();
    else setMsg({ type: "err", text: error.message });
  }

  return (
    <>
      <div className="bg-white rounded-2xl shadow p-5 mb-4">
        <h3 className="font-bold mb-2">重要 vs 緊急 － 優先級分數計算規則</h3>
        <p className="text-xs text-slate-500 mb-1">每一個任務會有其（重要）、（緊急）兩個指標分數，依據本公式算出當前優先級分數，分數越高者排越前面，建議優先處理。</p>
        <p className="text-xs text-slate-500 mb-4">使用者可以自行調配權值，譬如放比較多的權重在（重要性加乘：W1），或者（緊急度加乘：W2），以適配個人工作習慣。</p>

        <div className="bg-slate-50 rounded-lg px-4 py-3 text-sm flex flex-wrap items-center gap-2">
          <span className="text-slate-500 w-full mb-1">目前公式：</span>
          <span>重要性分數 ×</span>
          {editingWeights ? (
            <input value={weightDraft.w1} onChange={e => setWeightDraft({ ...weightDraft, w1: e.target.value })}
              className="w-16 border border-slate-300 rounded-lg px-2 py-1 text-center text-sm" />
          ) : (
            <span className="bg-slate-200 text-slate-600 rounded-lg px-3 py-1 font-medium">{Number(weights.w1).toFixed(1)}</span>
          )}
          <span>+ 緊急度分數 ×</span>
          {editingWeights ? (
            <input value={weightDraft.w2} onChange={e => setWeightDraft({ ...weightDraft, w2: e.target.value })}
              className="w-16 border border-slate-300 rounded-lg px-2 py-1 text-center text-sm" />
          ) : (
            <span className="bg-slate-200 text-slate-600 rounded-lg px-3 py-1 font-medium">{Number(weights.w2).toFixed(1)}</span>
          )}
          <span>= 優先級分數</span>
        </div>

        {weightErr && <div className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2 mt-2">{weightErr}</div>}

        <div className="flex gap-2 mt-3">
          {!editingWeights ? (
            <button onClick={startEditWeights} className="text-xs bg-slate-100 rounded-lg px-3 py-1.5">編輯</button>
          ) : (
            <>
              <button onClick={saveWeights} disabled={savingWeights} className="text-xs bg-slate-900 text-white rounded-lg px-4 py-1.5 disabled:opacity-50">{savingWeights ? "儲存中…" : "儲存"}</button>
              <button onClick={() => { setEditingWeights(false); setWeightErr(null); }} className="text-xs text-slate-500 px-4 py-1.5">取消</button>
            </>
          )}
          <button onClick={resetWeights} disabled={savingWeights} className="text-xs bg-rose-50 text-rose-600 rounded-lg px-3 py-1.5 disabled:opacity-50">回到預設</button>
        </div>
      </div>

      <div className="bg-white rounded-2xl shadow p-5 mb-4">
        <h3 className="font-bold mb-3">顯示設定</h3>

        <div className="grid md:grid-cols-2 gap-4">
          <div className="bg-slate-50 rounded-2xl p-4">
            <div className="flex justify-between items-center mb-2">
              <h4 className="text-sm font-semibold text-slate-700">重要性顯示</h4>
              {!editingPriority && <button onClick={startEditPriority} className="text-xs bg-white rounded-lg px-3 py-1.5 shadow-sm">編輯</button>}
            </div>
            <p className="text-xs text-slate-500 mb-3">P1～P4 可以各自設定「長字串」和「短字串」兩種自訂文字，下方再選擇不同位置要顯示哪一種。</p>
            <table className="w-full text-sm mb-3">
              <thead>
                <tr className="text-xs text-slate-400">
                  <th className="text-left font-medium pb-1 w-10"></th>

                    <td className="text-xs text-slate-500 pr-2 py-1">{p}</td>

                        <input value={(priorityLabelDraft[p] && priorityLabelDraft[p].long) || ""} onChange={e => updatePriorityDraft(p, "long", e.target.value)}
                          className="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-sm bg-white" />
                      ) : (
                        <div className="px-2 py-1.5 bg-white rounded-lg">{(priorityLabels[p] && priorityLabels[p].long) || p}</div>
                      )}
                    </td>
                    <td className="py-1">
                      {editingPriority ? (
                        <input value={(priorityLabelDraft[p] && priorityLabelDraft[p].short) || ""} onChange={e => updatePriorityDraft(p, "short", e.target.value)}
                          className="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-sm bg-white" />

              {DISPLAY_CONTEXTS.map(ctx => (

                    <select value={priorityDisplayDraft[ctx.key] || "long"} onChange={e => setPriorityDisplayDraft({ ...priorityDisplayDraft, [ctx.key]: e.target.value })}
                      className="border border-slate-300 rounded-lg px-2 py-1 bg-white">

              <button onClick={() => setEditingOtherDisplay(false)} className="text-xs text-slate-500 px-4 py-2">取消</button>
            </div>

    <div className="grid md:grid-cols-2 gap-4">
      <div className="bg-white rounded-2xl shadow p-5">
        <h3 className="font-bold mb-3">我的會員資料</h3>

          <div>
            <label className="text-xs text-slate-500">Email（不可修改）</label>
            <div className="mt-1 px-3 py-2 bg-slate-50 rounded-lg text-slate-500">{profile.email}</div>
          </div>
          <div>
            <label className="text-xs text-slate-500">顯示名稱</label>
            <input value={displayName} onChange={e => setDisplayName(e.target.value)} className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2" />
          </div>
          <label className="flex items-center gap-2 text-sm">
            <input type="checkbox" checked={isSearchable} onChange={e => setIsSearchable(e.target.checked)} className="w-4 h-4" />
            開放搜尋（其他成員可以搜尋到我並加我好友）
          </label>
          {msg && <div className={"text-xs rounded-lg px-3 py-2 " + (msg.type === "err" ? "bg-rose-50 text-rose-600" : "bg-emerald-50 text-emerald-700")}>{msg.text}</div>}
          <button onClick={saveProfile} disabled={saving} className="bg-slate-900 text-white rounded-lg px-4 py-2 text-sm disabled:opacity-50">{saving ? "儲存中…" : "儲存變更"}</button>

// =====================================================================
// 新增專案 Modal
// =====================================================================
function NewProjectModal({ onClose, onCreated, friendProfiles, currentUserName }) {
  const { style: popStyle, className: popClassName, requestClose } = usePopModalAnimation();
  // 建立專案成功走模式二（不用縮回按鈕原位置）；按 X 放棄離開維持模式一
  const { closing: createClosing, className: createCloseClassName, requestClose: requestCreateClose } = useConfirmModalAnimation();
  const effectivePopClassName = createClosing ? createCloseClassName : popClassName;
  const [name, setName] = useState("");
  const [description, setDescription] = useState("");
  const [memberSearch, setMemberSearch] = useState("");
  const [selectedIds, setSelectedIds] = useState([]);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  const filteredFriends = (friendProfiles || []).filter(f =>
    !memberSearch.trim() || (f.display_name || "").toLowerCase().includes(memberSearch.trim().toLowerCase())
  );

  function toggleMember(id) {
    setSelectedIds(ids => ids.includes(id) ? ids.filter(x => x !== id) : [...ids, id]);
  }

  async function submit(e) {
    e.preventDefault();
    setBusy(true); setErr(null);
    try {
      const { data: { user } } = await sb.auth.getUser();
      const { data: project, error } = await sb.from("projects").insert({ name, description: description || null, creator_id: user.id }).select().single();
      if (error) throw error;
      if (selectedIds.length > 0) {
        const rows = selectedIds.map(uid => ({ project_id: project.id, user_id: uid }));
        const { error: memberErr } = await sb.from("project_members").insert(rows);
        if (memberErr) throw memberErr;
      }
      onCreated();
      requestCreateClose(onClose);
    } catch (e2) {
      setErr(e2.message);
    } finally { setBusy(false); }
  }

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className={"bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 " + effectivePopClassName} style={popStyle}>
        <div className="flex justify-between items-center mb-4">
          <h2 className="text-lg font-bold">新增專案</h2>
          <button onClick={() => requestClose(onClose)}><Icon.Close className="w-5 h-5 text-slate-400"/></button>
        </div>
        <form onSubmit={submit} className="space-y-3">
          <div>
            <label className="text-xs text-slate-500">專案名稱</label>
            <input required value={name} onChange={e => setName(e.target.value)}
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label className="text-xs text-slate-500">專案描述（可留空）</label>
            <textarea rows={3} value={description} onChange={e => setDescription(e.target.value)}
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label className="text-xs text-slate-500">專案發起人</label>
            <div className="mt-1 px-3 py-2 bg-slate-50 rounded-lg text-sm text-slate-500">{currentUserName}</div>
          </div>
          <div>
            <label className="text-xs text-slate-500">新增專案成員（只能從好友中選擇）</label>
            <input value={memberSearch} onChange={e => setMemberSearch(e.target.value)} placeholder="搜尋好友名稱…"
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
            <div className="mt-2 max-h-48 overflow-y-auto space-y-1">
              {filteredFriends.length === 0 && <p className="text-xs text-slate-400">找不到符合的好友</p>}
              {filteredFriends.map(f => (
                <label key={f.id} className="flex items-center gap-2 text-sm bg-slate-50 rounded-lg px-3 py-2">
                  <input type="checkbox" checked={selectedIds.includes(f.id)} onChange={() => toggleMember(f.id)} className="w-4 h-4" />
                  {f.display_name}
                </label>
              ))}
            </div>
            {selectedIds.length > 0 && <p className="text-xs text-slate-400 mt-2">已選擇 {selectedIds.length} 位成員</p>}
          </div>
          {err && <div className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2">{err}</div>}
          <button disabled={busy} className="w-full bg-slate-900 text-white rounded-lg py-2.5 text-sm font-medium text-center btn-solid-flash disabled:opacity-50">
            {busy ? "建立中…" : "建立專案"}
          </button>
        </form>
      </div>
    </div>
  );
}

// =====================================================================
// 編輯專案 Modal（新增/移除成員）
// =====================================================================
function EditProjectModal({ project, members, friendProfiles, openMissions, onClose, onChanged }) {
  const { style: popStyle, className: popClassName, requestClose } = usePopModalAnimation();
  const [nameDraft, setNameDraft] = useState(project.name);
  const [descDraft, setDescDraft] = useState(project.description || "");
  const [savingInfo, setSavingInfo] = useState(false);
  const [infoErr, setInfoErr] = useState(null);
  const [memberSearch, setMemberSearch] = useState("");
  const [blockedInfo, setBlockedInfo] = useState(null); // { member, tasks }
  const [confirmRemove, setConfirmRemove] = useState(null); // member
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  const availableFriends = (friendProfiles || []).filter(f =>
    !members.some(m => m.id === f.id) &&
    (!memberSearch.trim() || (f.display_name || "").toLowerCase().includes(memberSearch.trim().toLowerCase()))
  );

  function blockingTasks(memberId) {
    return (openMissions || []).filter(m => m.creator_id === memberId || m.assigned_id === memberId);
  }

  async function saveProjectInfo() {
    if (!nameDraft.trim()) { setInfoErr("專案名稱不能留空"); return; }
    setSavingInfo(true); setInfoErr(null);
    const { error } = await sb.from("projects").update({ name: nameDraft.trim(), description: descDraft || null }).eq("id", project.id);
    setSavingInfo(false);
    if (error) setInfoErr(error.message); else onChanged();
  }

  async function addMember(uid) {
    setBusy(true); setErr(null);
    const { error } = await sb.from("project_members").insert({ project_id: project.id, user_id: uid });
    setBusy(false);
    if (error) setErr(error.message); else onChanged();
  }

  function requestRemove(member) {
    const blocking = blockingTasks(member.id);
    if (blocking.length > 0) setBlockedInfo({ member, tasks: blocking });
    else setConfirmRemove(member);
  }

  async function doRemove() {
    setBusy(true); setErr(null);
    const { error } = await sb.from("project_members").delete().eq("project_id", project.id).eq("user_id", confirmRemove.id);
    setBusy(false);
    setConfirmRemove(null);
    if (error) setErr(error.message); else onChanged();
  }

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className={"bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 " + popClassName} style={popStyle}>
        <div className="flex justify-between items-center mb-4">
          <h2 className="text-lg font-bold">編輯專案</h2>
          <button onClick={() => requestClose(onClose)}><Icon.Close className="w-5 h-5 text-slate-400"/></button>
        </div>

        <div className="space-y-2 mb-4">
          <div>
            <label className="text-xs text-slate-500">專案名稱</label>
            <input value={nameDraft} onChange={e => setNameDraft(e.target.value)}
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label className="text-xs text-slate-500">專案描述（可留空）</label>
            <textarea rows={3} value={descDraft} onChange={e => setDescDraft(e.target.value)}
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          {infoErr && <div className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2">{infoErr}</div>}
          <button onClick={saveProjectInfo} disabled={savingInfo} className="bg-slate-900 text-white text-xs rounded-lg px-4 py-2 disabled:opacity-50">
            {savingInfo ? "儲存中…" : "儲存基本資料"}
          </button>
          <p className="text-xs text-amber-600">若變更「專案名稱」，儲存後會自動通知專案內所有其他成員。</p>
        </div>

        <h3 className="text-sm font-semibold text-slate-700 mb-2 pt-2 border-t border-slate-100">目前成員</h3>
        <div className="space-y-2 mb-4 max-h-48 overflow-y-auto">
          {members.map(m => (
            <div key={m.id} className="flex justify-between items-center bg-slate-50 rounded-lg px-3 py-2 text-sm">
              <span>{m.display_name}{m.id === project.creator_id ? "（發起人）" : ""}</span>
              {m.id !== project.creator_id && (
                <button onClick={() => requestRemove(m)} className="text-xs text-rose-600 underline">移除</button>
              )}
            </div>
          ))}
        </div>

        <h3 className="text-sm font-semibold text-slate-700 mb-2">新增成員（只能從好友中選擇）</h3>
        <input value={memberSearch} onChange={e => setMemberSearch(e.target.value)} placeholder="搜尋好友名稱…"
          className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-2" />
        <div className="space-y-1 max-h-40 overflow-y-auto">
          {availableFriends.length === 0 && <p className="text-xs text-slate-400">沒有可加入的好友</p>}
          {availableFriends.map(f => (
            <div key={f.id} className="flex justify-between items-center bg-slate-50 rounded-lg px-3 py-2 text-sm">
              <span>{f.display_name}</span>
              <button onClick={() => addMember(f.id)} disabled={busy} className="text-xs bg-blue-600 text-white rounded-lg px-2 py-1 disabled:opacity-50">加入</button>
            </div>
          ))}
        </div>

        {err && <div className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2 mt-3">{err}</div>}
      </div>

      {blockedInfo && (
        <ConfirmModal
          title="無法移除此成員"
          hideCancel
          confirmLabel="我知道了"
          message={`「${blockedInfo.member.display_name}」目前在這個專案還有 ${blockedInfo.tasks.length} 筆未結案任務（自己建立或被指派），必須先轉指派給別人、或將任務標記為已完成/已棄置後才能移除。\n\n受影響的任務：\n` + blockedInfo.tasks.map(t => `．${t.title}`).join("\n")}
          onConfirm={() => setBlockedInfo(null)}
          onCancel={() => setBlockedInfo(null)}
        />
      )}
      {confirmRemove && (
        <ConfirmModal
          title="移除成員"
          message={`確定要把「${confirmRemove.display_name}」移出這個專案嗎？`}
          confirmLabel="確認移除"
          danger
          onConfirm={doRemove}
          onCancel={() => setConfirmRemove(null)}
        />
      )}
    </div>
  );
}

// =====================================================================
// 類別瀏覽：十個分類的方格卡片首頁 + 點進去的分類詳情列表
// =====================================================================
function CategoryGridPage({ missions, currentUserId, onOpenCategory, showAll, onToggleShowAll, emojiOverride, applySubDimension, onToggleApplySubDimension }) {
  // 每個分類先算個粗略數量給卡片參考（用預設 0.5 門檻，跟詳情頁預設值一致，純粹給使用者一個大概印象）
  const relevant = missions.filter(m => m.category_scores && (showAll || isRelevantToUser(m, currentUserId)));
  const counts = {};
  AI_CATEGORIES.forEach(k => {
    counts[k] = relevant.filter(m => (Number(m.category_scores[k]) || 0) >= 0.5).length;
  });
  return (
    <div>
      <div className="grid grid-cols-5 gap-4">
        {AI_CATEGORIES.map(key => (
          <button key={key} onClick={() => onOpenCategory(key)}
            className="flex flex-col items-center justify-center gap-2 rounded-2xl py-8 hover:opacity-90 transition"
            style={{ background: `${CATEGORY_CARD_COLOR[key]}1a`, border: `1px solid ${CATEGORY_CARD_COLOR[key]}40` }}>
            <CategoryIcon categoryKey={key} size="5rem" emojiOverride={emojiOverride} className="category-emoji-mono" tintColor={darkenHex(CATEGORY_CARD_COLOR[key])} />
            <span className="text-sm font-semibold" style={{ color: CATEGORY_CARD_COLOR[key] }}>{AI_CATEGORY_LABELS[key]}</span>
            <span className="text-xs text-slate-400">{counts[key]} 項</span>
          </button>
        ))}
      </div>
      <div className="flex items-center justify-center gap-6 mt-4">
        <label className="flex items-center gap-2 text-xs text-slate-500">

const CATEGORY_SORT_MODES = { category_first: "類別分數優先", ...SORT_MODE_LABELS };

function CategoryDetailPage({ categoryKey, missions, currentUserId, profile, visibleColumns, visibleColumnsClosed, visibleSections, onOpen, onBack,
  projectNameById, hiddenSet, onHide, onUnhide, onDelete, starredSet, onStar, onUnstar, onOpenColumnSettings, showAll, applySubDimension }) {
  const [threshold, setThreshold] = useState(0.5);
  const [sortMode, setSortMode] = useState("category_first");
  const weights = profile.priority_weights;

  const relevant = missions.filter(m => m.category_scores && (showAll || isRelevantToUser(m, currentUserId))
    && (Number(m.category_scores[categoryKey]) || 0) >= threshold);
  // 排序設定只影響「未結案」這一段；已完成/已棄置不管選哪種排序模式，一律固定用「最後更新」排序——
  // 已結案的任務不太需要照類別分數/優先級這些「還要不要處理」導向的排序邏輯去排，用最後更新反而更直覺
  const sortForTier = (list, tierKey) => {
    if (tierKey !== "open") return sortMissions(list, "updated_desc", weights);
    return sortMode === "category_first"
      ? sortMissionsByCategory(list, categoryKey, weights)
      : sortMissions(list, sortMode, weights);
  };

  // 「工作」分類專用：套用子類別選單時，每個狀態分層底下再依設定的維度細分小節
  const workSubDimKey = profile.work_sub_dimension || "functional_category";
  const useSubGrouping = categoryKey === "work" && applySubDimension && workSubDimKey !== "none";
  function dimensionValueFor(m) {
    const wd = Array.isArray(m.work_dimensions) ? m.work_dimensions[0] : m.work_dimensions;
    const v = workSubLabel(workSubDimKey, wd);
    return v || "未標記";
  }

  const tierDefs = [
    { key: "open", label: "未結案", columnMode: "list", tier: 0 },
    { key: "completed", label: "已完成", columnMode: "closed", tier: 1 },
    { key: "abandoned", label: "已棄置", columnMode: "closed", tier: 2 },
  ];
  const groups = [];
  tierDefs.forEach(t => {
    if (visibleSections?.[t.key] === false) return;
    const tierItems = sortForTier(relevant.filter(m => statusTier(m.status) === t.tier), t.key);
    if (tierItems.length === 0) return;
    if (!useSubGrouping) {
      groups.push({ key: t.key, label: t.label, columnMode: t.columnMode, items: tierItems });
      return;
    }
    const bySub = {};
    tierItems.forEach(m => { const v = dimensionValueFor(m); (bySub[v] = bySub[v] || []).push(m); });
    Object.keys(bySub)
      .sort((a, b) => (a === "未標記") - (b === "未標記") || a.localeCompare(b))
      .forEach(v => groups.push({ key: `${t.key}-${v}`, label: `${t.label} · ${v}`, columnMode: t.columnMode, items: bySub[v] }));
  });

  const commonListProps = {
    onOpen, currentUserId,
    priorityLabels: profile.priority_labels, scaleLabels: profile.scale_labels,
    priorityDisplay: profile.priority_display, scaleDisplay: profile.scale_display,
    priorityColorOverride: profile.priority_color_override, scaleColorOverride: profile.scale_color_override,
    urgencyDisplay: profile.urgency_display, urgencyLabels: profile.urgency_labels, urgencyColorOverride: profile.urgency_color_override,
    relationDisplayMode: profile.relation_filter_display_list,
    dueDateDisplayList: profile.due_date_display_list, dueDateColorOverride: profile.due_date_color_override,
    hiddenIds: hiddenSet, onHide, onUnhide, onDelete,
    starredIds: starredSet, onStar, onUnstar, starOverrideColor: profile.star_override_color,
    noProgressColorOverride: profile.no_progress_color_override, noProgressSeverityDays: profile.no_progress_severity_days,
    checklistDisplayMode: profile.checklist_display_mode,
    categoryDisplay: profile.category_display || DEFAULT_CATEGORY_DISPLAY_MODES,
    workSubDimension: profile.work_sub_dimension,
    categoryEmojiOverride: profile.category_emoji_override,
    sortMode, sortHighlightColor: profile.sort_highlight_color, forceShowSortColumn: profile.force_show_sort_column,
    showCategoryColumns: true, categoryKey, projectNameById,
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <button onClick={onBack} className="text-sm text-slate-500 underline">← 返回類別瀏覽</button>
        <button onClick={onOpenColumnSettings} title="顯示欄位設定" className="flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded-lg w-9 h-9">
          <Icon.Settings className="w-4 h-4 text-slate-600" />
        </button>
      </div>
      <div className="flex items-center gap-3 mb-4">
        <CategoryIcon categoryKey={categoryKey} size="2rem" emojiOverride={profile.category_emoji_override} className="category-emoji-mono" tintColor={darkenHex(CATEGORY_CARD_COLOR[categoryKey])} />
        <h2 className="text-xl font-bold" style={{ color: CATEGORY_CARD_COLOR[categoryKey] }}>{AI_CATEGORY_LABELS[categoryKey]}</h2>
        <span className="text-xs text-slate-400">共 {relevant.length} 項</span>
      </div>

      <div className="flex flex-wrap items-center justify-between gap-4 mb-4 bg-slate-50 rounded-lg px-4 py-3">
        <label className="flex items-center gap-2 text-xs text-slate-500">
          排序設定：
          <select value={sortMode} onChange={e => setSortMode(e.target.value)}
            className="text-xs border border-slate-300 rounded-lg px-2 py-1.5 bg-white">
            {Object.entries(CATEGORY_SORT_MODES).map(([key, label]) => <option key={key} value={key}>{label}</option>)}
          </select>
        </label>
        <label className="flex items-center gap-2 text-xs text-slate-500">
          分數門檻：{threshold.toFixed(2)}
          <input type="range" min="0" max="1" step="0.05" value={threshold}
            onChange={e => setThreshold(Number(e.target.value))} className="w-40" />
        </label>
      </div>

      {relevant.length === 0 && <p className="text-sm text-slate-400 px-1">目前沒有分數達到門檻的任務，可以試著把門檻拉低一點</p>}

      {groups.map(g => (
        <div key={g.key} className="mb-4">
          {g.label && <h3 className="text-xs font-semibold text-slate-400 mb-1.5 px-1">{g.label}（{g.items.length}）</h3>}
          <MissionListView
            {...commonListProps}
            missions={g.items}
            columnMode={g.columnMode}
            visibleColumns={g.columnMode === "closed" ? visibleColumnsClosed : visibleColumns}
            columnOrder={g.columnMode === "closed" ? profile.column_order_closed : profile.column_order}
          />
        </div>
      ))}
    </div>
  );
}

function relativeTimeText(iso) {
  if (!iso) return "";
  const diffSec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (diffSec < 10) return "剛剛";
  if (diffSec < 60) return `${diffSec} 秒前`;
  const diffMin = Math.floor(diffSec / 60);
  if (diffMin < 60) return `${diffMin} 分鐘前`;
  const diffHour = Math.floor(diffMin / 60);
  if (diffHour < 24) return `${diffHour} 小時前`;
  const diffDay = Math.floor(diffHour / 24);
  if (diffDay < 30) return `${diffDay} 天前`;
  return fmtDate(iso);
}

// 新增/編輯靈感彈窗：自動儲存用「防抖 2 秒＋最長等待 8 秒」雙重機制（Google Docs 風格）——
// 打字當下每敲一個字重設 2 秒計時器，停下來 2 秒沒再輸入就存檔；但如果持續不斷輸入、
// 2 秒防抖永遠不會觸發，所以另外疊一個 8 秒的保險，不管有沒有停頓，超過就強制存一次
function IdeaEditorModal({ idea, currentUserName, onClose, onChanged, onPromote }) {
  const { style: popStyle, className: popClassName, requestClose } = usePopModalAnimation();
  // 刪除靈感走模式二（不用縮回按鈕原位置），道理跟任務內頁的永久刪除一樣
  const { closing: deleteClosing, className: deleteCloseClassName, requestClose: requestDeleteClose } = useConfirmModalAnimation();
  const effectivePopClassName = deleteClosing ? deleteCloseClassName : popClassName;
  const [ideaId, setIdeaId] = useState(idea?.id || null);
  const [title, setTitle] = useState(idea?.title || "");
  const [content, setContent] = useState(idea?.content || "");
  const [status, setStatus] = useState(idea?.status || "active");
  const [autoSaveEnabled, setAutoSaveEnabled] = useState(true);
  const [dirty, setDirty] = useState(false);
  const [savingState, setSavingState] = useState("idle"); // idle | saving
  const [lastSavedAt, setLastSavedAt] = useState(idea?.updated_at || null);
  const [confirmClose, setConfirmClose] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [err, setErr] = useState(null);
  const [, forceTick] = useState(0); // 純粹用來讓「幾分鐘前」文字定期重新算一次，不影響邏輯

  const debounceRef = useRef(null);
  const maxWaitRef = useRef(null);
  const savingRef = useRef(false); // 是否已經有一個存檔請求在飛行中（用 ref 不用 state，才能在同一個事件循環裡立即擋住，不用等重新渲染）
  const pendingAfterSaveRef = useRef(false); // 存檔進行中又被要求再存一次，先記下來，這次做完後補做一次
  const titleRef = useRef(title);
  const contentRef = useRef(content);
  titleRef.current = title;
  contentRef.current = content;

  useEffect(() => {
    const t = setInterval(() => forceTick(x => x + 1), 15000);
    return () => clearInterval(t);
  }, []);

  function clearTimers() {
    if (debounceRef.current) { clearTimeout(debounceRef.current); debounceRef.current = null; }
    if (maxWaitRef.current) { clearTimeout(maxWaitRef.current); maxWaitRef.current = null; }
  }

  async function actuallySave() {
    // 標題內容都空、而且從沒存過，沒東西好存，不用打資料庫
    if (!titleRef.current.trim() && !contentRef.current.trim() && !ideaId) return;
    // 真正的 bug 根源在這裡：如果已經有一個存檔請求還在飛行中（例如打字打很久，最長等待 8 秒的
    // 保險機制先觸發了一次存檔，但這時使用者又繼續打字、2 秒防抖又到期），舊的存檔可能還沒等到
    // 伺服器回應、還不知道剛剛存出來的新靈感 id 是多少，這次新的存檔就會誤判成「還沒存過」，
    // 結果兩個請求都各自 insert 一筆，變成分裂成兩條靈感。這裡擋住「同時只能有一個存檔在飛行中」，
    // 被擋下來的這次先記著，等前一個真的做完、拿到正確的 id 之後再補做一次，就不會分裂了。
    // 單純拉長防抖/最長等待的秒數只是降低發生機率，沒有真正解決這個競態問題。
    if (savingRef.current) { pendingAfterSaveRef.current = true; return; }
    savingRef.current = true;
    setSavingState("saving"); setErr(null);
    try {
      if (ideaId) {
        const { error } = await sb.from("idea_notes")
          .update({ title: titleRef.current.trim() || null, content: contentRef.current })
          .eq("id", ideaId);
        if (error) throw error;
      } else {
        const { data: { user } } = await sb.auth.getUser();
        const { data, error } = await sb.from("idea_notes")
          .insert({ creator_id: user.id, title: titleRef.current.trim() || null, content: contentRef.current })
          .select("id").single();
        if (error) throw error;
        setIdeaId(data.id);
      }
      setDirty(false);
      setLastSavedAt(new Date().toISOString());
      onChanged();
    } catch (e) {
      setErr(e.message);
    } finally {
      setSavingState("idle");
      savingRef.current = false;
      if (pendingAfterSaveRef.current) {
        pendingAfterSaveRef.current = false;
        actuallySave(); // 補做剛剛被擋下來的那次；這時 ideaId 已經是最新的了，會正確走 update 而不是又 insert 一筆
      }
    }
  }
  async function doSave() {
    clearTimers();
    await actuallySave();
  }
  function scheduleAutosave() {
    if (debounceRef.current) clearTimeout(debounceRef.current);
    debounceRef.current = setTimeout(() => { doSave(); }, 2000);
    if (!maxWaitRef.current) {
      maxWaitRef.current = setTimeout(() => { doSave(); }, 8000);
    }
  }
  useEffect(() => () => clearTimers(), []); // 卸載時清掉還沒觸發的計時器，避免在已關閉的元件上 setState

  function handleTitleChange(v) {
    setTitle(v); setDirty(true);
    if (autoSaveEnabled) scheduleAutosave();
  }
  function handleContentChange(v) {
    setContent(v); setDirty(true);
    if (autoSaveEnabled) scheduleAutosave();
  }

  async function handleCloseClick() {
    if (!dirty) { requestClose(onClose); return; }
    if (autoSaveEnabled) { await doSave(); requestClose(onClose); return; }
    setConfirmClose(true);
  }
  async function confirmCloseSave() {
    await doSave();
    setConfirmClose(false);
    requestClose(onClose);
  }
  function confirmCloseDiscard() {
    setConfirmClose(false);
    requestClose(onClose);
  }

  async function handleDelete() {
    if (!ideaId) { requestDeleteClose(onClose); return; }
    const { error } = await sb.from("idea_notes").delete().eq("id", ideaId);
    if (error) { setErr(error.message); return; }
    setConfirmDelete(false);
    onChanged();
    requestDeleteClose(onClose);
  }

  async function handlePromote() {
    await doSave();
    onPromote({ id: ideaId, title, content });
  }

  const savedText = savingState === "saving"
    ? "儲存中…"
    : lastSavedAt
      ? ((Date.now() - new Date(lastSavedAt).getTime()) < 30000 ? "目前內容已自動儲存" : `自動儲存：${relativeTimeText(lastSavedAt)}`)
      : null;

  return (
    <>
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className={"bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[85vh] overflow-y-auto p-6 " + effectivePopClassName} style={popStyle}>
        <div className="flex justify-between items-center mb-4">
          <h2 className="text-lg font-bold">
            {!ideaId ? `您好！${currentUserName}，今天有什麼靈感？` : "編輯靈感"}
          </h2>
          <button onClick={handleCloseClick}><Icon.Close className="w-5 h-5 text-slate-400"/></button>
        </div>

        {status === "promoted" && (
          <p className="text-xs bg-emerald-50 text-emerald-700 rounded-lg px-3 py-2 mb-3">這則靈感已經升級成正式任務了，內容還是可以繼續編輯，但不會再影響那筆任務。</p>
        )}

        <div className="space-y-3">
          <div>
            <label className="text-xs text-slate-500">靈感標題（可留空）</label>
            <input value={title} onChange={e => handleTitleChange(e.target.value)}
              placeholder="（未命名靈感）" maxLength={200}
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label className="text-xs text-slate-500">靈感內容</label>
            <textarea rows={10} value={content} onChange={e => handleContentChange(e.target.value)}
              placeholder="想到什麼就寫下來…"
              className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>

          <div className="flex items-center justify-between">
            <label className="flex items-center gap-1.5 text-xs text-slate-500">
              <input type="checkbox" checked={autoSaveEnabled} onChange={e => setAutoSaveEnabled(e.target.checked)} className="w-4 h-4" />
              自動儲存
            </label>
            {savedText && <span className="text-xs text-slate-400">{savedText}</span>}
          </div>

          {err && <p className="text-xs text-rose-600 bg-rose-50 rounded-lg px-3 py-2">{err}</p>}

          <div className="flex items-center justify-between pt-2 border-t border-slate-100">
            <div className="flex gap-2">
              <button onClick={doSave} disabled={savingState === "saving"} className="bg-slate-900 text-white text-xs rounded-lg px-4 py-2 disabled:opacity-50">儲存靈感</button>
              {ideaId && status !== "promoted" && (
                <button onClick={handlePromote} className="bg-violet-50 text-violet-700 text-xs rounded-lg px-4 py-2 font-medium">🚀 升級成任務</button>
              )}
            </div>
            {ideaId && (
              <button onClick={() => setConfirmDelete(true)} title="刪除靈感"
                className="flex items-center justify-center bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg w-9 h-9">
                <Icon.Trash className="w-4 h-4" />
              </button>
            )}
          </div>
        </div>
      </div>
    </div>

    {confirmClose && (
      <ConfirmModal
        title="內容尚未儲存"
        message="這則靈感有還沒儲存的修改，要儲存後再離開，還是不儲存直接離開？"
        confirmLabel="儲存並離開" cancelLabel="不儲存離開"
        onConfirm={confirmCloseSave}
        onCancel={confirmCloseDiscard}
      />
    )}
    {confirmDelete && (
      <ConfirmModal
        title="刪除靈感"
        message="確定要刪除這則靈感嗎？此動作無法復原！"
        confirmLabel="確定刪除" danger
        onConfirm={handleDelete}
        onCancel={() => setConfirmDelete(false)}
      />
    )}
    </>
  );
}

  const [reportBusy, setReportBusy] = useState(false);
  const [reportMsg, setReportMsg] = useState(null);
  const [myReports, setMyReports] = useState([]);
  const current = MEMBER_ROLE_LIMITS[role] || MEMBER_ROLE_LIMITS.free;

  const loadMyReports = useCallback(async () => {
    const { data } = await sb.from("bug_reports").select("*").eq("reporter_id", currentUserId).order("created_at", { ascending: false });
    setMyReports(data || []);
  }, [currentUserId]);

  useEffect(() => { loadMyReports(); }, [loadMyReports]);

  // Realtime：如果 admin 在這段期間回覆了，畫面上的回報記錄會即時更新
  useEffect(() => {
    if (!sb) return;
    const channel = sb.channel("my-bug-reports-" + currentUserId)
      .on("postgres_changes", { event: "*", schema: "public", table: "bug_reports", filter: `reporter_id=eq.${currentUserId}` }, () => loadMyReports())
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [currentUserId, loadMyReports]);

  async function submitReport() {
    if (!reportText.trim()) return;
    setReportBusy(true); setReportMsg(null);

      setReportMsg({ type: "err", text: error.message });
    } else {
      setReportMsg({ type: "ok", text: "回報已送出，感謝您的協助！" });

    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className={"bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[85vh] flex flex-col " + roleModalClassName}>

            {current.items.map((t, i) => <li key={i}>{t}</li>)}
          </ul>
          <p className="text-xs text-slate-400 mb-2">＊AI 辨識另外有一道全站共用上限（每分鐘總計 10 次，不分身分、不分使用者），保護 AI 服務不被同時大量使用打爆，使用人數多的時段可能會比個人上限更早觸發。</p>

          {role === "free" && (
            <div className="border-t border-slate-200 pt-4 mt-4">
              <p className="text-sm font-semibold mb-2 text-amber-700">升級 VIP 後可以：</p>

                {MEMBER_ROLE_LIMITS.vip.items.map((t, i) => <li key={i}>{t}</li>)}

          {role === "admin" && (
            <div className="border-t border-slate-200 pt-4 mt-4 flex justify-center">

            {!reportOpen ? (
              <button onClick={() => setReportOpen(true)} className="text-xs text-slate-500 underline">錯誤回報</button>
            ) : (
              <div>
                <label className="text-xs text-slate-500">回報問題或建議給管理員</label>
                <textarea rows={4} value={reportText} onChange={e => setReportText(e.target.value)}

                  className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />

                      <span className={"text-xs px-2 py-0.5 rounded-full font-medium " + BUG_REPORT_STATUS_COLOR[r.status]}>{BUG_REPORT_STATUS_LABEL[r.status]}</span>
                      <span className="text-xs text-slate-400">{fmt(r.created_at)}</span>

        {role === "free" && (

function Dashboard({ session, profile, setProfile }) {
  const [tab, setTab] = useState("list"); // list(個人任務) | project | gantt | settings
  const [missions, setMissions] = useState([]);
  const [openMissionId, setOpenMissionId] = useState(null);
  const [showNew, setShowNew] = useState(false);
  const [columnSettingsContext, setColumnSettingsContext] = useState(null); // null | "list" | "category"（決定「類別分數」「來源」要不要出現在設定裡）
  const [visibleColumns, setVisibleColumns] = useState({ ...DEFAULT_VISIBLE_COLUMNS, ...(profile.visible_columns || {}) });
  const [visibleColumnsClosed, setVisibleColumnsClosed] = useState({ ...DEFAULT_VISIBLE_COLUMNS_CLOSED, ...(profile.visible_columns_closed || {}) });
  const [visibleSections, setVisibleSections] = useState({ ...DEFAULT_VISIBLE_SECTIONS, ...(profile.visible_sections || {}) });
  const [notifOpen, setNotifOpen] = useState(false);
  const [notifs, setNotifs] = useState([]);
  const [searchInput, setSearchInput] = useState("");
  const [appliedSearch, setAppliedSearch] = useState("");
  const [searchMatchedUpdateMissionIds, setSearchMatchedUpdateMissionIds] = useState([]);
  // 全域搜尋：獨立一份搜尋狀態，不跟個人任務的搜尋框共用（範圍不同，共用容易搞混）
  const [globalSearchInput, setGlobalSearchInput] = useState("");
  const [globalAppliedSearch, setGlobalAppliedSearch] = useState("");
  const [globalSearchMatchedUpdateMissionIds, setGlobalSearchMatchedUpdateMissionIds] = useState([]);
  const [sortMode, setSortMode] = useState(() => (
    profile.remember_sort_mode && profile.remember_sort_mode !== "last_used"
      ? profile.remember_sort_mode
      : (profile.last_sort_mode || "created_desc")
  )); // created_desc | due_asc | priority_desc | priority_first | scale_asc | scale_desc | procrastination_desc

  // 依「記住排序原則」設定：選了固定模式就不寫回去（每次都回到那個模式）；
  // 選「上次停留選項」才把這次選的排序模式存回 profile，下次開啟/切分頁時記得
  function chooseSortMode(setter, mode) {
    setter(mode);
    if (!profile.remember_sort_mode || profile.remember_sort_mode === "last_used") {
      setProfile(p => ({ ...p, last_sort_mode: mode }));
      sb.from("profiles").update({ last_sort_mode: mode }).eq("id", profile.id)
        .then(({ error }) => { if (error) console.error("儲存排序模式失敗：", error); });
    }
  }
  // 搜尋大框框的遮色：只有在搜尋條件不是空白（appliedSearch 有值）時才套用，清空搜尋就解除
  const searchColorEntry = profile.search_highlight_color && profile.search_highlight_color !== "none" ? SORT_HIGHLIGHT_COLORS[profile.search_highlight_color] : null;
  const searchBoxStyle = (appliedSearch && searchColorEntry) ? { background: `rgba(${hexToRgbString(searchColorEntry.hex)},0.15)` } : undefined;
  const [personalViewMode, setPersonalViewMode] = useState("list"); // list | gantt
  const [openCategoryKey, setOpenCategoryKey] = useState(null); // null=十宮格首頁；有值=該分類的詳情列表
  const [categoryShowAll, setCategoryShowAll] = useState(false); // 類別瀏覽「顯示與我無關之任務」開關，預設關閉、不持久化（跟門檻滑桿一樣是當次瀏覽的臨時決定）
  const [applySubDimension, setApplySubDimension] = useState(true); // 「套用子類別選單」：只影響「工作」分類，預設開啟、不持久化，跟 categoryShowAll 同一種session-only設計
  const [projectViewMode, setProjectViewMode] = useState("list"); // list | gantt
  const [relationFilter, setRelationFilter] = useState(DEFAULT_RELATION_FILTER);
  const [hiddenIds, setHiddenIds] = useState([]);
  const [starredIds, setStarredIds] = useState([]);
  const [friendProfiles, setFriendProfiles] = useState([]);
  const [projects, setProjects] = useState([]);
  const [ideaNotes, setIdeaNotes] = useState([]);
  const [ideaModalOpen, setIdeaModalOpen] = useState(false);
  const [editingIdeaObj, setEditingIdeaObj] = useState(null); // null=新增；有值=編輯既有靈感
  const [promotingIdea, setPromotingIdea] = useState(null); // { id, title, content }｜null：靈感升級成任務時，暫存要帶進新增任務表單的資料
  const [myProjectIds, setMyProjectIds] = useState([]);
  const [openProjectId, setOpenProjectId] = useState(null);
  const [showNewProject, setShowNewProject] = useState(false);
  const [reorderProjectsMode, setReorderProjectsMode] = useState(false);
  const [showMemberRoleModal, setShowMemberRoleModal] = useState(false);
  const [projectDeleteErr, setProjectDeleteErr] = useState(null);
  const [showDeleteProjectConfirm, setShowDeleteProjectConfirm] = useState(false);
  const [showDeleteBlockedInfo, setShowDeleteBlockedInfo] = useState(false);
  const [showEditProject, setShowEditProject] = useState(false);
  const [currentProjectMembers, setCurrentProjectMembers] = useState([]);
  const openProjectIdRef = useRef(null);
  const notifRef = useRef(null);

  const loadMissions = useCallback(async () => {
    let q = sb.from("missions").select("*, creator:profiles!missions_creator_id_fkey(id,display_name,email), assignee:profiles!missions_assigned_id_fkey(id,display_name,email), mission_checklist_items(id,is_checked), work_dimensions:mission_work_dimensions(*)").order("created_at", { ascending: false });
    const { data } = await q;
    setMissions(data || []);
  }, []);

  const loadHiddenIds = useCallback(async () => {
    const { data } = await sb.from("mission_hides").select("mission_id").eq("user_id", profile.id);
    setHiddenIds((data || []).map(r => r.mission_id));
  }, [profile.id]);

  const loadStarredIds = useCallback(async () => {
    const { data } = await sb.from("mission_stars").select("mission_id").eq("user_id", profile.id);
    setStarredIds((data || []).map(r => r.mission_id));
  }, [profile.id]);

  const loadNotifs = useCallback(async () => {
    const { data } = await sb.from("notifications")
      .select("*, actor:profiles!notifications_actor_id_fkey(display_name), mission:missions(title), project:projects(name)")
      .eq("user_id", profile.id).eq("is_read", false).order("created_at", { ascending: false });
    setNotifs(data || []);
  }, [profile.id]);

  const loadFriendProfiles = useCallback(async () => {
    const uid = profile.id;
    const [{ data: asReq }, { data: asAdr }] = await Promise.all([
      sb.from("friendships").select("addressee:profiles!friendships_addressee_id_fkey(id,display_name,email)").eq("requester_id", uid).eq("status", "accepted"),
      sb.from("friendships").select("requester:profiles!friendships_requester_id_fkey(id,display_name,email)").eq("addressee_id", uid).eq("status", "accepted"),
    ]);
    const f1 = (asReq || []).map(r => r.addressee).filter(Boolean);
    const f2 = (asAdr || []).map(r => r.requester).filter(Boolean);
    setFriendProfiles([...f1, ...f2]);
  }, [profile.id]);

  const loadProjects = useCallback(async () => {
    const { data } = await sb.from("projects")
      .select("*, creator:profiles!projects_creator_id_fkey(display_name), project_members(user:profiles!project_members_user_id_fkey(display_name))")
      .order("created_at", { ascending: false });
    setProjects(data || []);
  }, []);

  const loadIdeaNotes = useCallback(async () => {
    const { data } = await sb.from("idea_notes").select("*").order("created_at", { ascending: false });
    setIdeaNotes(data || []);
  }, []);

  // 自己所屬（發起或加入）的專案 ID 清單。project_members 這張表沒有給 admin 額外的讀取權限，
  // 所以不管是不是 admin，這裡查到的都只會是「自己真正有份」的專案，可以用來在前端一致地
  // 過濾掉 admin 因為管理用途的資料庫權限而多讀到、但畫面上不該顯示給自己看的任務/專案。
  const loadMyProjectIds = useCallback(async () => {
    const { data } = await sb.from("project_members").select("project_id").eq("user_id", profile.id);
    setMyProjectIds((data || []).map(r => r.project_id));
  }, [profile.id]);

  const loadCurrentProjectMembers = useCallback(async (pid) => {
    if (!pid) { setCurrentProjectMembers([]); return; }
    const { data } = await sb.from("project_members").select("user:profiles!project_members_user_id_fkey(id,display_name)").eq("project_id", pid);
    setCurrentProjectMembers((data || []).map(r => r.user));
  }, []);

  useEffect(() => { openProjectIdRef.current = openProjectId; loadCurrentProjectMembers(openProjectId); }, [openProjectId, loadCurrentProjectMembers]);

  useEffect(() => { loadMissions(); loadNotifs(); loadHiddenIds(); loadStarredIds(); loadFriendProfiles(); loadProjects(); loadMyProjectIds(); loadIdeaNotes(); }, [loadMissions, loadNotifs, loadHiddenIds, loadStarredIds, loadFriendProfiles, loadProjects, loadMyProjectIds, loadIdeaNotes]);

  async function hideMission(missionId) {
    setHiddenIds(ids => ids.includes(missionId) ? ids : [...ids, missionId]);
    const { error } = await sb.from("mission_hides").insert({ user_id: profile.id, mission_id: missionId });
    if (error) loadHiddenIds();
  }
  async function unhideMission(missionId) {
    setHiddenIds(ids => ids.filter(id => id !== missionId));
    const { error } = await sb.from("mission_hides").delete().eq("user_id", profile.id).eq("mission_id", missionId);
    if (error) loadHiddenIds();
  }

  async function starMission(missionId) {
    setStarredIds(ids => ids.includes(missionId) ? ids : [...ids, missionId]);
    const { error } = await sb.from("mission_stars").insert({ user_id: profile.id, mission_id: missionId });
    if (error) loadStarredIds();
  }
  async function unstarMission(missionId) {
    setStarredIds(ids => ids.filter(id => id !== missionId));
    const { error } = await sb.from("mission_stars").delete().eq("user_id", profile.id).eq("mission_id", missionId);
    if (error) loadStarredIds();
  }

  async function deleteMission(missionId) {
    const { error } = await sb.from("missions").delete().eq("id", missionId);
    if (!error) loadMissions();
  }

  // 靈感升級成任務：NewMissionModal 建立成功後回呼，把這則靈感標記為 promoted、記錄對應的任務 id
  async function handleIdeaPromoted(ideaId, missionId) {
    await sb.from("idea_notes").update({ status: "promoted", promoted_to_mission_id: missionId }).eq("id", ideaId);
    loadIdeaNotes();
    loadMissions();
    setPromotingIdea(null);
  }

  async function deleteProject() {
    setProjectDeleteErr(null);
    setShowDeleteProjectConfirm(false);
    const { error } = await sb.rpc("delete_project_release_missions", { p_project_id: openProjectId });
    if (!error) {
      setOpenProjectId(null);
      loadProjects();
      loadMissions();
    } else {
      setProjectDeleteErr(error.message);
    }
  }

  // Realtime：missions / mission_updates / friendships / mission_hides / projects / project_members
  // 任何一張表有變動，就重新抓一次對應資料。RLS 政策會自動幫每個使用者過濾掉他原本就看不到的變動。
  useEffect(() => {
    if (!sb) return;
    const channel = sb.channel("dashboard-realtime")
      .on("postgres_changes", { event: "*", schema: "public", table: "missions" }, () => loadMissions())
      .on("postgres_changes", { event: "*", schema: "public", table: "mission_updates" }, () => loadMissions())
      .on("postgres_changes", { event: "*", schema: "public", table: "friendships" }, () => { loadMissions(); loadFriendProfiles(); })
      .on("postgres_changes", { event: "*", schema: "public", table: "mission_hides" }, () => loadHiddenIds())
      .on("postgres_changes", { event: "*", schema: "public", table: "mission_stars" }, () => loadStarredIds())
      .on("postgres_changes", { event: "*", schema: "public", table: "mission_checklist_items" }, () => loadMissions())
      .on("postgres_changes", { event: "*", schema: "public", table: "mission_work_dimensions" }, () => loadMissions())
      .on("postgres_changes", { event: "*", schema: "public", table: "projects" }, () => loadProjects())
      .on("postgres_changes", { event: "*", schema: "public", table: "project_members" }, () => { loadProjects(); loadCurrentProjectMembers(openProjectIdRef.current); loadMyProjectIds(); })
      .on("postgres_changes", { event: "*", schema: "public", table: "notifications", filter: `user_id=eq.${profile.id}` }, () => loadNotifs())
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "profiles", filter: `id=eq.${profile.id}` }, (payload) => {
        // 自己的 profiles 資料列在別的裝置被改動時（例如顯示欄位/區塊設定），同步更新這台裝置的畫面
        const updated = payload.new;
        setProfile(p => ({ ...p, ...updated }));

                  <button onClick={() => chooseSortMode(setSortMode, "scale_asc")}

                  <button onClick={() => chooseSortMode(setSortMode, "updated_desc")}

                </div>
              </div>
            </div>
            <div className="bg-white rounded-2xl shadow p-4 mb-4">

          </>
        )}

        {tab === "ideas" && (
          <IdeaPoolPage
            ideaNotes={ideaNotes}
            onOpenIdea={idea => { setEditingIdeaObj(idea); setIdeaModalOpen(true); }}
            onNewIdea={() => { setEditingIdeaObj(null); setIdeaModalOpen(true); }}
          />
        )}

        {tab === "settings" && <SettingsView profile={profile} onProfileChange={setProfile} />}
      </main>

      {ideaModalOpen && (
        <IdeaEditorModal
          idea={editingIdeaObj}
          currentUserName={profile.display_name}

      {promotingIdea && (

      {showNew && (
        <NewMissionModal
          onClose={() => setShowNew(false)}
          onCreated={loadMissions}
          priorityLabels={profile.priority_labels} scaleLabels={profile.scale_labels}
          priorityDisplay={profile.priority_display} scaleDisplay={profile.scale_display}
          priorityColorOverride={profile.priority_color_override} scaleColorOverride={profile.scale_color_override}

          aiBanned={aiBanned}

        <NewProjectModal
          onClose={() => setShowNewProject(false)}

        <MemberRoleModal
          role={profile.member_role || "free"}
          currentUserId={profile.id}
          onClose={() => setShowMemberRoleModal(false)}
        />

      {showEditProject && currentProject && (
        <EditProjectModal
          project={currentProject}
          members={currentProjectMembers}
          friendProfiles={friendProfiles}
          openMissions={projectOpenMissionsAll}
          onClose={() => setShowEditProject(false)}
          onChanged={() => { loadCurrentProjectMembers(openProjectId); loadProjects(); loadMissions(); }}
        />
      )}
      {columnSettingsContext && (
        <ColumnSettingsModal
          visibleColumns={visibleColumns} onToggleColumn={toggleColumn}
          visibleColumnsClosed={visibleColumnsClosed} onToggleColumnClosed={toggleColumnClosed}
          visibleSections={visibleSections} onToggleSection={toggleSection}
          columnOrder={profile.column_order} columnOrderClosed={profile.column_order_closed} onSaveColumnOrder={saveColumnOrder}
          onClose={() => setColumnSettingsContext(null)}
